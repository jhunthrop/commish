# .github/workflows/ios.yml
# The iOS app (apps/ios, Lane 173): the local packages' tests (the view models against the shared
# fixtures, the snapshots that are each screen's mock, the copy guard), SwiftLint and SwiftFormat, then
# the app generated by XcodeGen, built and tested on a simulator; on main, the TestFlight upload once
# the App Store Connect key is a repository secret. Until it is, that step is skipped and says so in
# its name, and the workflow stays green. Runs on macos-26 with the Xcode named by XCODE_VERSION.
name: ios

on:
  push:
    branches: ["**"]
    paths:
      - "apps/ios/**"
      - "shared/**"
      - "api/openapi.yaml"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "shared/**"
      - "api/openapi.yaml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      record_snapshots:
        description: Record the snapshot references on this image and upload them (commit them from the artifact)
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The Xcode every job builds with, pinned so a runner-image update never silently re-renders the
  # snapshot references (they render on this Xcode's SDKs). To bump it: change this one value to an
  # Xcode the image carries (/Applications/Xcode_<version>.app), run this workflow by hand with
  # record_snapshots, commit the references from its artifact, and name the bump in the commit. When
  # GitHub's macos-26 (or a macos-27) image carries Xcode 27, that is the bump that matches this Mac.
  XCODE_VERSION: "26.6"
  # The simulator the app job tests on; its runtime is the newest the pinned Xcode can run.
  SIMULATOR_DEVICE: iPhone 17 Pro
  # XcodeGen pinned by version and checksum, as the actions are by SHA.
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  packages:
    name: Packages, snapshots and style
    runs-on: macos-26
    defaults: { run: { working-directory: apps/ios } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The pinned Xcode, never the image's newest; the versions are printed so a run names its toolchain.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          xcode="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$xcode" ]; then
            echo "::error::Xcode $XCODE_VERSION is not on this image. It carries:" && ls -d /Applications/Xcode_*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: xcodebuild -version && swift --version && sw_vers -productVersion
      - name: SwiftPM cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            apps/ios/Packages/*/.build
            apps/ios/Packages/Features/*/.build
          key: spm-packages-${{ runner.os }}-${{ hashFiles('apps/ios/Packages/**/Package.resolved', 'apps/ios/Packages/**/Package.swift', 'api/openapi.yaml') }}
          restore-keys: spm-packages-${{ runner.os }}-
      - name: Style tools
        run: brew install swiftlint swiftformat
      - name: SwiftFormat and SwiftLint
        run: scripts/lint.sh
      - name: Package tests (view models, copy guard, snapshots)
        if: ${{ !inputs.record_snapshots }}
        run: scripts/test-packages.sh
      - name: Record the snapshot references on this image
        if: ${{ inputs.record_snapshots }}
        env:
          SNAPSHOT_RECORD: "1"
          SNAPSHOT_SHOTS: ${{ runner.temp }}/persona-shots
        run: scripts/test-packages.sh CommishDesign Features/LeagueHome Features/Shell Features/Start Features/Matchup Features/Board Features/Waivers Features/Player Features/Trades Features/Rankings Features/Record Features/Account Features/Reference Features/Companion Features/MockRoom
      - name: Recorded references
        if: ${{ inputs.record_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-references
          path: apps/ios/Packages/**/__Snapshots__/*.png
      - name: Persona renders at each phone's own scale
        if: ${{ inputs.record_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persona-shots
          path: ${{ runner.temp }}/persona-shots/
      - name: Snapshot differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-failures
          path: apps/ios/Packages/**/__Failures__/
          if-no-files-found: ignore

  app:
    name: App build and tests on a simulator
    runs-on: macos-26
    needs: packages
    if: ${{ !inputs.record_snapshots }}
    defaults: { run: { working-directory: apps/ios } }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The pinned Xcode, never the image's newest; the versions are printed so a run names its toolchain.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          xcode="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$xcode" ]; then
            echo "::error::Xcode $XCODE_VERSION is not on this image. It carries:" && ls -d /Applications/Xcode_*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: xcodebuild -version && swift --version && sw_vers -productVersion
      - name: SwiftPM and derived data cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/ios/build/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/Packages/**/Package.resolved', 'api/openapi.yaml') }}
          restore-keys: derived-${{ runner.os }}-
      - name: XcodeGen
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Build and test
        run: |
          # SIMULATOR_DEVICE under the newest iOS runtime the pinned Xcode can run (the image may carry
          # an older runtime than the Xcode's SDK), by its id: simctl's JSON is keyed by runtime.
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          udid="$(xcrun simctl list devices available -j | SDK="$sdk" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin)["devices"]
          device = os.environ["SIMULATOR_DEVICE"]
          def version(text):
              return tuple(int(n) for n in re.findall(r"\d+", text))
          sdk_text = os.environ["SDK"]
          sdk = version(sdk_text)
          def runtime_version(runtime):
              return version(runtime.rsplit("iOS-", 1)[-1])
          runtimes = sorted(
              (r for r in devices if ".SimRuntime.iOS-" in r and runtime_version(r) <= sdk), key=runtime_version
          )
          phones = [d for d in devices[runtimes[-1]] if d["name"] == device] if runtimes else []
          if not phones:
              sys.exit(f"No available {device} under an iOS runtime the iOS {sdk_text} SDK can run.")
          print("Simulator:", device, "on", runtimes[-1], "with the iOS", sdk_text, "SDK", file=sys.stderr)
          print(phones[0]["udid"])
          ')"
          xcodebuild -project Commish.xcodeproj -scheme Commish \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build test
      - name: TestFlight upload
        if: github.ref == 'refs/heads/main' && env.ASC_KEY_ID != ''
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: fastlane beta
      - name: TestFlight upload skipped, no ASC_KEY_ID secret yet
        if: github.ref == 'refs/heads/main' && env.ASC_KEY_ID == ''
        run: 'echo "::notice::TestFlight skipped, the App Store Connect key (ASC_KEY_ID) is not a repository secret yet."'
