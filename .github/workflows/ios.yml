# .github/workflows/ios.yml
# The iOS app (apps/ios, Lane 173): the local packages' tests (the view models against the shared
# fixtures, the snapshots that are each screen's mock, the copy guard), SwiftLint and SwiftFormat, then
# the app generated by XcodeGen, built and tested on a simulator; on main, the TestFlight upload once
# the App Store Connect key is a repository secret. Until it is, that step is skipped and says so in
# its name, and the workflow stays green. Runs on macos-26 with the image's newest Xcode.
name: ios

on:
  push:
    branches: ["**"]
    paths:
      - "apps/ios/**"
      - "shared/**"
      - "api/openapi.yaml"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "shared/**"
      - "api/openapi.yaml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      record_snapshots:
        description: Record the snapshot references on this image and upload them (commit them from the artifact)
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # XcodeGen pinned by version and checksum, as the actions are by SHA.
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  packages:
    name: Packages, snapshots and style
    runs-on: macos-26
    defaults: { run: { working-directory: apps/ios } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # macos-26 with its newest Xcode: the packages resolve with this machine's Swift 6.4 toolchain,
      # which Xcode 16's Swift 6.1 cannot build. The versions are printed so a run names its toolchain.
      - name: Select the newest Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: find /Applications -maxdepth 1 -name "Xcode*" && xcodebuild -version && swift --version
      - name: SwiftPM cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            apps/ios/Packages/*/.build
            apps/ios/Packages/Features/*/.build
          key: spm-packages-${{ runner.os }}-${{ hashFiles('apps/ios/Packages/**/Package.resolved', 'apps/ios/Packages/**/Package.swift', 'api/openapi.yaml') }}
          restore-keys: spm-packages-${{ runner.os }}-
      - name: Style tools
        run: brew install swiftlint swiftformat
      - name: SwiftFormat and SwiftLint
        run: scripts/lint.sh
      - name: Package tests (view models, copy guard, snapshots)
        if: ${{ !inputs.record_snapshots }}
        run: scripts/test-packages.sh
      - name: Record the snapshot references on this image
        if: ${{ inputs.record_snapshots }}
        env:
          SNAPSHOT_RECORD: "1"
          SNAPSHOT_SHOTS: ${{ runner.temp }}/persona-shots
        run: scripts/test-packages.sh CommishDesign Features/LeagueHome Features/Shell Features/Start Features/Matchup Features/Board Features/Player
      - name: Recorded references
        if: ${{ inputs.record_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-references
          path: apps/ios/Packages/**/__Snapshots__/*.png
      - name: Persona renders at each phone's own scale
        if: ${{ inputs.record_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persona-shots
          path: ${{ runner.temp }}/persona-shots/
      - name: Snapshot differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-failures
          path: apps/ios/Packages/**/__Failures__/
          if-no-files-found: ignore

  app:
    name: App build and tests on a simulator
    runs-on: macos-26
    needs: packages
    if: ${{ !inputs.record_snapshots }}
    defaults: { run: { working-directory: apps/ios } }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # macos-26 with its newest Xcode: the packages resolve with this machine's Swift 6.4 toolchain,
      # which Xcode 16's Swift 6.1 cannot build. The versions are printed so a run names its toolchain.
      - name: Select the newest Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: find /Applications -maxdepth 1 -name "Xcode*" && xcodebuild -version && swift --version
      - name: SwiftPM and derived data cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/ios/build/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/Packages/**/Package.resolved', 'api/openapi.yaml') }}
          restore-keys: derived-${{ runner.os }}-
      - name: XcodeGen
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Build and test
        run: |
          # The first available iPhone under the newest iOS runtime the selected Xcode carries, by its
          # id: simctl's JSON is keyed by runtime, and the runtimes are ordered by version, not listed.
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return tuple(int(n) for n in re.findall(r"\d+", runtime.rsplit("iOS-", 1)[-1]))
          runtimes = sorted((r for r in devices if ".SimRuntime.iOS-" in r), key=version)
          phones = [d for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")] if runtimes else []
          if not phones:
              sys.exit("No available iPhone simulator under an iOS runtime.")
          print("Simulator:", phones[0]["name"], "on", runtimes[-1], file=sys.stderr)
          print(phones[0]["udid"])
          ')"
          xcodebuild -project Commish.xcodeproj -scheme Commish \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build test
      - name: TestFlight upload
        if: github.ref == 'refs/heads/main' && env.ASC_KEY_ID != ''
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: fastlane beta
      - name: TestFlight upload skipped, no ASC_KEY_ID secret yet
        if: github.ref == 'refs/heads/main' && env.ASC_KEY_ID == ''
        run: 'echo "::notice::TestFlight skipped, the App Store Connect key (ASC_KEY_ID) is not a repository secret yet."'
