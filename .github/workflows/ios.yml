# .github/workflows/ios.yml
# The iOS app (apps/ios, Lane 173): the local packages' tests (the view models against the shared
# fixtures, the snapshots that are each screen's mock, the copy guard), SwiftLint and SwiftFormat, then
# the app generated by XcodeGen, built and tested on a simulator; on main, the TestFlight upload once
# the App Store Connect key is a repository secret. Until it is, that step is skipped and says so in
# its name, and the workflow stays green. Runs on macos-26 with the Xcode named by XCODE_VERSION.
# By hand only, the store_shots dispatch draws the App Store screenshots (Lane 309) and uploads them as
# an artifact to commit into docs/store/app-store-graphics; it runs nothing else.
name: ios

on:
  push:
    branches: ["**"]
    paths:
      - "apps/ios/**"
      - "shared/**"
      - "api/openapi.yaml"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "shared/**"
      - "api/openapi.yaml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      record_snapshots:
        description: Record the snapshot references on this image and upload them (commit them from the artifact)
        type: boolean
        default: false
      store_shots:
        description: Draw the App Store screenshots and upload them (commit them from the artifact into docs/store/app-store-graphics)
        type: boolean
        default: false

# One run per commit. A push or a dispatch on a branch is keyed on the branch (ref_name), a pull
# request on its number; on either a newer run cancels the older one. Main is never cancelled: each
# main run has a group of its own (main-<run id>), so a later push to main can neither cancel it nor
# replace it while it waits. A shared main group would not do: with cancel-in-progress off a newer
# run still cancels the pending one (run 40311055577 on b98d92a77 was cancelled that way on
# 2026-10-26), and the queue key that would hold them in order (queue: max) is not yet known to
# actionlint (1.7.12). Main runs therefore run side by side, each one whole; iOS uploads nothing that
# could overlap until the TestFlight key exists. Pull request runs sit in their own groups, so a
# skipped duplicate (the changes job's if) never cancels the push run it duplicates. A record run
# (the record_snapshots dispatch) sits in its own group, so a verify push and a record run on one
# branch never cancel each other. A dispatched verify run shares the branch's verify group with the
# pushes: the newer of the two cancels the older, so the newest head of the branch wins. A store_shots
# run sits in a group of its own too.
concurrency:
  group: >-
    ios-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.run_id)
    || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || format('branch-{0}-{1}', inputs.record_snapshots && 'record' || inputs.store_shots && 'store' || 'verify',
    github.ref_name) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The Xcode every job builds with (keep it quoted: unquoted, 26.10 reads as 26.1), pinned so a
  # runner-image update never silently changes the compiler or the SDKs. The package snapshots render
  # on the host macOS through ImageRenderer, which the image controls, not the pin. To bump: change this
  # one value to an Xcode the image carries (/Applications/Xcode_<version>.app), run this workflow by
  # hand with record_snapshots, commit the references from its artifact, and name the bump and the
  # macOS in the commit. When GitHub's macos-26 (or a macos-27) image carries Xcode 27, that is the
  # bump that matches this Mac. The cache keys carry the pin, so a bump starts from clean builds.
  XCODE_VERSION: "26.6"
  # The macOS (major.minor) the references were recorded on: documentation, since GitHub cannot pin an
  # image's point release. A snapshot failure right after an image update with no change of ours means
  # re-record (record_snapshots) and set this to the macOS the run names. Keep it quoted.
  SNAPSHOT_MACOS: "26.6"
  # The simulator the app job tests on; its runtime is the newest the pinned Xcode can run.
  SIMULATOR_DEVICE: iPhone 17 Pro
  # XcodeGen pinned by version and checksum, as the actions are by SHA.
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  # What the push or the pull request changed, on a Linux runner, so no macOS runner waits on it. The
  # simulator job runs when a file under apps/ios other than the generated spec copy changed, or this
  # workflow did; a spec-only change (an API lane's regeneration) or a shared-only change is checked
  # by the packages job, which builds CommishAPI against the spec and runs the package tests on the
  # shared fixtures. Main and a run by hand always run the simulator job; so does any change the diff
  # cannot be read for (fail closed). The decision is printed as a notice either way. A branch is
  # judged whole, from its merge base with main to its head, never by one push: a spec-only push
  # after a Swift commit still runs the simulator job, so a branch head is never green over Swift the
  # simulator has not built. Known risk, accepted: the app target (Commish/, CommishTests/) uses
  # generated types directly and only the simulator job compiles it, so a spec-only change that
  # renames or drops a case those files use passes the branch and fails main's app job after the merge.
  # A pull request from a branch of this repository is skipped here, with every job after it: push
  # runs on every branch, so the push run already tests it. A pull request from a fork (no push run
  # here) runs.
  changes:
    name: What changed
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      simulator: ${{ steps.decide.outputs.simulator }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Does the simulator job run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SPEC_COPY: apps/ios/Packages/CommishAPI/Sources/CommishAPI/openapi.yaml
        run: |
          runs() {
            echo "simulator=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The simulator job runs: $1"
            exit 0
          }
          [ "$EVENT" = workflow_dispatch ] && runs "a run by hand is a whole run"
          [ "$REF" = refs/heads/main ] && runs "main is the merge gate"
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...HEAD"
          else
            base="$(git merge-base origin/main "$AFTER")" || runs "no base to diff $AFTER against"
            range="$base..$AFTER"
          fi
          files="$(git diff --name-only "$range")" || runs "the diff $range could not be read"
          swift="$(printf '%s\n' "$files" | grep -E '^(apps/ios/|\.github/workflows/ios\.yml$)' | grep -vxF "$SPEC_COPY" || true)"
          [ -n "$swift" ] && runs "$range changes $(printf '%s\n' "$swift" | head -3 | paste -sd ' ' -) (first three)"
          echo "simulator=false" >> "$GITHUB_OUTPUT"
          echo "::notice::The simulator job is skipped: $range changes no file under apps/ios but the generated spec copy, and not this workflow. The packages job builds CommishAPI against the spec."

  packages:
    name: Packages, snapshots and style
    needs: changes
    if: ${{ !inputs.store_shots }}
    runs-on: macos-26
    defaults: { run: { working-directory: apps/ios } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The pinned Xcode, never the image's newest; the versions are printed so a run names its toolchain.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          xcode="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$xcode" ]; then
            echo "::error::Xcode $XCODE_VERSION is not on this image. It carries:" && ls -d /Applications/Xcode_*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: xcodebuild -version && swift --version && sw_vers -productVersion
      - name: SwiftPM cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            apps/ios/Packages/*/.build
            apps/ios/Packages/Features/*/.build
          key: spm-packages-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('apps/ios/Packages/**/Package.resolved', 'apps/ios/Packages/**/Package.swift', 'api/openapi.yaml') }}
          restore-keys: spm-packages-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-
      - name: Style tools
        run: brew install swiftlint swiftformat
      - name: SwiftFormat and SwiftLint
        run: scripts/lint.sh
      - name: Package tests (view models, copy guard, snapshots)
        if: ${{ !inputs.record_snapshots }}
        run: scripts/test-packages.sh
      - name: Record the snapshot references on this image
        if: ${{ inputs.record_snapshots }}
        env:
          SNAPSHOT_RECORD: "1"
          SNAPSHOT_SHOTS: ${{ runner.temp }}/persona-shots
        run: scripts/test-packages.sh CommishDesign Features/LeagueHome Features/Shell Features/Start Features/Matchup Features/Board Features/Waivers Features/Player Features/Trades Features/Rankings Features/Record Features/Account Features/Reference Features/Companion Features/MockRoom Features/Sheet
      - name: Recorded references
        if: ${{ inputs.record_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-references
          path: apps/ios/Packages/**/__Snapshots__/*.png
      - name: Persona renders at each phone's own scale
        if: ${{ inputs.record_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persona-shots
          path: ${{ runner.temp }}/persona-shots/
      - name: Snapshot differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-failures
          path: apps/ios/Packages/**/__Failures__/
          if-no-files-found: ignore

  app:
    name: App build and tests on a simulator
    runs-on: macos-26
    needs: [changes, packages]
    # Skipped by name in the run (never absent) on a branch change with no Swift in it; see changes.
    if: ${{ !inputs.record_snapshots && needs.changes.outputs.simulator == 'true' }}
    defaults: { run: { working-directory: apps/ios } }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The pinned Xcode, never the image's newest; the versions are printed so a run names its toolchain.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          xcode="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$xcode" ]; then
            echo "::error::Xcode $XCODE_VERSION is not on this image. It carries:" && ls -d /Applications/Xcode_*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: xcodebuild -version && swift --version && sw_vers -productVersion
      - name: SwiftPM and derived data cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/ios/build/DerivedData
          key: derived-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/Packages/**/Package.resolved', 'api/openapi.yaml') }}
          restore-keys: derived-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-
      - name: XcodeGen
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Build and test
        run: |
          # SIMULATOR_DEVICE under the newest iOS runtime the pinned Xcode can run (the image may carry
          # an older runtime than the Xcode's SDK), by its id: simctl's JSON is keyed by runtime.
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          udid="$(xcrun simctl list devices available -j | SDK="$sdk" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin)["devices"]
          device = os.environ["SIMULATOR_DEVICE"]
          def version(text):
              return tuple(int(n) for n in re.findall(r"\d+", text))
          sdk_text = os.environ["SDK"]
          sdk = version(sdk_text)
          def runtime_version(runtime):
              return version(runtime.rsplit("iOS-", 1)[-1])
          runtimes = sorted(
              (r for r in devices if ".SimRuntime.iOS-" in r and runtime_version(r) <= sdk), key=runtime_version
          )
          phones = [d for d in devices[runtimes[-1]] if d["name"] == device] if runtimes else []
          if not phones:
              sys.exit(f"No available {device} under an iOS runtime the iOS {sdk_text} SDK can run.")
          print("Simulator:", device, "on", runtimes[-1], "with the iOS", sdk_text, "SDK", file=sys.stderr)
          print(phones[0]["udid"])
          ')"
          xcodebuild -project Commish.xcodeproj -scheme Commish \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build test
      - name: TestFlight upload
        if: github.ref == 'refs/heads/main' && env.ASC_KEY_ID != ''
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: fastlane beta
      - name: TestFlight upload skipped, no ASC_KEY_ID secret yet
        if: github.ref == 'refs/heads/main' && env.ASC_KEY_ID == ''
        run: 'echo "::notice::TestFlight skipped, the App Store Connect key (ASC_KEY_ID) is not a repository secret yet."'

  # The App Store screenshots (docs/store/app-store-graphics, Lane 309), by hand only: the StoreShots
  # package's gated tests draw the app's own screens over a renamed copy of the shared fixtures with
  # ImageRenderer on this image's macOS and the pinned Xcode, at 1206 x 2622 and 1320 x 2868, then the
  # check reads every file's size and alpha. Commit the artifact's files into the folder, never a local draw.
  store-shots:
    name: App Store screenshots
    if: ${{ inputs.store_shots }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The pinned Xcode, never the image's newest; the versions are printed so a run names its toolchain.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          xcode="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$xcode" ]; then
            echo "::error::Xcode $XCODE_VERSION is not on this image. It carries:" && ls -d /Applications/Xcode_*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: xcodebuild -version && swift --version && sw_vers -productVersion
      # 24: the script runs as TypeScript and reads import.meta.main.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - name: Draw and check the screenshots
        run: node apps/ios/scripts/store-shots.ts
      # The PNGs and each shot's scene strings, which the check reads for a platform's name (Lane 310).
      - name: The screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-store-graphics
          path: |
            docs/store/app-store-graphics/*.png
            docs/store/app-store-graphics/scene-strings/*.json
          if-no-files-found: error
