# .github/workflows/shared.yml
# The sources the web and the apps share (shared/, Lane 171): the design tokens, the word tables and
# the fixtures, each generated into the web's CSS, the apps' Swift and Kotlin and shared/fixtures, and
# the Android shell from the web (apps/android/scripts/web-shell.ts). This regenerates them and fails on any generated file that differs from its source, so a hand edit
# to a generated file, or a web change that moves a fixture answer, fails here on its own push. No
# deploy: api.yml still runs the same check inside `make check-gen` on an API push.
name: shared

on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "apps/ios/Packages/CommishDesign/Sources/CommishDesign/*.generated.swift"
      - "apps/ios/Packages/CommishAPI/Sources/CommishAPI/openapi.yaml"
      - "apps/ios/scripts/**"
      - "docs/store/app-store-graphics/**"
      - "api/openapi.yaml"
      - "apps/android/design/src/main/kotlin/app/trycommish/design/**"
      - "apps/android/design/src/main/res/drawable/**"
      - "apps/android/app/src/main/res/**"
      - "apps/android/scripts/**"
      - "web/src/lib/**"
      - "web/src/routes/sheet/**"
      - "web/src/fixtures/**"
      - "web/scripts/inseason-fixture/**"
      - "web/src/lib/ui/tokens.generated.css"
      - ".github/workflows/shared.yml"
  pull_request:
    paths:
      - "shared/**"
      - "apps/ios/Packages/CommishDesign/Sources/CommishDesign/*.generated.swift"
      - "apps/ios/Packages/CommishAPI/Sources/CommishAPI/openapi.yaml"
      - "apps/ios/scripts/**"
      - "docs/store/app-store-graphics/**"
      - "api/openapi.yaml"
      - "apps/android/design/src/main/kotlin/app/trycommish/design/**"
      - "apps/android/design/src/main/res/drawable/**"
      - "apps/android/app/src/main/res/**"
      - "apps/android/scripts/**"
      - "web/src/lib/**"
      - "web/src/routes/sheet/**"
      - "web/src/fixtures/**"
      - "web/scripts/inseason-fixture/**"
      - "web/src/lib/ui/tokens.generated.css"
      - ".github/workflows/shared.yml"

concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # 24: the generators run as TypeScript and read import.meta.main.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      # The generators import the web's modules (the word tables, the fixture API and what it reads).
      - name: Install the web's dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: The generated tokens, words and fixtures match their sources
        run: node shared/scripts/check-gen.ts
      - name: The Android shell from the web (the mark, the window colours, the phone bar) matches it
        run: node apps/android/scripts/web-shell.ts --check
      - name: The shared generators' tests, the iOS client spec's and the App Store screenshots' check
        run: node --test shared/scripts/*.test.ts apps/ios/scripts/*.test.ts
      - name: The web's own entry to the same check
        working-directory: web
        run: npm run check:shared
      # The API's game-state rule held to the web's (Lane 176): the parity test reads
      # shared/fixtures/parity/game-state.json and the fixture answers it names, so a fixture or web
      # reader change runs it here, with no API deploy (api.yml does not watch shared/).
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - name: The API's game state matches the web's reader on the shared fixtures
        working-directory: api
        run: go test -count=1 -run 'TestGameStateMatchesTheWebsReaderOnTheSharedFixtures' ./internal/inseason/
