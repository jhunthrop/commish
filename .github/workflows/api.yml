# The Go API (api/): test against Postgres 16, build one image, and on
# main deploy it as the api and room Cloud Run services and the api's
# jobs, all through workload identity federation (infra/README.md).
# Migrations run as their own Cloud Run job before any new revision
# takes traffic, never at container start.
name: api
# The sheet's parity fixture and the web's CSV encoder it is written from trigger it too, so the export's
# byte parity test (api/internal/sheets/csv_parity_test.go) runs when the web's file changes (Lane 254).
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'go.work'
      - 'web/src/lib/api/types.ts'
      - 'shared/fixtures/parity/sheet.json'
      - 'web/src/lib/sheet/csv.ts'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'go.work'
      - 'web/src/lib/api/types.ts'
      - 'shared/fixtures/parity/sheet.json'
      - 'web/src/lib/sheet/csv.ts'
      - '.github/workflows/api.yml'
  workflow_dispatch:

# Deploys run one at a time and never cancel each other mid-migration.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ${{ vars.GCP_ARTIFACT_REPO }}/api:${{ github.sha }}
  RUNTIME_SA: api-runtime@trycommish.iam.gserviceaccount.com
  # Cloud SQL for Postgres (infra/README.md). Every service and job that
  # reads the database mounts its socket at /cloudsql/<instance>, which
  # DATABASE_URL names in its host parameter; set, not add, so the list
  # each deploy leaves is exactly this one.
  CLOUDSQL_INSTANCE: trycommish:us-east1:commish-pg
  # The plain settings every api process gets (internal/config). ALLOWED_HOSTS locks the run.app URL:
  # the api answers its routes only on these hosts (space-separated), the probes on any. FREE_SEASON is the
  # repository variable (2026 for the free 2026 season, empty for the paid tiers): every member holds every
  # feature and checkout stays shut. FCM_PROJECT_ID is the Firebase project push sends through (Lane 262).
  # Overwrite strategy: a hand-set service variable is lost at the next deploy.
  API_ENV_VARS: >-
    APP_ENV=production,PUBLIC_BASE_URL=https://trycommish.app,API_BASE_URL=https://api.trycommish.app,SESSION_COOKIE_DOMAIN=.trycommish.app,CORS_ORIGINS=${{ vars.CORS_ORIGINS || 'https://trycommish.app' }},TRUSTED_PROXY_HOPS=${{ vars.TRUSTED_PROXY_HOPS || '1' }},STRIPE_ENVIRONMENT=${{ vars.STRIPE_ENVIRONMENT || 'test' }},STRIPE_AUTOMATIC_TAX=${{ vars.STRIPE_AUTOMATIC_TAX || 'false' }},R2_ACCOUNT_ID=${{ vars.CLOUDFLARE_ACCOUNT_ID }},R2_EXPORTS_BUCKET=commish-exports,ROOM_BASE_URL=wss://room.trycommish.app,ADVISOR_URL=${{ vars.ADVISOR_URL }},BOARDS_URL=${{ vars.BOARDS_URL }},BOARD_SCHEMA=${{ vars.BOARD_SCHEMA || 'research' }},HOST_FFPC_ENABLED=${{ vars.HOST_FFPC_ENABLED || 'true' }},HOST_YAHOO_ENABLED=${{ vars.HOST_YAHOO_ENABLED || 'true' }},HOST_ESPN_ENABLED=${{ vars.HOST_ESPN_ENABLED || 'true' }},HOST_WRITES_ESPN_LINEUP=${{ vars.HOST_WRITES_ESPN_LINEUP || 'false' }},HOST_WRITES_ESPN_CLAIM=${{ vars.HOST_WRITES_ESPN_CLAIM || 'false' }},HOST_WRITES_MFL_LINEUP=${{ vars.HOST_WRITES_MFL_LINEUP || 'false' }},HOST_CREDENTIALS_KEY_VERSION=1,ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS || 'api.trycommish.app' }},FREE_SEASON=${{ vars.FREE_SEASON }},FCM_PROJECT_ID=${{ vars.FCM_PROJECT_ID || 'trycommish' }}
  # Secret Manager references, NAME=secret:version.
  API_SECRETS: >-
    DATABASE_URL=DATABASE_URL:latest,WORKOS_CLIENT_ID=WORKOS_CLIENT_ID:latest,WORKOS_API_KEY=WORKOS_API_KEY:latest,WORKOS_COOKIE_PASSWORD=WORKOS_COOKIE_PASSWORD:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest,SHARE_LINK_KEYS=SHARE_LINK_KEYS:latest,HOST_CREDENTIALS_KEY=HOST_CREDENTIALS_KEY:1,YAHOO_CLIENT_ID=YAHOO_CLIENT_ID:latest,YAHOO_CLIENT_SECRET=YAHOO_CLIENT_SECRET:latest
  # The service alone adds the runs' key pair the /run routes read with (Lane 185): an account R2 token with
  # Object Read on commish-runs only. No job reads the run.
  RUNS_SECRETS: >-
    R2_RUNS_ACCESS_KEY_ID=R2_RUNS_ACCESS_KEY_ID:latest,R2_RUNS_SECRET_ACCESS_KEY=R2_RUNS_SECRET_ACCESS_KEY:latest
  # The jobs add the mail key the renewal reminder sends with.
  JOB_SECRETS: >-
    RESEND_API_KEY=RESEND_API_KEY:latest
  # The room reads the database, the session cookie and the board (the
  # research tables, BOARD_SCHEMA). Its LISTEN connection is the direct
  # endpoint derived from DATABASE_URL (config.DirectURL). ROOM_BASE_URL's host is the one the room
  # answers on (ALLOWED_HOSTS unset): its run.app URL gets a 404 but for the probes.
  ROOM_ENV_VARS: >-
    APP_ENV=production,PUBLIC_BASE_URL=https://trycommish.app,API_BASE_URL=https://api.trycommish.app,ROOM_BASE_URL=wss://room.trycommish.app,SESSION_COOKIE_DOMAIN=.trycommish.app,TRUSTED_PROXY_HOPS=${{ vars.TRUSTED_PROXY_HOPS || '1' }},BOARD_SCHEMA=${{ vars.BOARD_SCHEMA || 'research' }}
  ROOM_SECRETS: >-
    DATABASE_URL=DATABASE_URL:latest,WORKOS_COOKIE_PASSWORD=WORKOS_COOKIE_PASSWORD:latest

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: commish, POSTGRES_PASSWORD: commish, POSTGRES_DB: commish_test }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U commish" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://commish:commish@localhost:5433/commish_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        # 24: make check-gen runs the shared drift check, TypeScript that reads import.meta.main
        # (shared/scripts). The shared workflow runs it on the shared paths (shared.yml).
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: The generated Go and TypeScript types match openapi.yaml, the shared tokens, words and fixtures their sources
        run: make check-gen
        # -p 1: the database-backed packages share one database and each
        # resets the app schema.
      - run: go test -race -p 1 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    env:
      PUSH: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: auth
        if: env.PUSH == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
      - if: env.PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
        # Built on every push and PR that can change it, pushed only from
        # main, so a broken image is caught before it reaches a deploy.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: api
          file: api/Dockerfile
          build-args: VERSION=${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    needs: image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT }}
    steps:
        # For infra/post-deploy-check.sh, the job's last step.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { sparse-checkout: infra }
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with: { project_id: '${{ vars.GCP_PROJECT }}' }

        # Migrations first. Gated on APP_SCHEMA_READY until the app
        # schema's Cloud SQL connection string is in Secret Manager: until
        # then the services deploy against the placeholder and /readyz
        # says the database is not reachable.
      - name: Migrate the app schema
        if: vars.APP_SCHEMA_READY == 'true'
        run: |
          gcloud run jobs deploy api-migrate --image "$IMAGE" --region "$REGION" \
            --command /migrate --service-account "$RUNTIME_SA" \
            --set-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --max-retries 0 --task-timeout 300s --quiet
          gcloud run jobs execute api-migrate --region "$REGION" --wait
      - name: Migrations skipped
        if: vars.APP_SCHEMA_READY != 'true'
        run: echo "::warning::APP_SCHEMA_READY is not true, so migrations did not run"

      - uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        with:
          service: api
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          # INTERNAL_CALLERS (Lane 262), the service accounts whose identity tokens open the internal routes, is
          # the service's alone and quoted, so a list of several, comma or space separated, never splits the
          # variables (the action keeps a quoted value whole).
          env_vars: ${{ env.API_ENV_VARS }},INTERNAL_CALLERS="${{ vars.INTERNAL_CALLERS || 'research-runtime@trycommish.iam.gserviceaccount.com' }}"
          env_vars_update_strategy: overwrite
          secrets: ${{ env.API_SECRETS }},${{ env.RUNS_SECRETS }}
          secrets_update_strategy: overwrite
          flags: >-
            --service-account=${{ env.RUNTIME_SA }} --no-invoker-iam-check --cpu=2 --memory=1Gi
            --set-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }}
            --min-instances=0 --max-instances=10 --concurrency=80
            --cpu-boost --timeout=60

        # The room holds lobby clocks between requests, so its CPU is
        # never throttled, and a WebSocket stays on one instance by
        # session affinity. ROOM_MIN_INSTANCES is 0 out of season and 1
        # from July through September (spec §2.2).
      - uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        with:
          service: room
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          env_vars: ${{ env.ROOM_ENV_VARS }}
          env_vars_update_strategy: overwrite
          secrets: ${{ env.ROOM_SECRETS }}
          secrets_update_strategy: overwrite
          flags: >-
            --command=/room --service-account=${{ env.RUNTIME_SA }} --no-invoker-iam-check --cpu=2 --memory=1Gi
            --set-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }}
            --min-instances=${{ vars.ROOM_MIN_INSTANCES || '0' }} --max-instances=5 --concurrency=500
            --no-cpu-throttling --session-affinity --timeout=3600

        # Every job is this image run with the job's name as its argument,
        # so each moves with the service. Their schedules are Cloud
        # Scheduler's (see the lane report).
      - name: Point the api's jobs at the new image
        run: |
          for job in billing-reconcile renewal-reminders sweep ffpc-refresh espn-week-reads re-encrypt-host-connections; do
            gcloud run jobs deploy "api-$job" --image "$IMAGE" --region "$REGION" \
              --command /api --args "$job" --service-account "$RUNTIME_SA" \
              --set-cloudsql-instances "$CLOUDSQL_INSTANCE" \
              --set-env-vars "$API_ENV_VARS" --set-secrets "$API_SECRETS,$JOB_SECRETS" \
              --max-retries 1 --task-timeout 600s --quiet
          done
          # The push outbox's drain (Lane 262), every minute in season: no retry of the execution (the
          # next minute's run is the retry, and rows are leased), and a timeout well under the lease (the
          # drain keeps its own budget too). It mounts the database alone (security review L5): FCM sends as
          # the runtime (roles/firebasecloudmessaging.admin); APNs waits on APNS_KEY_ID, APNS_TEAM_ID and
          # APNS_KEY in Secret Manager, added to these secrets once they exist. Cloud Scheduler runs it as
          # research-runtime, the research schedule's caller, which holds run.invoker on this job alone.
          gcloud run jobs deploy api-notify --image "$IMAGE" --region "$REGION" \
            --command /api --args notify --service-account "$RUNTIME_SA" \
            --set-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --set-env-vars "$API_ENV_VARS" --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --max-retries 0 --task-timeout 90s --quiet
          gcloud run jobs add-iam-policy-binding api-notify --region "$REGION" \
            --member "serviceAccount:research-runtime@trycommish.iam.gserviceaccount.com" --role roles/run.invoker --quiet

        # Both services answer their readiness (the database reached) at the public names, or the
        # deploy goes red: one retry after 30 s for the new revision's cold start.
      - name: The api and the room answer
        run: infra/post-deploy-check.sh https://api.trycommish.app/readyz https://room.trycommish.app/readyz
