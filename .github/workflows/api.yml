# The Go API (api/): test against Postgres 16, build one image, and on
# main deploy it as the api and room Cloud Run services and the api's
# jobs, all through workload identity federation (infra/README.md).
# Migrations run as their own Cloud Run job before any new revision
# takes traffic, never at container start.
name: api
on:
  push:
    branches: [main]
    paths: ['api/**', 'go.work', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', 'go.work', '.github/workflows/api.yml']
  workflow_dispatch:

# Deploys run one at a time and never cancel each other mid-migration.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ${{ vars.GCP_ARTIFACT_REPO }}/api:${{ github.sha }}
  RUNTIME_SA: api-runtime@trycommish.iam.gserviceaccount.com
  # The plain settings every api process gets (internal/config).
  API_ENV_VARS: >-
    APP_ENV=production,PUBLIC_BASE_URL=https://trycommish.app,API_BASE_URL=https://api.trycommish.app,SESSION_COOKIE_DOMAIN=.trycommish.app,TRUSTED_PROXY_HOPS=1,STRIPE_ENVIRONMENT=${{ vars.STRIPE_ENVIRONMENT || 'test' }},R2_ACCOUNT_ID=${{ vars.CLOUDFLARE_ACCOUNT_ID }},R2_EXPORTS_BUCKET=commish-exports
  # Secret Manager references, NAME=secret:version.
  API_SECRETS: >-
    DATABASE_URL=DATABASE_URL:latest,WORKOS_CLIENT_ID=WORKOS_CLIENT_ID:latest,WORKOS_API_KEY=WORKOS_API_KEY:latest,WORKOS_COOKIE_PASSWORD=WORKOS_COOKIE_PASSWORD:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest
  # The jobs add the mail key the renewal reminder sends with.
  JOB_SECRETS: >-
    RESEND_API_KEY=RESEND_API_KEY:latest
  # The room reads only the database and the session cookie.
  ROOM_ENV_VARS: >-
    APP_ENV=production,PUBLIC_BASE_URL=https://trycommish.app,API_BASE_URL=https://api.trycommish.app,SESSION_COOKIE_DOMAIN=.trycommish.app,TRUSTED_PROXY_HOPS=1
  ROOM_SECRETS: >-
    DATABASE_URL=DATABASE_URL:latest,WORKOS_COOKIE_PASSWORD=WORKOS_COOKIE_PASSWORD:latest

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: commish, POSTGRES_PASSWORD: commish, POSTGRES_DB: commish_test }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U commish" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://commish:commish@localhost:5433/commish_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: The generated Go and TypeScript types match openapi.yaml
        run: make check-gen
        # -p 1: the database-backed packages share one database and each
        # resets the app schema.
      - run: go test -race -p 1 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: auth
        if: env.PUSH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
        # Built on every push and PR that can change it, pushed only from
        # main, so a broken image is caught before it reaches a deploy.
      - uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          build-args: VERSION=${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        with: { project_id: '${{ vars.GCP_PROJECT }}' }

        # Migrations first. Gated on APP_SCHEMA_READY until the Neon app
        # schema's connection string is in Secret Manager: until then
        # the services deploy against the placeholder and /readyz says
        # the database is not reachable.
      - name: Migrate the app schema
        if: vars.APP_SCHEMA_READY == 'true'
        run: |
          gcloud run jobs deploy api-migrate --image "$IMAGE" --region "$REGION" \
            --command /migrate --service-account "$RUNTIME_SA" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --max-retries 0 --task-timeout 300s --quiet
          gcloud run jobs execute api-migrate --region "$REGION" --wait
      - name: Migrations skipped
        if: vars.APP_SCHEMA_READY != 'true'
        run: echo "::warning::APP_SCHEMA_READY is not true, so migrations did not run"

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: api
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          env_vars: ${{ env.API_ENV_VARS }}
          env_vars_update_strategy: overwrite
          secrets: ${{ env.API_SECRETS }}
          secrets_update_strategy: overwrite
          flags: >-
            --service-account=${{ env.RUNTIME_SA }} --allow-unauthenticated
            --min-instances=0 --max-instances=20 --concurrency=80
            --cpu=1 --memory=512Mi --cpu-boost --timeout=60

        # The room holds lobby clocks between requests, so its CPU is
        # never throttled, and a WebSocket stays on one instance by
        # session affinity. ROOM_MIN_INSTANCES is 0 out of season and 1
        # from July through September (spec §2.2).
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: room
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          env_vars: ${{ env.ROOM_ENV_VARS }}
          env_vars_update_strategy: overwrite
          secrets: ${{ env.ROOM_SECRETS }}
          secrets_update_strategy: overwrite
          flags: >-
            --command=/room --service-account=${{ env.RUNTIME_SA }} --allow-unauthenticated
            --min-instances=${{ vars.ROOM_MIN_INSTANCES || '0' }} --max-instances=10 --concurrency=500
            --cpu=1 --memory=512Mi --no-cpu-throttling --session-affinity --timeout=3600

        # Every job is this image run with the job's name as its argument,
        # so each moves with the service. Their schedules are Cloud
        # Scheduler's (see the lane report).
      - name: Point the api's jobs at the new image
        run: |
          for job in billing-reconcile renewal-reminders sweep; do
            gcloud run jobs deploy "api-$job" --image "$IMAGE" --region "$REGION" \
              --command /api --args "$job" --service-account "$RUNTIME_SA" \
              --set-env-vars "$API_ENV_VARS" --set-secrets "$API_SECRETS,$JOB_SECRETS" \
              --max-retries 1 --task-timeout 600s --quiet
          done
