# .github/workflows/android.yml
# The Android app (apps/android, Lane 174): the files generated from the web (the mark, the window
# colours, the phone bar and its glyphs) against the web, ktlint,
# Android lint, the unit tests (the League home against shared/fixtures with a fixed clock, the
# client against the fixtures, the copy guard), the Paparazzi snapshots against the committed images,
# and a debug build. On main, with the upload key in the repository's secrets, the build job signs the
# release bundle once and the upload job sends it to Play's internal track through the Play Developer
# API, authenticated by GitHub federation as the Play service account (vars.PLAY_SA, a short-lived
# token; the organization forbids service-account keys, so none exists). Off main, or without the
# key, the upload is skipped by name with its reason and the run stays green.
#
# The snapshot references are this runner's images, and CI is the reference: a Mac draws edges one
# colour level off, so the local verifyPaparazziDebug compares nothing (see apps/android/build.gradle.kts).
# To change a reference, run the record job instead of copying images out of a failed run: dispatch this
# workflow on the lane's branch with record_snapshots ticked, or push a commit whose message contains
# the token [record-android]. The job records on this image, uploads the images as the
# snapshot-references artifact and, on a lane branch (worktree-*; it never runs on main and fails closed on any other ref), commits them back to the branch as a bot
# commit (a push by the workflow's own token starts no run, so the lane's next push carries it and
# the verify job runs on that one). The build job below stays the merge gate.
name: android

on:
  # Every branch, so a lane's push runs it with no pull request; the paths keep it to the app's inputs.
  push:
    paths:
      - "apps/android/**"
      - "shared/**"
      - "api/openapi.yaml"
      - "web/src/lib/ui/mark.ts"
      - "web/src/lib/ui/nav.ts"
      - "web/src/lib/ui/rail-order.ts"
      - "web/src/lib/ui/rail-icons.ts"
      - "web/src/lib/ui/icons.ts"
      - "web/src/lib/ui/shell-words.ts"
      - "web/src/lib/run/week-names.ts"
      - "web/src/lib/site/app-manifest.ts"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "shared/**"
      - "api/openapi.yaml"
      - "web/src/lib/ui/mark.ts"
      - "web/src/lib/ui/nav.ts"
      - "web/src/lib/ui/rail-order.ts"
      - "web/src/lib/ui/rail-icons.ts"
      - "web/src/lib/ui/icons.ts"
      - "web/src/lib/ui/shell-words.ts"
      - "web/src/lib/run/week-names.ts"
      - "web/src/lib/site/app-manifest.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      record_snapshots:
        description: Record the Paparazzi references on this image, upload them and commit them to this branch
        type: boolean
        default: false
      upload:
        description: Upload the signed bundle to Play internal (honoured on main only)
        type: boolean
        default: false

# One run per commit, as in ios.yml: a push or a dispatch on a branch is keyed on the branch
# (ref_name), a pull request on its number; on either a newer run cancels the older one. Main runs
# share one group, android-main, with cancel-in-progress off: a build or a Play upload is never
# cancelled half way and two uploads never overlap. A waiting main run is still replaced by a newer
# one (GitHub keeps one pending run per group); that is accepted, since the newest main commit's run
# builds and uploads everything before it. Pull request runs sit in their own groups, so a skipped
# duplicate (the build job's if) never cancels the push run, and a record run (the dispatch input or
# the [record-android] token) sits in its own group, so the lane's next push does not cancel it. A
# dispatched verify run shares the branch's verify group with the pushes: the newer cancels the older.
concurrency:
  group: >-
    android-${{ github.ref == 'refs/heads/main' && 'main'
    || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || format('branch-{0}-{1}', (inputs.record_snapshots || (github.event_name == 'push' && contains(github.event.head_commit.message, '[record-android]'))) && 'record' || 'verify', github.ref_name) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    # The record job takes the run when it is asked for, by the dispatch input or the commit token,
    # except on main, where the build and the Play step always run and record never does. A pull
    # request from a branch of this repository is skipped: push runs on every branch, so the push run
    # already builds it. A pull request from a fork runs.
    if: >-
      ${{ !((inputs.record_snapshots || (github.event_name == 'push' && contains(github.event.head_commit.message, '[record-android]'))) && github.ref != 'refs/heads/main')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android
    # The upload keystore is never in the job's environment: one step says whether this run uploads,
    # and only the signing step reads the keystore.
    outputs:
      upload: ${{ steps.play.outputs.upload }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # 24: the script runs as TypeScript and imports the web's mark, rail and manifest modules, which use no packages.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      # The platform every module compiles against, read from the version catalog so CI follows one
      # number (Lane 218: Play requires API 36). The runner image may already hold it; sdkmanager is then a no-op.
      - name: The Android platform the catalog names
        run: |
          level=$(sed -n 's/^android-compile-sdk = "\([0-9]*\)"$/\1/p' gradle/libs.versions.toml)
          test -n "$level" || { echo "::error::android-compile-sdk is missing from gradle/libs.versions.toml"; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$level"

      - name: The files generated from the web match it
        run: node scripts/web-shell.ts --check

      - name: The Play upload script against a stub of the API
        run: node --test scripts/*.test.ts

      # Push (Lane 288): Firebase's client config, which names the project and the app and carries a browser
      # API key secret scanning flags, so it lives in a secret rather than the repository. Without the secret
      # the build still passes and has no push (app/build.gradle.kts).
      - name: Firebase's client config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "app/google-services.json written from the secret."
          else
            echo "GOOGLE_SERVICES_JSON is not a repository secret: this build has no push."
          fi

      - name: Lint, unit tests, snapshots, debug build
        run: ./gradlew ktlintCheck lint testDebugUnitTest verifyPaparazziDebug assembleDebug --continue

      - name: Keep the reports and the snapshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            apps/android/**/build/reports/
            apps/android/**/build/paparazzi/failures/
          retention-days: 7

      # Uploads on a push to main, or a dispatch on main with upload ticked, when the three upload-key
      # secrets and the alias variable are present; never from a lane branch or a pull request, whatever the input says.
      - name: Whether this run uploads to Play
        id: play
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && vars.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          ASKED: ${{ inputs.upload == true }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            reason="This run is on $REF, not main, so nothing is uploaded to Play (the upload input is honoured on main only)."
          elif [ "$EVENT" != "push" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            reason="A $EVENT run never uploads to Play."
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$ASKED" != "true" ]; then
            reason="This dispatch did not tick upload, so nothing is uploaded to Play."
          elif [ "$HAS_KEYSTORE" != "true" ]; then
            reason="The upload key is not in the repository's secrets yet, so nothing is uploaded to Play."
          else
            reason=""
          fi
          if [ -n "$reason" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Play internal (skipped, off main or no upload key)
        if: steps.play.outputs.upload != 'true'
        env:
          REASON: ${{ steps.play.outputs.reason }}
        run: echo "$REASON"

      # Built and signed once, here; the upload job sends this file and never builds.
      - name: Sign the release bundle
        if: steps.play.outputs.upload == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # A re-run keeps the run number; the attempt gives it a code Play has not used (app/build.gradle.kts).
          ANDROID_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/upload.jks"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease

      - name: Keep the signed bundle for the upload job
        if: steps.play.outputs.upload == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-bundle
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3

  upload:
    name: Upload to Play internal
    needs: build
    if: needs.build.outputs.upload == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Three locks, not one: the gate above (editable on any branch, so not a boundary by itself); the
    # play environment, whose deployment branch policy is main only and which alone holds PLAY_SA, so
    # this job cannot start from another branch; and GCP, where commish-play's federation binding is
    # the principal set attribute.ref/refs/heads/main (the provider pins the repository), so a token
    # for it cannot be minted off main even by an edited workflow.
    environment: play
    # The federated token is this job's alone; the build job never holds id-token.
    permissions: { contents: read, id-token: write }
    env:
      PLAY_PACKAGE: app.trycommish.android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { sparse-checkout: apps/android/scripts, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: play-bundle
          path: ${{ runner.temp }}/play-bundle
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      # completed on internal; an app that has not passed its first review takes it only as a draft,
      # and a re-run whose code Play already holds uploads nothing: the script names both in a notice
      # and still exits 0.
      - name: Send the bundle to the internal track
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          BUNDLE: ${{ runner.temp }}/play-bundle/app-release.aab
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node apps/android/scripts/play-upload.ts --bundle "$BUNDLE" --package "$PLAY_PACKAGE" --track internal --status completed --attempt "$RUN_ATTEMPT"

  record:
    name: Record the Paparazzi references
    if: ${{ (inputs.record_snapshots || (github.event_name == 'push' && contains(github.event.head_commit.message, '[record-android]'))) && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Write access to the branch is this job's alone; the build job keeps read-only contents.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android
    env:
      BRANCH: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
      LANE_PREFIX: worktree-
    steps:
      # Fails closed before anything is built or written: only a branch named for a lane is recorded
      # to, so a tag or any other ref writes nothing.
      - name: Only a lane branch is recorded to
        working-directory: .
        run: |
          if [ "$REF_TYPE" != "branch" ] || [ "${BRANCH#"$LANE_PREFIX"}" = "$BRANCH" ]; then
            echo "::error::Refusing to record on '$BRANCH' ($REF_TYPE): record runs only on a branch whose name starts with '$LANE_PREFIX'. Nothing was written."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      # The platform every module compiles against, read from the version catalog so CI follows one
      # number (Lane 218: Play requires API 36). The runner image may already hold it; sdkmanager is then a no-op.
      - name: The Android platform the catalog names
        run: |
          level=$(sed -n 's/^android-compile-sdk = "\([0-9]*\)"$/\1/p' gradle/libs.versions.toml)
          test -n "$level" || { echo "::error::android-compile-sdk is missing from gradle/libs.versions.toml"; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$level"

      - name: Record the references on this image
        run: ./gradlew recordPaparazziDebug

      - name: Recorded references
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-references
          path: apps/android/**/src/test/snapshots/images/*.png
          retention-days: 14

      # The guard above allows only a lane branch, so this never writes main, a tag or another ref.
      - name: Commit the references to the branch
        working-directory: .
        run: |
          git add -- 'apps/android/**/src/test/snapshots/images/*.png'
          if git diff --cached --quiet; then
            echo "The recorded references match the committed ones; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(android): the Paparazzi references as the CI image draws them (run ${GITHUB_RUN_ID})" \
            -m "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>"
          git push origin "HEAD:refs/heads/${BRANCH}"
