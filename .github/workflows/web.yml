# The prep site: check, lint, build every nightly page from a run, hold the Lighthouse budgets, and
# deploy to the workers.dev preview and the custom domains, then clear the zone's edge cache. Runs on a push to main that touches web/, and when the nightly
# job dispatches nightly-run with the id of a run that passed its gates
# (client_payload.runId). A push builds the run runs/latest.json names.
# The custom domain route is added at cutover (spec §10), not here.
#
# A pull request, or a dispatch on any branch but main, runs only the `checks` job: types, lint, unit
# tests, the shared-sources check, and the build and its script bytes from the committed build run
# (shared/fixtures/build-run, Lane 252, B259). It holds no secret and never reads R2, whose keys
# derive from the Cloudflare token. Only a run on main reaches `build-measure-deploy`, the one job
# that names the token (Lane 251, B258).
name: web

on:
  push:
    branches: [main]
    paths: &paths ["web/**", "shared/**", "api/internal/figurewords/words.json", ".github/workflows/web.yml"]
  # A branch is checked on its pull request, not on every push too (api.yml and shared.yml do the same).
  pull_request:
    paths: *paths
  repository_dispatch:
    types: [nightly-run]
  # The hourly backstop at any hour, the delivery path: `publish` moves runs/latest.json every hour
  # (an in-season run goes public after noon UTC), and at 30 past every hour this builds unless the live site's stamp
  # (/data/run.txt) names both the latest run and this commit, so a scheduled run that took a
  # pending push's place still deploys it; with nothing new it stops in seconds, named. The
  # nightly's own dispatch (WEB_DISPATCH_TOKEN) only makes it sooner and is optional.
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      runId:
        description: "Run id to build, or latest"
        required: false
        default: latest

# One deploy at a time. A newer run waits for the one in flight rather than racing it. A branch's
# checks get their own group per ref, so they never queue behind or displace a deploy, and a newer
# push to the branch supersedes its older check.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'web-deploy' || format('web-checks-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# The Cloudflare token is set on the two steps that use it (the run inputs and the deploy), never on
# the job, so no install script, check or browser ever sees it.
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  PUBLIC_RUN_ID: ${{ github.event.client_payload.runId || inputs.runId || 'latest' }}
  # The full set of nightly pages builds in under four minutes (spec §2.1).
  BUILD_BUDGET_SECONDS: 240

defaults:
  run:
    working-directory: web

jobs:
  # Everything a branch can prove without a run to build. No step here reads a secret or the R2
  # bucket; the only repository values are the public account id and run id set above.
  checks:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    # The typed lint ran serially for about 18 minutes on a hosted runner (Lane 260's branch,
    # 2026-10-28), which cut a branch off at the old 20 twice (Lane 257). It now runs across the
    # runner's cores (npm run lint, eslint --concurrency=auto, Lane 272); 25 leaves room.
    timeout-minutes: 25
    env:
      # The committed build run: every file a build reads (web/src/lib/run/reads.ts), every format's
      # board among them, from the nightly's contract fixture. Test data, never served.
      PUBLIC_RUN_BASE_URL: ../shared/fixtures/build-run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Shared sources match their generators
        run: npm run check:shared

      - name: Build every page from the build run, timed
        # The main job's build, from the committed run in place of R2; the request API and the apps'
        # link claims stay empty, which claims no app.
        run: |
          start=$(date +%s)
          npm run build
          seconds=$(( $(date +%s) - start ))
          pages=$(find .svelte-kit/cloudflare -name '*.html' | wc -l | tr -d ' ')
          echo "Built ${pages} pages from the build run in ${seconds} s (budget ${BUILD_BUDGET_SECONDS} s)." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$seconds" -gt "$BUILD_BUDGET_SECONDS" ]; then
            echo "::error::The build took ${seconds} s, over the ${BUILD_BUDGET_SECONDS} s budget."
            exit 1
          fi

      - name: Script bytes on load, held to the Lighthouse budgets
        # pipefail, so a page over its budget fails the step through the tee.
        run: |
          set -o pipefail
          node scripts/script-bytes.ts | tee -a "$GITHUB_STEP_SUMMARY"

  # Main only: the build reads the run from R2 with keys derived from the Cloudflare token, then
  # deploys and purges with it. A branch never reaches this job.
  build-measure-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: The run inputs
        # Appends R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (masked) and PUBLIC_RUN_BASE_URL to the job's env.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/r2-env.ts

      - name: Is the live site already on the latest run (the hourly backstop)
        # Only the schedule asks: a push or a dispatch always builds.
        id: fresh
        if: github.event_name == 'schedule'
        env:
          SITE_URL: https://trycommish.app
        run: node scripts/run-fresh.ts

      - name: svelte-check
        if: steps.fresh.outputs.build != 'false'
        run: npm run check

      - name: Lint
        if: steps.fresh.outputs.build != 'false'
        run: npm run lint

      - name: Unit tests
        if: steps.fresh.outputs.build != 'false'
        run: npm test

      - name: Build every nightly page, timed
        if: steps.fresh.outputs.build != 'false'
        # The request API the account page and the sheet's sync call, fixed at build (src/env.ts).
        # The apps' link claims (scripts/well-known.ts): empty until the founder sets them, and an
        # empty one claims no app.
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          start=$(date +%s)
          npm run build
          seconds=$(( $(date +%s) - start ))
          pages=$(find .svelte-kit/cloudflare -name '*.html' | wc -l | tr -d ' ')
          echo "Built ${pages} pages from run ${PUBLIC_RUN_ID} in ${seconds} s (budget ${BUILD_BUDGET_SECONDS} s)." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$seconds" -gt "$BUILD_BUDGET_SECONDS" ]; then
            echo "::error::The build took ${seconds} s, over the ${BUILD_BUDGET_SECONDS} s budget."
            exit 1
          fi

      - name: Lighthouse budgets on the front door, the board, the run's top-ranked player and the record
        # Off until there is a product to tune (founder, 2026-10-16): the nine-run audit added about
        # twenty minutes to every deploy. Set the repository variable LIGHTHOUSE to "on" to run it
        # again; the configs and budgets stay in web/ unchanged.
        if: steps.fresh.outputs.build != 'false' && vars.LIGHTHOUSE == 'on'
        # Real (devtools) throttling at the mobile profile, nine runs, asserted on the median, from
        # a static server of the build. A failed budget stops the deploy.
        run: npm run lighthouse

      - name: Keep the Lighthouse reports
        if: always() && steps.fresh.outputs.build != 'false' && vars.LIGHTHOUSE == 'on'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}
          # The board's, front door's, player's and record's reports, and the sheet's (its own run
          # clears .lighthouseci's raw results and writes its named reports to its own folder).
          path: |
            web/.lighthouseci
            web/.lighthouseci-sheet
          # The folders' names start with a dot, which upload-artifact skips unless told: every deploy
          # before Lane 43 kept nothing ("No files were found").
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore

      - name: Deploy to the workers.dev preview
        if: steps.fresh.outputs.build != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Clear the edge cache so every visitor sees this deploy
        # The edge kept serving a removed page and the previous stamp after a deploy (ledger
        # 2026-10-15). The zone is found by name. The deploy above stays if this fails, and the job
        # goes red naming the purge. Needs the token's Zone > Cache Purge > Purge permission.
        if: steps.fresh.outputs.build != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_NAME: trycommish.app
        run: node scripts/purge-cache.ts

      - name: The site answers
        # The front door answers 200 after the deploy and the purge, or the job goes red: one retry
        # after 30 s for the Worker to reach every edge (infra/post-deploy-check.sh).
        if: steps.fresh.outputs.build != 'false'
        run: ../infra/post-deploy-check.sh https://trycommish.app/
