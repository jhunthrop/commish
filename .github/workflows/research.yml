# .github/workflows/research.yml
# The Python research lane: lint, types, the smoke tests, the schema gate and the parity harness;
# then, from main, the one research image (research/Dockerfile) and the advisor and boards services
# on Cloud Run. The parity run replays recorded provider responses only (no secrets, no network beyond the
# package registries), against a Postgres service the harness creates its own parity_* scratch
# databases in. The TypeScript oracle runs from research-ts/ (and the app modules
# under src/ it still imports, and the root drizzle journal that builds its legacy tables) with the
# repository's own node_modules, so any change to an oracle path reruns parity too.
name: research
on:
  workflow_dispatch:
  push:
    paths:
      - "research/**"
      - "web/src/lib/run/**"
      - "web/src/lib/server/run.ts"
      - "web/src/lib/types/player.ts"
      - "web/src/lib/format/**"
      - "api/internal/figurewords/words.json"
      - "shared/words/banned-words.json"
      - "web/package-lock.json"
      - "research-ts/**"
      - "drizzle/**"
      - "src/data/seed/**"
      - "src/lib/**"
      - "src/domain/**"
      - "src/stats/**"
      - "src/stats-pipeline/**"
      - "scripts/*.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/research.yml"
  pull_request:
    paths:
      - "research/**"
      - "web/src/lib/run/**"
      - "web/src/lib/server/run.ts"
      - "web/src/lib/types/player.ts"
      - "web/src/lib/format/**"
      - "api/internal/figurewords/words.json"
      - "shared/words/banned-words.json"
      - "web/package-lock.json"
      - "research-ts/**"
      - "drizzle/**"
      - "src/data/seed/**"
      - "src/lib/**"
      - "src/domain/**"
      - "src/stats/**"
      - "src/stats-pipeline/**"
      - "scripts/*.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/research.yml"
permissions: { contents: read }
concurrency:
  group: research-${{ github.ref }}
  # A deploy from main is never cancelled half way; a pull request's run is superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ${{ vars.GCP_ARTIFACT_REPO }}/research:${{ github.sha }}
  # The advisor's own identity: no Secret Manager, database or project role at all, so code
  # running in the advisor can read nothing (research-runtime, which holds secretAccessor, is the
  # nightly job's).
  ADVISOR_SA: advisor-runtime@trycommish.iam.gserviceaccount.com
  # The api and room services' identity, the only callers the advisor and the boards service admit.
  CALLER_SA: api-runtime@trycommish.iam.gserviceaccount.com
  # The boards service's own identity: secretAccessor on RESEARCH_DATABASE_URL alone, so code in
  # the service can read no other secret (infra/README.md, boards-runtime).
  BOARDS_SA: boards-runtime@trycommish.iam.gserviceaccount.com
  # Cloud SQL for Postgres (infra/README.md). What reads RESEARCH_DATABASE_URL mounts the instance's
  # socket at /cloudsql/<instance>, which that URL names in its host parameter: the boards service and
  # the nightly, nightly-publish (it writes the published board, Lane 28), inseason and
  # inseason-capture jobs. The advisor reads no database, so it gets no connection.
  CLOUDSQL_INSTANCE: trycommish:us-east1:commish-pg
jobs:
  research:
    runs-on: ubuntu-latest
    # Every case runs in two to four passes; the whole harness takes about half an hour.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: parity
          POSTGRES_PASSWORD: parity
          POSTGRES_DB: parity
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U parity -d parity"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PARITY_DATABASE_URL: postgres://parity:parity@localhost:5433/parity
      TZ: UTC
    defaults: { run: { working-directory: research } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # Node 24, the research image's: pytest runs the schema gate's reader (run-contract.ts) under it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: The TypeScript oracle's dependencies
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund
        # The web's reader and its zod, which tests/test_season_contract.py drives through the schema
        # gate over a page the writer made (Lane 119); with CI set the test never skips.
      - name: The web's run reader dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The TypeScript oracle's tests on its live nightly paths (the rest of its suite predates the pivot, launch item 2026-10-18)
        working-directory: research-ts
        run: npx vitest run src/nightly
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy -p research
      - name: mypy, the alembic environment and revisions (not a package)
        run: uv run mypy alembic/env.py alembic/versions
      - run: uv run pytest -q
      - name: The committed seeds validate
        run: |
          uv run python -m research.pipeline coaches --check
          uv run python -m research.pipeline win-totals-seed --check
      - name: Schema gate (the migrations against the declared schema, and the legacy map)
        run: uv run python -m research.parity schema
      - name: Parity, every ingest, recorded inputs, empty and non-empty passes
        run: uv run python -m research.parity ingest all
      # The model cases that need no store: V8's log, exp, sin, pow, round, max/min, the register's
      # ordinal comparator and mulberry32 against the Python reproductions. This runner's x86-64 node
      # is judged with both fused-multiply-add arms and must match exactly one (the unfused one); the
      # committed arm64 and x86-64 vectors are judged with their own arms. `pow` lines are judged only
      # where the node's `**` is this host's libm, so here they are skipped and counted, never passed.
      # The boards themselves are always computed fused (`research.model.arithmetic`), on any host.
      # The board, register, backtest and fit cases read the dev copy of production
      # (PARITY_SOURCE_DATABASE_URL), which never lives on a runner; they run where it is restored.
      - name: Parity, the model's numerics
        run: uv run python -m research.parity model all --no-store
      # The decide layer and the advisor. The recorded room states (advise-rooms) carry their board
      # as a committed fixture, so every decide case runs here. The port is judged in the arm of
      # the node it is compared with (unfused on this x86-64 runner, `node_arithmetic`); the
      # advisor itself always runs fused, as the stored boards were made.
      - name: Parity, the decide layer and the advisor
        run: uv run python -m research.parity decide all

  image:
    needs: research
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    env:
      PUSH: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # The run reader's import closure held to the Dockerfile's COPY lines and pins
        # (web/src/lib/run/image-closure.test.ts, which reads them with typescript): a COPY change that
        # leaves an import behind fails here, before the image builds (Lane 76 review).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: The image's copy of the run reader holds its import closure
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test src/lib/run/image-closure.test.ts
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: auth
        if: env.PUSH == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
      - if: env.PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
        # Built on every push and pull request that can change it, pushed only from main.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: research
          file: research/Dockerfile
          # The web's run contract, which the nightly's schema gate runs (research/nightly/schema_gate.py),
          # the API's words file its format modules import, and the site's banned list the writer reads
          # (research/Dockerfile, the web-contract stage).
          build-contexts: |
            web=web
            api=api
            shared=shared
          build-args: VERSION=${{ github.sha }}
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=research
          cache-to: type=gha,mode=max,scope=research
        # The schema gate inside the built image, over a recorded three-player run
        # (research/nightly/contract/fixture): a web import the image's contract copy lacks fails here,
        # not on the first night (review N16).
      - name: The schema gate in the built image
        run: docker run --rm "$IMAGE" research.nightly contract --runs nightly/contract/fixture --run-id 2026-10-13T21-2
        # An in-season run (week 7 to play): the rest-of-season board's rows, no range, the preseason
        # rank and points beside them, and a player off the preseason board (research/nightly/build/ros.py).
      - name: The schema gate in the built image, an in-season run
        run: docker run --rm "$IMAGE" research.nightly contract --runs nightly/contract/fixture --run-id 2026-10-21T12-ros
      - name: Push the image
        if: env.PUSH == 'true'
        run: docker push "$IMAGE"

  deploy:
    needs: image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    env:
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with: { project_id: '${{ vars.GCP_PROJECT }}' }

        # THE ADVISOR (spec §2.3): called only by api and room, never by a browser.
        # Ingress all behind IAM: the invoker check is on and only api-runtime holds the invoker
        # role, so a call needs a Google identity token for this service minted by that account.
        # Not internal ingress: api and room have no VPC egress, so an internal-only service would
        # be unreachable from them; IAM, not the network path, is the gate.
        # It runs as advisor-runtime, which holds no role: it reads no table and calls no provider
        # (the room sends the whole pool with each call), so it mounts no secret and can read
        # none; the nightly job is the image's command that reads RESEARCH_DATABASE_URL and
        # AI_GATEWAY_API_KEY, as research-runtime.
        # Two processes on two vCPUs (ADVISOR_WORKERS), four calls an instance at once, ready only
        # after a warm-up call (/readyz). ADVISOR_MIN_INSTANCES is 1 in season (July through
        # September, with the room's ROOM_MIN_INSTANCES) so the first room after an idle spell
        # never waits on a cold start past the rooms' ADVISOR_TIMEOUT_MS, and 0 otherwise.
      - uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        id: advisor
        with:
          service: advisor
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          env_vars: ADVISOR_WORKERS=2
          env_vars_update_strategy: overwrite
          flags: >-
            --service-account=${{ env.ADVISOR_SA }} --ingress=all --no-allow-unauthenticated
            --cpu=2 --memory=1Gi --concurrency=4 --min-instances=${{ vars.ADVISOR_MIN_INSTANCES || '0' }}
            --max-instances=10
            --cpu-boost --timeout=10 --port=8080
            --startup-probe=httpGet.path=/readyz,httpGet.port=8080,periodSeconds=2,failureThreshold=30,timeoutSeconds=2
            --liveness-probe=httpGet.path=/healthz,httpGet.port=8080,periodSeconds=30,timeoutSeconds=2
      - name: Only the api and room services may invoke the advisor
        run: |
          gcloud run services add-iam-policy-binding advisor --region "$REGION" \
            --member "serviceAccount:$CALLER_SA" --role roles/run.invoker --quiet
      - name: The advisor's URL, for the api's ADVISOR_URL
        env:
          URL: ${{ steps.advisor.outputs.url }}
        run: echo "advisor deployed at $URL (set the repository variable ADVISOR_URL to it)" >> "$GITHUB_STEP_SUMMARY"

        # THE BOARDS SERVICE (Lane 8, part A): a board for a league's exact scoring rules, called only
        # by api with an identity token, never by a browser. Like the advisor, ingress all behind IAM
        # with run.invoker on api-runtime alone: api has no VPC egress, so an internal-ingress service
        # would be unreachable from it, and IAM, not the network path, is the gate. Unlike the
        # advisor it reads the research schema (the stored boards' candidate sets) and writes its
        # cache (custom_boards), so it runs as its own boards-runtime, which can read
        # RESEARCH_DATABASE_URL and no other secret. One process, BOARDS_WORKERS threads, ready once the pinned priors are loaded.
      - uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        id: boards
        with:
          service: boards
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          env_vars: BOARDS_WORKERS=2
          env_vars_update_strategy: overwrite
          secrets: RESEARCH_DATABASE_URL=RESEARCH_DATABASE_URL:latest
          secrets_update_strategy: overwrite
          flags: >-
            --service-account=${{ env.BOARDS_SA }} --ingress=all --no-allow-unauthenticated
            --args=research.boards --set-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }}
            --cpu=1 --memory=1Gi --concurrency=8 --min-instances=0 --max-instances=4
            --cpu-boost --timeout=15 --port=8080
            --startup-probe=httpGet.path=/readyz,httpGet.port=8080,periodSeconds=2,failureThreshold=30,timeoutSeconds=2
            --liveness-probe=httpGet.path=/healthz,httpGet.port=8080,periodSeconds=30,timeoutSeconds=2
      - name: Only the api may invoke the boards service
        run: |
          gcloud run services add-iam-policy-binding boards --region "$REGION" \
            --member "serviceAccount:$CALLER_SA" --role roles/run.invoker --quiet
      - name: The boards service's URL, for the api's BOARDS_URL
        env:
          URL: ${{ steps.boards.outputs.url }}
        run: echo "boards deployed at $URL (set the repository variable BOARDS_URL to it)" >> "$GITHUB_STEP_SUMMARY"

        # THE NIGHTLY AND IN-SEASON JOBS (spec §4, research/JOBS.md): one image, one Cloud Run Job per
        # command, each running as research-runtime with only the secrets its command reads. Cloud
        # Scheduler runs them (infra/README.md, "The research schedule"); the deployer lacks the
        # scheduler role, so the scheduler jobs are created by hand, and this step grants their caller
        # (research-runtime) run.invoker on each job and nothing wider.
      - name: The nightly and in-season jobs
        env:
          RUNTIME_SA: research-runtime@trycommish.iam.gserviceaccount.com
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          db="RESEARCH_DATABASE_URL=RESEARCH_DATABASE_URL:latest"
          nightly="$db,AI_GATEWAY_API_KEY=AI_GATEWAY_API_KEY:latest,CLOUDFLARE_API_TOKEN=CLOUDFLARE_API_TOKEN:latest"
          nightly="$nightly,TANK01_API_KEY=TANK01_API_KEY:latest,ODDS_API_KEY=ODDS_API_KEY:latest"
          publish="$db,CLOUDFLARE_API_TOKEN=CLOUDFLARE_API_TOKEN:latest,WEB_DISPATCH_TOKEN=WEB_DISPATCH_TOKEN:latest"
          deploy() { # name, args, secrets, cpu, memory, task timeout
            # A job that reads the database gets its socket; one that does not gets none.
            sql=()
            case "$3" in *RESEARCH_DATABASE_URL=*) sql=(--set-cloudsql-instances "$CLOUDSQL_INSTANCE") ;; esac
            gcloud run jobs deploy "$1" --image "$IMAGE" --region "$REGION" --service-account "$RUNTIME_SA" \
              --args "$2" --set-secrets "$3" --set-env-vars "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" "${sql[@]}" \
              --cpu "$4" --memory "$5" --task-timeout "$6" --max-retries 0 --quiet
            gcloud run jobs add-iam-policy-binding "$1" --region "$REGION" \
              --member "serviceAccount:$RUNTIME_SA" --role roles/run.invoker --quiet
          }
          # A season's first night rewrites every capsule (hours at the gateway's pace); a night after, minutes.
          # A plain night: an injury status is dated by the day it began (fix round 4), so only sheets
          # whose facts truly moved are rewritten. Measured night to night on the dev copy, Oct 6 to 14:
          # 31 to 69 of 536 sheets (mean 48, 8.9%; new designations and headlines), about $0.11 a night.
          # A store whose capsules predate the change is restamped once first (`python -m
          # research.capsules restamp-injury-day`, idempotent), or its first night rewrites the board.
          deploy nightly "research.nightly,run" "$nightly" 2 2Gi 8h
          # A window hour waits up to 10 minutes for this hour's status capture before it marks the run
          # (Lane 222, research/nightly/game_day_reads.py), and may try a refused dispatch three times.
          deploy nightly-publish "research.nightly,publish" "$publish" 1 512Mi 20m
          # The Thursday pass reads the Tank01 player list before its freeze (step player-list, Lane 160).
          weekly="$db,ODDS_API_KEY=ODDS_API_KEY:latest,CLOUDFLARE_API_TOKEN=CLOUDFLARE_API_TOKEN:latest,TANK01_API_KEY=TANK01_API_KEY:latest"
          deploy inseason "research.inseason,--task,season-week" "$weekly" 2 2Gi 1h
          # The hourly capture rewrites the week-ahead reads its status capture moved (Lane 72): the writer's key,
          # and the memory and time of the board's facts pass (about 200 MB, a minute) beside the capture.
          capture="$db,TANK01_API_KEY=TANK01_API_KEY:latest,AI_GATEWAY_API_KEY=AI_GATEWAY_API_KEY:latest"
          deploy inseason-capture "research.inseason,--task,capture-harvest" "$capture" 1 2Gi 20m
          # The game-day status pass (Lane 263): the same secrets and week reads, two provider requests.
          deploy inseason-status "research.inseason,--task,capture-status" "$capture" 1 2Gi 20m
          # Our headshot copies (Lane 241): about 1,500 fetches at two a second on the first fill, each
          # converted to eight webp widths; the token must write commish-images as well as commish-runs.
          deploy headshots "research.headshots,sync" "$db,CLOUDFLARE_API_TOKEN=CLOUDFLARE_API_TOKEN:latest" 1 1Gi 1h
