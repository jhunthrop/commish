[versions]
# The Android API levels every module builds against, in one place. Target what Google Play requires
# today (Android 16, API 36, for new apps and updates since 2026-08-31; Lane 218).
android-compile-sdk = "36"
android-target-sdk = "36"
android-min-sdk = "26"
# 8.10: compile SDK 36 needs 8.9 or newer, and Paparazzi 2.0.0-alpha02 calls an 8.10 API. Gradle 8.11.1 is its floor.
agp = "8.10.1"
# 2.1.21: Paparazzi 2.0.0-alpha02 brings kotlin-compiler-embeddable 2.1.21 onto the build classpath, and
# the Kotlin Gradle plugin must match it (2.0.21 failed in compileDebugKotlin). Lane 218.
kotlin = "2.1.21"
compose-bom = "2024.12.01"
activity-compose = "1.9.3"
lifecycle = "2.8.7"
navigation = "2.8.5"
browser = "1.9.0"
security-crypto = "1.1.0-alpha06"
coroutines = "1.9.0"
serialization = "1.7.3"
ktor = "2.3.12"
junit5 = "5.11.3"
junit4 = "4.13.2"
android-junit5 = "1.11.2.0"
# 2.0.0-alpha02: 1.3.5's layoutlib cannot render against compile SDK 36 (android.os.Build gained a class its
# layoutlib lacks: NoSuchElementException in Renderer.configureBuildProperties). alpha02 is the first with
# compile SDK 36 and the last before Java 21 is required (alpha04). Lane 218.
paparazzi = "2.0.0-alpha02"
# Compose tests on the JVM (Lane 197): the sheet's composable wiring, with no device.
robolectric = "4.14.1"
openapi-generator = "7.10.0"
ktlint-gradle = "12.1.2"
# The image loader faces draw through (Lane 195), pinned: Compose and OkHttp, as the API client uses.
coil = "3.0.4"
# Push (Lane 288): Firebase Messaging through its BoM, and the plugin that reads google-services.json.
firebase-bom = "33.7.0"
google-services = "4.4.2"
# Firebase's Play services bring an older Fragment, under the 1.3 the activity's permission launcher needs.
fragment = "1.8.5"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
# The room socket (core room/), the OkHttp the API client already runs on (ktor 2.3.12 takes 4.12.0).
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version = "4.12.0" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-junit5 = { id = "de.mannodermaus.android-junit5", version.ref = "android-junit5" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
