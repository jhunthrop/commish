# The iOS app's Xcode project, generated by XcodeGen (`xcodegen generate` in apps/ios). The project
# file is not committed; this is its source. The app is a thin shell over the local packages.
name: Commish
options:
  bundleIdPrefix: app.trycommish
  deploymentTarget:
    # 17.4: the sign-in sheet takes its https return (ASWebAuthenticationSession.Callback.https).
    iOS: "17.4"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    # The Swift 6 language mode, the newest there is: Swift 6.1 to 6.4 (Xcode 26.6 ships 6.3) add
    # compiler releases, not modes (`swiftc -language-mode` takes 4, 4.2, 5 and 6). The packages say
    # the same in their swiftLanguageModes.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    # The simulator reaches the API on this Mac; a device build reads the live API.
    Debug:
      API_BASE_URL: http://localhost:8080
    Release:
      API_BASE_URL: https://api.trycommish.app
packages:
  CommishAPI:
    path: Packages/CommishAPI
  CommishDesign:
    path: Packages/CommishDesign
  CommishCore:
    path: Packages/CommishCore
  LeagueHome:
    path: Packages/Features/LeagueHome
  Shell:
    path: Packages/Features/Shell
  Start:
    path: Packages/Features/Start
  BoxScore:
    path: Packages/Features/BoxScore
  Matchup:
    path: Packages/Features/Matchup
  Board:
    path: Packages/Features/Board
  Waivers:
    path: Packages/Features/Waivers
  Player:
    path: Packages/Features/Player
  Trades:
    path: Packages/Features/Trades
  Rankings:
    path: Packages/Features/Rankings
  Record:
    path: Packages/Features/Record
  Account:
    path: Packages/Features/Account
  Reference:
    path: Packages/Features/Reference
  Companion:
    path: Packages/Features/Companion
  MockRoom:
    path: Packages/Features/MockRoom
  Sheet:
    path: Packages/Features/Sheet
targets:
  Commish:
    type: application
    platform: iOS
    sources:
      - path: Commish
    dependencies:
      - package: CommishAPI
      - package: CommishDesign
      - package: CommishCore
      - package: LeagueHome
      - package: Shell
      - package: Start
      - package: BoxScore
      - package: Matchup
      - package: Board
      - package: Waivers
      - package: Player
      - package: Trades
      - package: Rankings
      - package: Record
      - package: Account
      - package: Reference
      - package: Companion
      - package: MockRoom
      - package: Sheet
    entitlements:
      path: Commish/Commish.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:trycommish.app
          # The sign-in sheet takes its https return on iOS 17.4 and later only for a domain the app
          # holds web credentials for (apple-app-site-association's webcredentials).
          - webcredentials:trycommish.app
        # Push (Lane 288): APNs. Automatic signing adds the capability to the App ID, and the App Store
        # export (fastlane beta) writes production in the signed app.
        aps-environment: development
    info:
      path: Commish/Info.plist
      properties:
        CFBundleDisplayName: Commish
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CommishAPIBaseURL: $(API_BASE_URL)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Debug builds read the API on this Mac over http; ATS stays on for every other host.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trycommish.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  CommishTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CommishTests
    dependencies:
      - target: Commish
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Commish:
    build:
      targets:
        Commish: all
        CommishTests: [test]
    test:
      targets:
        - CommishTests
