    - leagueMatchup
    - runManifest
    - runBoard
    - runAdp
    - runDesignations
    - runClubs
    - runIndex
    - runPlayer
    - runHeld
    - runHeldCopy
    - runSchedule
    - playerWeek
    - leaguePlayerWeek
    - leagueWaivers
    - leagueTrades
    - checkLeagueTrade
    - order
    - weekOrder
    - runRecord
    - listCompanions
    - createCompanion
    - getCompanion
    - companionReport
    - createMock
    - getMock
    - pickMock
    - undoMock
    - autopickMock
    - finishMock
    - queueMock
    - mockCard
    - mockReport
