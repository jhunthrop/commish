        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/yahoo:
    delete:
      tags: [hosts]
      operationId: disconnectYahoo
      summary: Disconnect Yahoo. The kept tokens are deleted at once; leagues read from Yahoo keep their last read, shown as stale.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/espn/connect:
    post:
      tags: [hosts]
      operationId: connectESPN
      summary: >-
        Keep the member's two ESPN cookies, SWID and espn_s2 (handed to our page by Disney's own sign-in widget, or
        pasted from ESPN's site), envelope encrypted, once ESPN reads the member's league list with them. When the list
        holds a league the public cannot read, that league is read with them too (what proves espn_s2) and the
        connection is proven (201). When no listed league is checked private, a league whose check ESPN did not answer
        is read with them instead (a refusal refuses the connect). When every listed league is public, or ESPN lists
        none, the session is kept anyway, not yet proven, for the day a private league or a move needs it (200, with a
        note saying so); the first member read of a league the public cannot read proves it later. Never a password.
        Answers the member's ESPN football leagues this season. Needs consent. 422 when ESPN does not accept the two
        values; three refusals in an hour pause connecting for the hour (423). 502, with nothing kept, when ESPN does
        not answer within the connect's 40 seconds. 5 an hour an account. 503 when ESPN is not open here.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ESPNConnectInput" }
      responses:
        "200":
          description: connected, the session kept and not yet proven against a private league
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/HostConnected" } }
        "201":
          description: connected and proven
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/HostConnected" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "423": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/espn/leagues:
    get:
      tags: [hosts]
      operationId: espnLeagues
      summary: >-
        The member's ESPN football leagues this season, read from ESPN with their cookies, public and private, each
        with its size, whether the account follows it already, and whether the public reads it (checked with no
        cookies and kept for an hour), or why it carries no mark. A session not yet proven whose list holds a league
        checked private reads that league with the cookies before answering: that proves the session, and a refusal
        signs it out. 404 when not connected; 409 when ESPN does not accept the cookies (the message says whether it
        ever did).
      security: [{ session: [] }, { device: [] }]
      responses:
        "200":
          description: the leagues
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
