  /companions:
    get:
      tags: [companions]
      operationId: listCompanions
      summary: The account's newest followed drafts, newest first, with the Sleeper username each seat was found by.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200":
          description: up to five
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/CompanionSummary" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [companions]
      operationId: createCompanion
      summary: >-
        Follow a draft running on another host (Sleeper today) from the drafter's seat. Needs the live_draft_advisor
        feature (403 with feature otherwise). Snake drafts only; an auction, a linear order or a reversal is refused
        with a sentence. The same draft again answers the companion already made, with the seat updated.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanionCreate" }
      responses:
        "200": { $ref: "#/components/responses/CompanionResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /companions/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - name: since
        in: query
        required: false
        description: the pick count the caller already holds (its last answer's pick_count); only later picks are sent
        schema: { type: integer, minimum: 0, maximum: 1600, default: 0 }
    get:
      tags: [companions]
      operationId: getCompanion
      summary: >-
        The host's draft as of at most two seconds ago, the drafter's seat, pick N of M, picks until their turn, and at
        their turn our call. One upstream read per draft per two seconds whatever the viewer count; when the host fails,
        the last snapshot with host_stale_seconds.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/CompanionResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /companions/{id}/report:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [companions]
      operationId: companionReport
      summary: The report on the finished draft from the drafter's seat, once the host says it is complete (409 before).
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockReportResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: The account's paired browsers, newest first, each with its scopes and when it last sent a page.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200":
          description: up to ten
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/Device" } } }
  /devices/codes:
    post:
      tags: [devices]
      operationId: createPairCode
      summary: >-
        A one-time pairing code for the browser extension: six words, good for ten minutes and one pairing. A new code
        replaces the account's earlier one.
      security: [{ session: [] }, { device: [] }]
      responses:
        "201":
          description: the code, shown once
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/PairCode" } }
  /devices/pair:
    post:
      tags: [devices]
      operationId: pairDevice
      summary: >-
        A device trades a pairing code for its device token, answered this once and never again. The extension (kind
        extension, the default) trades the account page's code, and its token goes in Authorization Bearer on the
        device routes only. An app (kind ios or android) trades the code its sign-in came back with and the
        code_verifier behind that sign-in's code_challenge, and its token also carries the session scope. A code pairs
        only the kind it was minted for; a missing or wrong verifier is 400 and spends nothing. Never a cookie. 10 a
        minute an address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairInput" }
      responses:
        "201":
          description: the device and its token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/Paired" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /devices/me:
    get:
      tags: [devices]
      operationId: deviceMe
      summary: The paired device asking, and the account it writes for, so the extension's popup can say so.
      security: [{ device: [] }]
      responses:
        "200":
          description: the device
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/DeviceMe" } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /devices/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Unpair a browser. Its token opens nothing from the next request on.
      description: >-
        An app signing itself out (its own device token, its own id) is answered a DeviceSignOut: the WorkOS logout URL
        that ends the sign-in's WorkOS session, or url null for a device paired before the API kept it. Any other unpairing
        (the account page's cookie, or an app unpairing another device) is answered data null.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200":
          description: unpaired
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { nullable: true, allOf: [{ $ref: "#/components/schemas/DeviceSignOut" }] } }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /hosts:
    get:
      tags: [hosts]
      operationId: listHostConnections
      summary: >-
        The hosts connecting is open for here (HOST_FFPC_ENABLED, HOST_YAHOO_ENABLED, HOST_ESPN_ENABLED, each with the
        credentials key present), and the hosts the account is connected to, each with its state and when it was last
        read. No credential is ever answered. Signed out it answers the switches with no
        connections: a switch is not account data. MyFantasyLeague is listed with HOST_WRITES_MFL_LINEUP on and the
        key present, and while the switch is off, signed in, to the accounts on its proof list alone.
      security: [{ session: [] }, { device: [] }, {}]
      responses:
        "200":
          description: the connections
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/HostConnections" } }
  /hosts/ffpc/connect:
    post:
      tags: [hosts]
      operationId: connectFFPC
      summary: >-
        Sign in to FFPC as the member, through FFPC's own sign-in form, and keep what FFPC hands back (its session, and
        the sign-in because FFPC offers no other way to renew a session), envelope encrypted. Answers the member's FFPC
        leagues. Needs consent, kept with its time and words. Three refused sign-ins in an hour pause connecting for the
        hour (423). 5 an hour an account. 502 when FFPC is not answering or answers a sign-in in a way we do not expect;
        503 when FFPC is not open here or its sign-in page changed.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostConnectInput" }
      responses:
        "201":
          description: connected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/HostConnected" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "423": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/ffpc/leagues:
    get:
      tags: [hosts]
      operationId: ffpcLeagues
      summary: The member's FFPC leagues, read from FFPC as them. 409 when the connection needs a fresh sign-in.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200":
          description: the leagues
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/HostLeague" } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/ffpc:
    delete:
      tags: [hosts]
      operationId: disconnectFFPC
      summary: Disconnect FFPC. The kept sign-in and session are deleted at once; leagues read from FFPC stop updating.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/yahoo/connect:
    post:
      tags: [hosts]
      operationId: connectYahoo
      summary: >-
        Start connecting Yahoo: answers Yahoo's authorize address for the member to open, carrying a state bound to the
        account that expires in ten minutes, one use, and a PKCE S256 challenge. The permission Yahoo shows is Fantasy
        Sports, read only. The page the member started from may ride along (return_to), a path on the site the callback
        sends them back to once connected. 5 an hour an account. 503 when Yahoo is not open here.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/YahooConnectInput" }
      responses:
        "200":
          description: the authorize address
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/Redirect" } }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/yahoo/callback:
    get:
      tags: [hosts]
      operationId: yahooCallback
      summary: >-
        Yahoo returns here. The state must be one this account started in the last ten minutes, and the browser must be
        signed in as that account. The code is exchanged for Yahoo's tokens, which are kept envelope encrypted. Always
        redirects to the site: the page the sign-in started from (return_to) or the account page with yahoo=connected,
        or the account page with yahoo=refused and why (denied, expired, signed_out, failed, off), never anywhere else.
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        "302": { description: to the site's account page with the outcome }
  /hosts/yahoo/leagues:
    get:
      tags: [hosts]
      operationId: yahooLeagues
      summary: >-
        The member's Yahoo football leagues for the current season, read from Yahoo as them, each with its size, its
        scoring type and whether the account follows it already. 404 when not connected; 409 when Yahoo refused the kept
        token and the member connects again.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200":
          description: the leagues
          content:
