openapi: 3.0.3
info:
  title: Commish API
  version: 1.0.0
  description: >-
    The prep site's request-time API (spec docs/superpowers/specs/2026-10-12-prep-site-architecture-design.md §2.2).
    Every response is the envelope: ok, data, error, meta (pages only), request_id. Every route is rate limited
    by a token bucket keyed by the signed-in account, or by the client address when signed out; a spent bucket
    answers 429 with error.code rate_limited and a Retry-After header. State-changing requests that carry the
    session cookie must echo the commish_csrf cookie in the X-CSRF-Token header.
servers:
  - url: https://api.trycommish.app
    description: the request API (cmd/api)
  - url: https://room.trycommish.app
    description: the live room service (cmd/room), WebSocket only
  - url: http://localhost:8080
    description: local development

tags:
  - { name: health }
  - { name: auth }
  - { name: leagues }
  - { name: sheets }
  - { name: exports }
  - { name: billing }
  - { name: mocks }
  - { name: rooms }
  - { name: companions }
  - { name: devices }
  - { name: hosts }

paths:
  /healthz:
    get:
      tags: [health]
      operationId: liveness
      summary: The process is up. Never touches the database.
      responses:
        "200": { $ref: "#/components/responses/HealthResponse" }
  /readyz:
    get:
      tags: [health]
      operationId: readiness
      summary: The process can reach the database.
      responses:
        "200": { $ref: "#/components/responses/HealthResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }

  /auth/login:
    get:
      tags: [auth]
      operationId: login
      summary: Redirects to WorkOS AuthKit. return_to is a path on the site the browser comes back to.
      parameters:
        - { name: return_to, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: screen, in: query, required: false, schema: { type: string, enum: [sign-in, sign-up] } }
      responses:
        "302": { description: to WorkOS }
  /auth/callback:
    get:
      tags: [auth]
      operationId: callback
      summary: WorkOS returns here. Sets the sealed session cookie on the apex domain and redirects to the site.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: to the site, or to its sign-in problem page }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Ends the session here and returns the WorkOS logout URL that ends it there.
      responses:
        "200":
          description: signed out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/Redirect" } }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    patch:
      tags: [auth]
      operationId: updateMe
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }

  /leagues:
    get:
      tags: [leagues]
      operationId: listLeagues
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200":
          description: the account's saved leagues, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/League" } } }
    post:
      tags: [leagues]
      operationId: createLeague
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeagueInput" }
      responses:
        "201": { $ref: "#/components/responses/LeagueResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [leagues]
      operationId: getLeague
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/LeagueResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    put:
      tags: [leagues]
      operationId: replaceLeague
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeagueInput" }
      responses:
        "200": { $ref: "#/components/responses/LeagueResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [leagues]
      operationId: deleteLeague
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /leagues/attach/preview:
    post:
      tags: [league-sync]
      operationId: previewAttach
      summary: >-
        Read a league on another host by its link (Sleeper, or a public MyFantasyLeague league) and answer its name and
        teams, so the drafter can say which team is theirs. Free. Nothing is saved.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachPreviewInput" }
      responses:
        "200": { $ref: "#/components/responses/AttachPreviewResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attach:
    post:
      tags: [league-sync]
      operationId: attachLeague
      summary: >-
        Attach the drafter's own league on another host by its link. Free. The league's roster and scoring become a
        saved league (custom scoring, exactly as the host states it) a mock reruns from, when a mock room can draft
        its shape. The drafter's seat is the team their Sleeper username runs, or the team they pick. Attaching the
        same league again updates the seat.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachInput" }
      responses:
        "201": { $ref: "#/components/responses/LeagueSyncResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached:
    get:
      tags: [league-sync]
      operationId: listAttached
      summary: The account's attached leagues, newest first.
      security: [{ session: [] }]
      responses:
        "200":
          description: up to twenty
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/AttachedLeague" } } }
  /leagues/attached/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    delete:
      tags: [league-sync]
      operationId: detachLeague
      summary: >-
        Stop following a league. The attachment is kept as detached, with the saved league it made, so the detach
        can be undone (restore) and mocks saved from it keep their settings.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [league-sync]
      operationId: restoreLeague
      summary: Undo a detach. The league is followed again with the seat and saved league it had.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    get:
      tags: [league-sync]
      operationId: leagueSync
      summary: >-
        The attached league as it stands: standings, the drafter's roster, the week's matchup, the moves of this week
        and last, and the unrostered pool on our board. One upstream read per league per minute whatever the viewer
        count; when the host fails, the last good read with host_stale_seconds.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/LeagueSyncResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/refresh:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    post:
      tags: [league-sync]
      operationId: refreshLeague
      summary: >-
        Read the league from its host now, shared with any read inside the last ten seconds. 30 an hour an account.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/LeagueSyncResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }

  /sheets:
    get:
      tags: [sheets]
      operationId: listSheets
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200":
          description: the account's sheets, most recently changed first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/Sheet" } } }
    post:
      tags: [sheets]
      operationId: createSheet
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetCreate" }
      responses:
        "201": { $ref: "#/components/responses/SheetDetailResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /sheets/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [sheets]
      operationId: getSheet
      summary: The sheet with every row in rank order. Also the print view's data.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/SheetDetailResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    patch:
      tags: [sheets]
      operationId: renameSheet
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetUpdate" }
      responses:
        "200": { $ref: "#/components/responses/SheetResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [sheets]
      operationId: deleteSheet
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /sheets/{id}/rows:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    put:
      tags: [sheets]
      operationId: replaceSheetRows
      summary: Replaces every row. Rank is the order of the array, from 1. A drag sends the whole order.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetRowsReplace" }
      responses:
        "200": { $ref: "#/components/responses/SheetDetailResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /sheets/{id}/rows/{player_id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { name: player_id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    put:
      tags: [sheets]
      operationId: updateSheetRow
      summary: Sets one row's tier, tag and note. Null clears a field.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetRowUpdate" }
      responses:
        "200":
          description: the row as stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/SheetRow" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /sheets/{id}/import:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [sheets]
      operationId: importSheet
      summary: >-
        Replaces the rows from a CSV in the export's columns (rank, player_id, name, position, team, tier, tags,
        note). rank and player_id and name and position are required. tags holds up to four tags separated by
        commas, bars or semicolons, and a header named tag is read as tags. Rows are ordered by rank.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: what was imported and what was skipped, by line
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/SheetImportResult" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /sheets/{id}/exports:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [exports]
      operationId: exportSheet
      summary: Writes the sheet as a file to object storage and returns a signed link to it.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportCreate" }
      responses:
        "201": { $ref: "#/components/responses/ExportLinkResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /exports:
    get:
      tags: [exports]
      operationId: listExports
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200":
          description: the account's unexpired exports, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/Export" } } }
  /exports/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [exports]
      operationId: getExport
      summary: A fresh signed link to an export that has not expired.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/ExportLinkResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /billing/plans:
    get:
      tags: [billing]
      operationId: getPlans
      summary: >-
        What is for sale, for how much and what each product unlocks. Prices are read from Stripe, the annual
        Membership first; what each product unlocks is read from app.product_features. With checkout not open (Stripe
        not configured) the prices are the launch prices stripe-setup creates, and checkout_open says no one can pay yet.
      responses:
        "200":
          description: the catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/PlanCatalog" } }
  /billing/checkout:
    post:
      tags: [billing]
      operationId: checkout
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200": { $ref: "#/components/responses/RedirectResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /billing/portal:
    post:
      tags: [billing]
      operationId: billingPortal
      summary: The Stripe customer portal, for the card and receipts.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/RedirectResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /billing/membership/cancel:
    post:
      tags: [billing]
      operationId: cancelMembership
      summary: One-click cancellation. The Membership runs to the end of the period it was paid for and does not renew.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /billing/membership/resume:
    post:
      tags: [billing]
      operationId: resumeMembership
      summary: Undoes a cancellation before the period ends.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /billing/webhook:
    post:
      tags: [billing]
      operationId: stripeWebhook
      summary: Stripe events. The signature is verified on the raw body before anything else runs.
      parameters:
        - { name: Stripe-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /billing/group-passes:
    get:
      tags: [billing]
      operationId: listGroupPasses
      summary: The group passes this account bought, with their claim links.
      security: [{ session: [] }]
      responses:
        "200":
          description: newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/GroupPass" } } }
  /group-passes/{code}:
    parameters: [{ $ref: "#/components/parameters/ClaimCode" }]
    get:
      tags: [billing]
      operationId: previewGroupPass
      summary: What a claim link grants and how many seats are left. Readable signed out.
      responses:
        "200":
          description: the pass
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/GroupPassPreview" } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "410": { $ref: "#/components/responses/ErrorResponse" }
  /group-passes/{code}/claim:
    parameters: [{ $ref: "#/components/parameters/ClaimCode" }]
    post:
      tags: [billing]
      operationId: claimGroupPass
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "410": { $ref: "#/components/responses/ErrorResponse" }

  /mocks:
    get:
      tags: [mocks]
      operationId: listMocks
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200":
          description: the account's mocks, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/Mock" } } }
    post:
      tags: [mocks]
      operationId: createMock
      summary: >-
        Starts a solo mock from a saved league or from settings. The answer is the room at the drafter's first
        turn: every bot pick before it is already made, with the board the room drafts from. Signed out, a browser
        keeps 25 unfinished mocks (409 past that) and every signed-out browser together starts 2,000 an hour (429
        past that).
      security: [{ session: [] }, { anon: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MockCreate" }
      responses:
        "201": { $ref: "#/components/responses/MockRoomResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "415": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [mocks]
      operationId: getMock
      summary: The room as it stands, with the board.
      security: [{ session: [] }, { anon: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [mocks]
      operationId: deleteMock
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/picks:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [mocks]
      operationId: pickMock
      summary: >-
        The drafter's pick, and every bot pick to the drafter's next turn in the same transaction, stamped with no
        delay. pick is the overall pick the drafter saw, so a second submit of the same click answers 409. The
        answer carries no board.
      security: [{ session: [] }, { anon: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MockPickInput" }
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/undo:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [mocks]
      operationId: undoMock
      summary: >-
        Takes back one of the drafter's picks and every pick after it. The draft replays from there with the same
        seed, so the bots draft the same up to the change.
      security: [{ session: [] }, { anon: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MockUndoInput" }
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/autopick:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - name: to_round
        in: query
        required: true
        schema: { type: integer, minimum: 1, maximum: 25 }
    post:
      tags: [mocks]
      operationId: autopickMock
      summary: >-
        Pick for me to round N: the drafter's turns through that round draft from the queue first, then the
        newest cheat sheet, then the board.
      security: [{ session: [] }, { anon: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/finish:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [mocks]
      operationId: finishMock
      summary: Finish the draft, every remaining turn by the same rule as autopick.
      security: [{ session: [] }, { anon: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/queue:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    put:
      tags: [mocks]
      operationId: queueMock
      summary: Replaces the drafter's queue, best first.
      security: [{ session: [] }, { anon: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MockQueueInput" }
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/card:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [mocks]
      operationId: mockCard
      summary: >-
        Our call at the drafter's turn and every player's chance of lasting to the next one, from the advisor, or
        from the engine's 200 runs when the advisor does not answer. Recorded the first time it is read and written
        with the pick.
      security: [{ session: [] }, { anon: [] }]
      responses:
        "200": { $ref: "#/components/responses/RoomCardResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/report:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [mocks]
      operationId: mockReport
      summary: The finished draft's report, computed once and kept until an undo reopens the draft.
      security: [{ session: [] }, { anon: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockReportResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /boards/{format}:
    parameters:
      - name: format
        in: path
        required: true
        schema: { type: string, enum: [ppr, half, std] }
    get:
      tags: [mocks]
      operationId: roomBoard
      summary: >-
        The board a room drafts from in a scoring format, valued for 12 teams on the standard roster: the setup
        page's player list for keepers. A room values its own league.
      responses:
        "200":
          description: the board
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/RoomBoard" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /shared/mocks/{code}:
    parameters: [{ $ref: "#/components/parameters/ShareCode" }]
    get:
      tags: [mocks]
      operationId: sharedMock
      summary: A shared draft replayed from its settings, seed and picks, for anyone with the link.
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /shared/mocks/{code}/report:
    parameters: [{ $ref: "#/components/parameters/ShareCode" }]
    get:
      tags: [mocks]
      operationId: sharedMockReport
      summary: The report of a shared, finished draft.
      responses:
        "200": { $ref: "#/components/responses/MockReportResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }

  /lobbies:
    get:
      tags: [rooms]
      operationId: listLobbies
      summary: Each lobby format and how full its filling room is.
      responses:
        "200":
          description: the formats, in the setup page's order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/LobbyFilling" } } }
  /lobbies/join:
    post:
      tags: [rooms]
      operationId: joinLobby
      summary: >-
        Takes a seat in the format's filling room, or opens one. A room starts when it is full or 90 seconds after
        its first drafter joined, with bots in the open seats. Needs a handle (409 with field handle without one).
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LobbyJoin" }
      responses:
        "200": { $ref: "#/components/responses/LobbySeatResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /lobbies/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [rooms]
      operationId: getLobby
      summary: The room's settings, seats and board, for a drafter with a seat in it. Picks come over the socket.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/LobbyRoomResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /lobbies/{id}/leave:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [rooms]
      operationId: leaveLobby
      summary: Gives the seat up. A filling room frees it; a drafting room hands it to a bot at once.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /lobbies/{id}/card:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [rooms]
      operationId: lobbyCard
      summary: >-
        On your turn, our call as in the solo room. Off it, the call if the board holds to your pick, with each
        player's chance of reaching it.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/RoomCardResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /lobbies/{id}/report:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [rooms]
      operationId: lobbyReport
      summary: The report of a finished lobby, for the caller's seat.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockReportResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }

  /companions:
    get:
      tags: [companions]
      operationId: listCompanions
      summary: The account's newest followed drafts, newest first, with the Sleeper username each seat was found by.
      security: [{ session: [] }]
      responses:
        "200":
          description: up to five
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/CompanionSummary" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [companions]
      operationId: createCompanion
      summary: >-
        Follow a draft running on another host (Sleeper today) from the drafter's seat. Needs the live_draft_advisor
        feature (403 with feature otherwise). Snake drafts only; an auction, a linear order or a reversal is refused
        with a sentence. The same draft again answers the companion already made, with the seat updated.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanionCreate" }
      responses:
        "200": { $ref: "#/components/responses/CompanionResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /companions/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - name: since
        in: query
        required: false
        description: the pick count the caller already holds (its last answer's pick_count); only later picks are sent
        schema: { type: integer, minimum: 0, maximum: 1600, default: 0 }
    get:
      tags: [companions]
      operationId: getCompanion
      summary: >-
        The host's draft as of at most two seconds ago, the drafter's seat, pick N of M, picks until their turn, and at
        their turn our call. One upstream read per draft per two seconds whatever the viewer count; when the host fails,
        the last snapshot with host_stale_seconds.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/CompanionResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /companions/{id}/report:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [companions]
      operationId: companionReport
      summary: The report on the finished draft from the drafter's seat, once the host says it is complete (409 before).
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockReportResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: The account's paired browsers, newest first, each with its scopes and when it last sent a page.
      security: [{ session: [] }]
      responses:
        "200":
          description: up to ten
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/Device" } } }
  /devices/codes:
    post:
      tags: [devices]
      operationId: createPairCode
      summary: >-
        A one-time pairing code for the browser extension: six words, good for ten minutes and one pairing. A new code
        replaces the account's earlier one.
      security: [{ session: [] }]
      responses:
        "201":
          description: the code, shown once
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/PairCode" } }
  /devices/pair:
    post:
      tags: [devices]
      operationId: pairDevice
      summary: >-
        The extension trades a pairing code for its device token, answered this once and never again. The token goes
        in Authorization Bearer on the device routes only, never in a cookie. 10 a minute an address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairInput" }
      responses:
        "201":
          description: the device and its token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/Paired" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /devices/me:
    get:
      tags: [devices]
      operationId: deviceMe
      summary: The paired device asking, and the account it writes for, so the extension's popup can say so.
      security: [{ device: [] }]
      responses:
        "200":
          description: the device
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/DeviceMe" } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /devices/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Unpair a browser. Its token opens nothing from the next request on.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /hosts:
    get:
      tags: [hosts]
      operationId: listHostConnections
      summary: >-
        The hosts connecting is open for here (HOST_FFPC_ENABLED), and the hosts the account is connected to, each with
        its state and when it was last read. No credential is ever answered.
      security: [{ session: [] }]
      responses:
        "200":
          description: the connections
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/HostConnections" } }
  /hosts/ffpc/connect:
    post:
      tags: [hosts]
      operationId: connectFFPC
      summary: >-
        Sign in to FFPC as the member, through FFPC's own sign-in form, and keep what FFPC hands back (its session, and
        the sign-in because FFPC offers no other way to renew a session), envelope encrypted. Answers the member's FFPC
        leagues. Needs consent, kept with its time and words. Three refused sign-ins in an hour pause connecting for the
        hour (423). 5 an hour an account. 503 when FFPC is not open here or its sign-in page changed.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostConnectInput" }
      responses:
        "201":
          description: connected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/HostConnected" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "423": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/ffpc/leagues:
    get:
      tags: [hosts]
      operationId: ffpcLeagues
      summary: The member's FFPC leagues, read from FFPC as them. 409 when the connection needs a fresh sign-in.
      security: [{ session: [] }]
      responses:
        "200":
          description: the leagues
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/HostLeague" } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/ffpc:
    delete:
      tags: [hosts]
      operationId: disconnectFFPC
      summary: Disconnect FFPC. The kept sign-in and session are deleted at once; leagues read from FFPC stop updating.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /rooms/{id}/ws:
    servers:
      - url: https://room.trycommish.app
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [rooms]
      operationId: roomSocket
      summary: >-
        Upgrades to a WebSocket. The client's first message is RoomHello with the last seq it applied (0 for none).
        The server answers RoomWelcome with every action after that seq, then sends RoomUpdate with each new batch
        in seq order. The client sends RoomCommand to pick, queue or leave; a refused command answers RoomError, and a command
        over its budget (queue 5 a second, pick 2, leave 1, per seat across all its sockets) answers RoomError with
        code rate_limited; a socket that keeps sending past it is closed. A seat holds at most 3 sockets and opens at
        most 12 a minute after a burst of 6; past either, the newest socket gets RoomError (rate_limited, with the
        reason) and is closed with 1008, and the client should not retry it.
        A reconnect sends the same hello with its last seq, loses nothing, and takes the seat back from its bot.
      security: [{ session: [] }]
      responses:
        "101": { description: switching protocols }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

components:
  securitySchemes:
    device:
      type: http
      scheme: bearer
      description: >-
        A paired browser's device token (the extension), minted once at /devices/pair and sent as Authorization Bearer.
        It opens only the device routes, each of which names the scope it needs (league:write or draft:write); it is
        never a cookie, so it needs no CSRF token. It is stored hashed and revoked from the account page.
    session:
      type: apiKey
      in: cookie
      name: commish_session
    anon:
      type: apiKey
      in: cookie
      name: commish_anon
      description: >-
        A signed-out browser's solo mocks: a random token sealed in an HttpOnly cookie on the apex domain for 90 days,
        minted by a POST /mocks with no valid session or token, only after its settings validate, and never for a
        request the browser marks cross-site. A state-changing request echoes commish_anon_csrf (bound to the token)
        in X-Anon-CSRF-Token, never the session's cookie or header. Sign-in moves the token's mocks to the account and
        expires both cookies. An unclaimed mock is deleted after 90 days idle, or after 24 hours with no pick.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClaimCode:
      name: code
      in: path
      required: true
      schema: { type: string, minLength: 16, maxLength: 64 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    ShareCode:
      name: code
      in: path
      required: true
      description: >-
        a shared draft's settings, seed, picks and drafter, deflated and base64url encoded, then a dot and the
        server's signature; an unsigned or altered code is refused
      schema: { type: string, minLength: 8, maxLength: 2048, pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$" }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    ErrorResponse:
      description: the error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    EmptyResponse:
      description: done, data is null
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    HealthResponse:
      description: health
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/Health" } }
    RedirectResponse:
      description: where the browser goes next
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/Redirect" } }
    AccountResponse:
      description: the signed-in account
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/Account" } }
    LeagueResponse:
      description: a saved league
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/League" } }
    SheetResponse:
      description: a sheet without its rows
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/Sheet" } }
    SheetDetailResponse:
      description: a sheet with its rows
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/SheetDetail" } }
    ExportLinkResponse:
      description: an export with a signed link
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/ExportLink" } }
    MockRoomResponse:
      description: a solo room as it stands
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/MockRoom" } }
    RoomCardResponse:
      description: our call and the odds
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/RoomCard" } }
    MockReportResponse:
      description: a finished draft's report
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/MockReport" } }
    CompanionResponse:
      description: a live-draft companion as it stands
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/Companion" } }
    LeagueSyncResponse:
      description: an attached league as it stands
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/LeagueSync" } }
    AttachPreviewResponse:
      description: a league's name and teams, before it is attached
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/AttachPreview" } }
    LobbySeatResponse:
      description: the seat taken
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/LobbySeat" } }
    LobbyRoomResponse:
      description: a lobby room
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/LobbyRoom" } }

  schemas:
    Envelope:
      type: object
      required: [ok, data, error, request_id]
      properties:
        ok: { type: boolean }
        data: { nullable: true, description: the payload, null on error }
        error:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ErrorBody" }]
        meta:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PageMeta" }]
        request_id: { type: string }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            invalid, unauthorized, forbidden, not_found, conflict, rate_limited, csrf, payload_too_large, unsupported_media_type,
            billing_unavailable, storage_unavailable, unavailable, internal
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        feature: { $ref: "#/components/schemas/Feature" }
    PageMeta:
      type: object
      required: [page, per_page, total]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        version: { type: string }
    Redirect:
      type: object
      required: [url]
      properties:
        url: { type: string }

    Feature:
      type: string
      enum: [live_draft_advisor, custom_scoring, full_reasoning, range_of_outcomes, synced_sheet, early_run, start_sit, waiver_ranks, trade_finder]
    Product:
      type: string
      enum: [draft_pass, membership, group_pass]
    Interval:
      type: string
      enum: [year, month]

    Account:
      type: object
      required: [id, email, first_name, last_name, handle, features, draft_pass, membership, league_id, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        league_id:
          type: string
          format: uuid
          nullable: true
          description: the account's newest attached league (AttachedLeague.id), what the rail's League opens; null with none
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        handle:
          type: string
          nullable: true
          description: the name shown in lobbies, 3 to 20 letters, digits or underscores, not starting with a digit
        features:
          type: array
          items: { $ref: "#/components/schemas/Feature" }
        draft_pass:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DraftPassState" }]
        membership:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/MembershipState" }]
        created_at: { type: string, format: date-time }
    DraftPassState:
      type: object
      required: [season, ends_at, source]
      properties:
        season: { type: integer }
        ends_at: { type: string, format: date-time }
        source: { type: string, enum: [purchase, group_pass, grant] }
    MembershipState:
      type: object
      required: [status, interval, current_period_end, cancel_at_period_end]
      properties:
        status: { type: string }
        interval:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Interval" }]
        current_period_end: { type: string, format: date-time, nullable: true }
        cancel_at_period_end: { type: boolean }
    AccountUpdate:
      type: object
      required: [handle]
      properties:
        handle: { type: string, minLength: 3, maxLength: 20, pattern: "^[A-Za-z_][A-Za-z0-9_]{2,19}$" }

    ScoringPreset:
      type: string
      enum: [ppr, half_ppr, standard, te_premium]
    Lineup:
      type: string
      enum: [standard, superflex, two_flex]
    BotStyle:
      type: string
      enum: [adp, last_draft]
    BoardFormat:
      type: string
      enum: [ppr, half_ppr, standard, te_premium, superflex, two_flex, dynasty, best_ball]
    Scoring:
      type: object
      description: exactly one of preset and custom. custom needs the custom_scoring feature.
      properties:
        preset:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ScoringPreset" }]
        custom:
          type: object
          nullable: true
          description: points per stat, keyed by stat (snake_case), at most 200 stats
          additionalProperties: { type: number, format: double }
    RosterCounts:
      type: object
      description: starters per position and the bench. Flex spots come from the lineup.
      required: [qb, rb, wr, te, k, dst, bench]
      properties:
        qb: { type: integer, minimum: 0, maximum: 4 }
        rb: { type: integer, minimum: 0, maximum: 6 }
        wr: { type: integer, minimum: 0, maximum: 6 }
        te: { type: integer, minimum: 0, maximum: 4 }
        k: { type: integer, minimum: 0, maximum: 2 }
        dst: { type: integer, minimum: 0, maximum: 2 }
        bench: { type: integer, minimum: 0, maximum: 15 }
    Keeper:
      type: object
      required: [slot, player_id, round]
      properties:
        slot: { type: integer, minimum: 1 }
        player_id: { type: string, maxLength: 64 }
        round: { type: integer, minimum: 1 }
    LeagueSettings:
      type: object
      required: [scoring, teams, slot, roster, lineup, keepers, bot_style]
      properties:
        scoring: { $ref: "#/components/schemas/Scoring" }
        teams: { type: integer, minimum: 8, maximum: 14 }
        slot: { type: integer, nullable: true, minimum: 1, description: null drafts from a random slot }
        roster: { $ref: "#/components/schemas/RosterCounts" }
        lineup: { $ref: "#/components/schemas/Lineup" }
        keepers:
          type: array
          maxItems: 56
          items: { $ref: "#/components/schemas/Keeper" }
        bot_style: { $ref: "#/components/schemas/BotStyle" }
    LeagueInput:
      type: object
      required: [name, settings]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
    League:
      type: object
      required: [id, name, settings, rounds, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        rounds: { type: integer, description: the roster's total, which is the draft's round count }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SheetTag:
      type: string
      description: The fixed tags. A row's tags may also hold the drafter's own words (SheetTags).
      enum: [target, sleeper, breakout, avoid, injury, handcuff]
    SheetTags:
      type: array
      description: >-
        Up to four tags, each one of the fixed SheetTag values or the drafter's own word: 1 to 20 letters, digits,
        spaces, apostrophes, periods or hyphens, starting with a letter or digit. A word that matches a fixed tag in
        any case is stored as the fixed tag. No tag appears twice in any case.
      maxItems: 4
      items: { type: string, minLength: 1, maxLength: 20 }
    Sheet:
      type: object
      required: [id, name, format, row_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        format: { $ref: "#/components/schemas/BoardFormat" }
        row_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SheetRow:
      type: object
      required: [player_id, name, position, team, headshot, rank, tier, tags, note]
      properties:
        player_id: { type: string }
        name: { type: string }
        position: { type: string }
        team: { type: string, nullable: true }
        headshot: { type: string, nullable: true, description: the face the drafter saw when the row was added }
        rank: { type: integer }
        tier: { type: integer, nullable: true }
        tags: { $ref: "#/components/schemas/SheetTags" }
        note: { type: string, nullable: true }
    SheetDetail:
      allOf:
        - $ref: "#/components/schemas/Sheet"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: "#/components/schemas/SheetRow" }
    SheetRowInput:
      type: object
      required: [player_id, name, position]
      properties:
        player_id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 80 }
        position:
          type: string
          minLength: 1
          maxLength: 8
          description: QB, RB, WR, TE, K or DST, in any case. DEF and D/ST are stored as DST, PK as K.
        team: { type: string, nullable: true, maxLength: 8 }
        headshot: { type: string, nullable: true, minLength: 9, maxLength: 300, description: an https URL }
        tier: { type: integer, nullable: true, minimum: 1, maximum: 50 }
        tags: { $ref: "#/components/schemas/SheetTags" }
        note: { type: string, nullable: true, maxLength: 500 }
    SheetCreate:
      type: object
      required: [name, format]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        format: { $ref: "#/components/schemas/BoardFormat" }
        rows:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/SheetRowInput" }
    SheetUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    SheetRowsReplace:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/SheetRowInput" }
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 60
          description: >-
            The sheet's name, written in the same guarded write as the rows, so a rename can never pass a stale
            if_updated_at. Absent or null keeps the name.
        if_updated_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            The sheet's updated_at as the writer last read it. When given and the sheet has changed since, nothing
            is written and the answer is 409 conflict, so a second device never overwrites the first unseen.
    SheetRowUpdate:
      type: object
      required: [tier, tags, note]
      properties:
        tier: { type: integer, nullable: true, minimum: 1, maximum: 50 }
        tags: { $ref: "#/components/schemas/SheetTags" }
        note: { type: string, nullable: true, maxLength: 500 }
    ImportSkip:
      type: object
      required: [line, reason]
      properties:
        line: { type: integer }
        reason: { type: string }
    SheetImportResult:
      type: object
      required: [imported, skipped, sheet]
      properties:
        imported: { type: integer }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/ImportSkip" }
        sheet: { $ref: "#/components/schemas/SheetDetail" }

    ExportFormat:
      type: string
      enum: [csv]
    ExportCreate:
      type: object
      required: [format]
      properties:
        format: { $ref: "#/components/schemas/ExportFormat" }
    Export:
      type: object
      required: [id, sheet_id, format, file_name, bytes, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        sheet_id: { type: string, format: uuid, nullable: true }
        format: { $ref: "#/components/schemas/ExportFormat" }
        file_name: { type: string }
        bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    ExportLink:
      allOf:
        - $ref: "#/components/schemas/Export"
        - type: object
          required: [url, url_expires_at]
          properties:
            url: { type: string }
            url_expires_at: { type: string, format: date-time }

    Price:
      type: object
      required: [lookup_key, amount_cents, currency, interval]
      properties:
        lookup_key: { type: string }
        amount_cents: { type: integer, format: int64 }
        currency: { type: string }
        interval:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Interval" }]
    PlanCatalog:
      type: object
      description: >-
        A product whose price is not set in Stripe yet is null (draft_pass, group_pass) or missing from the list
        (membership). While checkout is not open the prices are the launch prices.
      required: [season, pass_ends_at, checkout_open, features, draft_pass, membership, group_pass]
      properties:
        season: { type: integer, description: "the season a pass bought now is for: the current one until its first kickoff, then the next" }
        pass_ends_at: { type: string, format: date-time, description: "when a pass bought now ends: its season's end, March 1 UTC" }
        checkout_open: { type: boolean, description: false while Stripe is not configured, and checkout answers 503 }
        features: { $ref: "#/components/schemas/PlanFeatures" }
        draft_pass:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Price" }]
        membership:
          type: array
          description: annual first
          items: { $ref: "#/components/schemas/Price" }
        group_pass:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/GroupPassPrice" }]
    PlanFeatures:
      type: object
      description: what each product unlocks, from app.product_features. A group pass seat is a draft_pass.
      required: [draft_pass, membership]
      properties:
        draft_pass:
          type: array
          items: { $ref: "#/components/schemas/Feature" }
        membership:
          type: array
          items: { $ref: "#/components/schemas/Feature" }
    GroupPassPrice:
      type: object
      required: [per_seat, min_seats, max_seats]
      properties:
        per_seat: { $ref: "#/components/schemas/Price" }
        min_seats: { type: integer }
        max_seats: { type: integer }
    CheckoutRequest:
      type: object
      required: [product]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        interval:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Interval" }]
        seats: { type: integer, nullable: true, minimum: 8, maximum: 14, description: "group_pass only: one pass per team, the league bounds" }
        league_name: { type: string, nullable: true, maxLength: 60, description: group_pass only }
    GroupPass:
      type: object
      required: [id, league_name, season, seats, claimed, claims, claim_url, claim_code, claimed_by_me, status, created_at]
      properties:
        id: { type: string, format: uuid }
        league_name: { type: string }
        season: { type: integer }
        seats: { type: integer }
        claimed: { type: integer }
        claims:
          type: array
          description: each claimed seat, first claim first; the seats past these are open
          items: { $ref: "#/components/schemas/GroupPassClaim" }
        claim_url: { type: string }
        claim_code: { type: string, description: the code in the claim link, for the buyer's own claim }
        claimed_by_me: { type: boolean, description: the buyer holds one of its seats }
        status: { type: string, enum: [active, refunded, disputed] }
        created_at: { type: string, format: date-time }
    GroupPassClaim:
      type: object
      required: [handle, claimed_at]
      properties:
        handle: { type: string, nullable: true, description: the claimer's lobby handle, null before they choose one }
        claimed_at: { type: string, format: date-time }
    GroupPassPreview:
      type: object
      required: [league_name, season, seats, claimed, purchaser_handle, claimed_by_me]
      properties:
        league_name: { type: string }
        season: { type: integer }
        seats: { type: integer }
        claimed: { type: integer }
        purchaser_handle: { type: string, nullable: true }
        claimed_by_me: { type: boolean }

    MockStatus:
      type: string
      enum: [active, complete]
    MockCreate:
      type: object
      description: exactly one of league_id and settings
      properties:
        league_id: { type: string, format: uuid, nullable: true }
        settings:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/LeagueSettings" }]
        seed: { type: integer, format: int64, nullable: true, minimum: 0, maximum: 4294967295 }
    Mock:
      type: object
      required: [id, league_id, settings, seed, status, created_at, updated_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        league_id: { type: string, format: uuid, nullable: true }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        seed: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/MockStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    PlayerPosition:
      type: string
      enum: [QB, RB, WR, TE, K, DEF]
    BoardPlayer:
      type: object
      description: one player of the board a room drafts from
      required: [id, name, position, team, headshot, adp, points, vor, position_rank, bye]
      properties:
        id: { type: string }
        name: { type: string }
        position: { $ref: "#/components/schemas/PlayerPosition" }
        team: { type: string }
        headshot: { type: string }
        adp: { type: number, format: double, nullable: true, description: where drafters take him, null with no source }
        points: { type: number, format: double, nullable: true, description: projected season points, null for kickers and defenses }
        vor: { type: number, format: double, nullable: true, description: points over replacement for this league, null when it has none }
        position_rank: { type: integer }
        bye: { type: integer, nullable: true }
    RoomBoard:
      type: object
      required: [format, season, as_of, basis, players]
      properties:
        format: { type: string, enum: [ppr, half, std] }
        season: { type: integer }
        as_of: { type: string, format: date-time }
        basis: { type: string, description: the sentence naming what the numbers are }
        players:
          type: array
          description: every player in the order drafters take them
          items: { $ref: "#/components/schemas/BoardPlayer" }
    RoomPick:
      type: object
      required: [pick, round, seat, player_id, auto]
      properties:
        pick: { type: integer }
        round: { type: integer }
        seat: { type: integer, description: the 1-based draft slot that made it }
        player_id: { type: string }
        auto: { type: boolean, description: "the clock made it: an expired turn. In a lobby, who made a pick is the log row's pick.by" }
    MockRoom:
      type: object
      required: [id, league_id, status, seed, settings, teams, rounds, slot, pick_number, on_clock, waiting, picks, queue, seq, share_code, created_at]
      properties:
        id: { type: string, format: uuid, nullable: true, description: null for a shared draft }
        league_id: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/MockStatus" }
        seed: { type: integer, format: int64 }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        teams: { type: integer }
        rounds: { type: integer }
        slot: { type: integer, description: the drafter's 1-based slot }
        pick_number: { type: integer, description: the pick on the clock, past the last pick when the draft is over }
        on_clock: { type: integer, nullable: true, description: the slot on the clock }
        waiting: { type: boolean, description: the drafter is on the clock }
        picks:
          type: array
          items: { $ref: "#/components/schemas/RoomPick" }
        queue:
          type: array
          items: { type: string }
        seq: { type: integer, format: int64 }
        share_code: { type: string, description: "the link's code: the settings, seed, picks and drafter, signed by the server" }
        shared_by: { type: string, description: "the drafter's handle, when he has one: a shared draft names whose it is" }
        created_at: { type: string, format: date-time }
        board:
          description: the board, on a full read (create, get, shared) and absent on a pick's answer
          allOf: [{ $ref: "#/components/schemas/RoomBoard" }]
        card:
          description: >-
            the drafter's card at the turn on the clock, the one GET /mocks/{id}/card records, so the
            turn and its call arrive together. On a get, pick, undo or autopick that leaves the draft
            on the drafter; absent otherwise, and absent when it could not be made in the request
            (read it from /card then)
          allOf: [{ $ref: "#/components/schemas/RoomCard" }]
    MockPickInput:
      type: object
      required: [player_id, pick]
      properties:
        player_id: { type: string, minLength: 1, maxLength: 64 }
        pick: { type: integer, minimum: 1, description: the overall pick the drafter saw on the clock }
    MockUndoInput:
      type: object
      required: [pick]
      properties:
        pick: { type: integer, minimum: 1, description: the overall pick of the drafter's to take back }
    MockQueueInput:
      type: object
      required: [player_ids]
      properties:
        player_ids:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
    CardCandidate:
      type: object
      required: [player_id]
      properties:
        player_id: { type: string }
        why: { type: string, description: the advisor's sentence, absent from the engine }
    RoomCard:
      type: object
      required: [pick_number, for_pick, next_pick, source, runs, call, shortlist, still_there, conditional]
      properties:
        pick_number: { type: integer, description: the pick on the clock when the card was made }
        for_pick: { type: integer, description: the drafter's pick the call is for }
        next_pick: { type: integer, nullable: true, description: the turn the odds look to }
        source: { type: string, enum: [advisor, sim] }
        runs: { type: integer, description: the runs the odds are over, 0 for the closed form }
        call: { type: string, description: the player we would take }
        shortlist:
          type: array
          items: { $ref: "#/components/schemas/CardCandidate" }
        still_there:
          type: object
          description: >-
            player id to his chance of still being there at next_pick, or, on a conditional card, of reaching
            for_pick
          additionalProperties: { type: number, format: double }
        conditional: { type: boolean, description: a lobby card off your turn, the call if the board holds }
    ReportTeam:
      type: object
      required: [seat, points, rank, starters_filled, starters_total, bye_collisions, value_captured]
      properties:
        seat: { type: integer }
        points: { type: number, format: double, description: projected points from the starters }
        rank: { type: integer }
        starters_filled: { type: integer }
        starters_total: { type: integer }
        bye_collisions: { type: integer }
        value_captured: { type: number, format: double }
    ReportPick:
      type: object
      required: [pick, round, player_id, over_replacement, adp_gap, chip, still_there, could_wait, odds_source, made_by]
      properties:
        pick: { type: integer }
        round: { type: integer }
        player_id: { type: string }
        over_replacement: { type: number, format: double, nullable: true }
        adp_gap: { type: number, format: double, nullable: true, description: ADP less the pick, positive before drafters take him }
        chip:
          type: string
          enum: [reach, steal, at_adp, none, kept]
          description: kept is a keeper at his seat and round, with no ADP gap and no hindsight
        still_there: { type: number, format: double, nullable: true, description: the chance he was there at your next turn, null at your last }
        could_wait: { type: boolean }
        odds_source: { type: string, description: "advisor or sim as recorded with the pick, or fallback_sim computed for the report" }
        made_by:
          type: string
          enum: [you, for_you, queue, clock]
          description: >-
            who made the pick: you, Pick for me or Finish the draft (for_you), a lobby seat's stand-in after you left
            (queue), or the stand-in when your clock ran out (clock). A pick you did not make carries no hindsight.
    ReportStarter:
      type: object
      required: [slot, player_id]
      properties:
        slot: { type: string }
        player_id: { type: string, nullable: true }
    ReportExposure:
      type: object
      required: [player_id, share]
      properties:
        player_id: { type: string }
        share: { type: number, format: double }
    ReportRuns:
      type: object
      required: [runs, points, median, middle_low, middle_high, top_share, top_finish, rank_counts, exposure]
      properties:
        runs: { type: integer }
        points:
          type: array
          description: your starting points in each run, ascending
          items: { type: number, format: double }
        median: { type: number, format: double }
        middle_low: { type: number, format: double }
        middle_high: { type: number, format: double }
        top_share: { type: number, format: double }
        top_finish: { type: integer, description: the rank top_share counts to }
        rank_counts:
          type: array
          description: runs finishing at each rank, first place first
          items: { type: integer }
        exposure:
          type: array
          description: who you end up with, by share of runs, most first
          items: { $ref: "#/components/schemas/ReportExposure" }
    MockReport:
      type: object
      required: [teams, rounds, slot, seed, settings, could_wait_from, standings, picks, starters, runs, board, computed_ms]
      properties:
        teams: { type: integer }
        rounds: { type: integer }
        slot: { type: integer }
        seed: { type: integer, format: int64 }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        could_wait_from: { type: number, format: double }
        standings:
          type: array
          description: every team, best first
          items: { $ref: "#/components/schemas/ReportTeam" }
        picks:
          type: array
          items: { $ref: "#/components/schemas/ReportPick" }
        starters:
          type: array
          items: { $ref: "#/components/schemas/ReportStarter" }
        runs: { $ref: "#/components/schemas/ReportRuns" }
        board:
          description: the board, holding only the players the report names
          allOf: [{ $ref: "#/components/schemas/RoomBoard" }]
        computed_ms: { type: integer, description: how long the report took to compute }
        share_code: { type: string, description: a solo draft's link code, absent for a lobby }

    CompanionHost:
      type: string
      enum: [sleeper, ffpc]
    CompanionCreate:
      type: object
      required: [host, draft, seat]
      properties:
        host: { $ref: "#/components/schemas/CompanionHost" }
        draft: { type: string, minLength: 1, maxLength: 300, description: the draft link as pasted, or its id }
        seat: { $ref: "#/components/schemas/CompanionSeat" }
        replay:
          type: boolean
          description: >-
            development only (COMPANION_REPLAY), replays the recorded completed draft one pick a second, whatever
            draft says
    CompanionSeat:
      type: object
      description: exactly one of slot and username
      properties:
        slot: { type: integer, nullable: true, minimum: 1, maximum: 32 }
        username: { type: string, nullable: true, maxLength: 40 }
    CompanionStatus:
      type: string
      enum: [pre_draft, drafting, paused, complete]
    CompanionSummary:
      type: object
      required: [id, host, host_draft_id, name, slot, host_username, status, replay, created_at]
      properties:
        id: { type: string, format: uuid }
        host: { $ref: "#/components/schemas/CompanionHost" }
        host_draft_id: { type: string }
        name: { type: string, description: "the draft's name on the host, empty when it has none" }
        slot: { type: integer }
        host_username: { type: string, nullable: true, description: the Sleeper username the seat was found by }
        status: { $ref: "#/components/schemas/CompanionStatus" }
        replay: { type: boolean }
        created_at: { type: string, format: date-time }
    CompanionPick:
      type: object
      required: [pick, round, seat, player_id, host_player_id, name, position, team, keeper]
      properties:
        pick: { type: integer }
        round: { type: integer }
        seat: { type: integer, description: the draft slot that made it }
        player_id: { type: string, nullable: true, description: our board's player, null when we could not place him }
        host_player_id: { type: string }
        name: { type: string, description: the host's name for him }
        position: { type: string }
        team: { type: string }
        keeper: { type: boolean }
    OutcomeRange:
      type: object
      required: [floor, median, ceiling]
      properties:
        floor: { type: number, format: double }
        median: { type: number, format: double }
        ceiling: { type: number, format: double }
    Companion:
      type: object
      required:
        [id, host, host_draft_id, replay, name, status, teams, rounds, slot, seat_names, settings, basis, pick_count, total_picks,
         on_clock, your_turn, your_next_pick, picks_until_turn, since, picks, unplaced, lost_at, traded, card, board,
         ranges, host_stale_seconds, created_at]
      properties:
        id: { type: string, format: uuid }
        host: { $ref: "#/components/schemas/CompanionHost" }
        host_draft_id: { type: string }
        replay: { type: boolean }
        name: { type: string, description: the draft's name on the host, may be empty }
        status: { $ref: "#/components/schemas/CompanionStatus" }
        teams: { type: integer }
        rounds: { type: integer }
        slot: { type: integer, description: the drafter's draft slot }
        seat_names:
          type: array
          description: >-
            each slot's name in the host league (its members' display names), slot 1 first; empty for a mock draft,
            and '' for a slot with no member
          items: { type: string }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        basis: { type: string, description: the board our call reads, in a sentence }
        pick_count: { type: integer, description: picks the host has made }
        total_picks: { type: integer }
        on_clock: { type: integer, nullable: true, description: the slot on the clock, null before the draft and after it }
        your_turn: { type: boolean }
        your_next_pick: { type: integer, nullable: true, description: the drafter's next overall pick, null after the last }
        picks_until_turn: { type: integer, nullable: true, description: picks before the drafter's next, 0 on the clock }
        since: { type: integer, description: the pick count the picks follow }
        picks:
          type: array
          description: every pick after since, in order
          items: { $ref: "#/components/schemas/CompanionPick" }
        unplaced: { type: integer, description: picks so far we could not place on our board; they take nobody from it }
        lost_at:
          type: integer
          nullable: true
          description: the pick our draft could not follow (out of order, or no roster spot takes him); no call after it
        traded: { type: integer, description: picks made by a team other than the slot's own, a traded pick }
        card:
          nullable: true
          description: >-
            our call at the drafter's turn, or between turns the conditional call (conditional true): the player to
            take if the board holds to your_next_pick. The why is on the call only, or on every shortlist row with
            full_reasoning.
          allOf: [{ $ref: "#/components/schemas/RoomCard" }]
        board:
          nullable: true
          description: the board valued for this league, sent only when since is 0
          allOf: [{ $ref: "#/components/schemas/RoomBoard" }]
        ranges:
          type: object
          nullable: true
          description: floor, median and ceiling for each shortlist player, with range_of_outcomes only
          additionalProperties: { $ref: "#/components/schemas/OutcomeRange" }
        host_stale_seconds:
          type: integer
          nullable: true
          description: how old the picks are when the host did not answer the last read, null when fresh
        created_at: { type: string, format: date-time }

    LobbyFormat:
      type: string
      enum: [12_ppr, 12_half_superflex, 10_ppr]
    LobbyFilling:
      type: object
      required: [format, teams, clock_seconds, scoring, lineup, filling]
      properties:
        format: { $ref: "#/components/schemas/LobbyFormat" }
        teams: { type: integer }
        clock_seconds: { type: integer }
        scoring: { $ref: "#/components/schemas/ScoringPreset" }
        lineup: { $ref: "#/components/schemas/Lineup" }
        filling: { type: integer, description: drafters in the room filling now, 0 when none is }
    LobbyJoin:
      type: object
      required: [format]
      properties:
        format: { $ref: "#/components/schemas/LobbyFormat" }
    LobbySeat:
      type: object
      required: [room_id, seat, socket_url]
      properties:
        room_id: { type: string, format: uuid }
        seat: { type: integer }
        socket_url: { type: string, description: the room service's WebSocket for this room }
    LobbySeatView:
      type: object
      required: [seat, handle, kind]
      properties:
        seat: { type: integer }
        handle: { type: string, nullable: true }
        kind: { type: string, enum: [drafter, bot, left, open] }
    LobbyRoom:
      type: object
      required: [id, format, status, teams, rounds, clock_seconds, fill_deadline, started_at, solo_pace, you, settings, seats, board, socket_url]
      properties:
        id: { type: string, format: uuid }
        format: { $ref: "#/components/schemas/LobbyFormat" }
        status: { type: string, enum: [filling, drafting, complete, abandoned] }
        teams: { type: integer }
        rounds: { type: integer }
        clock_seconds: { type: integer }
        fill_deadline: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        solo_pace: { type: boolean, description: fewer than three people started it, so the bots pick at once }
        you: { type: integer, description: your seat }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        seats:
          type: array
          items: { $ref: "#/components/schemas/LobbySeatView" }
        board: { $ref: "#/components/schemas/RoomBoard" }
        socket_url: { type: string }

    RoomHello:
      type: object
      required: [type, last_seq]
      properties:
        type: { type: string, enum: [hello] }
        last_seq: { type: integer, format: int64, minimum: 0 }
    RoomWelcome:
      type: object
      required: [type, room_id, seq, actions, now]
      properties:
        type: { type: string, enum: [welcome] }
        room_id: { type: string, format: uuid }
        seq: { type: integer, format: int64, description: the room's latest seq }
        now: { type: string, format: date-time, description: the server's clock, so the client's clock reads the same }
        actions:
          type: array
          items: { $ref: "#/components/schemas/RoomAction" }
    RoomUpdate:
      type: object
      required: [type, seq, actions]
      properties:
        type: { type: string, enum: [update] }
        seq: { type: integer, format: int64 }
        actions:
          type: array
          items: { $ref: "#/components/schemas/RoomAction" }
    RoomCommand:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [pick, queue, leave] }
        player_id: { type: string, maxLength: 64, description: pick }
        pick: { type: integer, description: pick, the overall pick the drafter saw }
        player_ids:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 64 }
          description: queue, best first
    RoomAction:
      type: object
      description: >-
        One entry of the room's log. kind is SEAT_JOINED (payload handle), SEAT_LEFT (payload freed when a filling room gave the seat up, otherwise its stand-in drafts), SEAT_RETURNED, ROOM_STARTED
        (payload bots, the seats bots took, and solo_pace), ROOM_COMPLETE, ROOM_ABANDONED (payload reason, nobody_here when the fill deadline found no drafter connected or everyone_left), or an engine action (START_DRAFT,
        SET_QUEUE, MAKE_PICK, TIMER_EXPIRE) whose payload carries the engine action as action and, for a pick,
        pick (RoomPick with by drafter, queue, clock or bot) and deadline, when the next turn's clock runs out. A
        socket receives only its own seat's SET_QUEUE payload; another seat's arrives empty, with its seq and kind.
      required: [seq, kind, seat, payload, at]
      properties:
        seq: { type: integer, format: int64 }
        kind: { type: string }
        seat: { type: integer, nullable: true }
        payload: { type: object }
        at: { type: string, format: date-time }
    RoomError:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string, enum: [error] }
        code: { type: string }
        message: { type: string }
    LeagueHost:
      type: string
      description: the host a league runs on, named as a mechanism
      enum: [sleeper, mfl, ffpc]
    AttachPreviewInput:
      type: object
      required: [link]
      properties:
        host: { $ref: "#/components/schemas/LeagueHost" }
        link: { type: string, minLength: 1, maxLength: 300, description: the league link as pasted, or a Sleeper league id }
    AttachInput:
      type: object
      required: [link, me]
      properties:
        host: { $ref: "#/components/schemas/LeagueHost" }
        link: { type: string, minLength: 1, maxLength: 300, description: the league link as pasted, or a Sleeper league id }
        me: { $ref: "#/components/schemas/AttachSeat" }
    AttachSeat:
      type: object
      description: exactly one of username (Sleeper only) and roster_id
      properties:
        username: { type: string, nullable: true, maxLength: 40 }
        roster_id: { type: integer, nullable: true, minimum: 1, maximum: 32 }
    AttachPreview:
      type: object
      required: [host, host_league_id, season, name, teams, seat_by_username]
      properties:
        host: { $ref: "#/components/schemas/LeagueHost" }
        host_league_id: { type: string }
        season: { type: integer, description: the league's season, 0 when the host does not say }
        name: { type: string }
        teams: { type: array, items: { $ref: "#/components/schemas/LeagueTeam" } }
        seat_by_username: { type: boolean, description: whether the host finds a seat by username (Sleeper does) }
    AttachedLeague:
      type: object
      required: [id, host, host_league_id, season, name, roster_id, team_name, attached_at]
      properties:
        id: { type: string, format: uuid }
        host: { $ref: "#/components/schemas/LeagueHost" }
        host_league_id: { type: string }
        season: { type: integer }
        name: { type: string, description: the league's name at its last read }
        roster_id: { type: integer }
        team_name: { type: string, description: the drafter's team at the last read, empty when unread }
        attached_at: { type: string, format: date-time }
    LeagueTeam:
      type: object
      required: [roster_id, name, owner, wins, losses, ties, points_for]
      properties:
        roster_id: { type: integer }
        name: { type: string, description: the team's name, or its owner's when it has none }
        owner: { type: string, description: the owner's display name, empty where the host shows none }
        wins: { type: integer }
        losses: { type: integer }
        ties: { type: integer }
        points_for: { type: number, format: double }
    LeaguePlayer:
      type: object
      required: [host_id, board_id, name, position, team]
      properties:
        host_id: { type: string }
        board_id: { type: string, nullable: true, description: the player's id on our board, null when unplaced }
        name: { type: string }
        position: { type: string }
        team: { type: string }
    RosterSpot:
      type: object
      required: [player, slot]
      properties:
        player: { $ref: "#/components/schemas/LeaguePlayer" }
        slot: { type: string, enum: [starter, bench, reserve, taxi] }
    MatchupStarter:
      type: object
      required: [player, points]
      properties:
        player: { $ref: "#/components/schemas/LeaguePlayer" }
        points: { type: number, format: double, description: his points so far this week }
    MatchupSide:
      type: object
      required: [roster_id, points, starters]
      properties:
        roster_id: { type: integer }
        points: { type: number, format: double }
        starters: { type: array, items: { $ref: "#/components/schemas/MatchupStarter" } }
    LeagueMatchup:
      type: object
      required: [week, mine, opponent]
      properties:
        week: { type: integer }
        mine: { $ref: "#/components/schemas/MatchupSide" }
        opponent: { allOf: [{ $ref: "#/components/schemas/MatchupSide" }], nullable: true }
    LeagueMove:
      type: object
      required: [kind, at, roster_ids, adds, drops]
      properties:
        kind: { type: string, enum: [add, waiver, trade] }
        at: { type: string, format: date-time }
        roster_ids: { type: array, items: { type: integer } }
        adds: { type: array, items: { $ref: "#/components/schemas/MovePlayer" } }
        drops: { type: array, items: { $ref: "#/components/schemas/MovePlayer" } }
    MovePlayer:
      type: object
      required: [player, roster_id]
      properties:
        player: { $ref: "#/components/schemas/LeaguePlayer" }
        roster_id: { type: integer, description: the team that took him (adds) or let him go (drops) }
    Placement:
      type: object
      description: how the league's rostered players were placed on our board, by rule
      required: [by_espn_id, by_defense, by_name, unplaced]
      properties:
        by_espn_id: { type: integer }
        by_defense: { type: integer }
        by_name: { type: integer }
        unplaced: { type: integer }
    LeagueSync:
      type: object
      required:
        - id
        - host
        - host_league_id
        - season
        - name
        - status
        - week
        - me
        - settings_league_id
        - settings_note
        - scoring_like
        - scoring_dropped
        - scoring_defaulted
        - teams
        - roster
        - matchup
        - moves
        - rostered
        - board_format
        - byes
        - placement
        - read_at
        - host_stale_seconds
      properties:
        id: { type: string, format: uuid }
        host: { $ref: "#/components/schemas/LeagueHost" }
        host_league_id: { type: string }
        season: { type: integer }
        name: { type: string }
        status: { type: string, description: the host's league state (in_season and the like), empty where the host shows none }
        week: { type: integer, description: the host's current week, 0 before the season or for a past one }
        me: { type: integer, description: the drafter's roster id }
        settings_league_id:
          type: string
          format: uuid
          nullable: true
          description: the saved league a mock reruns from, null when a mock room cannot draft this league
        settings_note: { type: string, nullable: true, description: why there is no saved league, in the drafter's words }
        scoring_like:
          allOf: [{ $ref: "#/components/schemas/ScoringPreset" }]
          description: the preset the league's rules score most like, what a mock without custom scoring drafts on
        scoring_dropped:
          type: array
          description: >-
            the league's scoring rules the saved league (ScoringRules' 21 keys) does not carry, by the host's own
            name and figure
          items: { type: string }
        scoring_defaulted:
          type: array
          description: the ScoringRules keys the league does not state, each at its standard figure ("key figure")
          items: { type: string }
        teams:
          type: array
          description: every team, in standings order (wins, then points for)
          items: { $ref: "#/components/schemas/LeagueTeam" }
        roster: { type: array, items: { $ref: "#/components/schemas/RosterSpot" } }
        matchup: { allOf: [{ $ref: "#/components/schemas/LeagueMatchup" }], nullable: true }
        moves:
          type: array
          description: the completed moves of this week and last, newest first
          items: { $ref: "#/components/schemas/LeagueMove" }
        rostered:
          type: array
          description: >-
            the board id of every player a team in the league holds; the waiver pool is our board without them. The
            board is the run's own (web data/league-board), not part of this answer
          items: { type: string }
        board_format:
          allOf: [{ $ref: "#/components/schemas/BoardFormat" }]
          description: the run's board the league reads on (ppr, half_ppr, standard or superflex)
        byes:
          type: object
          description: each NFL team's bye week this season, by team code
          additionalProperties: { type: integer }
        placement: { $ref: "#/components/schemas/Placement" }
        read_at: { type: string, format: date-time, description: when the host was last read for this league }
        host_stale_seconds:
          type: integer
          description: how stale the answer is because the host failed since, 0 when the last read reached it

    DeviceScope:
      type: string
      description: what a paired browser may write
      enum: [league:write, draft:write]
    Device:
      type: object
      required: [id, name, scopes, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: what the browser called itself at pairing }
        scopes: { type: array, items: { $ref: "#/components/schemas/DeviceScope" } }
        created_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: when it last sent a page, to the hour; null when it never has
    DeviceMe:
      type: object
      required: [device, handle]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        handle: { type: string, nullable: true, description: the account's public name, null when it has none }
    PairCode:
      type: object
      required: [code, expires_at]
      properties:
        code: { type: string, description: six words separated by spaces }
        expires_at: { type: string, format: date-time }
    PairInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 200, description: the six words as typed, any case or spacing }
        name: { type: string, maxLength: 60, description: what the browser calls itself, like Chrome on a Mac }
    Paired:
      type: object
      required: [token, device]
      properties:
        token: { type: string, description: the device token, answered this once; send it as Authorization Bearer }
        device: { $ref: "#/components/schemas/Device" }

    ConnectedHost:
      type: string
      description: a host the member connects their own account on, named as a mechanism
      enum: [ffpc]
    HostConnectionStatus:
      type: string
      description: >-
        connected reads. signed_out: FFPC no longer honors the session and the one kept sign-in allowed in six hours did
        not mend it; the member signs in again on our form
      enum: [connected, signed_out]
    HostConnection:
      type: object
      required: [host, status, connected_at, last_read_at]
      properties:
        host: { $ref: "#/components/schemas/ConnectedHost" }
        status: { $ref: "#/components/schemas/HostConnectionStatus" }
        connected_at: { type: string, format: date-time }
        last_read_at: { type: string, format: date-time, nullable: true }
    HostConnectInput:
      type: object
      required: [email, password, consent]
      properties:
        email: { type: string, minLength: 1, maxLength: 128, description: "the member's FFPC sign-in (FFPC's form calls it the username)" }
        password: { type: string, minLength: 1, maxLength: 128, description: sent to FFPC's sign-in only, never answered or logged }
        consent:
          type: boolean
          description: >-
            the member agrees that we sign in to FFPC as them to read their league, never make a move or a bid, and that
            they can disconnect any time; must be true
    HostConnections:
      type: object
      required: [enabled, connections]
      properties:
        enabled: { type: array, items: { $ref: "#/components/schemas/ConnectedHost" }, description: the hosts connecting is open for }
        connections: { type: array, items: { $ref: "#/components/schemas/HostConnection" } }
    HostLeague:
      type: object
      required: [league_id, name, team_name, record]
      properties:
        league_id: { type: string }
        name: { type: string }
        team_name: { type: string }
        record: { type: string, description: "the team's record as FFPC writes it, 2 - 3" }
    HostConnected:
      type: object
      required: [connection, leagues]
      properties:
        connection: { $ref: "#/components/schemas/HostConnection" }
        leagues: { type: array, items: { $ref: "#/components/schemas/HostLeague" } }
