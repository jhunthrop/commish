        opponent's rank against his position, his points a game and his last game's, each in PPR scoring, his club's
        game with its facts, and his place and rest-of-season points a game on our board valued for twelve teams,
        the standard lineup and PPR. Anyone may read it, as the board is. His club and position are our board's. A
        kicker, a defense or a player our board does not place has no page and answers 404.
      parameters:
        - name: player
          in: path
          required: true
          description: his board id, as his page names him
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: "#/components/parameters/TierMates"
        - $ref: "#/components/parameters/TierNext"
        - $ref: "#/components/parameters/TierFormat"
      responses:
        "200": { $ref: "#/components/responses/PlayerWeekResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
