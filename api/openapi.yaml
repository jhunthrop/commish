  /sheets/{id}/import:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [sheets]
      operationId: importSheet
      summary: >-
        Replaces the rows from a CSV in the export's columns (rank, player_id, name, position, team, tier, tags,
        note). rank and player_id and name and position are required. tags holds up to four tags separated by
        commas, bars or semicolons, and a header named tag is read as tags. Rows are ordered by rank.
        A body whose first line does not name player_id is read as a names list instead, one player a line in
        the drafter's order ("1. Puka Nacua", "Ja'Marr Chase, WR", "Bills D/ST"), matched against the board of the
        sheet's format: a name is taken only when it is unmistakable, and each line not taken is skipped with its
        reason. A body that reads to no player is refused with 400 and the sheet is left as it was.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
          text/plain:
            schema: { type: string }
      responses:
        "200":
          description: what was imported and what was skipped, by line
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/SheetImportResult" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
