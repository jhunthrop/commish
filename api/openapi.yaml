openapi: 3.0.3
info:
  title: Commish API
  version: 1.0.0
  description: >-
    The prep site's request-time API (spec docs/superpowers/specs/2026-10-12-prep-site-architecture-design.md §2.2).
    Every response is the envelope: ok, data, error, meta (pages only), request_id. Every route is rate limited
    by a token bucket keyed by the signed-in account, or by the client address when signed out; a spent bucket
    answers 429 with error.code rate_limited and a Retry-After header. State-changing requests that carry the
    session cookie must echo the commish_csrf cookie in the X-CSRF-Token header.
servers:
  - url: https://api.trycommish.app
    description: the request API (cmd/api)
  - url: https://room.trycommish.app
    description: the live room service (cmd/room), WebSocket only
  - url: http://localhost:8080
    description: local development

tags:
  - { name: health }
  - { name: auth }
  - { name: leagues }
  - { name: sheets }
  - { name: exports }
  - { name: billing }
  - { name: mocks }
  - { name: rooms }
  - { name: companions }
  - { name: devices }
  - { name: hosts }
  - { name: run }

paths:
  /healthz:
    get:
      tags: [health]
      operationId: liveness
      summary: The process is up. Never touches the database.
      responses:
        "200": { $ref: "#/components/responses/HealthResponse" }
  /readyz:
    get:
      tags: [health]
      operationId: readiness
      summary: The process can reach the database.
      responses:
        "200": { $ref: "#/components/responses/HealthResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }

  /auth/login:
    get:
      tags: [auth]
      operationId: login
      summary: >-
        Redirects to WorkOS AuthKit. On the web return_to is a path on the site the browser comes back to. An app
        (client ios or android, in the system browser sheet) comes back to the app link alone,
        https://trycommish.app/app/signed-in (the site plus /app/signed-in), given exactly or left out, and sends
        code_challenge, the S256 PKCE challenge (base64url of SHA-256 of a code_verifier the app keeps in memory, no
        padding, 43 characters), with code_challenge_method S256. Any other client, return_to, challenge or method
        answers 400 naming that field, before AuthKit is asked.
      parameters:
        - { name: return_to, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: screen, in: query, required: false, schema: { type: string, enum: [sign-in, sign-up] } }
        - name: client
          in: query
          required: false
          description: the app signing in; absent for the web
          schema: { type: string, enum: [ios, android] }
        - name: code_challenge
          in: query
          required: false
          description: an app's S256 PKCE challenge, required with client; ignored for the web
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        - name: code_challenge_method
          in: query
          required: false
          description: required with client
          schema: { type: string, enum: [S256] }
      responses:
        "302": { description: to WorkOS }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /auth/callback:
    get:
      tags: [auth]
      operationId: callback
      summary: >-
        WorkOS returns here. Sets the sealed session cookie on the apex domain and redirects to the site. For an app's
        sign-in it also mints a pairing code (ten minutes, one use, good only for that app's kind and only with the
        code_verifier behind the sign-in's code_challenge) and answers 303 to the app link with code and client in the
        query; the app trades the code and its verifier at POST /devices/pair.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: "to the site, or to its sign-in problem page" }
        "303": { description: "an app's sign-in, to https://trycommish.app/app/signed-in?code=...&client=ios|android" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Ends the session here and returns the WorkOS logout URL that ends it there.
      responses:
        "200":
          description: signed out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/Redirect" } }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    patch:
      tags: [auth]
      operationId: updateMe
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /me/delete:
    post:
      tags: [auth]
      operationId: deleteMe
      summary: >-
        Deletes the signed-in account (Lane 233, B230), from the account page's browser session or an app's device
        token. The member types the email they sign in with. In one transaction the platform connections go first,
        then every row kept with the account: sign-ins, paired devices and their codes, followed leagues and their
        private reads, sheets and exports, solo mocks and their reports, companions, moves, passes and billing rows.
        A seat in a lobby draft stays in the draft under the departed member's word, its picks with no account; a
        group pass stays with the people who claimed it. The sign-in provider's user is deleted after the commit,
        and a failure there is retried by the daily sweep. Answers 204 with the session cookie cleared; every device
        token opens nothing from then on. POST, not DELETE with a body, because OpenAPI 3.0 leaves a DELETE's request
        body undefined and the app clients' generators treat it unevenly.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountDeletion" }
      responses:
        "204": { description: the account is deleted and the session cookie cleared }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /me/week:
    get:
      tags: [league-sync]
      operationId: memberWeek
      summary: >-
        The front door's week (Lane 66k): for every league the account follows, newest first, its own score bug (the
        League page's game for the member's team, with both teams), the lineup's changes and what they add, and up to
        three facts about the member's roster, each from the reads the in-season routes already make. The front door
        reads this once and makes no other in-season read. A league whose read fails stays on the list with problem
        saying why.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200":
          description: the account's leagues this week
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/MemberWeek" } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /season:
    get:
      tags: [auth]
      operationId: getSeason
      summary: >-
        The NFL season the site is in, the same object /me carries, for anyone signed in or not, so a signed-out shell
        can correct its rail at boot. Kept an hour on the API, the same answer as /me's.
      responses:
        "200":
          description: the site's season
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/SiteSeason" } }
  /me/league:
    put:
      tags: [league-sync]
      operationId: selectLeague
      summary: >-
        The site's context: one of the account's followed leagues, or a format with no league. Every page reads the
        selection from /me.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeagueChoice" }
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /leagues:
    get:
      tags: [leagues]
      operationId: listLeagues
      security: [{ session: [] }, { device: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200":
          description: the account's saved leagues, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/League" } } }
    post:
      tags: [leagues]
      operationId: createLeague
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeagueInput" }
      responses:
        "201": { $ref: "#/components/responses/LeagueResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [leagues]
      operationId: getLeague
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/LeagueResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    put:
      tags: [leagues]
      operationId: replaceLeague
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeagueInput" }
      responses:
        "200": { $ref: "#/components/responses/LeagueResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [leagues]
      operationId: deleteLeague
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /leagues/import-scoring:
    post:
      tags: [leagues]
      operationId: importScoring
      summary: >-
        Read a league's scoring from its host by its link and answer it as ScoringRules: Sleeper from the league's
        scoring settings, ESPN from a public league's settings (a private league is refused with a sentence saying to
        make it viewable or enter the rules by hand), MyFantasyLeague from a public league's rules. Yahoo is entered
        by hand. Needs the custom_scoring feature (403 naming it). Nothing is saved.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoringImportInput" }
      responses:
        "200":
          description: the league's rules, what was applied, dropped and defaulted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/ScoringImport" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attach/preview:
    post:
      tags: [league-sync]
      operationId: previewAttach
      summary: >-
        Read a league on another host by its link (Sleeper, or a public MyFantasyLeague league) and answer its name and
        teams, so the drafter can say which team is theirs. Free. Nothing is saved.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachPreviewInput" }
      responses:
        "200": { $ref: "#/components/responses/AttachPreviewResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attach:
    post:
      tags: [league-sync]
      operationId: attachLeague
      summary: >-
        Attach the drafter's own league on another host by its link. Free. The league's roster and scoring become a
        saved league (custom scoring, exactly as the host states it) a mock reruns from, when a mock room can draft
        its shape. The drafter's seat is the team their Sleeper username runs, or the team they pick. Attaching the
        same league again updates the seat. One live league is free; a second needs the many_leagues feature
        (the Draft Pass or the Membership), refused with 403 naming it. A detached league does not count.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachInput" }
      responses:
        "201": { $ref: "#/components/responses/LeagueSyncResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached:
    get:
      tags: [league-sync]
      operationId: listAttached
      summary: The account's attached leagues, newest first.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200":
          description: up to twenty
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/AttachedLeague" } } }
  /leagues/attached/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    delete:
      tags: [league-sync]
      operationId: detachLeague
      summary: >-
        Stop following a league. The attachment is kept as detached, with the saved league it made, so the detach
        can be undone (restore) and mocks saved from it keep their settings.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [league-sync]
      operationId: restoreLeague
      summary: >-
        Undo a detach. The league is followed again with the seat and saved league it had. Like an attach, a second
        live league needs the many_leagues feature (403 naming it).
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    get:
      tags: [league-sync]
      operationId: leagueSync
      summary: >-
        The attached league as it stands: standings, the drafter's roster, the week's matchup, the moves of this week
        and last, and the unrostered pool on our board. One upstream read per league per minute whatever the viewer
        count; when the host fails, the last good read with host_stale_seconds.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/LeagueSyncResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/refresh:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    post:
      tags: [league-sync]
      operationId: refreshLeague
      summary: >-
        Read the league from its host now, shared with any read inside the last ten seconds. 30 an hour an account.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/LeagueSyncResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/lineup:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    get:
      tags: [league-sync]
      operationId: leagueLineup
      summary: >-
        Start and sit: the week's lineup for the drafter's own team, every slot filled by our order after the week's
        hard facts (bye, out, doubtful), each change from the lineup the host holds with its reason in one sentence.
        Reads the league as the sync route does. moves says whether the lineup can be set on the host from our screen
        (POST /leagues/attached/{id}/moves/plan, then /moves); nothing here writes the host.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/LineupAdviceResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/matchup:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    get:
      tags: [league-sync]
      operationId: leagueMatchup
      summary: >-
        The week's matchup as a box score: each side's starters in the host's slots and its bench, every player with
        his line (his game's facts, his points so far once his game has kicked off, the week's published projection).
        Reads the league as the sync route does; the sync answer's matchup keeps the score and the teams. Any game of
        the week is drawn when roster names one of its sides (Lane 204).
      security: [{ session: [] }, { device: [] }]
      parameters:
        - name: roster
          in: query
          required: false
          description: >-
            a roster id from the scoreboard's sides (ScoreboardSide.roster_id): the box is that roster's game, its side
            first and its opponent second when the week pairs them, by the same rules as the member's. Absent, the
            member's own game, as before (Lane 204). Not an integer answers 400; a roster the league's last read does
            not list answers 404, each naming the roster field
          schema: { type: integer, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/MatchupBoxResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/scoreboard:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    get:
      tags: [league-sync]
      operationId: leagueScoreboard
      summary: >-
        Every game of the league's week: each side's points so far as the host scores them, its starters' summed
        published projection, and the game's state from its starters' kickoffs (before kickoff, playing, final). Reads
        the league as the sync route does.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/ScoreboardResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/record:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    get:
      tags: [league-sync]
      operationId: leagueRecord
      summary: >-
        Our record in the member's own league (Lane 93): the league's lineup, which the record page counts starters in,
        and each week the register has graded whose roster ESPN was read for before our order was set, with the points
        the lineup our set order picks from the member's roster scored against the points of the lineup ESPN's own
        projection picks from the same roster (or, where that read carries no ESPN projection, the week's published
        projection), both scored as the league scores. Reads the league as the sync route does.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/LeagueRecordResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/waivers:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
      - name: position
        in: query
        required: false
        description: only candidates at this position
        schema: { type: string, enum: [QB, RB, WR, TE, K, DEF] }
      - name: player
        in: query
        required: false
        description: >-
          a player a link named (his board id): his row is kept on the page past its first 60, so an add from the
          order or the player card lands on him; an id not among the adds changes nothing
        schema: { type: string, maxLength: 64 }
    get:
      tags: [league-sync]
      operationId: leagueWaivers
      summary: >-
        Waivers: the unrostered players on our board ranked by the gain to the drafter's lineup, each with the drop it
        costs least to lose. A player tagged Hold on the drafter's sheets is never the drop. We submit nothing.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/WaiverAdviceResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/order:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
      - name: position
        in: query
        required: false
        description: >-
          only players at this position; without it every position, ranked by points over replacement. Kickers and
          defenses are not on the order, as the in-season table carries none
        schema: { type: string, enum: [QB, RB, WR, TE] }
      - name: q
        in: query
        required: false
        description: only players whose name or club holds these letters, any case
        schema: { type: string, minLength: 2, maxLength: 40 }
      - name: limit
        in: query
        required: false
        description: at most this many rows, 100 without it
        schema: { type: integer, minimum: 1, maximum: 400 }
      - name: roster
        in: query
        required: false
        description: only the free players, or only the drafter's own; total and the limit count after it
        schema: { type: string, enum: [free, yours] }
    get:
      tags: [league-sync]
      operationId: leagueOrder
      summary: >-
        The Rest of season screen for the drafter's league: our rest-of-season order valued for the league, each
        player with his week, whose roster holds him and the one move his row admits (add a free player the league
        starts, trade for one the trade finder's best trade with his team brings in). We submit nothing.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/OrderAdviceResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/order/week:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
      - { $ref: "#/components/parameters/WeekOrderPosition" }
    get:
      tags: [league-sync]
      operationId: leagueWeekOrder
      summary: >-
        The kickers' or defenses' tab in season for the drafter's league (Lane 66w): every club's kicker or defense
        with its week, in the order of the week's published projection, in the league's scoring, whose roster holds
        it and an add on the first five free rows still to play. We have no kicker or defense model, so there is no
        rest-of-season order for these positions. We submit nothing.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/WeekOrderAdviceResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/trades:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
      - name: player
        in: query
        required: false
        description: a board id; only trades holding this player, on either side
        schema: { type: string, minLength: 1, maxLength: 64 }
    get:
      tags: [league-sync]
      operationId: leagueTrades
      summary: >-
        The trade finder: for each other team, the one-for-one and two-for-one trades (both ways) after which both
        lineups gain on our order and both still fill every slot, best for the drafter first. A player tagged Hold on
        the drafter's sheets is never given. We never send an offer.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/TradeAdviceResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/trades/check:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    post:
      tags: [league-sync]
      operationId: checkLeagueTrade
      summary: >-
        The trade builder: one trade the drafter built with one other team, one or two players a side at QB, RB, WR
        or TE from the two rosters as the league's last read holds them, answered with the finder's own figures (the
        same engine, so a trade the finder lists answers its numbers): each lineup's gain or loss on our order, the
        drop a full roster makes for two in, and whether each roster still fills every slot. A player not on the
        named roster, a kicker, a defense, or a player on injured reserve or the taxi squad answers 422 with the
        sentence naming him. We never send an offer.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeCheckInput" }
      responses:
        "200": { $ref: "#/components/responses/TradeCheckResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "415": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/players/{player}:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
      - name: player
        in: path
        required: true
        description: his board id, as his page names him
        schema: { type: string, minLength: 1, maxLength: 64 }
      - $ref: "#/components/parameters/TierMates"
      - $ref: "#/components/parameters/TierNext"
      - $ref: "#/components/parameters/TierFormat"
    get:
      tags: [league-sync]
      operationId: leaguePlayerWeek
      summary: >-
        One player's week for his page, read in the drafter's league: the Lineup row's figures in the league's scoring
        (the week's projection in the format the league scores most like, its change, his opponent's rank against his
        position, his points a game and his last game's), and the one verb the league screens would give him: start him
        when he is on the drafter's roster and our lineup starts him where the platform does not, the lineup otherwise,
        a trade for him when another roster holds him, and the claim or the platform's waiver page when no roster does,
        as the claim moves say. A quarterback, running back, receiver or tight end our board places; anyone else 404s.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/PlayerWeekResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/moves/plan:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    post:
      tags: [league-sync]
      operationId: planHostMove
      summary: >-
        Plan a move the screen built (kind lineup: each slot's player in and the starter out, for the week; kind claim:
        the add, the drop and the bid the member typed, where the league bids, with the bid's bounds in the answer)
        against a fresh read of the league as the member, on the member's own team only. Answers the move in words with a confirm
        token bound to the account, the league, the move's content and ten minutes; sends nothing. Answers unavailable,
        with the host's page, where the host has no write path, the host's switch is off for the account, the account's
        connection is signed out or agreed to words older than the moves (a sentence asks to connect again), or the
        stored SWID does not own the team the attached league names as the member's in ESPN's teams read.
        20 a minute an account.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostMoveInput" }
      responses:
        "200": { $ref: "#/components/responses/HostMovePlanResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/moves:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    get:
      tags: [league-sync]
      operationId: listHostMoves
      summary: The member's own moves on this league, newest first, the last 20.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/HostMovesResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [league-sync]
      operationId: makeHostMove
      summary: >-
        Make the planned move once, with its confirm token: checked again against a fresh read, sent to the host once
        with the member's stored session, never retried, then the host's state read back. Answers done (read back and
        matching), refused (the host's reason in its own words, nothing changed), pending (a claim in the host's queue,
        with when it runs; or sent and the read-back did not confirm it: check the host) or unavailable (the host's
        page). Every move is kept as its proof. 409 for a token
        already used, 400 for a token for another account, league or move, or expired, 422 for a move the fresh read refuses
        (another week, a starter moved, a locked player, not the member's team). 5 a minute an account.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostMoveConfirm" }
      responses:
        "200": { $ref: "#/components/responses/HostMoveResultResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }

  /sheets:
    get:
      tags: [sheets]
