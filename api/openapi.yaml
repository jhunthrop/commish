  schemas:
    Envelope:
      type: object
      required: [ok, data, error, request_id]
      properties:
        ok: { type: boolean }
        data: { nullable: true, description: the payload, null on error }
        error:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ErrorBody" }]
        meta:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PageMeta" }]
        request_id: { type: string }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            invalid, unauthorized, forbidden, not_found, conflict, rate_limited, csrf, payload_too_large, unsupported_media_type,
            billing_unavailable, storage_unavailable, unavailable, internal, team_not_read (a 404 from an in-season route:
            the drafter's team is missing from the league's last read, so reading the host again may find it),
            free_season (a 409 from checkout: the season is free and nothing is sold)
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        feature: { $ref: "#/components/schemas/Feature" }
    PageMeta:
      type: object
      required: [page, per_page, total]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        version: { type: string }
    Redirect:
      type: object
      required: [url]
      properties:
        url: { type: string }
    DeviceSignOut:
      type: object
      required: [url]
      properties:
        url:
          type: string
          nullable: true
          description: >-
            The WorkOS logout URL the app opens to end the sign-in's WorkOS session, returning to the site; null when the
            device was paired before the API kept the session.

    Feature:
      type: string
      enum: [live_draft_advisor, custom_scoring, full_reasoning, range_of_outcomes, synced_sheet, early_run, start_sit, waiver_ranks, trade_finder, many_leagues]
    Product:
      type: string
      enum: [draft_pass, membership, group_pass]
    Interval:
      type: string
      enum: [year, month]

    Account:
      type: object
      required: [id, email, first_name, last_name, handle, features, draft_pass, membership, league, leagues, format, season, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        league:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ContextLeague" }]
          description: >-
            the selected league, the site's context; with no selection made, the newest followed league; null when the
            account follows none or chose a format alone
        leagues:
          type: array
          description: every league the account follows, newest first, as the shell's switcher lists them
          items: { $ref: "#/components/schemas/ContextLeague" }
        format:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BoardFormat" }]
          description: >-
            the context's format, the board every page opens in: the selected league's, else the format chosen with
            no league, null when neither
        season: { $ref: "#/components/schemas/SiteSeason" }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        handle:
          type: string
          nullable: true
          description: the name shown in lobbies, 3 to 20 letters, digits or underscores, not starting with a digit
        features:
          type: array
          items: { $ref: "#/components/schemas/Feature" }
        draft_pass:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DraftPassState" }]
        membership:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/MembershipState" }]
        created_at: { type: string, format: date-time }
    DraftPassState:
      type: object
      required: [season, ends_at, source]
      properties:
        season: { type: integer }
        ends_at: { type: string, format: date-time }
        source: { type: string, enum: [purchase, group_pass, grant] }
    MembershipState:
      type: object
      description: >-
        the account's Membership, from its live membership entitlement whatever its source, else its
        latest subscription. A subscription carries its billing (interval, current_period_end and
        cancel_at_period_end). A grant bought nothing, so those three are null.
      required: [source, status, starts_at, ends_at, interval, current_period_end, cancel_at_period_end]
      properties:
        source: { type: string, enum: [subscription, grant] }
        status: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true, description: "when access ends, null for a grant with no end" }
        interval:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Interval" }]
        current_period_end: { type: string, format: date-time, nullable: true }
        cancel_at_period_end: { type: boolean, nullable: true }
    AccountUpdate:
      type: object
      required: [handle]
      properties:
        handle: { type: string, minLength: 3, maxLength: 20, pattern: "^[A-Za-z_][A-Za-z0-9_]{2,19}$" }
    AccountDeletion:
      type: object
      description: >-
        The member's confirmation that the account goes: the email they sign in with, typed by hand, compared without
        regard to case or the spaces around it.
      required: [email]
      properties:
        email: { type: string, maxLength: 320 }

    ScoringPreset:
      type: string
      enum: [ppr, half_ppr, standard, te_premium]
    Lineup:
      type: string
      enum: [standard, superflex, two_flex]
    BotStyle:
      type: string
      enum: [adp, last_draft]
    BoardFormat:
      type: string
      enum: [ppr, half_ppr, standard, te_premium, superflex, two_flex, dynasty, best_ball]
    ContextLeague:
      type: object
      description: a followed league as the site's context reads it
      required: [id, name, host, team_name, standing, scoring, format, settings_league_id, phase, phase_basis, draft_at, playoff_start_week, waivers_open]
      properties:
        id: { type: string, format: uuid, description: the attachment (AttachedLeague.id) }
        name: { type: string, description: "the league's name at its last read, else its saved league's" }
        host: { $ref: "#/components/schemas/LeagueHost" }
        team_name: { type: string, description: "the drafter's team at the last read, empty when unread" }
        standing:
          allOf: [{ $ref: "#/components/schemas/LeagueStanding" }]
          nullable: true
          description: the drafter's record and place at the last read, null when unread
        scoring:
          allOf: [{ $ref: "#/components/schemas/ScoringPreset" }]
          description: the preset the league's scoring is, or scores most like (its saved league's, else its last read's)
        format:
          allOf: [{ $ref: "#/components/schemas/BoardFormat" }]
          description: >-
            the board the league reads on: superflex for a superflex lineup, otherwise ppr, half_ppr or standard by
            the league's points per reception (TE premium reads on ppr until its exact rules have a board)
        settings_league_id:
          type: string
          format: uuid
          nullable: true
          description: the saved league a mock reruns from, null when a mock room cannot draft this league
        phase: { $ref: "#/components/schemas/LeaguePhase" }
        phase_basis: { type: string, description: "one sentence naming the fact the phase came from, in the site's words" }
        draft_at: { type: string, format: date-time, nullable: true, description: "the host's draft time, null when the host does not say" }
        playoff_start_week:
          type: integer
          nullable: true
          description: the league's first playoff week as the host states it, null when the host does not say
        waivers_open:
          type: boolean
          description: >-
            the host still runs waivers this week: false in and after the playoffs where the host closes them, and once
            the season is over, else true
    LeaguePhase:
      type: string
      enum: [pre_draft, draft_day, in_season, playoffs, offseason]
      description: >-
        where a followed league is in its season, computed at read time from the host's facts: pre_draft before its
        draft, draft_day when the draft starts within 24 hours or is under way, in_season from the draft to the playoffs
        (a drafted league the host gives no current week is in_season while the site season is preseason), playoffs
        from the league's playoff start week until the host says the season is over, offseason after it (or a drafted
        league with no current week once the NFL regular season has ended)
    SiteSeason:
      type: object
      description: the NFL season the site is in, for a visitor with no league, from the kickoffs the API reads
      required: [phase, week, basis]
      properties:
        phase: { type: string, enum: [preseason, in_season, playoffs, offseason] }
        week: { type: integer, description: "the NFL week in play, 0 before week 1 and after the season" }
        basis: { type: string, description: one sentence naming the fact the phase came from, in the site's words }
        board_week:
          type: integer
          description: >-
            the first week the published board covers, read from the published run the board routes read. Absent
            (never null) before the first in-season board, outside the regular season, and when the board's week
            could not be read, which basis then says. When it is behind week, basis says why.
    LeagueChoice:
      type: object
      description: >-
        exactly one of league_id (a followed league) and format (no league: any board format, the web offering
        the ones the run carries)
      properties:
        league_id: { type: string, format: uuid, nullable: true }
        format:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BoardFormat" }]
    Scoring:
      type: object
      description: exactly one of preset and custom. custom needs the custom_scoring feature.
      properties:
        preset:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ScoringPreset" }]
        custom:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ScoringRules" }]
    ScoringRules:
      type: object
      additionalProperties: false
      description: >-
        A league's exact scoring: the 21 research/model/domain.py ScoringRules names (the board's rules), every one
        required, then a kicker's longer field goals and a team defense's points-allowed and yards-allowed tiers, each
        optional and read at its standard figure when absent (a body from before they existed stays good); every rule
        is always answered. An unknown key is a field error that names it. Points per yard for the yardage rules, per event for the rest.
        points_per_field_goal is a field goal made under 40 yards, and any field goal whose distance the stat line does
        not say. A tier is the points a defense scores for a game whose points or yards allowed fall in its range, both
        ends included; a tier the league does not score is 0.
      required: [points_per_passing_yard, points_per_passing_touchdown, points_per_interception, points_per_rushing_yard, points_per_rushing_touchdown, points_per_receiving_yard, points_per_receiving_touchdown, points_per_reception, points_per_fumble_lost, te_reception_bonus, points_per_field_goal, points_per_extra_point, points_per_sack, points_per_defensive_interception, points_per_defensive_touchdown, points_per_two_point_conversion, points_per_field_goal_missed, points_per_extra_point_missed, points_per_return_touchdown, points_per_defensive_fumble_recovery, points_per_safety]
      properties:
        points_per_passing_yard: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_passing_touchdown: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_interception: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_rushing_yard: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_rushing_touchdown: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_receiving_yard: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_receiving_touchdown: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_reception: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_fumble_lost: { type: number, format: double, minimum: -100, maximum: 100 }
        te_reception_bonus: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_field_goal: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_extra_point: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_sack: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_defensive_interception: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_defensive_touchdown: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_two_point_conversion: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_field_goal_missed: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_extra_point_missed: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_return_touchdown: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_defensive_fumble_recovery: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_safety: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_field_goal_40_49: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_per_field_goal_50_plus: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_0: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_1_6: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_7_13: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_14_17: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_18_20: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_21: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_22_27: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_28_34: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_35_45: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_46_plus: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_0_99: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_100_199: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_200_299: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_300_349: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_350_399: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_400_449: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_450_499: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_500_549: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_550_plus: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
    ScoringImportInput:
      type: object
      required: [host, link]
      properties:
        host: { type: string, enum: [sleeper, espn, mfl] }
        link: { type: string, minLength: 1, maxLength: 300, description: the league link as pasted, or its id }
    NamedPick:
      type: object
      required: [host_name, board_name]
      properties:
        host_name: { type: string, description: the player as the host names him }
        board_name: { type: string, description: the player as our board names him }
    DroppedRule:
      type: object
      required: [group, rule, points]
      properties:
        group: { type: string, enum: [offense, bonus, kicking, defense, other] }
        rule: { type: string, description: the rule in drafter words, no commas }
        points:
          type: number
          format: double
          nullable: true
          description: the host's figure, null when the rule's own words carry it
    ScoringImport:
      type: object
      required: [rules, applied, dropped, defaulted]
      properties:
        rules: { $ref: "#/components/schemas/ScoringRules" }
        applied:
          type: array
          items: { type: string }
          description: >-
            the rules the host states, by our names, with every points-allowed and yards-allowed tier: a tier the host
            does not score is 0, as the host scores it
        dropped:
          type: array
          items: { $ref: "#/components/schemas/DroppedRule" }
          description: every host rule ScoringRules does not carry, in drafter words by group with its figure, never silently lost
        defaulted:
          type: array
          items: { type: string }
          description: the rules the host does not state, each at the standard figure (never a tier, see applied)
    RosterCounts:
      type: object
      description: starters per position and the bench. Flex spots come from the lineup.
      required: [qb, rb, wr, te, k, dst, bench]
      properties:
        qb: { type: integer, minimum: 0, maximum: 4 }
        rb: { type: integer, minimum: 0, maximum: 6 }
        wr: { type: integer, minimum: 0, maximum: 6 }
        te: { type: integer, minimum: 0, maximum: 4 }
        k: { type: integer, minimum: 0, maximum: 2 }
        dst: { type: integer, minimum: 0, maximum: 2 }
        bench: { type: integer, minimum: 0, maximum: 15 }
    Keeper:
      type: object
      required: [slot, player_id, round]
      properties:
        slot: { type: integer, minimum: 1 }
        player_id: { type: string, maxLength: 64 }
        round: { type: integer, minimum: 1 }
    LeagueSettings:
      type: object
      required: [scoring, teams, slot, roster, lineup, keepers, bot_style]
      properties:
        scoring: { $ref: "#/components/schemas/Scoring" }
        teams: { type: integer, minimum: 8, maximum: 14 }
        slot: { type: integer, nullable: true, minimum: 1, description: null drafts from a random slot }
        roster: { $ref: "#/components/schemas/RosterCounts" }
        lineup: { $ref: "#/components/schemas/Lineup" }
        keepers:
          type: array
          maxItems: 56
          items: { $ref: "#/components/schemas/Keeper" }
        bot_style: { $ref: "#/components/schemas/BotStyle" }
    LeagueInput:
      type: object
      required: [name, settings]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
    League:
      type: object
      required: [id, name, settings, rounds, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        rounds: { type: integer, description: the roster's total, which is the draft's round count }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SheetTag:
      type: string
      description: The fixed tags. A row's tags may also hold the drafter's own words (SheetTags).
      enum: [target, sleeper, breakout, avoid, injury, handcuff]
    SheetTags:
      type: array
      description: >-
        Up to four tags, each one of the fixed SheetTag values or the drafter's own word: 1 to 20 letters, digits,
        spaces, apostrophes, periods or hyphens, starting with a letter or digit. A word that matches a fixed tag in
        any case is stored as the fixed tag. No tag appears twice in any case.
      maxItems: 4
      items: { type: string, minLength: 1, maxLength: 20 }
    Sheet:
      type: object
      required: [id, name, format, row_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        format: { $ref: "#/components/schemas/BoardFormat" }
        row_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SheetRow:
      type: object
      required: [player_id, name, position, team, headshot, rank, tier, tags, note]
      properties:
        player_id: { type: string }
        name: { type: string }
        position: { type: string }
        team: { type: string, nullable: true }
        headshot: { type: string, nullable: true, description: the face the drafter saw when the row was added }
        rank: { type: integer }
        tier: { type: integer, nullable: true }
        tags: { $ref: "#/components/schemas/SheetTags" }
        note: { type: string, nullable: true }
    SheetDetail:
      allOf:
        - $ref: "#/components/schemas/Sheet"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: "#/components/schemas/SheetRow" }
    SheetRowInput:
      type: object
      required: [player_id, name, position]
      properties:
        player_id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 80 }
        position:
          type: string
          minLength: 1
          maxLength: 8
          description: QB, RB, WR, TE, K or DST, in any case. DEF and D/ST are stored as DST, PK as K.
        team: { type: string, nullable: true, maxLength: 8 }
        headshot: { type: string, nullable: true, minLength: 9, maxLength: 300, description: an https URL }
        tier: { type: integer, nullable: true, minimum: 1, maximum: 50 }
        tags: { $ref: "#/components/schemas/SheetTags" }
        note: { type: string, nullable: true, maxLength: 500 }
    SheetCreate:
      type: object
      required: [name, format]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        format: { $ref: "#/components/schemas/BoardFormat" }
        rows:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/SheetRowInput" }
    SheetUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    SheetRowsReplace:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/SheetRowInput" }
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 60
          description: >-
            The sheet's name, written in the same guarded write as the rows, so a rename can never pass a stale
            if_updated_at. Absent or null keeps the name.
        if_updated_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            The sheet's updated_at as the writer last read it. When given and the sheet has changed since, nothing
            is written and the answer is 409 conflict, so a second device never overwrites the first unseen.
    SheetRowUpdate:
      type: object
      required: [tier, tags, note]
      properties:
        tier: { type: integer, nullable: true, minimum: 1, maximum: 50 }
        tags: { $ref: "#/components/schemas/SheetTags" }
        note: { type: string, nullable: true, maxLength: 500 }
    ImportSkip:
      type: object
      required: [line, reason]
      properties:
        line: { type: integer }
        reason: { type: string }
    SheetImportResult:
      type: object
      required: [imported, skipped, sheet]
      properties:
        imported: { type: integer }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/ImportSkip" }
        sheet: { $ref: "#/components/schemas/SheetDetail" }

    ExportFormat:
      type: string
      enum: [csv]
    ExportCreate:
      type: object
      required: [format]
      properties:
        format: { $ref: "#/components/schemas/ExportFormat" }
    Export:
      type: object
      required: [id, sheet_id, format, file_name, bytes, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        sheet_id: { type: string, format: uuid, nullable: true }
        format: { $ref: "#/components/schemas/ExportFormat" }
        file_name: { type: string }
        bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    ExportLink:
      allOf:
        - $ref: "#/components/schemas/Export"
        - type: object
          required: [url, url_expires_at]
          properties:
            url: { type: string }
            url_expires_at: { type: string, format: date-time }

    Price:
      type: object
      required: [lookup_key, amount_cents, currency, interval]
      properties:
        lookup_key: { type: string }
        amount_cents: { type: integer, format: int64 }
        currency: { type: string }
        interval:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Interval" }]
    PlanCatalog:
      type: object
      description: >-
        A product whose price is not set in Stripe yet is null (draft_pass, group_pass) or missing from the list
        (membership). While checkout is not open the prices are the launch prices. In a free season every price
        is null or missing and free_season is true.
      required: [season, pass_ends_at, checkout_open, features, draft_pass, membership, group_pass]
      properties:
        season: { type: integer, description: "the season a pass bought now is for: the current one until its first kickoff, then the next" }
        pass_ends_at: { type: string, format: date-time, description: "when a pass bought now ends: its season's end, March 1 UTC" }
        checkout_open: { type: boolean, description: false while Stripe is not configured, and checkout answers 503 }
        free_season:
          type: boolean
          description: >-
            true while the season is free (FREE_SEASON): every account holds every feature, checkout_open is false
            and checkout answers 409 free_season. Missing from an API older than the free season.
        features: { $ref: "#/components/schemas/PlanFeatures" }
        draft_pass:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Price" }]
        membership:
          type: array
          description: annual first
          items: { $ref: "#/components/schemas/Price" }
        group_pass:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/GroupPassPrice" }]
    PlanFeatures:
      type: object
      description: what each product unlocks, from app.product_features. A group pass seat is a draft_pass.
      required: [draft_pass, membership]
      properties:
        draft_pass:
          type: array
          items: { $ref: "#/components/schemas/Feature" }
        membership:
          type: array
          items: { $ref: "#/components/schemas/Feature" }
    GroupPassPrice:
      type: object
      required: [per_seat, min_seats, max_seats]
      properties:
        per_seat: { $ref: "#/components/schemas/Price" }
        min_seats: { type: integer }
        max_seats: { type: integer }
    CheckoutRequest:
      type: object
      required: [product]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        interval:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Interval" }]
        seats: { type: integer, nullable: true, minimum: 8, maximum: 14, description: "group_pass only: one pass per team, the league bounds" }
        league_name: { type: string, nullable: true, maxLength: 60, description: group_pass only }
    GroupPass:
      type: object
      required: [id, league_name, season, seats, claimed, claims, claim_url, claim_code, claimed_by_me, status, created_at]
      properties:
        id: { type: string, format: uuid }
        league_name: { type: string }
        season: { type: integer }
        seats: { type: integer }
        claimed: { type: integer }
        claims:
          type: array
          description: each claimed seat, first claim first; the seats past these are open
          items: { $ref: "#/components/schemas/GroupPassClaim" }
        claim_url: { type: string }
        claim_code: { type: string, description: the code in the claim link, for the buyer's own claim }
        claimed_by_me: { type: boolean, description: the buyer holds one of its seats }
        status: { type: string, enum: [active, refunded, disputed] }
        created_at: { type: string, format: date-time }
    GroupPassClaim:
      type: object
      required: [handle, claimed_at]
      properties:
        handle: { type: string, nullable: true, description: the claimer's lobby handle, null before they choose one }
        claimed_at: { type: string, format: date-time }
    GroupPassPreview:
      type: object
      required: [league_name, season, seats, claimed, purchaser_handle, claimed_by_me]
      properties:
        league_name: { type: string }
        season: { type: integer }
        seats: { type: integer }
        claimed: { type: integer }
        purchaser_handle: { type: string, nullable: true }
        claimed_by_me: { type: boolean }

    MockStatus:
      type: string
      enum: [active, complete]
    MockCreate:
      type: object
      description: exactly one of league_id and settings
      properties:
        league_id: { type: string, format: uuid, nullable: true }
        settings:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/LeagueSettings" }]
        seed: { type: integer, format: int64, nullable: true, minimum: 0, maximum: 4294967295 }
    Mock:
      type: object
      required: [id, league_id, settings, seed, status, created_at, updated_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        league_id: { type: string, format: uuid, nullable: true }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        seed: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/MockStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    PlayerPosition:
      type: string
      enum: [QB, RB, WR, TE, K, DEF]
    BoardPlayer:
      type: object
      description: one player of the board a room drafts from
      required: [id, name, position, team, headshot, adp, points, vor, position_rank, bye]
      properties:
        id: { type: string }
        name: { type: string }
        position: { $ref: "#/components/schemas/PlayerPosition" }
        team: { type: string, description: "his club's code, \"FA\" for a free agent (no club: no bye, Lane 123)" }
        headshot: { type: string }
        adp: { type: number, format: double, nullable: true, description: where drafters take him, null with no source }
        points: { type: number, format: double, nullable: true, description: projected season points, null for kickers and defenses }
        vor: { type: number, format: double, nullable: true, description: points over replacement for this league, null when it has none }
        gap:
          type: number
          format: double
          nullable: true
          description: >-
            drafters' ADP less his place on our board (the pool's order by points over replacement), the ADP the column
            prints less the place, a tenth: plus when drafters take him later than we rank him; null with no ADP or no
            place (a kicker, a defense). Absent from a server older than the column
        position_rank: { type: integer }
        bye: { type: integer, nullable: true }
        status:
          $ref: "#/components/schemas/BoardStatus"
    BoardStatus:
      type: object
      description: >-
        his injury designation on the newest hourly capture (GET /boards/{format} only), absent when the capture does
        not list him
      required: [status, season_long, since, as_of, source]
      properties:
        status: { $ref: "#/components/schemas/DesignationStatus" }
        season_long:
          type: boolean
          description: >-
            injured reserve, suspended, PUP, NFI, or out with the capture's note saying out for the season: his
            rest-of-season figure assumes he plays, so he is placed below every available player at his position. A
            week's out, doubtful or questionable moves nothing
        since:
          type: string
          format: date-time
          nullable: true
          description: >-
            the first capture of his unbroken run under a season-long status; null for a week's designation and for a
            run older than the captures read, whose start we do not know
        as_of: { type: string, format: date-time, description: the stamp of the capture that lists him }
        source: { type: string, description: "the capture's feed in the research store: tank01_injuries_by_date" }
    StatusRead:
      type: object
      description: the injury capture a board's statuses come from, absent when none was read
      required: [as_of, checked_at, source]
      properties:
        as_of:
          type: string
          format: date-time
          description: the capture's stamp, when the list last changed (an unchanged list is not stored again)
        checked_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            the capture job's last successful check of the list, null when the store records none: say "read" at
            this time, and "as the list stood" at as_of without it
        source: { type: string, description: the capture's feed in the research store }
    RoomBoard:
      type: object
      required: [format, season, as_of, basis, players]
      properties:
        format: { type: string, enum: [ppr, half, std] }
        season: { type: integer }
        as_of: { type: string, format: date-time }
        basis: { type: string, description: the sentence naming what the numbers are }
        status_read:
          $ref: "#/components/schemas/StatusRead"
        players:
          type: array
          description: >-
            every player in the order drafters take them; on GET /boards/{format}, each player on a season-long list
            follows the last available player at his position
          items: { $ref: "#/components/schemas/BoardPlayer" }
    RoomPick:
      type: object
      required: [pick, round, seat, player_id, auto]
      properties:
        pick: { type: integer }
        round: { type: integer }
        seat: { type: integer, description: the 1-based draft slot that made it }
        player_id: { type: string }
        auto: { type: boolean, description: "the clock made it: an expired turn. In a lobby, who made a pick is the log row's pick.by" }
    MockRoom:
      type: object
      required: [id, league_id, status, seed, settings, teams, rounds, slot, pick_number, on_clock, waiting, picks, queue, seq, share_code, created_at]
      properties:
        id: { type: string, format: uuid, nullable: true, description: null for a shared draft }
        league_id: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/MockStatus" }
        seed: { type: integer, format: int64 }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        teams: { type: integer }
        rounds: { type: integer }
        slot: { type: integer, description: the drafter's 1-based slot }
        pick_number: { type: integer, description: the pick on the clock, past the last pick when the draft is over }
        on_clock: { type: integer, nullable: true, description: the slot on the clock }
        waiting: { type: boolean, description: the drafter is on the clock }
        picks:
          type: array
          items: { $ref: "#/components/schemas/RoomPick" }
        queue:
          type: array
          items: { type: string }
        seq: { type: integer, format: int64 }
        share_code: { type: string, description: "the link's code: the settings, seed, picks and drafter, signed by the server" }
        shared_by: { type: string, description: "the drafter's handle, when he has one: a shared draft names whose it is" }
        created_at: { type: string, format: date-time }
        board:
          description: the board, on a full read (create, get, shared) and absent on a pick's answer
          allOf: [{ $ref: "#/components/schemas/RoomBoard" }]
        card:
          description: >-
            the drafter's card at the turn on the clock, the one GET /mocks/{id}/card records, so the
            turn and its call arrive together. On a get, pick, undo or autopick that leaves the draft
            on the drafter; absent otherwise, and absent when it could not be made in the request
            (read it from /card then)
          allOf: [{ $ref: "#/components/schemas/RoomCard" }]
    MockPickInput:
      type: object
      required: [player_id, pick]
      properties:
        player_id: { type: string, minLength: 1, maxLength: 64 }
        pick: { type: integer, minimum: 1, description: the overall pick the drafter saw on the clock }
    MockUndoInput:
      type: object
      required: [pick]
      properties:
        pick: { type: integer, minimum: 1, description: the overall pick of the drafter's to take back }
    MockQueueInput:
      type: object
      required: [player_ids]
      properties:
        player_ids:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
    CardCandidate:
      type: object
      required: [player_id]
      properties:
        player_id: { type: string }
        why: { type: string, description: the advisor's sentence, absent from the engine }
    RoomCard:
      type: object
      required: [pick_number, for_pick, next_pick, source, runs, call, shortlist, still_there, conditional]
      properties:
        pick_number: { type: integer, description: the pick on the clock when the card was made }
        for_pick: { type: integer, description: the drafter's pick the call is for }
        next_pick: { type: integer, nullable: true, description: the turn the odds look to }
        source: { type: string, enum: [advisor, sim] }
        runs: { type: integer, description: the runs the odds are over, 0 for the closed form }
        call: { type: string, description: the player we would take }
        shortlist:
          type: array
          items: { $ref: "#/components/schemas/CardCandidate" }
        still_there:
          type: object
          description: >-
            player id to his chance of still being there at next_pick, or, on a conditional card, of reaching
            for_pick
          additionalProperties: { type: number, format: double }
        conditional: { type: boolean, description: a lobby card off your turn, the call if the board holds }
    ReportTeam:
      type: object
      required: [seat, points, rank, starters_filled, starters_total, bye_collisions, value_captured]
      properties:
        seat: { type: integer }
        points: { type: number, format: double, description: projected points from the starters }
        rank: { type: integer }
        starters_filled: { type: integer }
        starters_total: { type: integer }
        bye_collisions: { type: integer }
        value_captured: { type: number, format: double }
    ReportPick:
      type: object
      required: [pick, round, player_id, over_replacement, board_rank, board_gap, adp_gap, chip, still_there, could_wait, odds_source, made_by]
      properties:
        pick: { type: integer }
        round: { type: integer }
        player_id: { type: string }
        over_replacement: { type: number, format: double, nullable: true }
        board_rank:
          type: integer
          nullable: true
          description: his place on our board, the pool's order by points over replacement; null for a player with none (a kicker or a defense)
        board_gap:
          type: integer
          nullable: true
          description: >-
            Picks later against our board: the pick's place among the draft's picks of players our board
            ranks, less board_rank, so plus means he came later than our board places him. Kickers and
            defenses are counted on neither side, since our board ranks them by no points; null for one, and
            for a keeper.
        adp_gap:
          type: number
          format: double
          nullable: true
          description: >-
            Picks later against drafters, a tenth: the pick less his ADP as the report prints it (the ADP
            rounded once to a tenth, then subtracted), so plus means he came later than drafters take him.
            Null with no ADP and for a keeper.
        chip:
          type: string
          enum: [reach, steal, at_adp, none, kept]
          description: kept is a keeper at his seat and round, with no ADP gap and no hindsight
        still_there: { type: number, format: double, nullable: true, description: the chance he was there at your next turn, null at your last }
        could_wait: { type: boolean }
        odds_source: { type: string, description: "advisor or sim as recorded with the pick, or fallback_sim computed for the report" }
        made_by:
          type: string
          enum: [you, for_you, queue, clock]
          description: >-
            who made the pick: you, Pick for me or Finish the draft (for_you), a lobby seat's stand-in after you left
            (queue), or the stand-in when your clock ran out (clock). A pick you did not make carries no hindsight.
    ReportStarter:
      type: object
      required: [slot, player_id]
      properties:
        slot: { type: string }
        player_id: { type: string, nullable: true }
    ReportExposure:
      type: object
      required: [player_id, share]
      properties:
        player_id: { type: string }
        share: { type: number, format: double }
    ReportRuns:
      type: object
      required: [runs, points, median, middle_low, middle_high, top_share, top_finish, rank_counts, exposure]
      properties:
        runs: { type: integer }
        points:
          type: array
          description: your starting points in each run, ascending
          items: { type: number, format: double }
        median: { type: number, format: double }
        middle_low: { type: number, format: double }
        middle_high: { type: number, format: double }
        top_share: { type: number, format: double }
        top_finish: { type: integer, description: the rank top_share counts to }
        rank_counts:
          type: array
          description: runs finishing at each rank, first place first
          items: { type: integer }
        exposure:
          type: array
          description: who you end up with, by share of runs, most first
          items: { $ref: "#/components/schemas/ReportExposure" }
    MockReport:
      type: object
      required: [teams, rounds, slot, seed, settings, could_wait_from, standings, picks, starters, runs, board, computed_ms]
      properties:
        teams: { type: integer }
        rounds: { type: integer }
        slot: { type: integer }
        seed: { type: integer, format: int64 }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        could_wait_from: { type: number, format: double }
        standings:
          type: array
          description: every team, best first
          items: { $ref: "#/components/schemas/ReportTeam" }
        picks:
          type: array
          items: { $ref: "#/components/schemas/ReportPick" }
        starters:
          type: array
          items: { $ref: "#/components/schemas/ReportStarter" }
        runs: { $ref: "#/components/schemas/ReportRuns" }
        board:
          description: the board, holding only the players the report names
          allOf: [{ $ref: "#/components/schemas/RoomBoard" }]
        computed_ms: { type: integer, description: how long the report took to compute }
        share_code: { type: string, description: a solo draft's link code, absent for a lobby }

    CompanionHost:
      type: string
      enum: [sleeper, ffpc]
    CompanionCreate:
      type: object
      required: [host, draft, seat]
      properties:
        host: { $ref: "#/components/schemas/CompanionHost" }
        draft: { type: string, minLength: 1, maxLength: 300, description: the draft link as pasted, or its id }
        seat: { $ref: "#/components/schemas/CompanionSeat" }
        replay:
          type: boolean
          description: >-
            development only (COMPANION_REPLAY), replays the recorded completed draft one pick a second, whatever
            draft says
    CompanionSeat:
      type: object
      description: exactly one of slot and username
      properties:
        slot: { type: integer, nullable: true, minimum: 1, maximum: 32 }
        username: { type: string, nullable: true, maxLength: 40 }
    CompanionStatus:
      type: string
      enum: [pre_draft, drafting, paused, complete]
    CompanionSummary:
      type: object
      required: [id, host, host_draft_id, name, slot, host_username, status, replay, created_at]
      properties:
        id: { type: string, format: uuid }
        host: { $ref: "#/components/schemas/CompanionHost" }
        host_draft_id: { type: string }
        name: { type: string, description: "the draft's name on the host, empty when it has none" }
        slot: { type: integer }
        host_username: { type: string, nullable: true, description: the Sleeper username the seat was found by }
        status: { $ref: "#/components/schemas/CompanionStatus" }
        replay: { type: boolean }
        created_at: { type: string, format: date-time }
    CompanionPick:
      type: object
      required: [pick, round, seat, player_id, host_player_id, name, position, team, keeper]
      properties:
        pick: { type: integer }
        round: { type: integer }
        seat: { type: integer, description: the draft slot that made it }
        player_id: { type: string, nullable: true, description: our board's player, null when we could not place him }
        host_player_id: { type: string }
        name: { type: string, description: the host's name for him }
        position: { type: string }
        team: { type: string }
        keeper: { type: boolean }
    OutcomeRange:
      type: object
      required: [floor, median, ceiling]
      properties:
        floor: { type: number, format: double }
        median: { type: number, format: double }
        ceiling: { type: number, format: double }
    Companion:
      type: object
      required:
        [id, host, host_draft_id, replay, name, status, teams, rounds, slot, seat_names, settings, basis, pick_count, total_picks,
         on_clock, your_turn, your_next_pick, picks_until_turn, since, picks, unplaced, placed_by_name, lost_at, traded, card, board,
         ranges, host_stale_seconds, created_at]
      properties:
        id: { type: string, format: uuid }
        host: { $ref: "#/components/schemas/CompanionHost" }
        host_draft_id: { type: string }
        replay: { type: boolean }
        name: { type: string, description: the draft's name on the host, may be empty }
        status: { $ref: "#/components/schemas/CompanionStatus" }
        teams: { type: integer }
        rounds: { type: integer }
        slot: { type: integer, description: the drafter's draft slot }
        seat_names:
          type: array
          description: >-
            each slot's name in the host league (its members' display names), slot 1 first; empty for a mock draft,
            and '' for a slot with no member
          items: { type: string }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        basis: { type: string, description: the board our call reads, in a sentence }
        pick_count: { type: integer, description: picks the host has made }
        total_picks: { type: integer }
        on_clock: { type: integer, nullable: true, description: the slot on the clock, null before the draft and after it }
        your_turn: { type: boolean }
        your_next_pick: { type: integer, nullable: true, description: the drafter's next overall pick, null after the last }
        picks_until_turn: { type: integer, nullable: true, description: picks before the drafter's next, 0 on the clock }
        since: { type: integer, description: the pick count the picks follow }
        picks:
          type: array
          description: every pick after since, in order
          items: { $ref: "#/components/schemas/CompanionPick" }
        unplaced: { type: integer, description: picks so far we could not place on our board; they take nobody from it }
        placed_by_name:
          type: array
          description: Sleeper picks placed by name, position and team because our players do not carry their Sleeper id yet, each by both names
          items: { $ref: "#/components/schemas/NamedPick" }
        lost_at:
          type: integer
          nullable: true
          description: the pick our draft could not follow (out of order, or no roster spot takes him); no call after it
        traded: { type: integer, description: picks made by a team other than the slot's own, a traded pick }
        card:
          nullable: true
          description: >-
            our call at the drafter's turn, or between turns the conditional call (conditional true): the player to
            take if the board holds to your_next_pick. The why is on the call only, or on every shortlist row with
            full_reasoning.
          allOf: [{ $ref: "#/components/schemas/RoomCard" }]
        board:
          nullable: true
          description: the board valued for this league, sent only when since is 0
          allOf: [{ $ref: "#/components/schemas/RoomBoard" }]
        ranges:
          type: object
          nullable: true
          description: floor, median and ceiling for each shortlist player, with range_of_outcomes only
          additionalProperties: { $ref: "#/components/schemas/OutcomeRange" }
        host_stale_seconds:
          type: integer
          nullable: true
          description: how old the picks are when the host did not answer the last read, null when fresh
        created_at: { type: string, format: date-time }

    LobbyFormat:
      type: string
      enum: [12_ppr, 12_half_superflex, 10_ppr]
    LobbyFilling:
      type: object
      required: [format, teams, clock_seconds, scoring, lineup, filling]
      properties:
        format: { $ref: "#/components/schemas/LobbyFormat" }
        teams: { type: integer }
        clock_seconds: { type: integer }
        scoring: { $ref: "#/components/schemas/ScoringPreset" }
        lineup: { $ref: "#/components/schemas/Lineup" }
        filling: { type: integer, description: drafters in the room filling now, 0 when none is }
    LobbyJoin:
      type: object
      required: [format]
      properties:
        format: { $ref: "#/components/schemas/LobbyFormat" }
    LobbySeat:
      type: object
      required: [room_id, seat, socket_url]
      properties:
        room_id: { type: string, format: uuid }
        seat: { type: integer }
        socket_url: { type: string, description: the room service's WebSocket for this room }
    LobbySeatView:
      type: object
      required: [seat, handle, kind]
      properties:
        seat: { type: integer }
        handle: { type: string, nullable: true }
        kind: { type: string, enum: [drafter, bot, left, open] }
    LobbyRoom:
      type: object
      required: [id, format, status, teams, rounds, clock_seconds, fill_deadline, started_at, solo_pace, you, settings, seats, board, socket_url]
      properties:
        id: { type: string, format: uuid }
        format: { $ref: "#/components/schemas/LobbyFormat" }
        status: { type: string, enum: [filling, drafting, complete, abandoned] }
        teams: { type: integer }
        rounds: { type: integer }
        clock_seconds: { type: integer }
        fill_deadline: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        solo_pace: { type: boolean, description: fewer than three people started it, so the bots pick at once }
        you: { type: integer, description: your seat }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        seats:
          type: array
          items: { $ref: "#/components/schemas/LobbySeatView" }
        board: { $ref: "#/components/schemas/RoomBoard" }
        socket_url: { type: string }

    RoomHello:
      type: object
      required: [type, last_seq]
      properties:
        type: { type: string, enum: [hello] }
        last_seq: { type: integer, format: int64, minimum: 0 }
    RoomWelcome:
      type: object
      required: [type, room_id, seq, actions, now]
      properties:
        type: { type: string, enum: [welcome] }
        room_id: { type: string, format: uuid }
        seq: { type: integer, format: int64, description: the room's latest seq }
        now: { type: string, format: date-time, description: the server's clock, so the client's clock reads the same }
        actions:
          type: array
          items: { $ref: "#/components/schemas/RoomAction" }
    RoomUpdate:
      type: object
      required: [type, seq, actions]
      properties:
        type: { type: string, enum: [update] }
        seq: { type: integer, format: int64 }
        actions:
          type: array
          items: { $ref: "#/components/schemas/RoomAction" }
    RoomCommand:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [pick, queue, leave] }
        player_id: { type: string, maxLength: 64, description: pick }
        pick: { type: integer, description: pick, the overall pick the drafter saw }
        player_ids:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 64 }
          description: queue, best first
    RoomAction:
      type: object
      description: >-
        One entry of the room's log. kind is SEAT_JOINED (payload handle), SEAT_LEFT (payload freed when a filling room gave the seat up, otherwise its stand-in drafts), SEAT_RETURNED, ROOM_STARTED
        (payload bots, the seats bots took, and solo_pace), ROOM_COMPLETE, ROOM_ABANDONED (payload reason, nobody_here when the fill deadline found no drafter connected or everyone_left), or an engine action (START_DRAFT,
        SET_QUEUE, MAKE_PICK, TIMER_EXPIRE) whose payload carries the engine action as action and, for a pick,
        pick (RoomPick with by drafter, queue, clock or bot) and deadline, when the next turn's clock runs out. A
        socket receives only its own seat's SET_QUEUE payload; another seat's arrives empty, with its seq and kind.
      required: [seq, kind, seat, payload, at]
      properties:
        seq: { type: integer, format: int64 }
        kind: { type: string }
        seat: { type: integer, nullable: true }
        payload: { type: object }
        at: { type: string, format: date-time }
    RoomError:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string, enum: [error] }
        code: { type: string }
        message: { type: string }
    LeagueHost:
      type: string
      description: the host a league runs on, named as a mechanism
      enum: [sleeper, mfl, ffpc, yahoo, espn]
    AttachPreviewInput:
      type: object
      required: [link]
      properties:
        host: { $ref: "#/components/schemas/LeagueHost" }
        link: { type: string, minLength: 1, maxLength: 300, description: the league link as pasted, or a Sleeper league id }
    AttachInput:
      type: object
      required: [link, me]
      properties:
        host: { $ref: "#/components/schemas/LeagueHost" }
        link: { type: string, minLength: 1, maxLength: 300, description: the league link as pasted, or a Sleeper league id }
        me: { $ref: "#/components/schemas/AttachSeat" }
    AttachSeat:
      type: object
      description: exactly one of username (Sleeper only) and roster_id
      properties:
        username: { type: string, nullable: true, maxLength: 40 }
        roster_id: { type: integer, nullable: true, minimum: 1, maximum: 32 }
    AttachPreview:
      type: object
      required: [host, host_league_id, season, name, teams, seat_by_username]
      properties:
        host: { $ref: "#/components/schemas/LeagueHost" }
        host_league_id: { type: string }
        season: { type: integer, description: the league's season, 0 when the host does not say }
        name: { type: string }
        teams: { type: array, items: { $ref: "#/components/schemas/LeagueTeam" } }
        seat_by_username: { type: boolean, description: whether the host finds a seat by username (Sleeper does) }
    AttachedLeague:
      type: object
      required: [id, host, host_league_id, season, name, roster_id, team_name, standing, attached_at, last_read_at, phase, phase_basis, draft_at, playoff_start_week, waivers_open]
      properties:
        id: { type: string, format: uuid }
        host: { $ref: "#/components/schemas/LeagueHost" }
        host_league_id: { type: string }
        season: { type: integer }
        name: { type: string, description: the league's name at its last read }
        roster_id: { type: integer }
        team_name: { type: string, description: "the drafter's team at the last read, empty when unread" }
        standing:
          allOf: [{ $ref: "#/components/schemas/LeagueStanding" }]
          nullable: true
          description: the drafter's record and place at the last read, null when unread
        attached_at: { type: string, format: date-time }
        last_read_at: { type: string, format: date-time, nullable: true, description: "the league's last host read for this account, null when never read" }
        phase: { $ref: "#/components/schemas/LeaguePhase" }
        phase_basis: { type: string, description: "one sentence naming the fact the phase came from, in the site's words" }
        draft_at: { type: string, format: date-time, nullable: true, description: "the host's draft time, null when the host does not say" }
        playoff_start_week:
          type: integer
          nullable: true
          description: the league's first playoff week as the host states it, null when the host does not say
        waivers_open:
          type: boolean
          description: >-
            the host still runs waivers this week: false in and after the playoffs where the host closes them, and once
            the season is over, else true
    LeagueStanding:
      type: object
      required: [wins, losses, ties, place, teams]
      properties:
        wins: { type: integer }
        losses: { type: integer }
        ties: { type: integer }
        place: { type: integer, description: "1-based, by record then points for, as the league page's strip orders it" }
        teams: { type: integer }
    LeagueTeam:
      type: object
      required: [roster_id, name, owner, wins, losses, ties, points_for, points_against, streak, waiver_order, waiver_budget_left, avatar]
      properties:
        roster_id: { type: integer }
        name: { type: string, description: the team's name, or its owner's when it has none }
        owner: { type: string, description: the owner's display name, empty where the host shows none }
        wins: { type: integer }
        losses: { type: integer }
        ties: { type: integer }
        points_for: { type: number, format: double }
        points_against: { type: number, format: double, nullable: true, description: null where the host does not say }
        streak:
          type: string
          nullable: true
          pattern: "^[WL][1-9][0-9]?$"
          description: the current run of wins or losses ("W3", "L2"), null where the host does not say
        waiver_order: { type: integer, nullable: true, description: the team's place in the waiver order, null where the host does not say }
        waiver_budget_left:
          type: integer
          nullable: true
          description: the waiver budget the team has left, null in a league without a budget or where the host does not say
        avatar:
          type: string
          nullable: true
          description: the host's image for the team or its owner, null where the host gives none we show
    LeaguePlayer:
      type: object
      required: [host_id, board_id, name, position, team, injured_reserve]
      properties:
        host_id: { type: string }
        board_id: { type: string, nullable: true, description: the player's id on our board, null when unplaced }
        name: { type: string }
        position: { type: string }
        team: { type: string, description: "his club's code. On a row built from our board (the order, the card, a pickup) \"FA\" for a free agent (no club: no game, no bye, Lane 123); on a league roster row the platform's own" }
        injured_reserve:
          type: boolean
          description: >-
            the host marks him injured reserve beside his name (FFPC's IR designation); a player on a roster's IR
            slot is said by the slot
    RosterSpot:
      type: object
      required: [player, slot]
      properties:
        player: { $ref: "#/components/schemas/LeaguePlayer" }
        slot: { type: string, enum: [starter, bench, reserve, taxi] }
    MatchupStarter:
      type: object
      required: [player, points]
      properties:
        player: { $ref: "#/components/schemas/LeaguePlayer" }
        points:
          type: number
          format: double
          nullable: true
          description: >-
            his points so far this week; null where the side's player_points is false or the platform's read left
            him out (an ESPN starter kicked off and missing from its period roster)
    MatchupSide:
      type: object
      required: [roster_id, points, points_read, player_points, team_total, starters]
      properties:
        roster_id: { type: integer }
        points: { type: number, format: double }
        player_points: { type: boolean, description: "as MatchupBoxSide's: the platform gives each player's points" }
        team_total: { type: boolean, description: "as MatchupBoxSide's: the platform sends the side's own total" }
        points_read:
          type: boolean
          description: >-
            the host's score for this side was read; false when it could not be (an FFPC all-play week whose
            scoring page did not answer), and points is then 0 and says nothing
        starters: { type: array, items: { $ref: "#/components/schemas/MatchupStarter" } }
    LeagueMatchup:
      type: object
      required: [week, mine, opponent]
      properties:
        week: { type: integer }
        mine: { $ref: "#/components/schemas/MatchupSide" }
        opponent: { allOf: [{ $ref: "#/components/schemas/MatchupSide" }], nullable: true }
    OrderBasis:
      type: string
      enum: [preseason, rest_of_season]
      description: >-
        which order ranks the players: our preseason board, or the rest-of-season order (from week 7, once the API
        reads it)
    # The published run's files (Lane 185), mirroring web/src/lib/run/schema.ts field for field: the run's own
    # camelCase names and nullability, a field the run may leave out not required. web/src/lib/run/api-parity.test.ts
    # holds each schema to its zod schema and parses every /run example with it.
    RunPosition:
      type: string
      enum: [QB, RB, WR, TE, K, DST]
    RunMarketPosition:
      type: string
      description: a kicker or a defense, the positions every board carries in the drafters' order
      enum: [K, DST]
    RunWindow:
      type: object
      description: the first and last moments a feed's numbers were captured, read from the data's own stamps
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    RunFormat:
      type: object
      required: [id, label, unit, teams, basis]
      properties:
        id: { type: string, description: "the format id: ppr-12" }
        label: { type: string, description: "as a chip prints it: PPR, Half PPR" }
        unit: { type: string, description: "what the points are in, as a cell label prints it: PPR pts" }
        teams: { type: integer, minimum: 2 }
        basis:
          type: array
          items: { type: string }
          description: the basis of every number on this format's board, phrase by phrase, as the board's lead prints them
        rosFromWeek:
          type: integer
          minimum: 1
          description: in season, the first week the board ranks the rest of the season from; absent preseason
        rosFromWeekPartial:
          type: boolean
          description: >-
            in season, set while a game of rosFromWeek had kicked off at the run: its clubs count from their next week.
            Absent preseason and on a run older than the field
        rosThroughWeek:
          type: integer
          minimum: 0
          description: in season, the last week whose games are in the season figures
        refreshedAt:
          type: string
          format: date-time
          description: in season, when the run refreshed the rest-of-season board
        marketOrder:
          type: string
          description: the ADP source id whose draft order the board's kickers and defenses take
    RunManifest:
      type: object
      description: the run's manifest.json, the members the site's reader names less the sources block (provenance)
      required: [runId, runAt, season, implementation, standIn, formats, players]
      properties:
        runId: { type: string, description: "the run's id: 2026-10-12T05" }
        runAt: { type: string, format: date-time, description: when the run finished, the date every page prints }
        season: { type: integer }
        implementation: { type: string, description: the code that produced the run }
        standIn: { type: boolean, description: true for the stand-in run }
        formats:
          type: array
          items: { $ref: "#/components/schemas/RunFormat" }
          description: every format the run carries, the default first
        players: { type: integer, minimum: 1, description: every player with a page, as the index lists them }
        reach:
          allOf: [{ $ref: "#/components/schemas/RunReach" }]
          description: >-
            the run's season reach, written by the run (Lane 205); absent on a run from before it
    RunManifestAnswer:
      type: object
      required: [run_id, manifest]
      properties:
        run_id: { type: string, description: the published run every /run answer is read from }
        manifest: { $ref: "#/components/schemas/RunManifest" }
    RunReach:
      type: object
      description: >-
        how far the run's season figures reach, as the site's bases say it (web/src/lib/run/reach.ts runReach), written
        by the run: the nightly's schema gate counts it through the site's own reader over every own page of the run
        (never a held page's copy), his club's game by his log, never a game final by its status alone
      required: [format, scoring, through, complete, partial]
      properties:
        format: { type: string, description: "the format every season block is scored in: ppr-12" }
        scoring: { type: string, description: "that format as a chip prints it: PPR" }
        through:
          type: string
          description: >-
            what a basis's "through week" says: "through week 5", "through week 5 and week 6's Thursday game"; empty
            before week 1's games
        complete: { type: integer, minimum: 0, description: the last week whose games are all in, 0 before week 1's }
        partial:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/RunReachPartial" }]
          description: the week after it with some counted games in, null with none
    RunReachPartial:
      type: object
      required: [week, days]
      properties:
        week: { type: integer, minimum: 1 }
        days:
          type: array
          items: { type: string }
          description: >-
            the days of its counted games in kickoff order on the Eastern clock ("Thursday"), empty when a counted
            club's game is not on the schedule ("part of week 6")
    RunBoardRow:
      type: object
      description: a ranked row of boards/<format>.json, ranked by our projection
      required:
        [id, slug, name, position, positionRank, team, headshot, ourRank, vorRound, adp, projected, vor, expectedGames, floor, median, ceiling, tier]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        position: { $ref: "#/components/schemas/RunPosition" }
        positionRank: { type: integer, minimum: 1 }
        team: { type: string }
        headshot: { type: string }
        orderBasis:
          type: string
          enum: [projection]
          description: absent on a run older than the kickers' and defenses' rows
        ourRank: { type: integer, minimum: 1, description: his place on this board, by points over replacement }
        vorRound: { type: integer, minimum: 1, description: the round of this format's draft his place falls in }
        adp: { type: number, nullable: true, description: "the blended ADP of this format's sources, null when none has him" }
        gap:
          type: number
          nullable: true
          description: >-
            the drafters' ADP less our rank, to a tenth: plus when drafters take him later than we rank him; null without
            an ADP, absent on a run older than the column
        projected: { type: number }
        vor: { type: number }
        expectedGames: { type: number, minimum: 0 }
        floor: { type: number, nullable: true, description: null in season }
        median: { type: number, nullable: true, description: null in season }
        ceiling: { type: number, nullable: true, description: null in season }
        tier: { type: integer, minimum: 1, description: his tier within his position, 1 the top }
        tierDrop:
          type: number
          nullable: true
          description: >-
            his tier's drop to the next tier at his position, to a tenth: the tier's last player's projected points less
            the next tier's first; null in his position's last tier, absent on a run older than the column
        preseasonRank:
          type: integer
          minimum: 1
          nullable: true
          description: in season, where the preseason board ranked him; null when it did not
        preseasonPoints: { type: number, nullable: true, description: "in season, the preseason board's points for the full season" }
        preseasonPerGame: { type: number, nullable: true, description: in season, the preseason pace a game his figure starts from }
        preseasonShare:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: in season, the share of his rate a game that pace carries, a whole percent
        blendedPerGame: { type: number, nullable: true, description: in season, his season blended with his usage a game }
        ratePerGame: { type: number, nullable: true, description: "in season, the model's rate a game he plays" }
        restFromWeek:
          type: integer
          minimum: 1
          nullable: true
          description: in season, the week his rest of season starts from, null with no game left
        gamePoints:
          type: number
          nullable: true
          description: >-
            in season, his points for one more game of his club; null preseason, absent on a run older than the
            field
    RunMarketRow:
      type: object
      description: >-
        a kicker or a defense on a board, after the ranked rows in the drafters' order, with no projected points and no
        tier: every figure of ours is always null
      required:
        [id, slug, name, position, positionRank, team, headshot, orderBasis, ourRank, adp, vorRound, projected, vor, expectedGames, floor, median, ceiling, tier]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        position: { $ref: "#/components/schemas/RunMarketPosition" }
        positionRank: { type: integer, minimum: 1, description: his place in the drafters' order at his position }
        team: { type: string }
        headshot: { type: string, nullable: true, description: "null for a defense (its face is its club's mark)" }
        orderBasis: { type: string, enum: [market] }
        ourRank: { type: integer, minimum: 1, description: his place on the whole board, after every ranked row }
        adp: { type: number, description: "this format's ADP" }
        gap: { type: number, nullable: true, description: always null when sent }
        vorRound: { type: integer, nullable: true, description: always null }
        projected: { type: number, nullable: true, description: always null }
        vor: { type: number, nullable: true, description: always null }
        expectedGames: { type: number, nullable: true, description: always null }
        floor: { type: number, nullable: true, description: always null }
        median: { type: number, nullable: true, description: always null }
        ceiling: { type: number, nullable: true, description: always null }
        tier: { type: integer, nullable: true, description: always null }
        tierDrop: { type: number, nullable: true, description: always null when sent }
    RunBoardAnswer:
      type: object
      required: [run_id, format, rows, market]
      properties:
        run_id: { type: string }
        format: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/RunBoardRow" }
          description: the ranked rows, in the file's order
        market:
          type: array
          items: { $ref: "#/components/schemas/RunMarketRow" }
          description: the kickers and defenses, in the file's order
    RunIndexSeason:
      type: object
      required: [games, pointsPerGame]
      properties:
        games: { type: integer, minimum: 0 }
        pointsPerGame: { type: number, nullable: true, description: null exactly when he has no game }
    RunIndexEntry:
      type: object
      required: [id, slug, name, team, position, headshot, season]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        team: { type: string }
        position: { $ref: "#/components/schemas/RunPosition" }
        headshot: { type: string }
        orderBasis:
          type: string
          enum: [projection]
          description: absent on a run older than the kickers' and defenses' entries
        season: { $ref: "#/components/schemas/RunIndexSeason" }
    RunMarketEntry:
      type: object
      required: [id, slug, name, team, position, headshot, orderBasis]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        team: { type: string }
        position: { $ref: "#/components/schemas/RunMarketPosition" }
        headshot: { type: string, nullable: true }
        orderBasis: { type: string, enum: [market] }
    RunIndexAnswer:
      type: object
      required: [run_id, pages, market]
      properties:
        run_id: { type: string }
        pages:
          type: array
          items: { $ref: "#/components/schemas/RunIndexEntry" }
          description: every player with a page, in the file's order
        market:
          type: array
          items: { $ref: "#/components/schemas/RunMarketEntry" }
          description: the kickers and defenses, in the file's order
    RunAdpSource:
      type: object
      required: [id, drafts, formats, window]
      properties:
        id: { type: string }
        drafts: { type: string, description: "the drafts behind the numbers, in a drafter's words: PPR drafts" }
        formats:
          type: array
          items: { type: string }
          description: the formats whose boards blend this source
        window: { $ref: "#/components/schemas/RunWindow" }
    RunAdp:
      type: object
      required: [sources, players]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/RunAdpSource" }
        players:
          type: object
          description: each player's ADP per source id; a missing key is a source that does not have him
          additionalProperties:
            type: object
            additionalProperties: { type: number, format: double }
    RunAdpAnswer:
      type: object
      required: [run_id, adp]
      properties:
        run_id: { type: string }
        adp: { $ref: "#/components/schemas/RunAdp" }
    RunPlayerStatus:
      type: object
      required: [status, seasonLong, since]
      properties:
        status: { $ref: "#/components/schemas/DesignationStatus" }
        seasonLong: { type: boolean }
        since:
          type: string
          format: date-time
          nullable: true
          description: the first capture of his unbroken run under a season-long status; null for a week's designation
        returning:
          type: string
          format: date
          description: the day he is due back from a season-long list, absent without one
    RunDesignations:
      type: object
      description: the run's designations.json, less its source (provenance)
      required: [readAt, checkedAt, players]
      properties:
        readAt: { type: string, format: date-time, description: "the capture's stamp: when the list last changed" }
        checkedAt:
          type: string
          format: date-time
          nullable: true
          description: the capture job's last successful check of the list, null when the store records none
        players:
          type: object
          description: by player id, every ranked player the capture lists
          additionalProperties: { $ref: "#/components/schemas/RunPlayerStatus" }
    RunDesignationsAnswer:
      type: object
      required: [run_id, designations]
      properties:
        run_id: { type: string }
        designations:
          nullable: true
          description: null when the run carries no capture
          allOf: [{ $ref: "#/components/schemas/RunDesignations" }]
    # A player's file (players/<id>.json, Lane 188): his numbers in every format whose board ranks him, the capsule,
    # the week-ahead read, his season so far and his earlier seasons, as web/src/lib/run/schema.ts and season.ts name them.
    RunPlayerFormat:
      type: object
      description: one format's numbers for him, his board row without the identity
      required: [positionRank, ourRank, vorRound, adp, projected, vor, expectedGames, floor, median, ceiling, tier]
      properties:
        positionRank: { type: integer, minimum: 1 }
        ourRank: { type: integer, minimum: 1, description: his place on this format's board, by points over replacement }
        vorRound: { type: integer, minimum: 1, description: the round of this format's draft his place falls in }
        adp: { type: number, nullable: true, description: "the blended ADP of this format's sources, null when none has him" }
        gap: { type: number, nullable: true, description: "the drafters' ADP less our rank, to a tenth; absent on a run older than the column" }
        projected: { type: number }
        vor: { type: number }
        expectedGames: { type: number, minimum: 0 }
        floor: { type: number, nullable: true, description: null in season }
        median: { type: number, nullable: true, description: null in season }
        ceiling: { type: number, nullable: true, description: null in season }
        tier: { type: integer, minimum: 1, description: his tier within his position, 1 the top }
        tierDrop: { type: number, nullable: true, description: "his tier's drop to the next tier at his position; absent on a run older than the column" }
        preseasonRank: { type: integer, minimum: 1, nullable: true, description: in season, where the preseason board ranked him }
        preseasonPoints: { type: number, nullable: true, description: "in season, the preseason board's points for the full season" }
        preseasonPerGame: { type: number, nullable: true, description: in season, the preseason pace a game his figure starts from }
        preseasonShare: { type: integer, minimum: 0, maximum: 100, nullable: true, description: in season, the share of his rate a game that pace carries }
        blendedPerGame: { type: number, nullable: true, description: in season, his season blended with his usage a game }
        ratePerGame: { type: number, nullable: true, description: "in season, the model's rate a game he plays" }
        restFromWeek: { type: integer, minimum: 1, nullable: true, description: in season, the week his rest of season starts from }
        gamePoints: { type: number, nullable: true, description: in season, his points for one more game of his club }
    RunPullFigure:
      type: object
      required: [figure, caption]
      properties:
        figure: { type: string, description: "a number exactly as the capsule writes it" }
        caption: { type: string, description: what it counts, in a few words }
    RunCapsule:
      type: object
      description: "the writer's read of him, as written: paragraphs apart by a blank line, each pull figure in the prose"
      required: [body, pulls]
      properties:
        body: { type: string }
        pulls:
          type: array
          items: { $ref: "#/components/schemas/RunPullFigure" }
        writtenAt: { type: string, format: date-time, description: "when the writer wrote it; absent on a run from before" }
    RunWeekRead:
      type: object
      description: >-
        the week-ahead read: its text, null when his status changed since it was written (the caption says when the
        new one is due), the call, the status it was written against
      required: [week, body, caption, status, call, writtenAt, factsAt]
      properties:
        week: { type: integer, minimum: 1 }
        body: { type: string, nullable: true }
        caption: { type: string, description: "Written Fri 9:00 pm Central, for week 6" }
        status: { type: string, nullable: true }
        call: { type: string, nullable: true, enum: [start, sit, hold, none], description: "the writer's call, null when withheld" }
        writtenAt: { type: string, format: date-time }
        factsAt: { type: string, format: date-time, nullable: true, description: the newest stamp of the facts it was written from }
        projection: { type: number, nullable: true, description: "the published projection it quotes, in PPR; absent on a run from before" }
        movedCaption: { type: string, description: "the words the page shows once the live read prints another; absent on a run from before" }
    RunReadsDue:
      type: object
      description: the coming week and the night its reads are written in one pass, when the week rolls over
      required: [week, night]
      properties:
        week: { type: integer, minimum: 1 }
        night: { type: string, enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday], description: "the Central night of the nightly that writes them" }
    RunStatLine:
      type: object
      description: a stat line in the research store's names; a field is null when the records do not carry it
      required:
        [pass_attempts, completions, passing_yards, passing_touchdowns, interceptions, carries, rushing_yards, rushing_touchdowns, targets, receptions, receiving_yards, receiving_touchdowns, fumbles_lost, field_goals_made, extra_points_made, sacks, defensive_interceptions, defensive_touchdowns, snapShare, points]
      properties:
        pass_attempts: { type: number, nullable: true }
        completions: { type: number, nullable: true }
        passing_yards: { type: number, nullable: true }
        passing_touchdowns: { type: number, nullable: true }
        interceptions: { type: number, nullable: true }
        carries: { type: number, nullable: true }
        rushing_yards: { type: number, nullable: true }
        rushing_touchdowns: { type: number, nullable: true }
        targets: { type: number, nullable: true }
        receptions: { type: number, nullable: true }
        receiving_yards: { type: number, nullable: true }
        receiving_touchdowns: { type: number, nullable: true }
        fumbles_lost: { type: number, nullable: true }
        field_goals_made: { type: number, nullable: true }
        extra_points_made: { type: number, nullable: true }
        sacks: { type: number, nullable: true }
        defensive_interceptions: { type: number, nullable: true }
        defensive_touchdowns: { type: number, nullable: true }
        snapShare: { type: number, minimum: 0, maximum: 1, nullable: true, description: "his share of his team's offensive snaps" }
        points: { type: number, nullable: true, description: "the line scored in the block's format" }
    RunGameLogRow:
      type: object
      description: one week of his log, its stat line beside where the week stands for him
      required:
        [pass_attempts, completions, passing_yards, passing_touchdowns, interceptions, carries, rushing_yards, rushing_touchdowns, targets, receptions, receiving_yards, receiving_touchdowns, fumbles_lost, field_goals_made, extra_points_made, sacks, defensive_interceptions, defensive_touchdowns, snapShare, points, week, opponent, home, status]
      properties:
        pass_attempts: { type: number, nullable: true }
        completions: { type: number, nullable: true }
        passing_yards: { type: number, nullable: true }
        passing_touchdowns: { type: number, nullable: true }
        interceptions: { type: number, nullable: true }
        carries: { type: number, nullable: true }
        rushing_yards: { type: number, nullable: true }
        rushing_touchdowns: { type: number, nullable: true }
        targets: { type: number, nullable: true }
        receptions: { type: number, nullable: true }
        receiving_yards: { type: number, nullable: true }
        receiving_touchdowns: { type: number, nullable: true }
        fumbles_lost: { type: number, nullable: true }
        field_goals_made: { type: number, nullable: true }
        extra_points_made: { type: number, nullable: true }
        sacks: { type: number, nullable: true }
        defensive_interceptions: { type: number, nullable: true }
        defensive_touchdowns: { type: number, nullable: true }
        snapShare: { type: number, minimum: 0, maximum: 1, nullable: true }
        points: { type: number, nullable: true }
        week: { type: integer, minimum: 1 }
        opponent: { type: string, nullable: true, description: "the club he plays; null on his bye, and where the run cannot say whose he was" }
        home: { type: boolean, nullable: true, description: true at home, false away, null where the opponent is }
        status: { $ref: "#/components/schemas/RunGameStatus" }
        unnamedGame: { type: boolean, description: "always true when sent: an inactive week he played in a game the run cannot name" }
    RunGameStatus:
      type: string
      description: where a week stands for him
      enum: [played, inactive, bye, upcoming]
    RunSeason:
      type: object
      description: his season so far, scored in one format, a row for every week of the regular season
      required: [season, format, weeks, through, games, pointsPerGame, totals, log]
      properties:
        season: { type: integer }
        format: { type: string, description: the format every point in the block is scored in }
        weeks: { type: integer, minimum: 1, description: "the regular season's length; the log has this many rows" }
        through: { type: integer, minimum: 0, description: the last week whose games are all final with their lines in }
        games: { type: integer, minimum: 0 }
        pointsPerGame: { type: number, nullable: true, description: null before his first game }
        totals: { $ref: "#/components/schemas/RunStatLine" }
        log:
          type: array
          items: { $ref: "#/components/schemas/RunGameLogRow" }
    RunPriorSeason:
      type: object
      description: a season before this one, its regular season summed in the same format
      required: [season, games, pointsPerGame, totals]
      properties:
        season: { type: integer }
        games: { type: integer, minimum: 1 }
        pointsPerGame: { type: number, nullable: true }
        totals: { $ref: "#/components/schemas/RunStatLine" }
    RunLastGameClub:
      type: object
      description: the club his newest game line was for and its week, when it is not his club
      required: [club, week]
      properties:
        club: { type: string }
        week: { type: integer, minimum: 1 }
        specialTeams: { type: boolean, description: "always true when sent: that week he was on the field for special teams alone" }
    RunPlayer:
      type: object
      description: the run's players/<id>.json, as written
      required: [id, slug, name, position, team, headshot, formats, capsule, season]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        position: { $ref: "#/components/schemas/RunPosition" }
        team: { type: string }
        headshot: { type: string }
        formats:
          type: object
          description: keyed by format id, every format the run carries that ranks him
          additionalProperties: { $ref: "#/components/schemas/RunPlayerFormat" }
        capsule:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/RunCapsule" }]
        weekRead:
          nullable: true
          description: "absent on a run from before the nightly wrote it, null when the writer did not write for the week ahead"
          allOf: [{ $ref: "#/components/schemas/RunWeekRead" }]
        weekReadsDue:
          nullable: true
          description: "the night the coming week's reads are written, while they are not and no read is served; null otherwise, absent on a run from before"
          allOf: [{ $ref: "#/components/schemas/RunReadsDue" }]
        season: { $ref: "#/components/schemas/RunSeason" }
        priorSeasons:
          type: array
          description: his earlier seasons, newest first; absent on a run from before
          items: { $ref: "#/components/schemas/RunPriorSeason" }
        lastGameClub:
          nullable: true
          description: "null when his newest line was for his club; absent on a run from before"
          allOf: [{ $ref: "#/components/schemas/RunLastGameClub" }]
    RunPlayerAnswer:
      type: object
      required: [run_id, player]
      properties:
        run_id: { type: string }
        player: { $ref: "#/components/schemas/RunPlayer" }
    # The pages the nightly's schema gate held back (held.json, Lane 136).
    RunHeldCopy:
      type: object
      description: the earlier run his copy is from, and when that run was written
      required: [runId, runAt]
      properties:
        runId: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}(-[a-z0-9-]+)?$", description: "the run id: 2026-10-20T12-ros" }
        runAt: { type: string, format: date-time }
    RunHeldPage:
      type: object
      description: a held page, less what the reader said of it (the run's report)
      required: [id, copy]
      properties:
        id: { type: string }
        copy:
          nullable: true
          description: "null when no earlier run had a page of his: his page is then his board rows' figures alone"
          allOf: [{ $ref: "#/components/schemas/RunHeldCopy" }]
    RunHeld:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items: { $ref: "#/components/schemas/RunHeldPage" }
    RunHeldAnswer:
      type: object
      required: [run_id, held]
      properties:
        run_id: { type: string }
        held:
          nullable: true
          description: null when the run held no page
          allOf: [{ $ref: "#/components/schemas/RunHeld" }]
    # The record (record.json, Lane 188): our orders graded against the season's games.
    RunScore:
      type: object
      description: how well one order matched the finish
      required: [graded, agreement, placesOff, starters, startersOf]
      properties:
        graded: { type: integer, minimum: 0, description: players this order had an opinion about, among those graded }
        agreement: { type: number, minimum: -1, maximum: 1, nullable: true, description: rank agreement with the finish, null when the sample cannot support one }
        placesOff: { type: number, minimum: 0, nullable: true, description: the typical miss in places, null with no sample }
        starters: { type: integer, minimum: 0, description: "the week's top players at each position this order also put there" }
        startersOf: { type: integer, minimum: 0 }
    RunRecordPosition:
      type: string
      description: a position, or All
      enum: [All, QB, RB, WR, TE, K, DST]
    RunRecordLine:
      type: object
      required: [position, ours, adp, published, oursOnPublished]
      properties:
        position: { $ref: "#/components/schemas/RunRecordPosition" }
        ours: { $ref: "#/components/schemas/RunScore" }
        adp:
          nullable: true
          description: ADP on the same players; null on the weekly record
          allOf: [{ $ref: "#/components/schemas/RunScore" }]
        published:
          nullable: true
          description: "the week's published projection on the same players, null before the freeze kept it"
          allOf: [{ $ref: "#/components/schemas/RunScore" }]
        oursOnPublished:
          nullable: true
          description: the season to date only, ours over the weeks that graded the published projection
          allOf: [{ $ref: "#/components/schemas/RunScore" }]
        espn:
          nullable: true
          description: "ESPN's weekly projection on the same players; absent or null before it was kept"
          allOf: [{ $ref: "#/components/schemas/RunScore" }]
        oursOnEspn:
          nullable: true
          description: "the season to date only, ours over the weeks that graded ESPN's projection; absent or null before"
          allOf: [{ $ref: "#/components/schemas/RunScore" }]
    RunPlacedPlayer:
      type: object
      description: "one graded player of a week: each order's place among the week's graded players, and his finish"
      required: [position, ours, adp, published, finish]
      properties:
        position: { $ref: "#/components/schemas/RunPosition" }
        ours: { type: integer, minimum: 1, nullable: true }
        adp: { type: integer, minimum: 1, nullable: true }
        published: { type: integer, minimum: 1, nullable: true }
        espn: { type: integer, minimum: 1, nullable: true, description: absent or null before ESPN's projection was kept }
        finish: { type: integer, minimum: 1 }
    RunRecordWeekStatus:
      type: string
      description: "graded, frozen and waiting on its stats, missed (its first kickoff passed with no board frozen), or upcoming"
      enum: [graded, frozen, missed, upcoming]
    RunRecordWeek:
      type: object
      required: [week, status, frozenAt, frozenBy, gradedAt, order, population, lines]
      properties:
        week: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/RunRecordWeekStatus" }
        frozenAt: { type: string, format: date-time, nullable: true, description: "when our board was frozen; an upcoming week's first kickoff" }
        frozenBy: { type: string, nullable: true, description: the run whose board was frozen }
        gradedAt: { type: string, format: date-time, nullable: true }
        order: { allOf: [{ $ref: "#/components/schemas/OrderBasis" }], nullable: true, description: the order the week's freeze graded }
        population: { type: integer, minimum: 0, description: frozen players with a stat line for the week }
        lines:
          type: array
          items: { $ref: "#/components/schemas/RunRecordLine" }
        note: { type: string, description: "why a missed week was not frozen, one sentence; present only for a missed week" }
        orderAsOf: { type: string, format: date-time, description: when the graded order was last refreshed before the week was set }
        gradesFrom: { type: string, format: date-time, description: "a frozen week's earliest grading instant" }
        players:
          type: array
          description: a graded week's players, in the finish's order
          items: { $ref: "#/components/schemas/RunPlacedPlayer" }
        espnNote: { type: string, description: "one sentence the weekly record prints under the week's row" }
    RunRecordStatistic:
      type: object
      description: the statistics the record grades with, as its column heads print them
      required: [agreement, placesOff, starters]
      properties:
        agreement: { type: string }
        placesOff: { type: string }
        starters: { type: string }
    RunWeeklyRecord:
      type: object
      description: our weekly rankings against the weekly experts, from the first week the shipped order was set
      required: [fromWeek, statistic, scale, startersBasis, method, honest, weeks, toDate]
      properties:
        fromWeek: { type: integer, minimum: 1 }
        statistic: { $ref: "#/components/schemas/RunRecordStatistic" }
        scale: { type: string }
        startersBasis: { type: string, nullable: true }
        method: { type: string }
        honest: { type: string, nullable: true, description: "the sentence printed when a yardstick called the weeks better on any figure" }
        weeks:
          type: array
          items: { $ref: "#/components/schemas/RunRecordWeek" }
        toDate:
          type: array
          items: { $ref: "#/components/schemas/RunRecordLine" }
    RunDraftLine:
      type: object
      required: [position, ours, adp]
      properties:
        position: { $ref: "#/components/schemas/RunRecordPosition" }
        ours: { $ref: "#/components/schemas/RunScore" }
        adp: { $ref: "#/components/schemas/RunScore" }
    RunDraftProgress:
      type: object
      description: order matched, all positions, on the season's points through a counted week
      required: [week, ours, adp]
      properties:
        week: { type: integer, minimum: 1 }
        ours: { type: number, minimum: -1, maximum: 1, nullable: true }
        adp: { type: number, minimum: -1, maximum: 1, nullable: true }
    RunDraftRecord:
      type: object
      description: our draft board against ADP on the season's points so far
      required: [setAt, boardAsOf, throughWeek, namedBasis, honest, lines, progress]
      properties:
        setAt: { type: string, format: date-time }
        boardAsOf: { type: string, format: date-time }
        throughWeek: { type: integer, minimum: 1, nullable: true }
        namedBasis: { type: string, nullable: true }
        honest: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: "#/components/schemas/RunDraftLine" }
        progress:
          type: array
          items: { $ref: "#/components/schemas/RunDraftProgress" }
    RunRecord:
      type: object
      description: the run's record.json, as written
      required: [season, format, statistic, scale, startersBasis, method, publishedFromWeek, honest, weeks, toDate]
      properties:
        season: { type: integer }
        format: { type: string, description: the format every frozen board ranks in }
        statistic: { $ref: "#/components/schemas/RunRecordStatistic" }
        scale: { type: string }
        startersBasis: { type: string, nullable: true }
        method: { type: string }
        publishedFromWeek: { type: integer, minimum: 1, nullable: true }
        honest: { type: string, nullable: true }
        weeks:
          type: array
          items: { $ref: "#/components/schemas/RunRecordWeek" }
        toDate:
          type: array
          items: { $ref: "#/components/schemas/RunRecordLine" }
        weekly: { $ref: "#/components/schemas/RunWeeklyRecord" }
        draft: { $ref: "#/components/schemas/RunDraftRecord" }
    RunRecordAnswer:
      type: object
      required: [run_id, record]
      properties:
        run_id: { type: string }
        record: { $ref: "#/components/schemas/RunRecord" }
    # The clubs and their slates (clubs.json and schedule.json, Lane 188).
    RunClub:
      type: object
      required: [abbr, city, nickname, bye]
      properties:
        abbr: { type: string }
        city: { type: string }
        nickname: { type: string }
        bye: { type: integer, minimum: 1, nullable: true, description: the week the club does not play, null before the schedule is out }
    RunClubsAnswer:
      type: object
      required: [run_id, clubs]
      properties:
        run_id: { type: string }
        clubs:
          type: array
          description: the 32 clubs, in the file's order
          items: { $ref: "#/components/schemas/RunClub" }
    RunGameState:
      type: string
      description: "the game's state at the run's instant: final once either side's result or line is in"
      enum: [upcoming, kicked_off, final]
    RunGame:
      type: object
      required: [week, opponent, home, kickoff]
      properties:
        week: { type: integer, minimum: 1 }
        opponent: { type: string }
        home: { type: boolean }
        kickoff: { type: string, format: date-time, description: "an unset time is the start of its day on the Eastern clock" }
        state: { $ref: "#/components/schemas/RunGameState" }
    RunRestSlate:
      type: object
      description: "a slate's games left at the run's instant: their strength, its rank (1 the hardest), and how it is measured"
      required: [strength, rank, method]
      properties:
        strength: { type: number }
        rank: { type: integer, minimum: 1, maximum: 32 }
        method: { type: string }
    RunSlate:
      type: object
      required: [abbr, games, strength, rank, method, window]
      properties:
        abbr: { type: string }
        games:
          type: array
          items: { $ref: "#/components/schemas/RunGame" }
        strength: { type: number, description: "the slate's strength in the method's unit" }
        rank: { type: integer, minimum: 1, maximum: 32, description: 1 is the hardest slate of the 32 }
        method: { type: string, description: how strength is measured, as the page prints it beside the number }
        window: { $ref: "#/components/schemas/RunWindow" }
        rest:
          nullable: true
          description: the rest of the season, null with no game left; absent on a run from before
          allOf: [{ $ref: "#/components/schemas/RunRestSlate" }]
    RunSchedule:
      type: object
      description: the run's schedule.json, as written
      required: [season, opponentValues, opponentBasis, unit, slates]
      properties:
        season: { type: integer }
        opponentValues:
          type: object
          description: the number each opponent contributes to the strength, keyed by club
          additionalProperties: { type: number, format: double }
        opponentBasis: { type: string, description: what one opponent value is, as a column head prints it }
        unit: { type: string, description: "a slate's strength as a short caption under its number" }
        slates:
          type: array
          items: { $ref: "#/components/schemas/RunSlate" }
    RunScheduleAnswer:
      type: object
      required: [run_id, schedule]
      properties:
        run_id: { type: string }
        schedule: { $ref: "#/components/schemas/RunSchedule" }
    DesignationStatus:
      type: string
      enum: [questionable, doubtful, out, injured_reserve, suspended, pup, nfi]
    InjuryDesignation:
      type: object
      required: [status, as_of]
      properties:
        status: { $ref: "#/components/schemas/DesignationStatus" }
        as_of:
          type: string
          format: date-time
          description: the stamp of the injury read that lists it, or of the host read for the host's own IR mark
        since:
          type: string
          format: date-time
          nullable: true
          description: when his unbroken run under a season-long status began, the first capture that lists it (boards.WithSince, the nightly's designations.json since); null for a week's designation, the host's own IR mark, or a run older than the captures read. The site's status chip says it ("IR since Sep 28") and keeps the read for the basis
        listed:
          type: string
          format: date-time
          nullable: true
          description: >-
            when the provider first listed him under this status, any status (the run's start); null when the read
            could not date it; absent from an older answer
        carried_over:
          type: boolean
          description: >-
            on a page addressing the week after the platform's (Lane 95): a week's designation listed no later than his
            club's last game, or undated, so still listed but from before that game; the site says it with its listing
            date ("Out, listed Oct 12"); absent otherwise
        season_long:
          type: boolean
          description: >-
            true when the status keeps him off the field for weeks the rest-of-season figure counts (injured reserve,
            PUP, NFI, suspended, out with the capture's note saying out for the season, the platform's own IR mark):
            the in-season order places him after every available player, his line carries no rank and no week
            figure is his (Lane 128); absent otherwise and from an older answer
        return_week:
          type: integer
          nullable: true
          description: >-
            the week the provider expects him back (Lane 110, B79): the first week whose last game day is on or after
            the return date the daily player list gives him under this same status ("IR, eligible week 9"), and only
            when it is later than the week the designation addresses (a questionable or doubtful date in the coming
            days says nothing and is omitted; a multi-week out and the season-long statuses keep it); absent when that
            list dates no return for him, its date does not read or has passed, it is not past the addressed week, or
            it falls past the schedule's last week, and from an older answer
        returning:
          type: string
          format: date
          description: >-
            the day the provider expects him back from a season-long list (Lane 153), the daily player list's return
            date, Eastern. With status questionable it is at or before his club's game day in the addressed week: he
            is this week's question (designated to return), ranked as playing, season_long, since and listed absent
            ("Due back Sun Oct 25"). With a season-long status it is after his club's game this week, or his club is
            on a bye, and the row says when ("IR, back Nov 8"). Absent with no date, a date already passed, a week's
            designation, and from an older answer
    GamePoints:
      type: object
      required: [week, points]
      properties:
        week: { type: integer }
        points: { type: number, format: double, description: his points that game under the league's scoring }
        source:
          type: string
          enum: [stats, platform]
          description: >-
            where the points come from (Lane 111, B23): our stats, or the league platform's points for him that week, read
            with the league, while the game is final and our stats for it have not landed (they replace it once they
            do). Absent from an older answer, which is our stats
    PointsAllowed:
      type: object
      required: [points_a_game, rank, of, position]
      properties:
        points_a_game:
          type: number
          format: double
          description: the opponent's defense to this position, season to date, under the league's scoring, one decimal
        rank: { type: integer, description: 1 allowed the fewest }
        of: { type: integer, description: the defenses ranked, those with a final game }
        position: { type: string }
    WeekFacts:
      type: object
      description: one player's week; a fact we do not hold is null, never zero
      required:
        - week
        - opponent
        - home
        - kickoff
        - bye
        - designation
        - played
        - points_this_week
        - last_games
        - allowed_to_position
        - game_total
        - spread
        - roof
        - weather
      properties:
        week: { type: integer }
        opponent: { type: string, nullable: true, description: "the opponent's team code, null on bye or when his team is unknown" }
        home: { type: boolean, nullable: true }
        kickoff: { type: string, format: date-time, nullable: true }
        bye: { type: boolean }
        designation: { allOf: [{ $ref: "#/components/schemas/InjuryDesignation" }], nullable: true }
        played: { type: boolean, description: his game this week is final }
        game_state:
          allOf: [{ $ref: "#/components/schemas/GameState" }]
          nullable: true
          description: his game this week by the read's clock, null on his bye or when his club is unknown
        points_this_week:
          type: number
          format: double
          nullable: true
          description: the host's score for him so far, from the matchup, when he starts there and his game has kicked off, to the tenth
        last_games:
          type: array
          description: up to three completed games under the league's scoring, newest first
          items: { $ref: "#/components/schemas/GamePoints" }
        allowed_to_position: { allOf: [{ $ref: "#/components/schemas/PointsAllowed" }], nullable: true }
        game_total: { allOf: [{ $ref: "#/components/schemas/GameTotal" }], nullable: true }
        spread: { allOf: [{ $ref: "#/components/schemas/GameSpread" }], nullable: true }
        roof: { allOf: [{ $ref: "#/components/schemas/GameRoof" }], nullable: true }
        weather: { allOf: [{ $ref: "#/components/schemas/KickoffWeather" }], nullable: true }
    GameState:
      type: string
      enum: [upcoming, kicked_off, final]
      description: >-
        a game's state, one rule for every screen: upcoming before its kickoff, kicked_off from its kickoff until its
        final is in, final once the store holds its result or a stat line from either side
    GameStateCell:
      type: object
      description: >-
        a game at the request's clock as every screen says it (Lane 176), one rule for the web and the apps: a player's
        game by the web's lineState, a scoreboard game by its gameHead (web/src/lib/league/box/kickoff.ts), held to
        them by shared/fixtures/parity/game-state.json
      required: [state, word]
      properties:
        state:
          type: string
          enum: [not_started, kicked_off, final, bye, no_game]
          description: >-
            not_started before its kickoff; kicked_off from its kickoff (an upcoming read whose kickoff has passed
            included) until its final is in; final; bye, his club's bye week; no_game, no game held for him this week
            (a free agent, or a club with no game we hold). Open: a client reads a value it does not know by its word
        word:
          type: string
          description: >-
            the word the screen prints for the state: "Next kickoff" (empty for a scoreboard game with no kickoff to
            name), "Kicked off", "Final", "Bye", "No club" for a free agent, empty for any other line with no game
    WeekDoneState:
      type: string
      enum: [locked, final]
      description: >-
        the matchup's state once the member's starters have all kicked off: final when the matchup's game is final by
        the one game-state rule (every starter on both sides final), or with no opponent this week once the member's
        own starters are all final; locked while any starter on either side is still in play or has a game to play,
        nothing left to set
    GameTotal:
      type: object
      description: >-
        the game's expected score, the consensus of the hourly capture's newest read before kickoff; a read more than six
        hours before kickoff (or before now) gives way to the game table's newest weekly read, with its own read time
      required: [points, team_points, read_at]
      properties:
        points: { type: number, format: double, description: both clubs' points together }
        team_points: { type: number, format: double, description: "this club's own expected points, from the same read" }
        read_at: { type: string, format: date-time, description: when the figures were read }
    GameSpread:
      type: object
      description: the expected margin from this club's side, from the same read as game_total
      required: [side, points, read_at]
      properties:
        side: { type: string, enum: [win, lose, even], description: "whether this club is expected to win or lose" }
        points: { type: number, format: double, description: "the margin, never negative, and 0 when even" }
        read_at: { type: string, format: date-time }
    GameRoof:
      type: object
      description: >-
        the venue as the stadium table confirms it: a dome takes no forecast, a venue abroad no weather term; null when
        the venue is not confirmed
      required: [kind, abroad]
      properties:
        kind: { type: string, enum: [outdoors, dome, retractable] }
        abroad: { type: boolean }
    KickoffWeather:
      type: object
      description: >-
        the weather service's forecast for the kickoff hour at the stadium, the newest read before kickoff; null for a
        dome, a venue abroad, or before the forecast reaches the game
      required: [temperature_f, wind_mph, precipitation_chance, precipitation_kind, read_at]
      properties:
        temperature_f: { type: number, format: double, nullable: true }
        wind_mph: { type: number, format: double, nullable: true }
        precipitation_chance: { type: number, format: double, nullable: true, description: "percent, 0 to 100" }
        precipitation_kind:
          type: string
          nullable: true
          enum: [none, rain, thunderstorms, snow, ice]
          description: the most severe kind of precipitation the kickoff hour names
        read_at: { type: string, format: date-time, description: when the forecast was read }
    GameWeek:
      type: object
      required: [season, week, games]
      properties:
        season: { type: integer }
        week: { type: integer }
        games: { type: array, items: { $ref: "#/components/schemas/ClubGame" } }
    ClubGame:
      type: object
      description: one club's game in the week, from its side
      required: [team, opponent, home, kickoff, played, game_total, spread, roof, weather]
      properties:
        team: { type: string, description: "the club, in the board's codes" }
        opponent: { type: string }
        home: { type: boolean }
        kickoff: { type: string, format: date-time }
        played: { type: boolean, description: the game is final }
        game_state: { allOf: [{ $ref: "#/components/schemas/GameState" }], nullable: true, description: "the game by the read's clock" }
        game_total: { allOf: [{ $ref: "#/components/schemas/GameTotal" }], nullable: true }
        spread: { allOf: [{ $ref: "#/components/schemas/GameSpread" }], nullable: true }
        roof: { allOf: [{ $ref: "#/components/schemas/GameRoof" }], nullable: true }
        weather: { allOf: [{ $ref: "#/components/schemas/KickoffWeather" }], nullable: true }
    PlayerLine:
      type: object
      required: [player, headshot, slug, position_rank, points_over_replacement, rest_of_season_per_game, week_projection, projection_delta, opp_rank, season_avg, last_points, held, facts]
      properties:
        player: { $ref: "#/components/schemas/LeaguePlayer" }
        headshot: { type: string, nullable: true, description: "our copy of his headshot, null without one" }
        slug:
          type: string
          nullable: true
          description: >-
            his page on the site (/players/{slug}): set for a quarterback, running back, receiver or tight end our order
            ranks whose name no other player in our directory shares, null otherwise (a kicker or defense has no page) (a shared name's page is named by the run, which the API does not read)
        position_rank: { type: integer, nullable: true, description: "his place at his position in our order, null when unranked and for a player on a season-long list (injured reserve, PUP, NFI, suspended, the platform's IR mark included), whom the in-season order never ranks as playing" }
        points_over_replacement:
          type: number
          format: double
          nullable: true
          description: >-
            points over replacement a week for this league, one decimal: the order's averaged over the weeks it covers
            (the preseason number's season over 17, the rest-of-season order's over its own first week, the league's when the run does not say, through
            the league's last playoff week as its platform states it, week 17 when it states none), as the basis says; null without a projection
        rest_of_season_per_game:
          type: number
          format: double
          nullable: true
          description: >-
            his rest-of-season points a game, one decimal: the published board's rest-of-season points over the games his
            club had still to play at the run (the games not yet kicked off, from the board's first week through week 17, byes out;
            the same as his rest-of-season points now over his club's games left now), as the basis says; null on the preseason
            number, on a run that does not say its first week, without a projection or with no games left. A player who is
            out keeps it: it assumes he plays
        week_projection:
          type: number
          format: double
          nullable: true
          description: >-
            his points this week on the week's published projection, to the tenth (the site's one rounding, half away from zero), in the format the league's scoring is
            most like (PPR, half PPR or standard); a team defense's by its club, a kicker our board does not place (no board id) by his club's one kicker, never a teammate's for a kicker the snapshot left out. The newest snapshot stored for the
            league's week (projection_read_at says when) while his game is still to come; once it has kicked off, the newest
            captured at or before his kickoff (null when none was), so a game under way or final keeps
            its projection as of kickoff. Null when his club has no game that week (a bye), whatever the snapshot holds, and when the snapshot has no row for him or none is stored.
            Our own weekly model replaces it when it passes its test
        projection_delta:
          type: number
          format: double
          nullable: true
          description: >-
            week_projection's change since the week's snapshot before the one it is read from (the newest, or once
            his game has kicked off the one as of kickoff), to the tenth, in the same format; null without a row for
            him in both snapshots or when week_projection is null
        opp_rank:
          type: integer
          nullable: true
          description: >-
            this week's opponent's rank in points allowed a game to his position this season under the league's scoring,
            1 allowed the fewest (facts.allowed_to_position.rank, of its .of); null on a bye or before the season ranks it
        season_avg:
          type: number
          format: double
          nullable: true
          description: >-
            his points a game over every completed game this season under the league's scoring, to the tenth, a final game
            our stats have not landed counted on the platform's points (facts.last_games source); null before his first game
        last_points:
          type: number
          format: double
          nullable: true
          description: >-
            his points in his last completed game under the league's scoring, to the tenth, the platform's points for a
            final game our stats have not landed (facts.last_games source); null before his first game
        games_played:
          type: integer
          description: >-
            the completed games season_avg is over, a final game the platform's points count included (facts.last_games
            source platform, Lane 111); absent before his first game and from an older answer
        held: { type: boolean, description: the drafter tags him Hold on a sheet, so he is never a drop or a trade give }
        facts: { $ref: "#/components/schemas/WeekFacts" }
        game_state:
          allOf: [{ $ref: "#/components/schemas/GameStateCell" }]
          description: >-
            his game this week at the request's clock in the state and the word the screen prints (Lane 176): from
            facts' bye, kickoff, game_state and played by the web's lineState, so no client computes it; absent from
            an older answer
    PlayerWeek:
      type: object
      required: [week, line, projection_scoring, projection_read_at, projection_previous_read_at, verb]
      properties:
        week: { type: integer, description: "the week the line is for: the league's week, else the week of the next game still to be played" }
        line: { $ref: "#/components/schemas/PlayerLine" }
        projection_scoring: { $ref: "#/components/schemas/ProjectionScoring" }
        projection_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the week's projection was captured, null with none stored
        projection_previous_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the snapshot projection_delta is measured from was captured, null with none
        verb:
          allOf: [{ $ref: "#/components/schemas/PlayerVerb" }]
          nullable: true
          description: what the league screens would do with him; null on the read with no league
        rest_of_season:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/RestOfSeasonFigure" }
          description: >-
            his rest of season at the read's clock in every format the run carries (twelve teams: PPR, half PPR and
            standard on the standard lineup, PPR on the superflex lineup), each from that format's board re-valued as the
            order is (LiveBoard: the run's points a game times his club's games still to play now, so a game kicked off
            since the run is no longer counted); absent off the rest-of-season order, without a projection and from a
            read older than the field
        tier:
          allOf: [{ $ref: "#/components/schemas/RestOfSeasonTier" }]
          nullable: true
          description: >-
            the players the read was asked for (?tier=, ?tier_next=, ?tier_format=) at the read's clock in that format, as
            the page's tier box lists them; absent when not asked or off the rest-of-season order
        rest_from_week:
          type: integer
          nullable: true
          description: >-
            the week his rest of season starts from: his club's first game still to play at the read's clock (not yet
            kicked off, through week 17); null off the rest-of-season order, without a projection or with no game left. Absent from a read
            older than the field
        after_bye:
          allOf: [{ $ref: "#/components/schemas/PlayerAfterBye" }]
          nullable: true
          description: >-
            on his bye in week (line.facts.bye), his club's next game in the same scoring as line (Lane 100, B30): the card's
            Opp rank and Proj tiles read it, as no tile of the bye week holds a figure; null off a bye or with no game left,
            absent from an older answer
    PlayerAfterBye:
      type: object
      required: [week, line, projection_read_at, projection_arrives_at]
      properties:
        week: { type: integer, description: the week of his club's next game after the bye }
        line: { $ref: "#/components/schemas/PlayerLine" }
        projection_read_at:
          type: string
          format: date-time
          nullable: true
          description: when that week's published projection was captured, null with none stored
        projection_arrives_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            when that week's published projection is first captured (its first kickoff less the capture's lead), set
            only while none is read for it; null otherwise
    RestOfSeasonFigure:
      type: object
      required: [format, points, points_over_replacement]
      properties:
        format: { $ref: "#/components/schemas/BoardFormat" }
        points:
          type: number
          format: double
          description: his rest-of-season points in this format at the read's clock, one decimal
        points_over_replacement:
          type: number
          format: double
          nullable: true
          description: those points less a free pickup's for a twelve-team league of this format, one decimal; null at a position the league starts nobody at
        position_rank:
          type: integer
          nullable: true
          description: >-
            his place at his position in our order for this format at the read's clock (in PPR the public /order's
            overall_rank at his position, Lane 227, B206), the number the page's head says in its own format; null
            when he is on a season-long list as the read sees him (on a league's read the platform's IR mark
            included, as his head), or the order does not place him; absent from an older answer
        overall_rank:
          type: integer
          nullable: true
          description: >-
            his place across every position in our order for this format at the read's clock, by points over
            replacement (in PPR the public /order's overall_rank with no position, Lane 227, B206); null as
            position_rank is; absent from an older answer
    TierMate:
      type: object
      required: [board_id, points]
      properties:
        board_id: { type: string }
        points:
          type: number
          format: double
          nullable: true
          description: his rest-of-season points at the read's clock, one decimal; null when the board has no projection for him
        position_rank:
          type: integer
          nullable: true
          description: "his place at his position among the players on no season-long list, the read's own rank (the one its line.position_rank says, PlayingRanks, Lane 128), so the tier box and the card's head draw one number (Lane 162); null on a season-long list or off the board; absent from an older answer"
        from_week:
          type: integer
          nullable: true
          description: "the week his points count from, his club's first game still to play at the read's clock (the read's rest_from_week for him), so the tier box says whose span is not the card's (Lane 162); null with no game left; absent from an older answer"
    RestOfSeasonTier:
      type: object
      required: [format, mates, drop, from_week, partial]
      properties:
        format: { $ref: "#/components/schemas/BoardFormat" }
        mates:
          type: array
          items: { $ref: "#/components/schemas/TierMate" }
        drop:
          type: number
          format: double
          nullable: true
          description: the last asked player's points less tier_next's, one decimal; null without tier_next or either figure
        from_week:
          type: integer
          nullable: true
          description: the earliest week with a game still to play at the read's clock, the week the board's figures count from
        partial:
          type: boolean
          description: a game of from_week has kicked off, so the board counts that week's games left
    PlayerVerb:
      type: object
      required: [kind, holder, host_url, note]
      properties:
        kind:
          type: string
          enum: [start, lineup, trade, claim, waivers]
          description: >-
            start when he is on the drafter's roster and our lineup starts him where the platform's lineup does not;
            lineup when he is on the drafter's roster otherwise; trade when another roster holds him; claim when no
            roster holds him and a claim can be made from our screen (WaiverMoves.claim available); waivers when no
            roster holds him and the verb is the platform's waiver page
        holder: { type: string, nullable: true, description: "the team holding him, for trade; null otherwise" }
        host_url: { type: string, nullable: true, description: "the platform's waiver page, for waivers; null otherwise or when we do not know it" }
        note: { type: string, nullable: true, description: "the claim moves' note, for claim or waivers; null otherwise" }
    LineupSlot:
      type: object
      required: [slot, ours, host, changed, no_one_can_play, sentence]
      properties:
        slot: { type: string, enum: [QB, RB, WR, TE, FLEX, SUPERFLEX, K, DEF] }
        ours: { $ref: "#/components/schemas/PlayerLine" }
        host:
          allOf: [{ $ref: "#/components/schemas/PlayerLine" }]
          nullable: true
          description: >-
            the host lineup's player in this place: the same player when unchanged, the starter we sit for a change,
            null for a spot the host left empty
        changed: { type: boolean, description: we start a player the host has on the bench }
        no_one_can_play:
          type: boolean
          description: >-
            no rostered player who can play this week fills the spot (a bye, out, doubtful, injured reserve or
            suspended for everyone eligible): ours is the member's current player there, left in place, never a
            recommendation, and changed is false
        sentence: { type: string, nullable: true, description: the reason for a change, from facts; null when unchanged }
    LineupAdvice:
      type: object
      required: [week, basis, basis_note, uncounted_rules, order_basis, refreshed, read_at, projection_read_at, projection_previous_read_at, projection_scoring, player_points, team_points, set, slots, empty_slots, bench, reserve, host_lineup_url, host_note, moves]
      properties:
        week: { type: integer }
        player_points:
          type: boolean
          description: >-
            the host gives each player's points (Sleeper, MFL, ESPN); false where it gives each team's total alone
            (Yahoo, FFPC) or its read carried no player's, so a player's points_this_week stay null and the team's
            total is team_points
        team_points:
          type: number
          format: double
          nullable: true
          description: >-
            the host's points so far for the drafter's team this week, null before any of its starters has kicked off
            or when the host's score could not be read
        projected_final:
          type: number
          format: double
          nullable: true
          description: >-
            the lineup's projected final by the score bug's one rule over the lineup as the platform holds it (the
            score bug's figure for the member): team_points plus the rest of the Proj of its starters in play and
            the Proj of its starters still to play, an out
            starter counting nothing; null while team_points is, while a starter still to play has no Proj, or absent
            from an older answer
        projection_scoring: { $ref: "#/components/schemas/ProjectionScoring" }
        projection_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the week's published projection the rows' week_projection read was captured, null with none
        projection_previous_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the snapshot before it was captured, the read projection_delta counts from; null with none
        basis:
          type: string
          description: >-
            the honesty line: the lineup starts the highest week_projection at each slot after this week's designations
            and byes, the rest-of-season order breaking ties and standing in where a player has none
        basis_note:
          type: string
          description: >-
            the league's scoring rules Avg and Last miss because our stats lack them, named (Lane 111, B33: "Our stats
            omit two-point and safety.", both missed kicks said as one missed kick), empty when they
            miss none
        basis_note_list:
          type: string
          description: >-
            one sentence fragment, not a list: the rules basis_note names, as it names them, at most four then the rest counted ("two-point, missed kick,
            fumble recovery, safety and one more rule", Lane 115, B92), for the web to say in its own frame where no row
            counts the platform's points ("Avg and Last are our stats, which omit ..."); empty with no basis_note,
            absent from an older answer
        uncounted_rules:
          type: array
          items: { type: string }
          description: >-
            the rules basis_note counts, in words ("two-point conversions"), for the league's Settings to list; empty
            when it counts none
        order_basis: { $ref: "#/components/schemas/OrderBasis" }
        refreshed: { type: string, format: date-time, description: when the order was made }
        read_at: { type: string, format: date-time, description: the league's last host read }
        set: { type: boolean, description: true when the host's lineup is already ours }
        slots:
          type: array
          description: >-
            every starting spot in the league's order (QB, RB, WR, TE, the flex spots, K, DEF); a spot no rostered player
            can fill is left out
          items: { $ref: "#/components/schemas/LineupSlot" }
        bench:
          type: array
          description: everyone else on the active roster, by the same keys (injured reserve and taxi spots left out)
          items: { $ref: "#/components/schemas/PlayerLine" }
        empty_slots:
          type: array
          description: >-
            the starting spots no rostered player who can play this week fills and the member left empty (or whose
            player the advice starts in another spot), in the league's order: the screen shows each as a row with no
            player and says no one can play there
          items: { type: string, enum: [QB, RB, WR, TE, FLEX, SUPERFLEX, K, DEF] }
        reserve:
          type: array
          description: the players in the host's injured reserve spots, who start nowhere this week
          items: { $ref: "#/components/schemas/PlayerLine" }
        host_lineup_url: { type: string, description: "the host's lineup page, empty when we know none" }
        host_note:
          type: string
          nullable: true
          description: >-
            one sentence under the verb when we cannot open the host's page ("Make this change on Yahoo. We cannot
            open that page for you yet."), null when the url opens it
        moves: { $ref: "#/components/schemas/LineupMoves" }
        week_done:
          type: string
          nullable: true
          description: >-
            the sentence once every starter of the member's with a game this week has kicked off, a bye starter aside
            ("Every starter of yours has kicked off, so nothing is left to set." while any is still in play, "Every
            starter of yours has played, so nothing is left to set." once every one is final): it says the lineup, never
            the week, and stands in place of the changes and the verb; null while any starter's game is still to come,
            or absent from an older answer
        week_done_state:
          allOf: [{ $ref: "#/components/schemas/WeekDoneState" }]
          nullable: true
          description: present whenever week_done is, null otherwise or absent from an older answer
        missed:
          type: string
          nullable: true
          description: >-
            the miss line once the lineup as set on the platform has kicked off where it differs from our pick (the
            highest Proj at each slot after designations and byes, as of each kickoff, no player held): each such slot
            once both its players have kicked off, "DJ Moore, Out, scored 0.0 in your Flex while Josh Downs scored 8.7
            on your bench.", the two that cost the most named and the rest counted (", and one more slot."), then once every starter of both lineups is final "Our lineup would have scored 85.5."; null
            where the two agree, before such a slot has kicked off, where the platform gives no player's points, or
            absent from an older answer
    BoxStarter:
      type: object
      required: [slot, line]
      properties:
        slot: { type: string, enum: [QB, RB, WR, TE, FLEX, SUPERFLEX, K, DEF] }
        line: { $ref: "#/components/schemas/PlayerLine" }
    MatchupBoxSide:
      type: object
      required: [roster_id, player_points, team_total, starters, bench]
      properties:
        roster_id: { type: integer }
        player_points:
          type: boolean
          description: the host gives each player's points for this side; false where it gives the side's total alone
        team_total:
          type: boolean
          description: >-
            the platform sends the side's own total (ESPN, Yahoo, FFPC), so the score and the Totals row print it;
            false where it sends each player's points alone (Sleeper, MFL), so both print the rows' sum
        to_play:
          type: string
          nullable: true
          description: >-
            where the side's starters stand while the game is playing, by the score bug's rule
            (ScoreboardSide.to_play): "3 to play", "2 playing", never a zero; null otherwise, or absent from an older
            answer
        schedule_state:
          allOf: [{ $ref: "#/components/schemas/GameState" }]
          description: >-
            the side's state by the schedule, for a side the platform lists no starters for (FFPC's opponent view),
            whose state no starter's game can give (Lane 124, B102): its roster's games where the league read carries
            the roster, else every game of the week, each by gameStateAt; final once every one is final, kicked_off
            once one has kicked off, upcoming before. The game's state is final only once this is too. Absent for a
            side that lists starters, whose starters say it, and from an older answer, which reads the game's state
        projected_final:
          type: number
          format: double
          nullable: true
          description: >-
            the side's projected final by the score bug's one rule (ScoreboardSide.projected_final): its score so far,
            the rest of the Proj of its starters in play and the Proj of its starters still to play; null before the game's first kickoff, with the score unread,
            while a starter still to play has no Proj, for a side the platform lists no starters for and whose roster
            the read does not carry, or absent from an older answer. For a side listing no starters whose roster the
            read carries (projection_best_lineup), its score so far plus the Proj of our best lineup's players still
            to play and the rest of the Proj of one in play where the read gives his points (Lane 92), else his Proj times the share of his game left (3 h 15 m from kickoff, held between 0 and 1), one final adding nothing (Lane 127)
        projection_best_lineup:
          type: boolean
          description: >-
            true where projection and projected_final are our best lineup's from the side's roster (Lane 127, Lane
            137): a side the platform lists no starters for whose roster the league read carries. Absent otherwise and
            from an older answer
        projection:
          type: number
          format: double
          nullable: true
          description: >-
            for a side the platform lists no starters for whose roster the league read carries (projection_best_lineup),
            our best lineup's week projection from that roster, the figure ScoreboardSide.projection gives the same side
            (Lane 137, B107: one figure per side across screens); null where that lineup fills no slot. Absent for a
            side that lists starters, whose Proj its starters' rows add, for one with no roster read, and from an older
            answer
        best_lineup_skipped:
          type: boolean
          description: >-
            true where our best lineup (projection_best_lineup) passed over a player with no week projection who can
            play and would start in it were he counted (Lane 137, B107): his slot takes the next best player with a
            Proj and stays empty only where none can fill it, the Proj summed from the slots filled. Absent otherwise
            and from an older answer
        projected_final_paced:
          type: boolean
          description: >-
            true where projected_final counts a player of our best lineup in play at his projection's pace (the
            read gives no player's points and some of his game is left, Lane 127 fix round 3); absent otherwise and
            from an older answer
        starters:
          type: array
          description: >-
            the host's starters in the league's slot order (QB, RB, WR, TE, the flex spots, K, DEF); an empty spot is
            left out, and a starter no slot takes ends the list in his position's slot. Empty where the host shows us
            no lineup for the side (FFPC's opponents)
          items: { $ref: "#/components/schemas/BoxStarter" }
        bench:
          type: array
          description: the side's other active players, by our order (injured reserve and taxi spots left out)
          items: { $ref: "#/components/schemas/PlayerLine" }
    ProjectionScoring:
      type: object
      description: >-
        the scoring the rows' week_projection is read in: the published projection's column the league scores most
        like, and whether that is the league's own scoring or the closest of the three to rules of its own (a tight
        end premium reads PPR and is never its own). A team defense's figure is the published default in every format
      required: [format, league_own]
      properties:
        format: { type: string, enum: [ppr, half_ppr, standard] }
        league_own: { type: boolean, description: the league scores exactly as format, every rule alike }
        te_bonus:
          type: number
          format: double
          description: >-
            the extra points the league's rules give a tight end's catch over format (FFPC's 0.5), which the
            published projection does not carry; absent where the league gives none

    ScoreboardSide:
      type: object
      required: [roster_id, points, points_read, projection, starters, played]
      properties:
        schedule_state:
          allOf: [{ $ref: "#/components/schemas/GameState" }]
          description: >-
            the side's state by the schedule, for a side the platform lists no starters for (FFPC's opponent view),
            whose state no starter's game can give (Lane 124, B102): its roster's games where the league read carries
            the roster, else every game of the week, each by gameStateAt; final once every one is final, kicked_off
            once one has kicked off, upcoming before. The game's state is final only once this is too. Absent for a
            side that lists starters, whose starters say it, and from an older answer, which reads the game's state
        starters_final:
          type: boolean
          description: >-
            every one of the side's starters with a game this week has a final game at the read's clock
            (gameStateAt), empty slots, byes and starters with no game held not counting, false with none
            (Lane 121, B99): the side's figure reads Final with its total; absent for a side the platform lists
            no starters for (FFPC's opponent view), which says schedule_state instead, and from an older answer, which
            reads the game's state
        roster_id: { type: integer }
        points: { type: number, format: double, description: "the side's points so far as the host scores them, to the tenth" }
        points_read: { type: boolean, description: false when the host's score could not be read; points then says nothing }
        projection:
          type: number
          format: double
          nullable: true
          description: >-
            the side's starters' week projections summed, each as printed to the tenth, a starter with none counting
            nothing; null when no starter has one. For a side the platform lists no starters for whose roster the league
            read carries (FFPC's rosters page, projection_best_lineup), our best lineup from that roster this week under
            the league's slots (Lane 127, B105): the lineup rule's week fill, every player who can play this week, one
            whose game has kicked off included, summed the same way; null for such a side with no roster
        projection_best_lineup:
          type: boolean
          description: >-
            true where projection is our best lineup from the side's roster (Lane 127, B105): a side the platform lists
            no starters for whose roster the league read carries. Absent for a side that lists starters, for one with
            no roster read, and from an older answer, whose projection for such a side is null
        best_lineup_skipped:
          type: boolean
          description: >-
            true where our best lineup (projection_best_lineup) passed over a player with no week projection who can
            play and would start in it were he counted (Lane 137, B107): his slot takes the next best player with a
            Proj and stays empty only where none can fill it, the Proj summed from the slots filled. Absent otherwise
            and from an older answer
        projected_final_paced:
          type: boolean
          description: >-
            true where projected_final counts a player of our best lineup in play at his projection's pace (the
            read gives no player's points and some of his game is left, Lane 127 fix round 3); absent otherwise and
            from an older answer
        starters: { type: integer, description: the starters the host lists for the side }
        played: { type: integer, description: those starters whose game has kicked off }
        to_play:
          type: string
          nullable: true
          description: >-
            while the game is playing, where the side's starters stand, never a zero: "3 to play" while any starter
            with a game is still to come (an out starter whose game is still to come counts), "2 playing" once none
            is and some are in play; null once every starter is final, on bye or out of a game under way, before
            kickoff, or absent from an older answer
        in_play:
          type: integer
          description: >-
            the side's starters whose own game has kicked off and is not final at the read's clock (gameStateAt),
            an out starter not counted: 0 before kickoff, between games (a Thursday starter final, Sunday's still
            to come) and once every starter is final; absent from an older answer, which reads as none in play
        projected_final:
          type: number
          format: double
          nullable: true
          description: >-
            the side's projected final once any starter of the game has kicked off: points (the platform's score so
            far), plus for each starter in play the rest of his week projection (max(0, Proj - his points so far),
            nothing where the platform gives no player's points), plus the week projection of each starter still to
            play, each as printed to the tenth, an out starter counting nothing; equal to points once every starter is final. Null before the game's first kickoff, with
            the score unread, while a starter still to play has no week projection, for a side the platform lists no
            starters for (FFPC's opponent view) whose roster the read does not carry, or absent from an older answer.
            For a side whose projection is our best lineup (projection_best_lineup), once the game reads playing or
            final: its points plus the week projection of that lineup's players still to play, the rest of the Proj of one in play
            where the read gives his points (Lane 92), else his Proj times the share of his game left (3 h 15 m from kickoff, held between 0 and 1), one final adding nothing (Lane 127)
    ScoreboardGame:
      type: object
      required: [state, next_kickoff, sides]
      properties:
        state:
          type: string
          enum: [upcoming, playing, final]
          description: >-
            upcoming before any starter's game kicks off, final once every starter's game is over, playing between
        next_kickoff:
          type: string
          format: date-time
          nullable: true
          description: the earliest kickoff still to come among both sides' starters, null when none is
        game_state:
          allOf: [{ $ref: "#/components/schemas/GameStateCell" }]
          description: >-
            the game at the request's clock in the state and the word its score bug prints (Lane 176): from state and
            next_kickoff by the web's gameHead, never bye or no_game; absent from an older answer
        to_play:
          type: string
          nullable: true
          description: >-
            while the game is playing, how many of both sides' starters with a game this week are still to play
            ("5 to play", or "2 playing" once none is still to come), never a zero; an out starter is done once his
            game has kicked off, a starter on bye or with no game held leaves the count; null otherwise, or absent from an older answer. Each side's
            own count is its to_play
        sides:
          type: array
          description: two sides, the drafter's first when the game is theirs; one for a team with no opponent
          items: { $ref: "#/components/schemas/ScoreboardSide" }
    Scoreboard:
      type: object
      required: [week, read_at, projection_read_at, projection_scoring, games]
      properties:
        week: { type: integer }
        read_at: { type: string, format: date-time, description: the league's last host read }
        projection_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the week's published projection was captured, null with none
        projection_scoring: { $ref: "#/components/schemas/ProjectionScoring" }
        games:
          type: array
          description: the drafter's game first, then the rest in the host's order
          items: { $ref: "#/components/schemas/ScoreboardGame" }
    MemberWeek:
      type: object
      required: [leagues]
      properties:
        leagues:
          type: array
          description: every league the account follows, newest first, as GET /leagues/attached lists them
          items: { $ref: "#/components/schemas/WeekLeague" }
    WeekLeague:
      type: object
      required: [id, name, host, team_name, standing, phase, week, read_at, projection_read_at, projection_scoring, bug, lineup, chips, problem]
      properties:
        id: { type: string, format: uuid, description: the attachment (AttachedLeague.id) }
        name: { type: string }
        host: { $ref: "#/components/schemas/LeagueHost" }
        team_name: { type: string, description: "the member's team at the last read, empty when unread" }
        standing:
          allOf: [{ $ref: "#/components/schemas/LeagueStanding" }]
          nullable: true
        phase: { $ref: "#/components/schemas/LeaguePhase" }
        week: { type: integer, description: "the league's current week, 0 when it has none or the read failed" }
        chips_week:
          type: integer
          description: >-
            the week the chips address (Lane 95, the action screens' week): week, or the week after once every
            starter of the member's with a game has kicked off or is final; absent from an older answer
        read_at: { type: string, format: date-time, nullable: true, description: the league's last host read, null when unread }
        projection_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the week's published projection the figures read was captured, null with none
        projection_scoring:
          allOf: [{ $ref: "#/components/schemas/ProjectionScoring" }]
          nullable: true
          description: the scoring the figures' projections are read in, null when the league has no week
        bug:
          allOf: [{ $ref: "#/components/schemas/WeekBug" }]
          nullable: true
          description: the member's game this week, null when the league has no week, no game, or the read failed
        lineup:
          allOf: [{ $ref: "#/components/schemas/WeekLineup" }]
          nullable: true
          description: the lineup's changes this week, null when the league has no week or the read failed
        chips:
          type: array
          description: >-
            at most three facts about the member's roster, in this order where each holds: a starter's designation,
            a starter on bye, the top pickup
          items: { $ref: "#/components/schemas/RosterChip" }
        problem:
          type: string
          nullable: true
          description: one sentence when a read failed or the league has no saved scoring, naming the platform; null otherwise
    WeekBug:
      type: object
      required: [game, teams, first]
      properties:
        game: { $ref: "#/components/schemas/ScoreboardGame" }
        teams:
          type: array
          description: the game's teams in the order of its sides, the member's first
          items: { $ref: "#/components/schemas/LeagueTeam" }
        first:
          type: array
          description: >-
            the member's starters as the platform holds them whose kickoff is the earliest of theirs still to come,
            empty when none is
          items: { $ref: "#/components/schemas/PlayerLine" }
    WeekLineup:
      type: object
      required: [changes, projection, as_set, gain, swaps]
      properties:
        changes: { type: integer, description: the starting spots our lineup fills with someone other than the platform holds }
        projection:
          type: number
          format: double
          nullable: true
          description: our lineup's starters' week projections summed, each as printed to the tenth; null when none has one
        as_set:
          type: number
          format: double
          nullable: true
          description: the lineup as the platform holds it, summed the same way; null when none has one
        gain:
          type: number
          format: double
          nullable: true
          description: projection less as_set to the tenth, null when either is null
        swaps:
          type: array
          description: each change, in the league's slot order
          items: { $ref: "#/components/schemas/WeekSwap" }
        week_done:
          type: string
          nullable: true
          description: >-
            the Lineup's own week_done sentence (words.go WeekDoneWords) once every starter of the member's has kicked off,
            which the front door says in place of the changes and the verb; null before, or absent from an older answer
        week_done_state:
          allOf: [{ $ref: "#/components/schemas/WeekDoneState" }]
          nullable: true
          description: the Lineup's own week_done_state, present whenever week_done is, null otherwise or absent from an older answer
    WeekSwap:
      type: object
      required: [slot, in, out]
      properties:
        slot: { type: string, enum: [QB, RB, WR, TE, FLEX, SUPERFLEX, K, DEF] }
        in: { $ref: "#/components/schemas/LeaguePlayer" }
        out:
          allOf: [{ $ref: "#/components/schemas/LeaguePlayer" }]
          nullable: true
          description: the player the platform starts there, null for a spot left empty
    RosterChip:
      type: object
      required: [kind, line, gain, idle]
      properties:
        kind:
          type: string
          enum: [status, bye, pickup]
          description: >-
            status, a starter as set with this week's designation (the newest); bye, a starter as set on bye whose
            spot no one on the member's roster can play (never a bye the lineup's changes already fill); pickup, the first pickup worth making as the Waivers
            screen chooses them, while the league runs waivers
        line: { $ref: "#/components/schemas/PlayerLine" }
        gain:
          type: number
          format: double
          nullable: true
          description: >-
            a pickup's week_gain (the Waivers strip's first card): this week's Proj the lineup the advice sets gains
            with him in, one decimal; null on the other kinds
        idle:
          type: boolean
          description: true on a bye (no one on the member's roster can play its spot this week); false on the other kinds
    MatchupBox:
      type: object
      required: [week, read_at, projection_read_at, projection_scoring, sides]
      properties:
        projection_scoring: { $ref: "#/components/schemas/ProjectionScoring" }
        week: { type: integer }
        read_at: { type: string, format: date-time, description: the league's last host read }
        projection_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the week's published projection the rows' week_projection read was captured, null with none
        sides:
          type: array
          description: >-
            the drafter's side first, then the opponent's when the week pairs them; with roster asked, that roster's
            side first, then its opponent's
          items: { $ref: "#/components/schemas/MatchupBoxSide" }
        viewer_side:
          type: string
          enum: [mine, other]
          description: >-
            whose game the box is (Lane 204): mine for the member's own (roster absent, or the member's), other for
            another team's game asked by roster; absent from an older answer, which is always the member's
        standing:
          type: string
          nullable: true
          description: >-
            where the member stands, said under the score bug's two scores from their side: while the game plays the
            margin and who is left ("Up 3.2, 2 of yours and 1 of theirs to play", "Down 14.1 with nobody left,
            McCaffrey and Kittle playing for them"), once final the result ("Won by 6.4", "Lost by 30.4", "Tied"); null
            before the first kickoff, without an opponent, with either score unread, where the platform shows us no
            starters for a side, on another team's game (viewer_side other: the words are the member's), or absent
            from an older answer
        decided:
          type: boolean
          nullable: true
          description: >-
            while the game plays, the side behind has nobody left to score and the leader cannot fall back to it (no QB
            or D/ST of the leader's still to score, or a lead of 10 points or more): the bug says Decided in place of
            the game's state; present whenever standing is and on another team's game where the member's would be,
            absent from an older answer
    WaiverBeats:
      type: object
      description: >-
        the Beats column (Lane 98): for the move the strip offers, the player that move drops (gain the move's
        week_gain); for any other row, the player his move takes out of the rest-of-season lineup the row's gain is
        measured on (the same fill); or the open spot he fills, a slot that lineup leaves empty. The player is labelled
        by his place in that rest-of-season lineup (Lane 108, B81)
      required: [host_id, name, starter, gain, open_spot]
      properties:
        open_spot:
          type: boolean
          description: >-
            he fills a slot the rest-of-season lineup leaves empty (host_id and name empty, gain null)
        host_id: { type: string, description: "the member's player's host id, a line in the answer's roster; empty for the open spot" }
        name: { type: string, description: empty for the open spot }
        starter:
          type: boolean
          description: >-
            the player named has a place in the rest-of-season lineup the row's gain is measured on (Lane 108, B81):
            the cell reads Starter, else Bench; whether he plays this week is the bye field's
        bye:
          type: boolean
          description: >-
            true when the player named is on his bye in the week the page addresses (line.facts.bye), so a starter
            reads "Starter, bye" (Lane 108, B81); absent otherwise or from an older answer
        gain:
          type: number
          format: double
          nullable: true
          description: >-
            the offered move's week_gain, else his Proj less that player's where both have one, as the screen prints them
            (tenths); null while the pickups go in season Gain order (a pickup's game has kicked off), when no week figure
            counts
    WaiverDrop:
      type: object
      description: one player of the member's an add could replace, with the lineup's gains after the swap
      required: [host_id, gain, week_gain, starts_this_week]
      properties:
        host_id: { type: string, description: "the dropped player's host id, a line in the answer's roster" }
        starts_this_week:
          type: boolean
          description: >-
            the lineup the Lineup screen sets this week starts him; the panel marks him, and the row's own drop is one
            only when the lineup stays full with the add in it (Lane 66u)
        gain: { type: number, format: double, description: "points over replacement a week to the lineup over the rest of the season, one decimal" }
        week_gain:
          type: number
          format: double
          nullable: true
          description: "this week's Proj to the lineup the advice sets, one decimal; null in season Gain order"
    WaiverRow:
      type: object
      required: [add, drop, gain, week_gain, starts, pickup, beats, drops, clears, sentence]
      properties:
        add: { $ref: "#/components/schemas/PlayerLine" }
        drop:
          allOf: [{ $ref: "#/components/schemas/PlayerLine" }]
          nullable: true
          description: null when a roster spot is open or there is no move to make
        gain: { type: number, format: double, description: "points over replacement a week to the lineup over the rest of the season with the row's drop, one decimal" }
        week_gain:
          type: number
          format: double
          nullable: true
          description: >-
            this week's Proj of the lineup the advice sets (the Lineup screen's rule) with him in and the row's drop out,
            less the lineup's without him, one decimal; 0 when he would not start. Null on every row once any pickup's
            add or drop has kicked off (gameStateAt): the pickups then go in season Gain order and no week figure counts
        starts: { type: boolean, description: "he starts this week in the lineup the advice sets with him in (the highest Proj after designations and byes)" }
        pickup:
          type: boolean
          description: >-
            a pickup worth making: he starts this week, the lineup's Proj rises, and the gain over the rest of the season
            is not below 0
        beats:
          allOf: [{ $ref: "#/components/schemas/WaiverBeats" }]
          nullable: true
          description: null when he starts in no one's place in the rest-of-season lineup and his row is not the strip's
        drops:
          type: array
          description: every player he could replace, the row's drop first, then by gain; empty when a spot is open
          items: { $ref: "#/components/schemas/WaiverDrop" }
        clears:
          type: string
          format: date
          nullable: true
          description: "the day a claim on him clears, from the platform (Yahoo's waiver wire); null when it does not say"
        sentence: { type: string }
        stash:
          allOf: [{ $ref: "#/components/schemas/WaiverStash" }]
          description: set on a row of the Stash group alone (Lane 118, B79); absent on every other row
    WaiverStash:
      type: object
      required: [back_week, per_game, ir_slot]
      properties:
        back_week:
          type: integer
          description: "the week he is due back by the listed return date: the week the page addresses (for_week) or later"
        per_game:
          type: number
          format: double
          nullable: true
          description: >-
            his rest-of-season points a game, the add's rest_of_season_per_game (the figure his player page shows), the
            figure the group sorts by; null where the board carries none
        ir_slot:
          type: boolean
          description: >-
            the member's team has an injured reserve slot open that takes him on the league's platform (ESPN, Sleeper
            and Yahoo slots from the league's settings; an out player only where the platform's slot takes one), so the
            verb is Stash; false elsewhere (FFPC and MyFantasyLeague always), the verb Add. Either way the row names the
            drop the gaining rows' rule names (an IR slot frees no bench spot until the platform moves him), none only
            with a bench spot open
    OrderAdvice:
      type: object
      required: [week, basis, basis_note, order_basis, refreshed, from_week, read_at, projection_read_at, projection_scoring, rank_by, moves, total, rows]
      properties:
        week: { type: integer, description: the week the rows' Game cell and Proj are for }
        basis:
          type: string
          description: what the order and its two figures are, said once under the rows
        basis_note:
          type: string
          description: >-
            the league's scoring rules Avg and Last miss because our stats lack them, named (Lane 111, B33: "Our stats
            omit two-point and safety.", both missed kicks said as one missed kick), empty when they
            miss none
        basis_note_list:
          type: string
          description: >-
            one sentence fragment, not a list: the rules basis_note names, as it names them, at most four then the rest counted ("two-point, missed kick,
            fumble recovery, safety and one more rule", Lane 115, B92), for the web to say in its own frame where no row
            counts the platform's points ("Avg and Last are our stats, which omit ..."); empty with no basis_note,
            absent from an older answer
        order_basis: { $ref: "#/components/schemas/OrderBasis" }
        refreshed: { type: string, format: date-time, description: when the order was made }
        from_week:
          type: integer
          nullable: true
          description: >-
            the first week the rest-of-season order covers at the read's clock: the earliest with a game still to play
            (Lane 86; a club whose game of it kicked off counts from its next week), null on the preseason order
        read_at:
          type: string
          format: date-time
          nullable: true
          description: when the league was read from its platform, null without a league
        projection_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the week's published projection was read, null when none is stored
        projection_scoring: { $ref: "#/components/schemas/ProjectionScoring" }
        rank_by:
          type: string
          enum: [rest_of_season_points, points_over_replacement]
          description: >-
            the key the rows' rank sorts on, the figure a screen shows first: the rest-of-season total at a position,
            points over replacement across positions
        moves:
          allOf: [{ $ref: "#/components/schemas/WaiverMoves" }]
          nullable: true
          description: the claim's moves on the league's platform, the Waivers screen's verb rule for an add; null without a league
        total: { type: integer, description: every player the view holds before the limit, after the search and the roster filter }
        on_club:
          type: integer
          description: >-
            the players of total on a club's roster today (Lane 165, D12): the daily list's club, so a free agent or a
            retired player, who has none, is not counted; absent from an older answer
        rows:
          type: array
          description: in our order, at most the limit
          items: { $ref: "#/components/schemas/OrderRow" }
    OrderRow:
      type: object
      required: [line, rank, rest_of_season_points, points_over_replacement, roster, move]
      properties:
        line: { $ref: "#/components/schemas/PlayerLine" }
        rank:
          type: integer
          description: >-
            his place in our order for this view as the answer draws it: at a position his position rank (by his
            rest-of-season total, which orders the same as points over replacement there), across every position his
            place by points over replacement; with byes=last the rows are numbered 1..n after the byes are moved last,
            so from the first bye row down rank and overall_rank differ
        overall_rank:
          type: integer
          description: >-
            his place in the full order of the view (the position asked, or every position) for the answer's scoring at
            the request's clock, before any byes=last move: the one number home, the club page, compare and the
            Rankings print for him (Lane 227, B209). Equal to rank without byes=last; with it the rows are not
            consecutive from the first bye down. Every row carries it; absent from an older answer
        rest_of_season_points:
          type: number
          format: double
          nullable: true
          description: >-
            the order's key, one decimal: his rest-of-season points over his club's games left at the read's
            clock (not yet kicked off) through the league's last playoff week as its platform states it (Lane 96; week 17
            when it states none and with no league), byes out (Lane 86, the player read's rest_of_season figure for
            the order's format); null on the preseason order and without a projection
        points_over_replacement:
          type: number
          format: double
          nullable: true
          description: >-
            the key across positions, one decimal: his points over replacement for the league over the weeks the order
            covers; null at a position the league starts nobody at
        roster:
          allOf: [{ $ref: "#/components/schemas/RosterMark" }]
          nullable: true
          description: whose roster in the league holds him, null without a league
        move:
          type: string
          nullable: true
          enum: [add, trade]
          description: >-
            the one move his row admits: add for a player no roster holds at a position the league starts, trade for a
            player on another roster whom the trade finder's best trade with his team brings in for the drafter, null
            otherwise (and always for the drafter's own players, and for a free agent Waivers neither lists nor
            stashes, one on injured reserve with no return week among them)
    WeekOrderAdvice:
      type: object
      required: [week, position, basis_note, read_at, projection_read_at, projection_scoring, moves, rows]
      properties:
        week: { type: integer, description: the week the rows' Game cell and Proj are for }
        position: { type: string, enum: [K, DEF] }
        basis_note:
          type: string
          description: >-
            the tab's scoring rules (kicking rules for K, defense rules for DEF) Avg and Last miss, named ("Our stats
            omit fumble recovery and safety.", the same for a reader with no league), empty
            when none
        basis_note_list:
          type: string
          description: >-
            one sentence fragment, not a list: the rules basis_note names, as it names them, at most four then the rest counted ("two-point, missed kick,
            fumble recovery, safety and one more rule", Lane 115, B92), for the web to say in its own frame where no row
            counts the platform's points ("Avg and Last are our stats, which omit ..."); empty with no basis_note,
            absent from an older answer
        read_at:
          type: string
          format: date-time
          nullable: true
          description: when the league was read from its platform, null without a league
        projection_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the week's published projection was read, null when none is stored
        projection_scoring: { $ref: "#/components/schemas/ProjectionScoring" }
        moves:
          allOf: [{ $ref: "#/components/schemas/WaiverMoves" }]
          nullable: true
          description: the claim's moves on the league's platform, the Waivers screen's verb rule for an add; null without a league
        rows:
          type: array
          description: >-
            one a club (a kicker is the club's one the projection names, else the one who kicked for it last): first
            the games still to play by Proj, ties by Avg, then those kicked off, then the clubs on bye
          items: { $ref: "#/components/schemas/WeekOrderRow" }
    WeekOrderRow:
      type: object
      required: [line, section, roster, move]
      properties:
        line: { $ref: "#/components/schemas/PlayerLine" }
        section:
          type: string
          enum: [to_play, kicked_off, bye]
          description: his game still to play, kicked off (or final) by the read's clock, or his club on bye
        roster:
          allOf: [{ $ref: "#/components/schemas/RosterMark" }]
          nullable: true
          description: whose roster in the league holds him, null without a league
        move:
          type: string
          nullable: true
          enum: [add]
          description: add on the first five free rows still to play at a position the league starts, null otherwise
    RosterMark:
      type: object
      required: [kind, team]
      properties:
        kind: { type: string, enum: [yours, free, team] }
        team: { type: string, nullable: true, description: the holding team's name when kind is team, else null }
    WaiverAdvice:
      type: object
      required: [week, basis, pickup_order, season_basis, basis_note, order_basis, refreshed, read_at, projection_read_at, projection_previous_read_at, projection_scoring, lineup_proj, pickups_proj, pickups, rows, roster, host_waivers_url, host_note, moves]
      properties:
        week: { type: integer, description: "the platform's current week, the week a claim names" }
        for_week:
          type: integer
          description: >-
            the week the page addresses (Lane 95): week, or the week after once every starter of the member's with a
            game has kicked off or is final; the rows' facts, Proj and pickups are that week's; absent from an older
            answer
        projection_arrives_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            when for_week's published projection is first captured (its first kickoff less the capture's lead), set
            only while none is read for it; null otherwise, absent from an older answer
        pickup_order:
          type: string
          enum: [week, season_gain]
          description: >-
            the order the page's rows and strip are in, decided over the full page's rows and the answer's own by each
            row's game state (gameStateAt): week (the strip by this week's Proj gain, the rows as the search ranks them)
            while no row's add or drop has kicked off; season_gain once any has (the rows by the season Gain, every week
            figure null, the strip the first row worth making); a page narrowed to one position or focused on a player
            takes season_gain whenever the full page does; season_gain too while for_week's published projection is not
            read (Lane 95), there being no Proj to order the week by
        lineup_proj:
          type: number
          format: double
          nullable: true
          description: >-
            this week's Proj of the lineup the advice sets with no add (the Lineup screen's Totals), one decimal, the
            base every week_gain counts from; null before the week's projection is read
        basis: { type: string, description: "the pickup rule, the basis's first line" }
        season_basis:
          type: string
          description: what the Rest of season column and a gain over the rest of the season are, said once under the rows
        basis_note:
          type: string
          description: >-
            the league's scoring rules Avg and Last miss because our stats lack them, named (Lane 111, B33: "Our stats
            omit two-point and safety.", both missed kicks said as one missed kick), empty when they
            miss none
        basis_note_list:
          type: string
          description: >-
            one sentence fragment, not a list: the rules basis_note names, as it names them, at most four then the rest counted ("two-point, missed kick,
            fumble recovery, safety and one more rule", Lane 115, B92), for the web to say in its own frame where no row
            counts the platform's points ("Avg and Last are our stats, which omit ..."); empty with no basis_note,
            absent from an older answer
        order_basis: { $ref: "#/components/schemas/OrderBasis" }
        refreshed: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
        projection_scoring: { $ref: "#/components/schemas/ProjectionScoring" }
        projection_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the week's published projection the rows' week_projection read was captured, null with none
        projection_previous_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the snapshot before it was captured, the read projection_delta counts from; null with none
        pickups_proj:
          type: number
          format: double
          nullable: true
          description: >-
            this week's Proj of the lineup the advice sets with every pickup made, one decimal; lineup_proj with none;
            null before the week's projection is read
        pickups:
          type: array
          description: >-
            the pickups worth making, chosen as a set from every add we rank, at most 3: each measured against the
            lineup with the ones before it made, kept only while he still starts and raises the Proj, no two taking the
            same player of the member's (topped or dropped); each one's week_gain is his over the ones before (the
            strip's cards); empty when no pickup beats the roster
          items: { $ref: "#/components/schemas/WaiverRow" }
        rows:
          type: array
          description: >-
            positive gains first by gain, then the rest by points over replacement, at most 60; by the season Gain alone in
            the season_gain order; a free agent on a season-long list (injured reserve, PUP, NFI) or ruled out this week
            is not listed in them, save the player a link asked for (an injured reserve or out free agent whose return
            week falls in the regular season is in stash instead); a week's out carried over from a game already played
            is listed, and so is one whose listing's dating is still pending (Lane 118, B94)
          items: { $ref: "#/components/schemas/WaiverRow" }
        stash:
          type: array
          description: >-
            the Stash group (Lane 118, B79): free agents on injured reserve or ruled out due back in the week the page
            addresses or later, inside the league's regular season (before its first playoff week, else the order's last
            week), each row's stash set, by his rest-of-season points a game, highest first, at most 10; one due back in
            the week the page addresses whose move gains is in rows instead; never among rows or pickups, never counted
            with the rows that gain; absent from an older answer
          items: { $ref: "#/components/schemas/WaiverRow" }
        regular_season_taken:
          type: integer
          description: >-
            the regular season's last week as taken where the league's platform states neither its playoffs' first
            week nor a playoff start (Lane 121, B99): 14, the week the Stash group keeps returns to, for its line to
            say "Regular season taken as weeks 1 to 14."; absent where the platform states it, and from an older
            answer
        stash_late:
          type: integer
          description: >-
            how many free agents on injured reserve or ruled out this page leaves unlisted because their return week
            is after the regular season (Lane 118 fix round 1), for the basis to say once; absent from an older answer
        stash_undated:
          type: integer
          description: >-
            how many free agents on injured reserve or ruled out this page leaves unlisted because no read dates their
            return (Lane 118, B79), for the basis to say once; absent from an older answer
        roster:
          type: array
          description: the member's active roster (injured reserve and taxi spots left out), the lines beats and drops name
          items: { $ref: "#/components/schemas/PlayerLine" }
        host_waivers_url: { type: string, description: "the host's waiver page, empty when we know none" }
        host_note:
          type: string
          nullable: true
          description: >-
            one sentence under the verb when we cannot open the host's page ("Make this change on Yahoo. We cannot
            open that page for you yet."), null when the url opens it
        moves: { $ref: "#/components/schemas/WaiverMoves" }
    WaiverMoves:
      type: object
      required: [claim, note, takes_writes, writes_on, reason]
      properties:
        claim:
          type: string
          enum: [available, unavailable]
          description: >-
            available when a claim can be made on the host from our screen (the host has a write path, its claim
            switch is on for the account and the account's connection agreed to the moves); unavailable when the verb
            is the host's page
        note:
          type: string
          nullable: true
          description: one sentence when a claim waits on the member (connect again to agree to moves), null otherwise
        takes_writes:
          type: boolean
          description: true where the league's platform takes a claim from our screen at all (ESPN)
        writes_on:
          type: boolean
          description: true when the platform's claim switch is on for this account (HOST_WRITES_ESPN_CLAIM or its proof list)
        reason:
          type: string
          nullable: true
          description: >-
            one line under the platform's waiver page verb saying why a claim is not made from here, naming the platform;
            null when claim is available
    TradeRecord:
      type: object
      required: [wins, losses, ties]
      properties:
        wins: { type: integer }
        losses: { type: integer }
        ties: { type: integer }
    TradeRow:
      type: object
      required: [give, get, drop, drop_reason, my_gain, their_gain, close_for_them, my_proj_change, their_proj_change]
      properties:
        give: { type: array, items: { $ref: "#/components/schemas/PlayerLine" } }
        get: { type: array, items: { $ref: "#/components/schemas/PlayerLine" } }
        drop:
          allOf: [{ $ref: "#/components/schemas/PlayerLine" }]
          nullable: true
          description: >-
            who the drafter drops to make room when the trade brings in more players than it sends and the roster has
            no open spot: never held, never one whose loss leaves a rest-of-season slot empty; among the drops that
            keep this week's lineup as the Lineup screen sets it full (a bench player, or a starter whose place a
            player the trade brings in takes), the largest rest-of-season gain, ties to the higher Proj kept, then a
            bench player, then the player our order values least (Lane 66u); the gain is after him; null otherwise
        drop_reason:
          type: string
          nullable: true
          description: >-
            the trade's sentence when its drop starts this week: the spot he starts in and the player the trade
            brings in who takes it (Lane 66u); null for a bench drop or none
        my_gain: { type: number, format: double, description: points over replacement a week to the drafter's lineup, one decimal }
        their_gain: { type: number, format: double, description: the same to theirs }
        close_for_them: { type: boolean, description: their gain is under 0.5 a week }
        my_proj_change:
          type: number
          format: double
          nullable: true
          description: >-
            this week's Proj total of the drafter's lineup with the trade less without it, each lineup set as the
            Lineup screen sets it (Lane 66g), one decimal; null when the week has no published projection read
        their_proj_change: { type: number, format: double, nullable: true, description: the same for theirs }
        my_rest_of_season:
          type: number
          format: double
          description: >-
            the drafter's rest-of-season change (Lane 269): what the players he gets score on our order over the waiver
            level at their position, less the same for those he gives and drops, over the weeks gain_basis names, one
            decimal. The waiver level is the best free agent at the position in the league's last read that the
            Waivers screen lists as a pickup (none on injured reserve, ruled out, suspended or on a season-long list),
            so a bench player counts for what he scores over the one his side could pick up and start, and a player at
            or under it counts none; at a position with no such free agent, or where the league's free agents are not
            read, the last starter league-wide (rest_of_season_basis names which). Unlike my_gain it counts the bench;
            absent from an older answer
        their_rest_of_season: { type: number, format: double, description: "the same for theirs, their drop counted against them; absent from an older answer" }
        need:
          type: string
          nullable: true
          description: >-
            the trade's sentence when the need is why it is listed (Lane 103): it sends out a player we rank first at
            his position for under 1.0 a week and fills a starting spot of the drafter's lineup for the week the page
            addresses that no one of his who can play fills, leaving no other spot empty ("Fills your empty WR2 while
            Gibbs sits on bye."); null on every other row, absent from an older answer
    TradeTeam:
      type: object
      required: [roster_id, name, owner, record, roster, trades, note]
      properties:
        roster_id: { type: integer }
        name: { type: string }
        owner: { type: string }
        record: { $ref: "#/components/schemas/TradeRecord" }
        roster:
          type: array
          description: >-
            every player on their active roster (injured reserve and taxi spots left out), by position then name: the
            builder's players on their side
          items: { $ref: "#/components/schemas/PlayerLine" }
        trades:
          type: array
          description: >-
            at most 10: the trades their lineup gains 0.5 a week or more from first, then the close calls for them,
            each group best for the drafter first; a trade sending out the top player at his position in our order
            only when it gains the drafter's lineup 1.0 a week or more or fills a need (Lane 103)
          items: { $ref: "#/components/schemas/TradeRow" }
        note:
          type: string
          nullable: true
          description: one sentence when every trade found with this team is a close call for them, else null
    LineupMoves:
      type: object
      required: [lineup, note, takes_writes, writes_on, reason]
      properties:
        takes_writes:
          type: boolean
          description: >-
            true where the league's platform takes a lineup from our screen at all (ESPN, MyFantasyLeague), false where
            it has no write path (the verb is always Copy the lineup there)
        writes_on:
          type: boolean
          description: >-
            true when the platform's write switch is on for this account (HOST_WRITES_ESPN_LINEUP or
            HOST_WRITES_MFL_LINEUP, or the account is on the switch's proof list); false where the platform takes no
            writes
        reason:
          type: string
          nullable: true
          description: >-
            one line under Copy the lineup saying why the lineup is not set from here (the platform takes no writes,
            its switch is off, or the member must connect or agree to moves), naming the platform; null when lineup is
            available

        lineup:
          type: string
          enum: [available, unavailable]
          description: >-
            available when the lineup can be set on the host from our screen (the host has a write path, its switch
            is on for the account and the account's connection agreed to the moves); unavailable when the screen's
            verb copies the lineup instead
        note:
          type: string
          nullable: true
          description: one sentence when a move waits on the member (connect again to agree to moves), null otherwise
    HostMoveChange:
      type: object
      required: [slot, in, out]
      properties:
        slot: { type: string, enum: [QB, RB, WR, TE, FLEX, SUPERFLEX, K, DEF] }
        in: { type: string, pattern: "^-?[0-9]{1,12}$", description: the host id of the player who starts in the slot }
        out:
          type: string
          nullable: true
          pattern: "^-?[0-9]{1,12}$"
          description: the host id of the starter the change sits, null for a slot the host left empty
    HostClaim:
      type: object
      required: [add, drop, bid]
      properties:
        add: { type: string, pattern: "^-?[0-9]{1,12}$", description: the host id of the player claimed }
        drop:
          type: string
          nullable: true
          pattern: "^-?[0-9]{1,12}$"
          description: the host id of the player dropped for him, null for an open roster spot
        bid:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100000
          description: >-
            the bid the member typed, in the league's waiver dollars; null where the league does not bid. We never
            suggest one.
    HostMoveInput:
      type: object
      required: [kind, week, changes]
      properties:
        kind: { type: string, enum: [lineup, claim] }
        week: { type: integer, minimum: 1, maximum: 25, description: "the week the screen read, the host's current one" }
        changes:
          type: array
          maxItems: 10
          description: a lineup's changes, at least one; empty for a claim
          items: { $ref: "#/components/schemas/HostMoveChange" }
        claim:
          allOf: [{ $ref: "#/components/schemas/HostClaim" }]
          nullable: true
          description: a claim's add, drop and bid; absent for a lineup
    HostBid:
      type: object
      required: [amount, min, max, left_known]
      properties:
        amount: { type: integer, description: the bid the plan sends }
        min: { type: integer, description: "the league's least bid" }
        max:
          type: integer
          description: >-
            what the team has left to bid, the league's budget less what it has spent; the whole budget when the host
            did not say what was spent (left_known false)
        left_known: { type: boolean, description: the host said what the team has spent, so max is what it has left }
    HostMoveConfirm:
      type: object
      required: [move, confirm]
      properties:
        move: { $ref: "#/components/schemas/HostMoveInput" }
        confirm: { type: string, minLength: 1, maxLength: 200, description: the plan's token, for this move alone }
    HostMovePlan:
      type: object
      required: [status, sentence, confirm, expires_at, host_url, bid]
      properties:
        status: { type: string, enum: [ready, unavailable] }
        sentence:
          type: string
          description: >-
            the move in words, every change named ("Start Rachaad White over Tank Bigsby at RB, and Jauan Jennings over
            Josh Downs in the flex, on ESPN now.", "Add Keenan Allen, drop Danny Amendola, bid $12. He is on waivers,
            so ESPN runs the claim on Wednesday."), or why it cannot be made here
        confirm: { type: string, nullable: true, description: the token that makes this move once, null when unavailable }
        expires_at: { type: string, format: date-time, nullable: true, description: when the token stops making it }
        host_url: { type: string, description: "the host's page for the move (lineup or waivers), empty when we know none" }
        bid:
          allOf: [{ $ref: "#/components/schemas/HostBid" }]
          nullable: true
          description: >-
            a claim in a league that bids: the bid the plan sends (the one typed, else the league's least) and the
            bounds the league allows; null otherwise
    HostMoveResult:
      type: object
      required: [outcome, sentence, host_words, host_url, move_id, processes_at]
      properties:
        outcome: { type: string, enum: [done, refused, pending, unavailable] }
        sentence: { type: string, description: our sentence for the outcome }
        host_words:
          type: string
          nullable: true
          description: the host's reason for a refusal, verbatim in its own words; null otherwise
        host_url: { type: string, description: "the host's page for the move (lineup or waivers), empty when we know none" }
        move_id: { type: string, format: uuid, nullable: true, description: the move's proof record, null when none was kept }
        processes_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            a pending claim: when the host's queue says it runs the claim (ESPN's processDate), null when it did not
            say or for any other move
    HostMove:
      type: object
      required: [id, kind, week, sentence, outcome, host_words, created_at, answered_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [lineup, claim] }
        week: { type: integer }
        sentence: { type: string, description: the move as the member confirmed it }
        outcome: { type: string, enum: [sending, not_sent, done, refused, pending] }
        host_words: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        answered_at: { type: string, format: date-time, nullable: true }
    TradeAdvice:
      type: object
      required: [week, basis, basis_note, per_game_basis, order_basis, refreshed, read_at, teams, roster, host_trades_url, host_note, check_basis, moves, projection_scoring, projection_read_at, player_points]
      properties:
        week: { type: integer, description: "the platform's current week" }
        for_week:
          type: integer
          description: >-
            the week the page addresses (Lane 95): week, or the week after once every starter of the member's with a
            game has kicked off or is final; the rows' facts and Proj changes are that week's; absent from an older
            answer
        projection_arrives_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            when for_week's published projection is first captured (its first kickoff less the capture's lead), set
            only while none is read for it; null otherwise, absent from an older answer
        check_basis:
          type: string
          description: the trade builder's own line under its scoreboard, shown before its first answer (TradeCheck.basis says the same)
        per_game_basis:
          type: string
          description: >-
            what the opened rows' points a game is, said only while a trade is opened or the builder is open; empty
            when no player shown carries the figure
        basis:
          type: string
          description: >-
            which trades are listed (a trade sending out the top player at his position in our order only when it
            gains the drafter's lineup 1.0 a week or more or fills an empty spot, Lane 103) and who decides
        gain_basis:
          type: string
          description: >-
            the line under the finder's Gain head: whose points and the weeks a Gain is a week over ("points over
            replacement in each lineup, weeks 7 to 17", Lane 103); absent from an older answer
        rest_of_season_basis:
          type: string
          description: >-
            the line for the rows' rest-of-season figures, the level they are over, and the rule that lists a trade
            (Lane 269): a trade is listed only when neither side's figure falls by more than the tolerance, GiveUpPerWeek
            points for each week the figures cover, which the line states for its weeks; absent from an older answer
        roster:
          type: array
          description: >-
            every player on the drafter's active roster (injured reserve and taxi spots left out), by position then
            name: the picker's own players, a trade found or not
          items: { $ref: "#/components/schemas/PlayerLine" }
        basis_note:
          type: string
          description: >-
            the league's scoring rules Avg and Last miss because our stats lack them, named (Lane 111, B33: "Our stats
            omit two-point and safety.", both missed kicks said as one missed kick), empty when they
            miss none
        basis_note_list:
          type: string
          description: >-
            one sentence fragment, not a list: the rules basis_note names, as it names them, at most four then the rest counted ("two-point, missed kick,
            fumble recovery, safety and one more rule", Lane 115, B92), for the web to say in its own frame where no row
            counts the platform's points ("Avg and Last are our stats, which omit ..."); empty with no basis_note,
            absent from an older answer
        order_basis: { $ref: "#/components/schemas/OrderBasis" }
        refreshed: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
        teams: { type: array, description: every other team, in standings order, items: { $ref: "#/components/schemas/TradeTeam" } }
        host_trades_url: { type: string, description: "the host's trade page, empty when we know none" }
        host_note:
          type: string
          nullable: true
          description: >-
            one sentence under the verb when we cannot open the host's page ("Make this change on Yahoo. We cannot
            open that page for you yet."), null when the url opens it
        moves: { $ref: "#/components/schemas/TradeMoves" }
        projection_scoring: { $ref: "#/components/schemas/ProjectionScoring" }
        projection_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the week's published projection behind week_projection and each proj change was captured, null with none
        player_points: { type: boolean, description: "as LineupAdvice's: the platform gives each player's points" }
    TradeMoves:
      type: object
      required: [propose, reason]
      properties:
        propose:
          type: string
          enum: [available, unavailable]
          description: >-
            available when a trade can be proposed on the platform from our screen (none today: the verb would read
            Propose on the platform); unavailable when the verb copies the offer and opens the platform's trade page
        reason:
          type: string
          nullable: true
          description: one line under the verb saying why the trade is not proposed from here, naming the platform; null when available
    TradeSideTotals:
      type: object
      required: [proj_before, proj_after, season_before, season_after]
      properties:
        proj_before:
          type: number
          format: double
          nullable: true
          description: this week's Proj total of the side's lineup as the Lineup screen sets it, one decimal; null with no projection read
        proj_after: { type: number, format: double, nullable: true, description: the same after the trade }
        season_before:
          type: number
          format: double
          description: >-
            the side's lineup strength on our rest-of-season order, points over replacement a week, one decimal: the
            figure the gains are a change in
        season_after: { type: number, format: double, description: "the same after the trade: season_before plus the side's gain" }
    TradeTotals:
      type: object
      required: [yours, theirs]
      properties:
        yours: { $ref: "#/components/schemas/TradeSideTotals" }
        theirs: { $ref: "#/components/schemas/TradeSideTotals" }
    TradeAcceptable:
      type: object
      required: [yours, theirs]
      properties:
        yours:
          type: boolean
          description: >-
            trade.my_rest_of_season, as one decimal prints it, falls by no more than the tolerance (GiveUpPerWeek points
            for each week it covers): the finder's rule for both sides, so a false on either is a trade the finder never
            lists
        theirs: { type: boolean, description: the same for theirs }
    TradeCheckInput:
      type: object
      required: [team, give, get]
      properties:
        team: { type: integer, description: "the other team's roster_id (TradeTeam.roster_id)" }
        give:
          type: array
          minItems: 1
          maxItems: 2
          description: "host ids (LeaguePlayer.host_id) of one or two of the drafter's players: every rostered player has one, placed on our board or not"
          items: { type: string, minLength: 1, maxLength: 64 }
        get:
          type: array
          minItems: 1
          maxItems: 2
          description: host ids of one or two of theirs
          items: { type: string, minLength: 1, maxLength: 64 }
    TradeFills:
      type: object
      required: [yours, theirs, yours_open, theirs_open, yours_room, theirs_room]
      properties:
        yours: { type: boolean, description: "the drafter's roster still fills every slot it filled before the trade" }
        theirs: { type: boolean, description: the same for theirs }
        yours_open:
          type: string
          nullable: true
          description: >-
            the first slot the drafter's lineup would leave empty, as a lineup row labels it ("RB2", "TE", "Flex"),
            null when it fills every slot
        theirs_open: { type: string, nullable: true, description: the same for theirs }
        yours_room:
          type: boolean
          description: >-
            the drafter's roster has room for what it takes in: an open spot, or a player to drop (trade.drop) when it
            takes in more than it gives; false when every player it could drop is a starter after the trade, held, or
            its only kicker or defense
        theirs_room: { type: boolean, description: "the same for theirs (their drop is theirs to choose, so it is not named)" }
    TradeCheck:
      type: object
      required: [week, basis, basis_note, order_basis, refreshed, read_at, trade, fills, totals, host_trades_url, host_note]
      properties:
        week: { type: integer }
        basis: { type: string, description: the honesty line beside the answer }
        basis_note:
          type: string
          description: >-
            the league's scoring rules Avg and Last miss because our stats lack them, named (Lane 111, B33: "Our stats
            omit two-point and safety.", both missed kicks said as one missed kick), empty when they
            miss none
        basis_note_list:
          type: string
          description: >-
            one sentence fragment, not a list: the rules basis_note names, as it names them, at most four then the rest counted ("two-point, missed kick,
            fumble recovery, safety and one more rule", Lane 115, B92), for the web to say in its own frame where no row
            counts the platform's points ("Avg and Last are our stats, which omit ..."); empty with no basis_note,
            absent from an older answer
        order_basis: { $ref: "#/components/schemas/OrderBasis" }
        refreshed: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
        trade:
          allOf: [{ $ref: "#/components/schemas/TradeRow" }]
          description: >-
            the trade as the finder reckons one: my_gain and their_gain fall below zero for a lineup that loses,
            close_for_them as the finder marks it
        fills: { $ref: "#/components/schemas/TradeFills" }
        totals: { $ref: "#/components/schemas/TradeTotals" }
        acceptable:
          allOf: [{ $ref: "#/components/schemas/TradeAcceptable" }]
          description: >-
            whether each side would take the trade on its rest of season (Lane 269), the finder's rule for both sides;
            absent from an older answer
        rest_of_season_basis:
          type: string
          description: >-
            the line for trade.my_rest_of_season and trade.their_rest_of_season, the level they are over, and the rule
            acceptable reads, the tolerance stated for its weeks (Lane 269); absent from an older answer
        host_trades_url: { type: string, description: "the host's trade page, the finder's, empty when we know none" }
        host_note: { type: string, nullable: true, description: "as TradeAdvice's" }
    LeagueMove:
      type: object
      required: [kind, at, roster_ids, adds, drops, bid]
      properties:
        bid: { type: integer, nullable: true, description: a claim's bid from the league's waiver budget, null for a move with none }
        kind: { type: string, enum: [add, waiver, trade] }
        at: { type: string, format: date-time }
        roster_ids: { type: array, items: { type: integer } }
        adds: { type: array, items: { $ref: "#/components/schemas/MovePlayer" } }
        drops: { type: array, items: { $ref: "#/components/schemas/MovePlayer" } }
    LeagueTerms:
      type: object
      description: the league's settings as its host states them, for the league page's settings; read only
      required: [waivers, waiver_budget, playoff_teams, playoff_weeks, roster, scoring, scoring_unstated, scoring_extra, host_settings_url]
      properties:
        waivers:
          type: string
          nullable: true
          enum: [budget, order]
          description: claims carry a bid from a season budget, or run in a waiver order; null where the host does not say
        waiver_budget: { type: integer, nullable: true, description: each team's season budget, null without one }
        playoff_teams: { type: integer, nullable: true, description: the teams that make the playoffs, null where the host does not say }
        playoff_weeks:
          allOf: [{ $ref: "#/components/schemas/PlayoffWeeks" }]
          nullable: true
          description: null where the host does not say
        roster: { $ref: "#/components/schemas/LeagueShape" }
        scoring:
          allOf: [{ $ref: "#/components/schemas/ScoringRules" }]
          nullable: true
          description: the league's rules as ScoringRules, null when the host's scoring could not be read whole
        scoring_extra:
          type: array
          description: the host's rules ScoringRules does not carry, in drafter words with the host's figure
          items: { $ref: "#/components/schemas/DroppedRule" }
        scoring_unstated:
          type: array
          description: >-
            the ScoringRules keys the platform does not state, which scoring holds at our standard figure; the
            settings print no figure for them, never ours as the league's
          items: { type: string }
        host_settings_url: { type: string, nullable: true, description: the host's page for the league's settings, null where we know none }
        playoff_seeds:
          type: array
          description: >-
            how the host's rules seed the playoffs, seed by seed (FFPC's "Seed 1) Team with best regular season
            Record, Seed 2) Team with highest point total"); absent or empty where the host states no seeding
          items: { type: string, enum: [record, points] }
        waiver_order:
          allOf: [{ $ref: "#/components/schemas/WaiverOrder" }]
          description: >-
            how an order league's waiver order moves; absent in a budget league, where the host does not say, and from
            an API before Lane 104
        tiebreak:
          allOf: [{ $ref: "#/components/schemas/Tiebreak" }]
          description: >-
            the rule the host breaks a tie in the standings by (ESPN's playoff seeding tiebreaker); absent where the
            host does not say, and from an API before Lane 104
    WaiverOrder:
      type: string
      enum: [rolling, inverse_standings]
      description: >-
        rolling, a successful claim sends the team to the back of the order; inverse_standings, the order resets each
        week, the last place first
    Tiebreak:
      type: string
      enum: [head_to_head, points_for, points_against, division_record]
      description: the rule a tie on record in the standings is broken by
    PlayoffWeeks:
      type: object
      description: the playoffs' first and last week
      required: [first, last]
      properties:
        first: { type: integer }
        last: { type: integer }
    LeagueRecord:
      type: object
      description: our record in the member's own league (Lane 93)
      required: [host, teams, lineup, weeks]
      properties:
        host: { $ref: "#/components/schemas/LeagueHost" }
        teams: { type: integer, description: "the league's teams, the count each starting slot is multiplied by" }
        lineup: { $ref: "#/components/schemas/LeagueShape" }
        weeks:
          type: array
          description: >-
            the graded weeks, in week order; empty on a platform whose week reads are not kept (every platform but
            ESPN) and before the first graded week whose roster was read before our order was set
          items: { $ref: "#/components/schemas/LeagueRecordWeek" }
    LeagueRecordWeek:
      type: object
      required: [week, benchmark, ours, theirs, margin]
      properties:
        week: { type: integer }
        benchmark:
          type: string
          enum: [espn, published]
          description: >-
            the lineup ours is graded against: espn, the lineup ESPN's own projection picks; published, the lineup the
            week's published projection picks, where the read carried no ESPN projection
        ours: { type: number, format: double, description: "our picks' points, to the tenth, as the league scores" }
        theirs: { type: number, format: double, description: "the benchmark lineup's points, to the tenth, as the league scores" }
        margin: { type: number, format: double, description: "ours less theirs, to the tenth" }
        ranking:
          $ref: "#/components/schemas/LeagueRanking"
    LeagueRanking:
      type: object
      description: >-
        the week's weekly record in the member's own league (Lane 114), present only where the benchmark is espn: our
        set order and ESPN's own projection, each graded on every rostered player with a stat line at quarterback, running back,
        receiver and tight end (none on a bye, out, suspended or on injured reserve at the read before our order was
        set) by what he scored as the league scores; absent from an answer before Lane 114
      required: [players, ours, espn]
      properties:
        players: { type: integer, description: "the rostered players graded" }
        ours: { $ref: "#/components/schemas/LeagueRankingScore" }
        espn: { $ref: "#/components/schemas/LeagueRankingScore" }
    LeagueRankingScore:
      type: object
      required: [agreement, places_off, starters, starters_of]
      properties:
        agreement:
          type: number
          format: double
          nullable: true
          description: "order matched: Spearman's rank correlation with the week's points, to two places, null when the week cannot support one"
        places_off:
          type: number
          format: double
          nullable: true
          description: "the mean distance in places between the order and the finish, to the tenth, null with no players"
        starters: { type: integer, description: "the starters the order called right in the league's lineup across its teams" }
        starters_of: { type: integer, description: "the starters the finish fills there" }
    LeagueShape:
      type: object
      description: the league's starting lineup by our slots, and its bench
      required: [qb, rb, wr, te, flex, super_flex, k, def, bench]
      properties:
        qb: { type: integer }
        rb: { type: integer }
        wr: { type: integer }
        te: { type: integer }
        flex: { type: integer }
        super_flex: { type: integer }
        k: { type: integer }
        def: { type: integer }
        bench: { type: integer }
    MovePlayer:
      type: object
      required: [player, roster_id]
      properties:
        player: { $ref: "#/components/schemas/LeaguePlayer" }
        roster_id: { type: integer, description: the team that took him (adds) or let him go (drops) }
    Placement:
      type: object
      description: how the league's rostered players were placed on our board, by rule
      required: [by_espn_id, by_defense, by_name, unplaced]
      properties:
        by_espn_id: { type: integer }
        by_defense: { type: integer }
        by_name: { type: integer }
        unplaced: { type: integer }
    LeagueSync:
      type: object
      required:
        - id
        - host
        - host_league_id
        - season
        - name
        - status
        - week
        - week_all_play
        - me
        - settings_league_id
        - settings_note
        - scoring_like
        - scoring_dropped
        - scoring_defaulted
        - teams
        - roster
        - matchup
        - moves
        - held_by
        - rostered
        - board_format
        - byes
        - placement
        - read_at
        - host_stale_seconds
        - host_failed
        - host_signed_out
        - terms
        - moves_read
      properties:
        terms: { $ref: "#/components/schemas/LeagueTerms" }
        moves_read:
          type: boolean
          description: >-
            the platform's moves are read (ESPN gives us no move history): false, moves is empty and says nothing
            about whether anyone moved
        id: { type: string, format: uuid }
        host: { $ref: "#/components/schemas/LeagueHost" }
        host_league_id: { type: string }
        season: { type: integer }
        name: { type: string }
        status: { type: string, description: the host's league state (in_season and the like), empty where the host shows none }
        week: { type: integer, description: the host's current week, 0 before the season or for a past one }
        week_all_play:
          type: boolean
          description: >-
            the host's schedule sets this week as all-play (every team scored against every other, no head-to-head
            game); the matchup then holds the drafter's side alone
        me: { type: integer, description: the drafter's roster id }
        settings_league_id:
          type: string
          format: uuid
          nullable: true
          description: the saved league a mock reruns from, null when a mock room cannot draft this league
        settings_note: { type: string, nullable: true, description: why there is no saved league, in the drafter's words }
        scoring_like:
          allOf: [{ $ref: "#/components/schemas/ScoringPreset" }]
          description: the preset the league's rules score most like, what a mock without custom scoring drafts on
        scoring_dropped:
          type: array
          description: >-
            the league's scoring rules the saved league (ScoringRules) does not carry, by the host's own
            name and figure
          items: { type: string }
        scoring_defaulted:
          type: array
          description: the ScoringRules keys the league does not state, each at its standard figure ("key figure")
          items: { type: string }
        teams:
          type: array
          description: every team, in standings order (wins, then points for)
          items: { $ref: "#/components/schemas/LeagueTeam" }
        roster: { type: array, items: { $ref: "#/components/schemas/RosterSpot" } }
        matchup: { allOf: [{ $ref: "#/components/schemas/LeagueMatchup" }], nullable: true }
        moves:
          type: array
          description: the completed moves of this week and last, newest first
          items: { $ref: "#/components/schemas/LeagueMove" }
        held_by:
          type: object
          description: >-
            the roster id holding each player a team in the league holds, by his board id; the waiver pool is our
            board without them, and every page marks them. The board is the run's own (web data/league-board), not
            part of this answer
          additionalProperties: { type: integer }
        rostered:
          type: array
          deprecated: true
          description: >-
            held_by's board ids, sorted, for a web from before held_by during the deploy window. Removed after
            2026-10-21 once the web that reads held_by has shipped
          items: { type: string }
        board_format:
          allOf: [{ $ref: "#/components/schemas/BoardFormat" }]
          description: the run's board the league reads on (ppr, half_ppr, standard or superflex)
        byes:
          type: object
          description: each NFL team's bye week this season, by team code
          additionalProperties: { type: integer }
        placement: { $ref: "#/components/schemas/Placement" }
        read_at: { type: string, format: date-time, description: when the host was last read for this league }
        host_stale_seconds:
          type: integer
          description: how stale the answer is because the host failed since, 0 when the last read reached it
        host_failed:
          type: boolean
          description: >-
            the stale answer's last read failed. False for a read kept from before this process while the next one
            goes to the host, so a stale answer names a failure only when there was one
        host_signed_out:
          type: boolean
          description: >-
            the stale answer's last read failed because no member of the league is signed in to the host (FFPC), so a
            sign-in mends it. False when fresh

    DeviceScope:
      type: string
      description: what a paired device may do; session (an app's alone) opens every signed-in route
      enum: [league:write, draft:write, session]
    DeviceKind:
      type: string
      description: what was paired, the browser extension or an app
      enum: [extension, ios, android]
    Device:
      type: object
      required: [id, name, scopes, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: what the browser called itself at pairing }
        kind:
          $ref: "#/components/schemas/DeviceKind"
        scopes: { type: array, items: { $ref: "#/components/schemas/DeviceScope" } }
        created_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: when it last sent a page, to the hour; null when it never has
    DeviceMe:
      type: object
      required: [device, handle]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        handle: { type: string, nullable: true, description: the account's public name, null when it has none }
    PairCode:
      type: object
      required: [code, expires_at]
      properties:
        code: { type: string, description: six words separated by spaces }
        expires_at: { type: string, format: date-time }
    PairInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 200, description: the six words as typed, any case or spacing }
        name: { type: string, maxLength: 60, description: what the browser calls itself, like Chrome on a Mac }
        kind:
          $ref: "#/components/schemas/DeviceKind"
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: >-
            an app's PKCE verifier, whose S256 challenge it sent on /auth/login; required for kind ios and android,
            ignored for the extension
    Paired:
      type: object
      required: [token, device]
      properties:
        token: { type: string, description: the device token, answered this once; send it as Authorization Bearer }
        device: { $ref: "#/components/schemas/Device" }

    ConnectedHost:
      type: string
      description: a host the member connects their own account on, named as a mechanism
      enum: [ffpc, yahoo, espn, mfl]
    HostConnectionStatus:
      type: string
      description: >-
        connected reads. signed_out: the host no longer honors what we keep (FFPC's session past the one kept sign-in
        allowed in six hours, a Yahoo refresh Yahoo refused, ESPN cookies ESPN no longer accepts); the member connects
        again
      enum: [connected, signed_out]
    HostConnection:
      type: object
      required: [host, status, connected_at, last_read_at, proven, consent_version, writes_on, writes_reason]
      properties:
        host: { $ref: "#/components/schemas/ConnectedHost" }
        status: { $ref: "#/components/schemas/HostConnectionStatus" }
        proven:
          type: boolean
          description: >-
            false for an ESPN session kept before any league the public cannot read was read with it (the member's
            leagues were all public, or ESPN listed none); FFPC and Yahoo prove themselves on connect
        connected_at: { type: string, format: date-time }
        last_read_at: { type: string, format: date-time, nullable: true }
        consent_version: { type: integer, description: the version of the consent words the member agreed to on connect }
        writes_on:
          type: boolean
          description: >-
            true when the member's lineup is set on the platform from our screen (the platform takes writes, its switch
            is on for the account, and the connection agreed to the moves); false otherwise, and writes_reason says why
        writes_reason:
          type: string
          nullable: true
          description: >-
            the Account room's one line naming the platform when writes are off (it takes none, its switch is off for
            the account, connect again, agree to moves, or the check failed), null when on
    HostConnectInput:
      type: object
      required: [email, password, consent]
      properties:
        email: { type: string, minLength: 1, maxLength: 128, description: "the member's FFPC sign-in (FFPC's form calls it the username)" }
        password: { type: string, minLength: 1, maxLength: 128, description: sent to FFPC's sign-in only, never answered or logged }
        consent:
          type: boolean
          description: >-
            the member agrees that we sign in to FFPC as them to read their league, never make a move or a bid, and that
            they can disconnect any time; must be true
    HostConnections:
      type: object
      required: [enabled, connections]
      properties:
        enabled: { type: array, items: { $ref: "#/components/schemas/ConnectedHost" }, description: the hosts connecting is open for }
        connections: { type: array, items: { $ref: "#/components/schemas/HostConnection" } }
    HostLeague:
      type: object
      required: [league_id, name, team_name, record]
      properties:
        league_id: { type: string }
        name: { type: string }
        team_name: { type: string }
        record: { type: string, description: "the team's record as the host writes it (FFPC 2 - 3), empty when the list does not carry it" }
        teams: { type: integer, minimum: 1, maximum: 32, description: the league's team count, where the host's list states it }
        scoring_type: { type: string, description: "the league's scoring type in our words: points, categories, best ball" }
        attached: { type: boolean, description: whether the account follows the league already, where the host's list says }
        public:
          type: boolean
          description: >-
            whether the public reads the league with no sign-in (ESPN), as one read with no cookies answered within the
            hour; absent when it was not checked or ESPN did not answer, and unmarked says which
        unmarked:
          type: string
          enum: [not_checked, no_answer]
          description: >-
            why an ESPN league carries no public mark: not_checked, past the first 10 leagues of the list, which are the
            ones checked; no_answer, ESPN did not answer the check in time
    YahooConnectInput:
      type: object
      properties:
        return_to:
          type: string
          maxLength: 200
          pattern: "^/[A-Za-z0-9_-][A-Za-z0-9/_-]{0,199}$"
          description: a page on the site to come back to once connected, like /league/{id}; the account page when absent
    ESPNConnectInput:
      type: object
      required: [swid, espn_s2, consent]
      properties:
        consent_version:
          type: integer
          minimum: 1
          description: >-
            the version of the consent words the page showed (3 names the moves); kept never above the server's own,
            and taken as 2 when absent
        swid: { type: string, minLength: 38, maxLength: 40, description: "ESPN's SWID cookie, a braced id: {XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX}" }
        espn_s2: { type: string, minLength: 40, maxLength: 600, description: "ESPN's espn_s2 cookie, kept encrypted, never answered or logged" }
        consent:
          type: boolean
          description: >-
            the member agrees that we keep an encrypted copy of their ESPN session so their league stays in sync, and
            that disconnect deletes it; must be true
    MFLConnectInput:
      type: object
      required: [username, password, consent, consent_version]
      properties:
        username: { type: string, minLength: 1, maxLength: 128, description: "the member's MyFantasyLeague username, as MyFantasyLeague's own sign-in takes it" }
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: sent once to MyFantasyLeague's login in a POST body, never kept, answered or logged
        consent:
          type: boolean
          description: >-
            the member agrees that we exchange their password once for a MyFantasyLeague session, keep that session
            encrypted (never the password), and set their lineup on MyFantasyLeague when they confirm a move; must be
            true
        consent_version:
          type: integer
          minimum: 1
          description: the version of the consent words the page showed (1 names the lineup moves); kept never above the server's own
    HostConnected:
      type: object
      required: [connection, leagues]
      properties:
        connection: { $ref: "#/components/schemas/HostConnection" }
        leagues: { type: array, items: { $ref: "#/components/schemas/HostLeague" } }
        note:
          type: string
          description: >-
            one sentence for a connection kept but not yet proven (ESPN): how many leagues ESPN lists and that the
            session is kept for the day a private league or a move needs it
