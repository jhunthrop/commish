        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/mfl:
    delete:
      tags: [hosts]
      operationId: disconnectMFL
      summary: Disconnect MyFantasyLeague. The kept session is deleted at once; lineup moves on MyFantasyLeague stop.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /rooms/{id}/ws:
    servers:
      - url: https://room.trycommish.app
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [rooms]
      operationId: roomSocket
      summary: >-
        Upgrades to a WebSocket. The client's first message is RoomHello with the last seq it applied (0 for none).
        The server answers RoomWelcome with every action after that seq, then sends RoomUpdate with each new batch
        in seq order. The client sends RoomCommand to pick, queue or leave; a refused command answers RoomError, and a command
        over its budget (queue 5 a second, pick 2, leave 1, per seat across all its sockets) answers RoomError with
        code rate_limited; a socket that keeps sending past it is closed. A seat holds at most 3 sockets and opens at
        most 12 a minute after a burst of 6; past either, the newest socket gets RoomError (rate_limited, with the
        reason) and is closed with 1008, and the client should not retry it.
        A reconnect sends the same hello with its last seq, loses nothing, and takes the seat back from its bot.
        A browser signs in by its session cookie; an app by its device token (session scope) in the Authorization
        header, never the query string, and the token wins over a cookie beside it. A socket an app opened is re-read
        at every ping: once its token is revoked or lapses it gets RoomError (unauthorized) and is closed with 1008,
        reason "signed out", and the app signs out as on a 401.
      security: [{ session: [] }, { device: [] }]
      responses:
        "101": { description: switching protocols }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

components:
  securitySchemes:
    device:
      type: http
      scheme: bearer
      description: >-
        A paired device's token (the browser extension or an app), minted once at /devices/pair and sent as
        Authorization Bearer. The extension's opens only the device routes, each of which names the scope it needs
        (league:write or draft:write). An app's (kind ios or android) also carries the session scope, which opens
        every route that names this scheme beside session, as its account. It is never a cookie, so it needs no CSRF
        token. It is stored hashed and revoked from the account page.
    session:
      type: apiKey
      in: cookie
      name: commish_session
    anon:
      type: apiKey
      in: cookie
      name: commish_anon
      description: >-
        A signed-out browser's solo mocks: a random token sealed in an HttpOnly cookie on the apex domain for 90 days,
        minted by a POST /mocks with no valid session or token, only after its settings validate, and never for a
        request the browser marks cross-site. A state-changing request echoes commish_anon_csrf (bound to the token)
        in X-Anon-CSRF-Token, never the session's cookie or header. Sign-in moves the token's mocks to the account and
        expires both cookies. An unclaimed mock is deleted after 90 days idle, or after 24 hours with no pick.

  headers:
    RunETag:
      description: weak, the run id and the file, one value per run and file (the gzip and the plain body share it)
      schema: { type: string }
    RunCacheControl:
      description: public, with a short max-age
      schema: { type: string }
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: an ETag a /run answer gave; a match answers 304 with no body
      schema: { type: string }
    TierMates:
      name: tier
      in: query
      required: false
      description: board ids, comma separated, at most 24, whose rest-of-season points the read gives in tier_format (the page's tier box)
      schema: { type: string, maxLength: 1600 }
    TierNext:
      name: tier_next
      in: query
      required: false
      description: the next tier's first board id, whose points the tier's drop is measured to
      schema: { type: string, maxLength: 64 }
    TierFormat:
      name: tier_format
      in: query
      required: false
      description: the format the tier is in, PPR when absent
      schema: { $ref: "#/components/schemas/BoardFormat" }
    WeekOrderPosition:
      name: position
      in: query
      required: true
      description: the kickers' tab (K) or the defenses' (DEF)
      schema: { type: string, enum: [K, DEF] }
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClaimCode:
      name: code
      in: path
      required: true
      schema: { type: string, minLength: 16, maxLength: 64 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    ShareCode:
      name: code
      in: path
      required: true
      description: >-
        a shared draft's settings, seed, picks and drafter, deflated and base64url encoded, then a dot and the
        server's signature; an unsigned or altered code is refused
      schema: { type: string, minLength: 8, maxLength: 2048, pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$" }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    RunNotModified:
      description: the run and the file are the ones the If-None-Match names; no body
      headers:
        ETag: { $ref: "#/components/headers/RunETag" }
        Cache-Control: { $ref: "#/components/headers/RunCacheControl" }
    ErrorResponse:
      description: the error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    EmptyResponse:
      description: done, data is null
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    HealthResponse:
      description: health
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/Health" } }
    RedirectResponse:
      description: where the browser goes next
