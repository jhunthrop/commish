openapi: 3.0.3
info:
  title: Commish API
  version: 1.0.0
  description: >-
    The prep site's request-time API (spec docs/superpowers/specs/2026-10-12-prep-site-architecture-design.md §2.2).
    Every response is the envelope: ok, data, error, meta (pages only), request_id. Every route is rate limited
    by a token bucket keyed by the signed-in account, or by the client address when signed out; a spent bucket
    answers 429 with error.code rate_limited and a Retry-After header. State-changing requests that carry the
    session cookie must echo the commish_csrf cookie in the X-CSRF-Token header.
servers:
  - url: https://api.trycommish.app
    description: the request API (cmd/api)
  - url: https://room.trycommish.app
    description: the live room service (cmd/room), WebSocket only
  - url: http://localhost:8080
    description: local development

tags:
  - { name: health }
  - { name: auth }
  - { name: leagues }
  - { name: sheets }
  - { name: exports }
  - { name: billing }
  - { name: mocks }
  - { name: rooms }
  - { name: companions }
  - { name: devices }
  - { name: hosts }

paths:
  /healthz:
    get:
      tags: [health]
      operationId: liveness
      summary: The process is up. Never touches the database.
      responses:
        "200": { $ref: "#/components/responses/HealthResponse" }
  /readyz:
    get:
      tags: [health]
      operationId: readiness
      summary: The process can reach the database.
      responses:
        "200": { $ref: "#/components/responses/HealthResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }

  /auth/login:
    get:
      tags: [auth]
      operationId: login
      summary: Redirects to WorkOS AuthKit. return_to is a path on the site the browser comes back to.
      parameters:
        - { name: return_to, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: screen, in: query, required: false, schema: { type: string, enum: [sign-in, sign-up] } }
      responses:
        "302": { description: to WorkOS }
  /auth/callback:
    get:
      tags: [auth]
      operationId: callback
      summary: WorkOS returns here. Sets the sealed session cookie on the apex domain and redirects to the site.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: to the site, or to its sign-in problem page }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Ends the session here and returns the WorkOS logout URL that ends it there.
      responses:
        "200":
          description: signed out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/Redirect" } }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    patch:
      tags: [auth]
      operationId: updateMe
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /season:
    get:
      tags: [auth]
      operationId: getSeason
      summary: >-
        The NFL season the site is in, the same object /me carries, for anyone signed in or not, so a signed-out shell
        can correct its rail at boot. Kept an hour on the API, the same answer as /me's.
      responses:
        "200":
          description: the site's season
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/SiteSeason" } }
  /me/league:
    put:
      tags: [league-sync]
      operationId: selectLeague
      summary: >-
        The site's context: one of the account's followed leagues, or a format with no league. Every page reads the
        selection from /me.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeagueChoice" }
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /leagues:
    get:
      tags: [leagues]
      operationId: listLeagues
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200":
          description: the account's saved leagues, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/League" } } }
    post:
      tags: [leagues]
      operationId: createLeague
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeagueInput" }
      responses:
        "201": { $ref: "#/components/responses/LeagueResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [leagues]
      operationId: getLeague
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/LeagueResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    put:
      tags: [leagues]
      operationId: replaceLeague
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeagueInput" }
      responses:
        "200": { $ref: "#/components/responses/LeagueResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [leagues]
      operationId: deleteLeague
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /leagues/import-scoring:
    post:
      tags: [leagues]
      operationId: importScoring
      summary: >-
        Read a league's scoring from its host by its link and answer it as ScoringRules: Sleeper from the league's
        scoring settings, ESPN from a public league's settings (a private league is refused with a sentence saying to
        make it viewable or enter the rules by hand), MyFantasyLeague from a public league's rules. Yahoo is entered
        by hand. Needs the custom_scoring feature (403 naming it). Nothing is saved.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoringImportInput" }
      responses:
        "200":
          description: the league's rules, what was applied, dropped and defaulted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/ScoringImport" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attach/preview:
    post:
      tags: [league-sync]
      operationId: previewAttach
      summary: >-
        Read a league on another host by its link (Sleeper, or a public MyFantasyLeague league) and answer its name and
        teams, so the drafter can say which team is theirs. Free. Nothing is saved.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachPreviewInput" }
      responses:
        "200": { $ref: "#/components/responses/AttachPreviewResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attach:
    post:
      tags: [league-sync]
      operationId: attachLeague
      summary: >-
        Attach the drafter's own league on another host by its link. Free. The league's roster and scoring become a
        saved league (custom scoring, exactly as the host states it) a mock reruns from, when a mock room can draft
        its shape. The drafter's seat is the team their Sleeper username runs, or the team they pick. Attaching the
        same league again updates the seat. One live league is free; a second needs the many_leagues feature
        (the Draft Pass or the Membership), refused with 403 naming it. A detached league does not count.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachInput" }
      responses:
        "201": { $ref: "#/components/responses/LeagueSyncResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached:
    get:
      tags: [league-sync]
      operationId: listAttached
      summary: The account's attached leagues, newest first.
      security: [{ session: [] }]
      responses:
        "200":
          description: up to twenty
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/AttachedLeague" } } }
  /leagues/attached/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    delete:
      tags: [league-sync]
      operationId: detachLeague
      summary: >-
        Stop following a league. The attachment is kept as detached, with the saved league it made, so the detach
        can be undone (restore) and mocks saved from it keep their settings.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [league-sync]
      operationId: restoreLeague
      summary: >-
        Undo a detach. The league is followed again with the seat and saved league it had. Like an attach, a second
        live league needs the many_leagues feature (403 naming it).
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    get:
      tags: [league-sync]
      operationId: leagueSync
      summary: >-
        The attached league as it stands: standings, the drafter's roster, the week's matchup, the moves of this week
        and last, and the unrostered pool on our board. One upstream read per league per minute whatever the viewer
        count; when the host fails, the last good read with host_stale_seconds.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/LeagueSyncResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/refresh:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    post:
      tags: [league-sync]
      operationId: refreshLeague
      summary: >-
        Read the league from its host now, shared with any read inside the last ten seconds. 30 an hour an account.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/LeagueSyncResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/lineup:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    get:
      tags: [league-sync]
      operationId: leagueLineup
      summary: >-
        Start and sit: the week's lineup for the drafter's own team, every slot filled by our order after the week's
        hard facts (bye, out, doubtful), each change from the lineup the host holds with its reason in one sentence.
        Reads the league as the sync route does. moves says whether the lineup can be set on the host from our screen
        (POST /leagues/attached/{id}/moves/plan, then /moves); nothing here writes the host.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/LineupAdviceResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/matchup:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    get:
      tags: [league-sync]
      operationId: leagueMatchup
      summary: >-
        The week's matchup as a box score: each side's starters in the host's slots and its bench, every player with
        his line (his game's facts, his points so far once his game has kicked off, the week's published projection).
        Reads the league as the sync route does; the sync answer's matchup keeps the score and the teams.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/MatchupBoxResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/waivers:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
      - name: position
        in: query
        required: false
        description: only candidates at this position
        schema: { type: string, enum: [QB, RB, WR, TE, K, DEF] }
    get:
      tags: [league-sync]
      operationId: leagueWaivers
      summary: >-
        Waivers: the unrostered players on our board ranked by the gain to the drafter's lineup, each with the drop it
        costs least to lose. A player tagged Hold on the drafter's sheets is never the drop. We submit nothing.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/WaiverAdviceResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/trades:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
      - name: player
        in: query
        required: false
        description: a board id; only trades holding this player, on either side
        schema: { type: string, minLength: 1, maxLength: 64 }
    get:
      tags: [league-sync]
      operationId: leagueTrades
      summary: >-
        The trade finder: for each other team, the one-for-one and two-for-one trades (both ways) after which both
        lineups gain on our order and both still fill every slot, best for the drafter first. A player tagged Hold on
        the drafter's sheets is never given. We never send an offer.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/TradeAdviceResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/trades/check:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    post:
      tags: [league-sync]
      operationId: checkLeagueTrade
      summary: >-
        The trade builder: one trade the drafter built with one other team, one or two players a side at QB, RB, WR
        or TE from the two rosters as the league's last read holds them, answered with the finder's own figures (the
        same engine, so a trade the finder lists answers its numbers): each lineup's gain or loss on our order, the
        drop a full roster makes for two in, and whether each roster still fills every slot. A player not on the
        named roster, a kicker, a defense, or a player on injured reserve or the taxi squad answers 422 with the
        sentence naming him. We never send an offer.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeCheckInput" }
      responses:
        "200": { $ref: "#/components/responses/TradeCheckResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "415": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/moves/plan:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    post:
      tags: [league-sync]
      operationId: planHostMove
      summary: >-
        Plan a move the screen built (kind lineup: each slot's player in and the starter out, for the week; kind claim:
        the add, the drop and the bid the member typed, where the league bids, with the bid's bounds in the answer)
        against a fresh read of the league as the member, on the member's own team only. Answers the move in words with a confirm
        token bound to the account, the league, the move's content and ten minutes; sends nothing. Answers unavailable,
        with the host's page, where the host has no write path, the host's switch is off for the account, the account's
        connection is signed out or agreed to words older than the moves (a sentence asks to connect again), or the
        stored SWID does not own the team the attached league names as the member's in ESPN's teams read.
        20 a minute an account.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostMoveInput" }
      responses:
        "200": { $ref: "#/components/responses/HostMovePlanResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /leagues/attached/{id}/moves:
    parameters:
      - name: id
        in: path
        required: true
        description: the attached league's id (AttachedLeague.id)
        schema: { type: string, format: uuid }
    get:
      tags: [league-sync]
      operationId: listHostMoves
      summary: The member's own moves on this league, newest first, the last 20.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/HostMovesResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [league-sync]
      operationId: makeHostMove
      summary: >-
        Make the planned move once, with its confirm token: checked again against a fresh read, sent to the host once
        with the member's stored session, never retried, then the host's state read back. Answers done (read back and
        matching), refused (the host's reason in its own words, nothing changed), pending (a claim in the host's queue,
        with when it runs; or sent and the read-back did not confirm it: check the host) or unavailable (the host's
        page). Every move is kept as its proof. 409 for a token
        already used, 400 for a token for another account, league or move, or expired, 422 for a move the fresh read refuses
        (another week, a starter moved, a locked player, not the member's team). 5 a minute an account.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostMoveConfirm" }
      responses:
        "200": { $ref: "#/components/responses/HostMoveResultResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }

  /sheets:
    get:
      tags: [sheets]
      operationId: listSheets
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200":
          description: the account's sheets, most recently changed first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/Sheet" } } }
    post:
      tags: [sheets]
      operationId: createSheet
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetCreate" }
      responses:
        "201": { $ref: "#/components/responses/SheetDetailResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /sheets/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [sheets]
      operationId: getSheet
      summary: The sheet with every row in rank order. Also the print view's data.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/SheetDetailResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    patch:
      tags: [sheets]
      operationId: renameSheet
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetUpdate" }
      responses:
        "200": { $ref: "#/components/responses/SheetResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [sheets]
      operationId: deleteSheet
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /sheets/{id}/rows:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    put:
      tags: [sheets]
      operationId: replaceSheetRows
      summary: Replaces every row. Rank is the order of the array, from 1. A drag sends the whole order.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetRowsReplace" }
      responses:
        "200": { $ref: "#/components/responses/SheetDetailResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /sheets/{id}/rows/{player_id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { name: player_id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    put:
      tags: [sheets]
      operationId: updateSheetRow
      summary: Sets one row's tier, tag and note. Null clears a field.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetRowUpdate" }
      responses:
        "200":
          description: the row as stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/SheetRow" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /sheets/{id}/import:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [sheets]
      operationId: importSheet
      summary: >-
        Replaces the rows from a CSV in the export's columns (rank, player_id, name, position, team, tier, tags,
        note). rank and player_id and name and position are required. tags holds up to four tags separated by
        commas, bars or semicolons, and a header named tag is read as tags. Rows are ordered by rank.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: what was imported and what was skipped, by line
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/SheetImportResult" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /sheets/{id}/exports:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [exports]
      operationId: exportSheet
      summary: Writes the sheet as a file to object storage and returns a signed link to it.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportCreate" }
      responses:
        "201": { $ref: "#/components/responses/ExportLinkResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /exports:
    get:
      tags: [exports]
      operationId: listExports
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200":
          description: the account's unexpired exports, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/Export" } } }
  /exports/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [exports]
      operationId: getExport
      summary: A fresh signed link to an export that has not expired.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/ExportLinkResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /billing/plans:
    get:
      tags: [billing]
      operationId: getPlans
      summary: >-
        What is for sale, for how much and what each product unlocks. Prices are read from Stripe, the annual
        Membership first; what each product unlocks is read from app.product_features. With checkout not open (Stripe
        not configured) the prices are the launch prices stripe-setup creates, and checkout_open says no one can pay yet.
      responses:
        "200":
          description: the catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/PlanCatalog" } }
  /billing/checkout:
    post:
      tags: [billing]
      operationId: checkout
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200": { $ref: "#/components/responses/RedirectResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /billing/portal:
    post:
      tags: [billing]
      operationId: billingPortal
      summary: The Stripe customer portal, for the card and receipts.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/RedirectResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /billing/membership/cancel:
    post:
      tags: [billing]
      operationId: cancelMembership
      summary: One-click cancellation. The Membership runs to the end of the period it was paid for and does not renew.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /billing/membership/resume:
    post:
      tags: [billing]
      operationId: resumeMembership
      summary: Undoes a cancellation before the period ends.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /billing/webhook:
    post:
      tags: [billing]
      operationId: stripeWebhook
      summary: Stripe events. The signature is verified on the raw body before anything else runs.
      parameters:
        - { name: Stripe-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /billing/group-passes:
    get:
      tags: [billing]
      operationId: listGroupPasses
      summary: The group passes this account bought, with their claim links.
      security: [{ session: [] }]
      responses:
        "200":
          description: newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/GroupPass" } } }
  /group-passes/{code}:
    parameters: [{ $ref: "#/components/parameters/ClaimCode" }]
    get:
      tags: [billing]
      operationId: previewGroupPass
      summary: What a claim link grants and how many seats are left. Readable signed out.
      responses:
        "200":
          description: the pass
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/GroupPassPreview" } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "410": { $ref: "#/components/responses/ErrorResponse" }
  /group-passes/{code}/claim:
    parameters: [{ $ref: "#/components/parameters/ClaimCode" }]
    post:
      tags: [billing]
      operationId: claimGroupPass
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AccountResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "410": { $ref: "#/components/responses/ErrorResponse" }

  /mocks:
    get:
      tags: [mocks]
      operationId: listMocks
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200":
          description: the account's mocks, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/Mock" } } }
    post:
      tags: [mocks]
      operationId: createMock
      summary: >-
        Starts a solo mock from a saved league or from settings. The answer is the room at the drafter's first
        turn: every bot pick before it is already made, with the board the room drafts from. Signed out, a browser
        keeps 25 unfinished mocks (409 past that) and every signed-out browser together starts 2,000 an hour (429
        past that).
      security: [{ session: [] }, { anon: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MockCreate" }
      responses:
        "201": { $ref: "#/components/responses/MockRoomResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "415": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [mocks]
      operationId: getMock
      summary: The room as it stands, with the board.
      security: [{ session: [] }, { anon: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      tags: [mocks]
      operationId: deleteMock
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/picks:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [mocks]
      operationId: pickMock
      summary: >-
        The drafter's pick, and every bot pick to the drafter's next turn in the same transaction, stamped with no
        delay. pick is the overall pick the drafter saw, so a second submit of the same click answers 409. The
        answer carries no board.
      security: [{ session: [] }, { anon: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MockPickInput" }
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/undo:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [mocks]
      operationId: undoMock
      summary: >-
        Takes back one of the drafter's picks and every pick after it. The draft replays from there with the same
        seed, so the bots draft the same up to the change.
      security: [{ session: [] }, { anon: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MockUndoInput" }
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/autopick:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - name: to_round
        in: query
        required: true
        schema: { type: integer, minimum: 1, maximum: 25 }
    post:
      tags: [mocks]
      operationId: autopickMock
      summary: >-
        Pick for me to round N: the drafter's turns through that round draft from the queue first, then the
        newest cheat sheet, then the board.
      security: [{ session: [] }, { anon: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/finish:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [mocks]
      operationId: finishMock
      summary: Finish the draft, every remaining turn by the same rule as autopick.
      security: [{ session: [] }, { anon: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/queue:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    put:
      tags: [mocks]
      operationId: queueMock
      summary: Replaces the drafter's queue, best first.
      security: [{ session: [] }, { anon: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MockQueueInput" }
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/card:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [mocks]
      operationId: mockCard
      summary: >-
        Our call at the drafter's turn and every player's chance of lasting to the next one, from the advisor, or
        from the engine's 200 runs when the advisor does not answer. Recorded the first time it is read and written
        with the pick.
      security: [{ session: [] }, { anon: [] }]
      responses:
        "200": { $ref: "#/components/responses/RoomCardResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /mocks/{id}/report:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [mocks]
      operationId: mockReport
      summary: The finished draft's report, computed once and kept until an undo reopens the draft.
      security: [{ session: [] }, { anon: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockReportResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /boards/{format}:
    parameters:
      - name: format
        in: path
        required: true
        schema: { type: string, enum: [ppr, half, std] }
    get:
      tags: [mocks]
      operationId: roomBoard
      summary: >-
        The board a room drafts from in a scoring format, valued for 12 teams on the standard roster: the setup
        page's player list for keepers. A room values its own league. Each player carries his designation on the
        newest hourly injury capture, and a player on a season-long list follows the available players at his
        position.
      responses:
        "200":
          description: the board
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/RoomBoard" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /games/week:
    get:
      tags: [league-sync]
      operationId: gameWeek
      summary: >-
        Every club's game in a week with its facts: the game's expected score and margin from the hourly capture, the
        venue's roof, and the weather service's forecast for the kickoff hour, each with its read time. Facts, never a
        projection. Read by a league's Matchup screen and the player pages.
      parameters:
        - name: week
          in: query
          required: false
          description: the week, 1 to 18; without it the week of the next game still to be played
          schema: { type: integer, minimum: 1, maximum: 18 }
      responses:
        "200": { $ref: "#/components/responses/GameWeekResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /shared/mocks/{code}:
    parameters: [{ $ref: "#/components/parameters/ShareCode" }]
    get:
      tags: [mocks]
      operationId: sharedMock
      summary: A shared draft replayed from its settings, seed and picks, for anyone with the link.
      responses:
        "200": { $ref: "#/components/responses/MockRoomResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /shared/mocks/{code}/report:
    parameters: [{ $ref: "#/components/parameters/ShareCode" }]
    get:
      tags: [mocks]
      operationId: sharedMockReport
      summary: The report of a shared, finished draft.
      responses:
        "200": { $ref: "#/components/responses/MockReportResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }

  /lobbies:
    get:
      tags: [rooms]
      operationId: listLobbies
      summary: Each lobby format and how full its filling room is.
      responses:
        "200":
          description: the formats, in the setup page's order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/LobbyFilling" } } }
  /lobbies/join:
    post:
      tags: [rooms]
      operationId: joinLobby
      summary: >-
        Takes a seat in the format's filling room, or opens one. A room starts when it is full or 90 seconds after
        its first drafter joined, with bots in the open seats. Needs a handle (409 with field handle without one).
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LobbyJoin" }
      responses:
        "200": { $ref: "#/components/responses/LobbySeatResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /lobbies/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [rooms]
      operationId: getLobby
      summary: The room's settings, seats and board, for a drafter with a seat in it. Picks come over the socket.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/LobbyRoomResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /lobbies/{id}/leave:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [rooms]
      operationId: leaveLobby
      summary: Gives the seat up. A filling room frees it; a drafting room hands it to a bot at once.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /lobbies/{id}/card:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [rooms]
      operationId: lobbyCard
      summary: >-
        On your turn, our call as in the solo room. Off it, the call if the board holds to your pick, with each
        player's chance of reaching it.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/RoomCardResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /lobbies/{id}/report:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [rooms]
      operationId: lobbyReport
      summary: The report of a finished lobby, for the caller's seat.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockReportResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }

  /companions:
    get:
      tags: [companions]
      operationId: listCompanions
      summary: The account's newest followed drafts, newest first, with the Sleeper username each seat was found by.
      security: [{ session: [] }]
      responses:
        "200":
          description: up to five
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/CompanionSummary" } } }
        "403": { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [companions]
      operationId: createCompanion
      summary: >-
        Follow a draft running on another host (Sleeper today) from the drafter's seat. Needs the live_draft_advisor
        feature (403 with feature otherwise). Snake drafts only; an auction, a linear order or a reversal is refused
        with a sentence. The same draft again answers the companion already made, with the seat updated.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanionCreate" }
      responses:
        "200": { $ref: "#/components/responses/CompanionResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /companions/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - name: since
        in: query
        required: false
        description: the pick count the caller already holds (its last answer's pick_count); only later picks are sent
        schema: { type: integer, minimum: 0, maximum: 1600, default: 0 }
    get:
      tags: [companions]
      operationId: getCompanion
      summary: >-
        The host's draft as of at most two seconds ago, the drafter's seat, pick N of M, picks until their turn, and at
        their turn our call. One upstream read per draft per two seconds whatever the viewer count; when the host fails,
        the last snapshot with host_stale_seconds.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/CompanionResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /companions/{id}/report:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [companions]
      operationId: companionReport
      summary: The report on the finished draft from the drafter's seat, once the host says it is complete (409 before).
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/MockReportResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: The account's paired browsers, newest first, each with its scopes and when it last sent a page.
      security: [{ session: [] }]
      responses:
        "200":
          description: up to ten
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/Device" } } }
  /devices/codes:
    post:
      tags: [devices]
      operationId: createPairCode
      summary: >-
        A one-time pairing code for the browser extension: six words, good for ten minutes and one pairing. A new code
        replaces the account's earlier one.
      security: [{ session: [] }]
      responses:
        "201":
          description: the code, shown once
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/PairCode" } }
  /devices/pair:
    post:
      tags: [devices]
      operationId: pairDevice
      summary: >-
        The extension trades a pairing code for its device token, answered this once and never again. The token goes
        in Authorization Bearer on the device routes only, never in a cookie. 10 a minute an address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairInput" }
      responses:
        "201":
          description: the device and its token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/Paired" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /devices/me:
    get:
      tags: [devices]
      operationId: deviceMe
      summary: The paired device asking, and the account it writes for, so the extension's popup can say so.
      security: [{ device: [] }]
      responses:
        "200":
          description: the device
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/DeviceMe" } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /devices/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Unpair a browser. Its token opens nothing from the next request on.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /hosts:
    get:
      tags: [hosts]
      operationId: listHostConnections
      summary: >-
        The hosts connecting is open for here (HOST_FFPC_ENABLED, HOST_YAHOO_ENABLED, HOST_ESPN_ENABLED, each with the
        credentials key present), and the hosts the account is connected to, each with its state and when it was last
        read. No credential is ever answered. Signed out it answers the switches with no
        connections: a switch is not account data. MyFantasyLeague is listed with HOST_WRITES_MFL_LINEUP on and the
        key present, and while the switch is off, signed in, to the accounts on its proof list alone.
      security: [{ session: [] }, {}]
      responses:
        "200":
          description: the connections
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/HostConnections" } }
  /hosts/ffpc/connect:
    post:
      tags: [hosts]
      operationId: connectFFPC
      summary: >-
        Sign in to FFPC as the member, through FFPC's own sign-in form, and keep what FFPC hands back (its session, and
        the sign-in because FFPC offers no other way to renew a session), envelope encrypted. Answers the member's FFPC
        leagues. Needs consent, kept with its time and words. Three refused sign-ins in an hour pause connecting for the
        hour (423). 5 an hour an account. 502 when FFPC is not answering or answers a sign-in in a way we do not expect;
        503 when FFPC is not open here or its sign-in page changed.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostConnectInput" }
      responses:
        "201":
          description: connected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/HostConnected" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "423": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/ffpc/leagues:
    get:
      tags: [hosts]
      operationId: ffpcLeagues
      summary: The member's FFPC leagues, read from FFPC as them. 409 when the connection needs a fresh sign-in.
      security: [{ session: [] }]
      responses:
        "200":
          description: the leagues
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/HostLeague" } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/ffpc:
    delete:
      tags: [hosts]
      operationId: disconnectFFPC
      summary: Disconnect FFPC. The kept sign-in and session are deleted at once; leagues read from FFPC stop updating.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/yahoo/connect:
    post:
      tags: [hosts]
      operationId: connectYahoo
      summary: >-
        Start connecting Yahoo: answers Yahoo's authorize address for the member to open, carrying a state bound to the
        account that expires in ten minutes, one use, and a PKCE S256 challenge. The permission Yahoo shows is Fantasy
        Sports, read only. The page the member started from may ride along (return_to), a path on the site the callback
        sends them back to once connected. 5 an hour an account. 503 when Yahoo is not open here.
      security: [{ session: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/YahooConnectInput" }
      responses:
        "200":
          description: the authorize address
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/Redirect" } }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/yahoo/callback:
    get:
      tags: [hosts]
      operationId: yahooCallback
      summary: >-
        Yahoo returns here. The state must be one this account started in the last ten minutes, and the browser must be
        signed in as that account. The code is exchanged for Yahoo's tokens, which are kept envelope encrypted. Always
        redirects to the site: the page the sign-in started from (return_to) or the account page with yahoo=connected,
        or the account page with yahoo=refused and why (denied, expired, signed_out, failed, off), never anywhere else.
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        "302": { description: to the site's account page with the outcome }
  /hosts/yahoo/leagues:
    get:
      tags: [hosts]
      operationId: yahooLeagues
      summary: >-
        The member's Yahoo football leagues for the current season, read from Yahoo as them, each with its size, its
        scoring type and whether the account follows it already. 404 when not connected; 409 when Yahoo refused the kept
        token and the member connects again.
      security: [{ session: [] }]
      responses:
        "200":
          description: the leagues
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/HostLeague" } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/yahoo:
    delete:
      tags: [hosts]
      operationId: disconnectYahoo
      summary: Disconnect Yahoo. The kept tokens are deleted at once; leagues read from Yahoo keep their last read, shown as stale.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/espn/connect:
    post:
      tags: [hosts]
      operationId: connectESPN
      summary: >-
        Keep the member's two ESPN cookies, SWID and espn_s2 (handed to our page by Disney's own sign-in widget, or
        pasted from ESPN's site), envelope encrypted, once ESPN reads the member's league list with them. When the list
        holds a league the public cannot read, that league is read with them too (what proves espn_s2) and the
        connection is proven (201). When no listed league is checked private, a league whose check ESPN did not answer
        is read with them instead (a refusal refuses the connect). When every listed league is public, or ESPN lists
        none, the session is kept anyway, not yet proven, for the day a private league or a move needs it (200, with a
        note saying so); the first member read of a league the public cannot read proves it later. Never a password.
        Answers the member's ESPN football leagues this season. Needs consent. 422 when ESPN does not accept the two
        values; three refusals in an hour pause connecting for the hour (423). 502, with nothing kept, when ESPN does
        not answer within the connect's 40 seconds. 5 an hour an account. 503 when ESPN is not open here.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ESPNConnectInput" }
      responses:
        "200":
          description: connected, the session kept and not yet proven against a private league
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/HostConnected" } }
        "201":
          description: connected and proven
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/HostConnected" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "423": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/espn/leagues:
    get:
      tags: [hosts]
      operationId: espnLeagues
      summary: >-
        The member's ESPN football leagues this season, read from ESPN with their cookies, public and private, each
        with its size, whether the account follows it already, and whether the public reads it (checked with no
        cookies and kept for an hour), or why it carries no mark. A session not yet proven whose list holds a league
        checked private reads that league with the cookies before answering: that proves the session, and a refusal
        signs it out. 404 when not connected; 409 when ESPN does not accept the cookies (the message says whether it
        ever did).
      security: [{ session: [] }]
      responses:
        "200":
          description: the leagues
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/HostLeague" } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/espn:
    delete:
      tags: [hosts]
      operationId: disconnectESPN
      summary: Disconnect ESPN. The kept cookies are deleted at once; private leagues read from ESPN keep their last read, shown as stale.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/mfl/connect:
    post:
      tags: [hosts]
      operationId: connectMFL
      summary: >-
        Exchange the member's MyFantasyLeague username and password once, in a POST to MyFantasyLeague's own login,
        for its session (MFL_USER_ID), then read the member's leagues with that session and keep it envelope
        encrypted with the expiry its cookie states. The password is never kept, logged or answered. Records the
        consent words' version the page showed (1 names the lineup moves), which a lineup move needs. Answers the
        member's MyFantasyLeague leagues this season (201). Open while HOST_WRITES_MFL_LINEUP is on, and to the
        accounts on its proof list while it is off (else 503). 422 when MyFantasyLeague refuses the pair; three
        refusals in an hour pause connecting for the hour (423). 502, with nothing kept, when MyFantasyLeague does
        not answer. 5 an hour an account.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFLConnectInput" }
      responses:
        "201":
          description: connected, the session kept
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/HostConnected" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "423": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/mfl/leagues:
    get:
      tags: [hosts]
      operationId: mflLeagues
      summary: >-
        The member's MyFantasyLeague leagues this season, read with their kept session, each with their team in it and
        whether the account follows it already. 404 when not connected; 409 when MyFantasyLeague no longer accepts
        the session (or it is past its expiry), which signs it out.
      security: [{ session: [] }]
      responses:
        "200":
          description: the leagues
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/HostLeague" } } }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/mfl:
    delete:
      tags: [hosts]
      operationId: disconnectMFL
      summary: Disconnect MyFantasyLeague. The kept session is deleted at once; lineup moves on MyFantasyLeague stop.
      security: [{ session: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

  /rooms/{id}/ws:
    servers:
      - url: https://room.trycommish.app
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [rooms]
      operationId: roomSocket
      summary: >-
        Upgrades to a WebSocket. The client's first message is RoomHello with the last seq it applied (0 for none).
        The server answers RoomWelcome with every action after that seq, then sends RoomUpdate with each new batch
        in seq order. The client sends RoomCommand to pick, queue or leave; a refused command answers RoomError, and a command
        over its budget (queue 5 a second, pick 2, leave 1, per seat across all its sockets) answers RoomError with
        code rate_limited; a socket that keeps sending past it is closed. A seat holds at most 3 sockets and opens at
        most 12 a minute after a burst of 6; past either, the newest socket gets RoomError (rate_limited, with the
        reason) and is closed with 1008, and the client should not retry it.
        A reconnect sends the same hello with its last seq, loses nothing, and takes the seat back from its bot.
      security: [{ session: [] }]
      responses:
        "101": { description: switching protocols }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }

components:
  securitySchemes:
    device:
      type: http
      scheme: bearer
      description: >-
        A paired browser's device token (the extension), minted once at /devices/pair and sent as Authorization Bearer.
        It opens only the device routes, each of which names the scope it needs (league:write or draft:write); it is
        never a cookie, so it needs no CSRF token. It is stored hashed and revoked from the account page.
    session:
      type: apiKey
      in: cookie
      name: commish_session
    anon:
      type: apiKey
      in: cookie
      name: commish_anon
      description: >-
        A signed-out browser's solo mocks: a random token sealed in an HttpOnly cookie on the apex domain for 90 days,
        minted by a POST /mocks with no valid session or token, only after its settings validate, and never for a
        request the browser marks cross-site. A state-changing request echoes commish_anon_csrf (bound to the token)
        in X-Anon-CSRF-Token, never the session's cookie or header. Sign-in moves the token's mocks to the account and
        expires both cookies. An unclaimed mock is deleted after 90 days idle, or after 24 hours with no pick.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClaimCode:
      name: code
      in: path
      required: true
      schema: { type: string, minLength: 16, maxLength: 64 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    ShareCode:
      name: code
      in: path
      required: true
      description: >-
        a shared draft's settings, seed, picks and drafter, deflated and base64url encoded, then a dot and the
        server's signature; an unsigned or altered code is refused
      schema: { type: string, minLength: 8, maxLength: 2048, pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$" }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    ErrorResponse:
      description: the error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    EmptyResponse:
      description: done, data is null
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    HealthResponse:
      description: health
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/Health" } }
    RedirectResponse:
      description: where the browser goes next
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/Redirect" } }
    AccountResponse:
      description: the signed-in account
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/Account" } }
    LeagueResponse:
      description: a saved league
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/League" } }
    SheetResponse:
      description: a sheet without its rows
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/Sheet" } }
    SheetDetailResponse:
      description: a sheet with its rows
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/SheetDetail" } }
    ExportLinkResponse:
      description: an export with a signed link
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/ExportLink" } }
    MockRoomResponse:
      description: a solo room as it stands
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/MockRoom" } }
    RoomCardResponse:
      description: our call and the odds
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/RoomCard" } }
    MockReportResponse:
      description: a finished draft's report
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/MockReport" } }
    CompanionResponse:
      description: a live-draft companion as it stands
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/Companion" } }
    LeagueSyncResponse:
      description: an attached league as it stands
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/LeagueSync" } }
    GameWeekResponse:
      description: every club's game in the week with its facts
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/GameWeek" } }
    LineupAdviceResponse:
      description: the week's lineup advice for the drafter's team
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/LineupAdvice" } }
    MatchupBoxResponse:
      description: the week's matchup as a box score
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/MatchupBox" } }
    WaiverAdviceResponse:
      description: the waiver pool ranked by the gain to the drafter's lineup
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/WaiverAdvice" } }
    TradeAdviceResponse:
      description: the trades that help both lineups, by team
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/TradeAdvice" } }
    TradeCheckResponse:
      description: one trade the drafter built, with each lineup's change
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/TradeCheck" } }
    AttachPreviewResponse:
      description: a league's name and teams, before it is attached
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/AttachPreview" } }
    LobbySeatResponse:
      description: the seat taken
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/LobbySeat" } }
    LobbyRoomResponse:
      description: a lobby room
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/LobbyRoom" } }
    HostMovePlanResponse:
      description: the move in words with its confirm token, or why it cannot be made here
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/HostMovePlan" } }
    HostMoveResultResponse:
      description: what the move came to
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { $ref: "#/components/schemas/HostMoveResult" } }
    HostMovesResponse:
      description: the member's own moves on the league
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties: { data: { type: array, items: { $ref: "#/components/schemas/HostMove" } } }

  schemas:
    Envelope:
      type: object
      required: [ok, data, error, request_id]
      properties:
        ok: { type: boolean }
        data: { nullable: true, description: the payload, null on error }
        error:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ErrorBody" }]
        meta:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PageMeta" }]
        request_id: { type: string }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            invalid, unauthorized, forbidden, not_found, conflict, rate_limited, csrf, payload_too_large, unsupported_media_type,
            billing_unavailable, storage_unavailable, unavailable, internal, team_not_read (a 404 from an in-season route:
            the drafter's team is missing from the league's last read, so reading the host again may find it)
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        feature: { $ref: "#/components/schemas/Feature" }
    PageMeta:
      type: object
      required: [page, per_page, total]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        version: { type: string }
    Redirect:
      type: object
      required: [url]
      properties:
        url: { type: string }

    Feature:
      type: string
      enum: [live_draft_advisor, custom_scoring, full_reasoning, range_of_outcomes, synced_sheet, early_run, start_sit, waiver_ranks, trade_finder, many_leagues]
    Product:
      type: string
      enum: [draft_pass, membership, group_pass]
    Interval:
      type: string
      enum: [year, month]

    Account:
      type: object
      required: [id, email, first_name, last_name, handle, features, draft_pass, membership, league, leagues, format, season, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        league:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ContextLeague" }]
          description: >-
            the selected league, the site's context; with no selection made, the newest followed league; null when the
            account follows none or chose a format alone
        leagues:
          type: array
          description: every league the account follows, newest first, as the shell's switcher lists them
          items: { $ref: "#/components/schemas/ContextLeague" }
        format:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BoardFormat" }]
          description: >-
            the context's format, the board every page opens in: the selected league's, else the format chosen with
            no league, null when neither
        season: { $ref: "#/components/schemas/SiteSeason" }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        handle:
          type: string
          nullable: true
          description: the name shown in lobbies, 3 to 20 letters, digits or underscores, not starting with a digit
        features:
          type: array
          items: { $ref: "#/components/schemas/Feature" }
        draft_pass:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DraftPassState" }]
        membership:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/MembershipState" }]
        created_at: { type: string, format: date-time }
    DraftPassState:
      type: object
      required: [season, ends_at, source]
      properties:
        season: { type: integer }
        ends_at: { type: string, format: date-time }
        source: { type: string, enum: [purchase, group_pass, grant] }
    MembershipState:
      type: object
      description: >-
        the account's Membership, from its live membership entitlement whatever its source, else its
        latest subscription. A subscription carries its billing (interval, current_period_end and
        cancel_at_period_end). A grant bought nothing, so those three are null.
      required: [source, status, starts_at, ends_at, interval, current_period_end, cancel_at_period_end]
      properties:
        source: { type: string, enum: [subscription, grant] }
        status: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true, description: "when access ends, null for a grant with no end" }
        interval:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Interval" }]
        current_period_end: { type: string, format: date-time, nullable: true }
        cancel_at_period_end: { type: boolean, nullable: true }
    AccountUpdate:
      type: object
      required: [handle]
      properties:
        handle: { type: string, minLength: 3, maxLength: 20, pattern: "^[A-Za-z_][A-Za-z0-9_]{2,19}$" }

    ScoringPreset:
      type: string
      enum: [ppr, half_ppr, standard, te_premium]
    Lineup:
      type: string
      enum: [standard, superflex, two_flex]
    BotStyle:
      type: string
      enum: [adp, last_draft]
    BoardFormat:
      type: string
      enum: [ppr, half_ppr, standard, te_premium, superflex, two_flex, dynasty, best_ball]
    ContextLeague:
      type: object
      description: a followed league as the site's context reads it
      required: [id, name, host, team_name, standing, scoring, format, settings_league_id, phase, phase_basis, draft_at, playoff_start_week, waivers_open]
      properties:
        id: { type: string, format: uuid, description: the attachment (AttachedLeague.id) }
        name: { type: string, description: "the league's name at its last read, else its saved league's" }
        host: { $ref: "#/components/schemas/LeagueHost" }
        team_name: { type: string, description: "the drafter's team at the last read, empty when unread" }
        standing:
          allOf: [{ $ref: "#/components/schemas/LeagueStanding" }]
          nullable: true
          description: the drafter's record and place at the last read, null when unread
        scoring:
          allOf: [{ $ref: "#/components/schemas/ScoringPreset" }]
          description: the preset the league's scoring is, or scores most like (its saved league's, else its last read's)
        format:
          allOf: [{ $ref: "#/components/schemas/BoardFormat" }]
          description: >-
            the board the league reads on: superflex for a superflex lineup, otherwise ppr, half_ppr or standard by
            the league's points per reception (TE premium reads on ppr until its exact rules have a board)
        settings_league_id:
          type: string
          format: uuid
          nullable: true
          description: the saved league a mock reruns from, null when a mock room cannot draft this league
        phase: { $ref: "#/components/schemas/LeaguePhase" }
        phase_basis: { type: string, description: "one sentence naming the fact the phase came from, in the site's words" }
        draft_at: { type: string, format: date-time, nullable: true, description: "the host's draft time, null when the host does not say" }
        playoff_start_week:
          type: integer
          nullable: true
          description: the league's first playoff week as the host states it, null when the host does not say
        waivers_open:
          type: boolean
          description: >-
            the host still runs waivers this week: false in and after the playoffs where the host closes them, and once
            the season is over, else true
    LeaguePhase:
      type: string
      enum: [pre_draft, draft_day, in_season, playoffs, offseason]
      description: >-
        where a followed league is in its season, computed at read time from the host's facts: pre_draft before its
        draft, draft_day when the draft starts within 24 hours or is under way, in_season from the draft to the playoffs
        (a drafted league the host gives no current week is in_season while the site season is preseason), playoffs
        from the league's playoff start week until the host says the season is over, offseason after it (or a drafted
        league with no current week once the NFL regular season has ended)
    SiteSeason:
      type: object
      description: the NFL season the site is in, for a visitor with no league, from the kickoffs the API reads
      required: [phase, week, basis]
      properties:
        phase: { type: string, enum: [preseason, in_season, playoffs, offseason] }
        week: { type: integer, description: "the NFL week in play, 0 before week 1 and after the season" }
        basis: { type: string, description: one sentence naming the fact the phase came from, in the site's words }
        board_week:
          type: integer
          description: >-
            the first week the published board covers, read from the published run the board routes read. Absent
            (never null) before the first in-season board, outside the regular season, and when the board's week
            could not be read, which basis then says. When it is behind week, basis says why.
    LeagueChoice:
      type: object
      description: >-
        exactly one of league_id (a followed league) and format (no league: any board format, the web offering
        the ones the run carries)
      properties:
        league_id: { type: string, format: uuid, nullable: true }
        format:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BoardFormat" }]
    Scoring:
      type: object
      description: exactly one of preset and custom. custom needs the custom_scoring feature.
      properties:
        preset:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ScoringPreset" }]
        custom:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ScoringRules" }]
    ScoringRules:
      type: object
      additionalProperties: false
      description: >-
        A league's exact scoring: the 21 research/model/domain.py ScoringRules names (the board's rules), every one
        required, then a kicker's longer field goals and a team defense's points-allowed and yards-allowed tiers, each
        optional and read at its standard figure when absent (a body from before they existed stays good); every rule
        is always answered. An unknown key is a field error that names it. Points per yard for the yardage rules, per event for the rest.
        points_per_field_goal is a field goal made under 40 yards, and any field goal whose distance the stat line does
        not say. A tier is the points a defense scores for a game whose points or yards allowed fall in its range, both
        ends included; a tier the league does not score is 0.
      required: [points_per_passing_yard, points_per_passing_touchdown, points_per_interception, points_per_rushing_yard, points_per_rushing_touchdown, points_per_receiving_yard, points_per_receiving_touchdown, points_per_reception, points_per_fumble_lost, te_reception_bonus, points_per_field_goal, points_per_extra_point, points_per_sack, points_per_defensive_interception, points_per_defensive_touchdown, points_per_two_point_conversion, points_per_field_goal_missed, points_per_extra_point_missed, points_per_return_touchdown, points_per_defensive_fumble_recovery, points_per_safety]
      properties:
        points_per_passing_yard: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_passing_touchdown: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_interception: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_rushing_yard: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_rushing_touchdown: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_receiving_yard: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_receiving_touchdown: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_reception: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_fumble_lost: { type: number, format: double, minimum: -100, maximum: 100 }
        te_reception_bonus: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_field_goal: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_extra_point: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_sack: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_defensive_interception: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_defensive_touchdown: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_two_point_conversion: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_field_goal_missed: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_extra_point_missed: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_return_touchdown: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_defensive_fumble_recovery: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_safety: { type: number, format: double, minimum: -100, maximum: 100 }
        points_per_field_goal_40_49: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_per_field_goal_50_plus: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_0: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_1_6: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_7_13: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_14_17: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_18_20: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_21: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_22_27: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_28_34: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_35_45: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        points_allowed_46_plus: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_0_99: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_100_199: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_200_299: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_300_349: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_350_399: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_400_449: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_450_499: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_500_549: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
        yards_allowed_550_plus: { type: number, format: double, minimum: -100, maximum: 100, x-go-type-skip-optional-pointer: true, x-omitempty: false }
    ScoringImportInput:
      type: object
      required: [host, link]
      properties:
        host: { type: string, enum: [sleeper, espn, mfl] }
        link: { type: string, minLength: 1, maxLength: 300, description: the league link as pasted, or its id }
    NamedPick:
      type: object
      required: [host_name, board_name]
      properties:
        host_name: { type: string, description: the player as the host names him }
        board_name: { type: string, description: the player as our board names him }
    DroppedRule:
      type: object
      required: [group, rule, points]
      properties:
        group: { type: string, enum: [offense, bonus, kicking, defense, other] }
        rule: { type: string, description: the rule in drafter words, no commas }
        points:
          type: number
          format: double
          nullable: true
          description: the host's figure, null when the rule's own words carry it
    ScoringImport:
      type: object
      required: [rules, applied, dropped, defaulted]
      properties:
        rules: { $ref: "#/components/schemas/ScoringRules" }
        applied:
          type: array
          items: { type: string }
          description: >-
            the rules the host states, by our names, with every points-allowed and yards-allowed tier: a tier the host
            does not score is 0, as the host scores it
        dropped:
          type: array
          items: { $ref: "#/components/schemas/DroppedRule" }
          description: every host rule ScoringRules does not carry, in drafter words by group with its figure, never silently lost
        defaulted:
          type: array
          items: { type: string }
          description: the rules the host does not state, each at the standard figure (never a tier, see applied)
    RosterCounts:
      type: object
      description: starters per position and the bench. Flex spots come from the lineup.
      required: [qb, rb, wr, te, k, dst, bench]
      properties:
        qb: { type: integer, minimum: 0, maximum: 4 }
        rb: { type: integer, minimum: 0, maximum: 6 }
        wr: { type: integer, minimum: 0, maximum: 6 }
        te: { type: integer, minimum: 0, maximum: 4 }
        k: { type: integer, minimum: 0, maximum: 2 }
        dst: { type: integer, minimum: 0, maximum: 2 }
        bench: { type: integer, minimum: 0, maximum: 15 }
    Keeper:
      type: object
      required: [slot, player_id, round]
      properties:
        slot: { type: integer, minimum: 1 }
        player_id: { type: string, maxLength: 64 }
        round: { type: integer, minimum: 1 }
    LeagueSettings:
      type: object
      required: [scoring, teams, slot, roster, lineup, keepers, bot_style]
      properties:
        scoring: { $ref: "#/components/schemas/Scoring" }
        teams: { type: integer, minimum: 8, maximum: 14 }
        slot: { type: integer, nullable: true, minimum: 1, description: null drafts from a random slot }
        roster: { $ref: "#/components/schemas/RosterCounts" }
        lineup: { $ref: "#/components/schemas/Lineup" }
        keepers:
          type: array
          maxItems: 56
          items: { $ref: "#/components/schemas/Keeper" }
        bot_style: { $ref: "#/components/schemas/BotStyle" }
    LeagueInput:
      type: object
      required: [name, settings]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
    League:
      type: object
      required: [id, name, settings, rounds, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        rounds: { type: integer, description: the roster's total, which is the draft's round count }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SheetTag:
      type: string
      description: The fixed tags. A row's tags may also hold the drafter's own words (SheetTags).
      enum: [target, sleeper, breakout, avoid, injury, handcuff]
    SheetTags:
      type: array
      description: >-
        Up to four tags, each one of the fixed SheetTag values or the drafter's own word: 1 to 20 letters, digits,
        spaces, apostrophes, periods or hyphens, starting with a letter or digit. A word that matches a fixed tag in
        any case is stored as the fixed tag. No tag appears twice in any case.
      maxItems: 4
      items: { type: string, minLength: 1, maxLength: 20 }
    Sheet:
      type: object
      required: [id, name, format, row_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        format: { $ref: "#/components/schemas/BoardFormat" }
        row_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SheetRow:
      type: object
      required: [player_id, name, position, team, headshot, rank, tier, tags, note]
      properties:
        player_id: { type: string }
        name: { type: string }
        position: { type: string }
        team: { type: string, nullable: true }
        headshot: { type: string, nullable: true, description: the face the drafter saw when the row was added }
        rank: { type: integer }
        tier: { type: integer, nullable: true }
        tags: { $ref: "#/components/schemas/SheetTags" }
        note: { type: string, nullable: true }
    SheetDetail:
      allOf:
        - $ref: "#/components/schemas/Sheet"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: "#/components/schemas/SheetRow" }
    SheetRowInput:
      type: object
      required: [player_id, name, position]
      properties:
        player_id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 80 }
        position:
          type: string
          minLength: 1
          maxLength: 8
          description: QB, RB, WR, TE, K or DST, in any case. DEF and D/ST are stored as DST, PK as K.
        team: { type: string, nullable: true, maxLength: 8 }
        headshot: { type: string, nullable: true, minLength: 9, maxLength: 300, description: an https URL }
        tier: { type: integer, nullable: true, minimum: 1, maximum: 50 }
        tags: { $ref: "#/components/schemas/SheetTags" }
        note: { type: string, nullable: true, maxLength: 500 }
    SheetCreate:
      type: object
      required: [name, format]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        format: { $ref: "#/components/schemas/BoardFormat" }
        rows:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/SheetRowInput" }
    SheetUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    SheetRowsReplace:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/SheetRowInput" }
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 60
          description: >-
            The sheet's name, written in the same guarded write as the rows, so a rename can never pass a stale
            if_updated_at. Absent or null keeps the name.
        if_updated_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            The sheet's updated_at as the writer last read it. When given and the sheet has changed since, nothing
            is written and the answer is 409 conflict, so a second device never overwrites the first unseen.
    SheetRowUpdate:
      type: object
      required: [tier, tags, note]
      properties:
        tier: { type: integer, nullable: true, minimum: 1, maximum: 50 }
        tags: { $ref: "#/components/schemas/SheetTags" }
        note: { type: string, nullable: true, maxLength: 500 }
    ImportSkip:
      type: object
      required: [line, reason]
      properties:
        line: { type: integer }
        reason: { type: string }
    SheetImportResult:
      type: object
      required: [imported, skipped, sheet]
      properties:
        imported: { type: integer }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/ImportSkip" }
        sheet: { $ref: "#/components/schemas/SheetDetail" }

    ExportFormat:
      type: string
      enum: [csv]
    ExportCreate:
      type: object
      required: [format]
      properties:
        format: { $ref: "#/components/schemas/ExportFormat" }
    Export:
      type: object
      required: [id, sheet_id, format, file_name, bytes, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        sheet_id: { type: string, format: uuid, nullable: true }
        format: { $ref: "#/components/schemas/ExportFormat" }
        file_name: { type: string }
        bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    ExportLink:
      allOf:
        - $ref: "#/components/schemas/Export"
        - type: object
          required: [url, url_expires_at]
          properties:
            url: { type: string }
            url_expires_at: { type: string, format: date-time }

    Price:
      type: object
      required: [lookup_key, amount_cents, currency, interval]
      properties:
        lookup_key: { type: string }
        amount_cents: { type: integer, format: int64 }
        currency: { type: string }
        interval:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Interval" }]
    PlanCatalog:
      type: object
      description: >-
        A product whose price is not set in Stripe yet is null (draft_pass, group_pass) or missing from the list
        (membership). While checkout is not open the prices are the launch prices.
      required: [season, pass_ends_at, checkout_open, features, draft_pass, membership, group_pass]
      properties:
        season: { type: integer, description: "the season a pass bought now is for: the current one until its first kickoff, then the next" }
        pass_ends_at: { type: string, format: date-time, description: "when a pass bought now ends: its season's end, March 1 UTC" }
        checkout_open: { type: boolean, description: false while Stripe is not configured, and checkout answers 503 }
        features: { $ref: "#/components/schemas/PlanFeatures" }
        draft_pass:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Price" }]
        membership:
          type: array
          description: annual first
          items: { $ref: "#/components/schemas/Price" }
        group_pass:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/GroupPassPrice" }]
    PlanFeatures:
      type: object
      description: what each product unlocks, from app.product_features. A group pass seat is a draft_pass.
      required: [draft_pass, membership]
      properties:
        draft_pass:
          type: array
          items: { $ref: "#/components/schemas/Feature" }
        membership:
          type: array
          items: { $ref: "#/components/schemas/Feature" }
    GroupPassPrice:
      type: object
      required: [per_seat, min_seats, max_seats]
      properties:
        per_seat: { $ref: "#/components/schemas/Price" }
        min_seats: { type: integer }
        max_seats: { type: integer }
    CheckoutRequest:
      type: object
      required: [product]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        interval:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Interval" }]
        seats: { type: integer, nullable: true, minimum: 8, maximum: 14, description: "group_pass only: one pass per team, the league bounds" }
        league_name: { type: string, nullable: true, maxLength: 60, description: group_pass only }
    GroupPass:
      type: object
      required: [id, league_name, season, seats, claimed, claims, claim_url, claim_code, claimed_by_me, status, created_at]
      properties:
        id: { type: string, format: uuid }
        league_name: { type: string }
        season: { type: integer }
        seats: { type: integer }
        claimed: { type: integer }
        claims:
          type: array
          description: each claimed seat, first claim first; the seats past these are open
          items: { $ref: "#/components/schemas/GroupPassClaim" }
        claim_url: { type: string }
        claim_code: { type: string, description: the code in the claim link, for the buyer's own claim }
        claimed_by_me: { type: boolean, description: the buyer holds one of its seats }
        status: { type: string, enum: [active, refunded, disputed] }
        created_at: { type: string, format: date-time }
    GroupPassClaim:
      type: object
      required: [handle, claimed_at]
      properties:
        handle: { type: string, nullable: true, description: the claimer's lobby handle, null before they choose one }
        claimed_at: { type: string, format: date-time }
    GroupPassPreview:
      type: object
      required: [league_name, season, seats, claimed, purchaser_handle, claimed_by_me]
      properties:
        league_name: { type: string }
        season: { type: integer }
        seats: { type: integer }
        claimed: { type: integer }
        purchaser_handle: { type: string, nullable: true }
        claimed_by_me: { type: boolean }

    MockStatus:
      type: string
      enum: [active, complete]
    MockCreate:
      type: object
      description: exactly one of league_id and settings
      properties:
        league_id: { type: string, format: uuid, nullable: true }
        settings:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/LeagueSettings" }]
        seed: { type: integer, format: int64, nullable: true, minimum: 0, maximum: 4294967295 }
    Mock:
      type: object
      required: [id, league_id, settings, seed, status, created_at, updated_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        league_id: { type: string, format: uuid, nullable: true }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        seed: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/MockStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    PlayerPosition:
      type: string
      enum: [QB, RB, WR, TE, K, DEF]
    BoardPlayer:
      type: object
      description: one player of the board a room drafts from
      required: [id, name, position, team, headshot, adp, points, vor, position_rank, bye]
      properties:
        id: { type: string }
        name: { type: string }
        position: { $ref: "#/components/schemas/PlayerPosition" }
        team: { type: string }
        headshot: { type: string }
        adp: { type: number, format: double, nullable: true, description: where drafters take him, null with no source }
        points: { type: number, format: double, nullable: true, description: projected season points, null for kickers and defenses }
        vor: { type: number, format: double, nullable: true, description: points over replacement for this league, null when it has none }
        position_rank: { type: integer }
        bye: { type: integer, nullable: true }
        status:
          $ref: "#/components/schemas/BoardStatus"
    BoardStatus:
      type: object
      description: >-
        his injury designation on the newest hourly capture (GET /boards/{format} only), absent when the capture does
        not list him
      required: [status, season_long, since, as_of, source]
      properties:
        status: { $ref: "#/components/schemas/DesignationStatus" }
        season_long:
          type: boolean
          description: >-
            injured reserve, suspended, PUP, NFI, or out with the capture's note saying out for the season: his
            rest-of-season figure assumes he plays, so he is placed below every available player at his position. A
            week's out, doubtful or questionable moves nothing
        since:
          type: string
          format: date-time
          nullable: true
          description: >-
            the first capture of his unbroken run under a season-long status; null for a week's designation and for a
            run older than the captures read, whose start we do not know
        as_of: { type: string, format: date-time, description: the stamp of the capture that lists him }
        source: { type: string, description: "the capture's feed in the research store: tank01_injuries_by_date" }
    StatusRead:
      type: object
      description: the injury capture a board's statuses come from, absent when none was read
      required: [as_of, checked_at, source]
      properties:
        as_of:
          type: string
          format: date-time
          description: the capture's stamp, when the list last changed (an unchanged list is not stored again)
        checked_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            the capture job's last successful check of the list, null when the store records none: say "read" at
            this time, and "as the list stood" at as_of without it
        source: { type: string, description: the capture's feed in the research store }
    RoomBoard:
      type: object
      required: [format, season, as_of, basis, players]
      properties:
        format: { type: string, enum: [ppr, half, std] }
        season: { type: integer }
        as_of: { type: string, format: date-time }
        basis: { type: string, description: the sentence naming what the numbers are }
        status_read:
          $ref: "#/components/schemas/StatusRead"
        players:
          type: array
          description: >-
            every player in the order drafters take them; on GET /boards/{format}, each player on a season-long list
            follows the last available player at his position
          items: { $ref: "#/components/schemas/BoardPlayer" }
    RoomPick:
      type: object
      required: [pick, round, seat, player_id, auto]
      properties:
        pick: { type: integer }
        round: { type: integer }
        seat: { type: integer, description: the 1-based draft slot that made it }
        player_id: { type: string }
        auto: { type: boolean, description: "the clock made it: an expired turn. In a lobby, who made a pick is the log row's pick.by" }
    MockRoom:
      type: object
      required: [id, league_id, status, seed, settings, teams, rounds, slot, pick_number, on_clock, waiting, picks, queue, seq, share_code, created_at]
      properties:
        id: { type: string, format: uuid, nullable: true, description: null for a shared draft }
        league_id: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/MockStatus" }
        seed: { type: integer, format: int64 }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        teams: { type: integer }
        rounds: { type: integer }
        slot: { type: integer, description: the drafter's 1-based slot }
        pick_number: { type: integer, description: the pick on the clock, past the last pick when the draft is over }
        on_clock: { type: integer, nullable: true, description: the slot on the clock }
        waiting: { type: boolean, description: the drafter is on the clock }
        picks:
          type: array
          items: { $ref: "#/components/schemas/RoomPick" }
        queue:
          type: array
          items: { type: string }
        seq: { type: integer, format: int64 }
        share_code: { type: string, description: "the link's code: the settings, seed, picks and drafter, signed by the server" }
        shared_by: { type: string, description: "the drafter's handle, when he has one: a shared draft names whose it is" }
        created_at: { type: string, format: date-time }
        board:
          description: the board, on a full read (create, get, shared) and absent on a pick's answer
          allOf: [{ $ref: "#/components/schemas/RoomBoard" }]
        card:
          description: >-
            the drafter's card at the turn on the clock, the one GET /mocks/{id}/card records, so the
            turn and its call arrive together. On a get, pick, undo or autopick that leaves the draft
            on the drafter; absent otherwise, and absent when it could not be made in the request
            (read it from /card then)
          allOf: [{ $ref: "#/components/schemas/RoomCard" }]
    MockPickInput:
      type: object
      required: [player_id, pick]
      properties:
        player_id: { type: string, minLength: 1, maxLength: 64 }
        pick: { type: integer, minimum: 1, description: the overall pick the drafter saw on the clock }
    MockUndoInput:
      type: object
      required: [pick]
      properties:
        pick: { type: integer, minimum: 1, description: the overall pick of the drafter's to take back }
    MockQueueInput:
      type: object
      required: [player_ids]
      properties:
        player_ids:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
    CardCandidate:
      type: object
      required: [player_id]
      properties:
        player_id: { type: string }
        why: { type: string, description: the advisor's sentence, absent from the engine }
    RoomCard:
      type: object
      required: [pick_number, for_pick, next_pick, source, runs, call, shortlist, still_there, conditional]
      properties:
        pick_number: { type: integer, description: the pick on the clock when the card was made }
        for_pick: { type: integer, description: the drafter's pick the call is for }
        next_pick: { type: integer, nullable: true, description: the turn the odds look to }
        source: { type: string, enum: [advisor, sim] }
        runs: { type: integer, description: the runs the odds are over, 0 for the closed form }
        call: { type: string, description: the player we would take }
        shortlist:
          type: array
          items: { $ref: "#/components/schemas/CardCandidate" }
        still_there:
          type: object
          description: >-
            player id to his chance of still being there at next_pick, or, on a conditional card, of reaching
            for_pick
          additionalProperties: { type: number, format: double }
        conditional: { type: boolean, description: a lobby card off your turn, the call if the board holds }
    ReportTeam:
      type: object
      required: [seat, points, rank, starters_filled, starters_total, bye_collisions, value_captured]
      properties:
        seat: { type: integer }
        points: { type: number, format: double, description: projected points from the starters }
        rank: { type: integer }
        starters_filled: { type: integer }
        starters_total: { type: integer }
        bye_collisions: { type: integer }
        value_captured: { type: number, format: double }
    ReportPick:
      type: object
      required: [pick, round, player_id, over_replacement, adp_gap, chip, still_there, could_wait, odds_source, made_by]
      properties:
        pick: { type: integer }
        round: { type: integer }
        player_id: { type: string }
        over_replacement: { type: number, format: double, nullable: true }
        adp_gap: { type: number, format: double, nullable: true, description: ADP less the pick, positive before drafters take him }
        chip:
          type: string
          enum: [reach, steal, at_adp, none, kept]
          description: kept is a keeper at his seat and round, with no ADP gap and no hindsight
        still_there: { type: number, format: double, nullable: true, description: the chance he was there at your next turn, null at your last }
        could_wait: { type: boolean }
        odds_source: { type: string, description: "advisor or sim as recorded with the pick, or fallback_sim computed for the report" }
        made_by:
          type: string
          enum: [you, for_you, queue, clock]
          description: >-
            who made the pick: you, Pick for me or Finish the draft (for_you), a lobby seat's stand-in after you left
            (queue), or the stand-in when your clock ran out (clock). A pick you did not make carries no hindsight.
    ReportStarter:
      type: object
      required: [slot, player_id]
      properties:
        slot: { type: string }
        player_id: { type: string, nullable: true }
    ReportExposure:
      type: object
      required: [player_id, share]
      properties:
        player_id: { type: string }
        share: { type: number, format: double }
    ReportRuns:
      type: object
      required: [runs, points, median, middle_low, middle_high, top_share, top_finish, rank_counts, exposure]
      properties:
        runs: { type: integer }
        points:
          type: array
          description: your starting points in each run, ascending
          items: { type: number, format: double }
        median: { type: number, format: double }
        middle_low: { type: number, format: double }
        middle_high: { type: number, format: double }
        top_share: { type: number, format: double }
        top_finish: { type: integer, description: the rank top_share counts to }
        rank_counts:
          type: array
          description: runs finishing at each rank, first place first
          items: { type: integer }
        exposure:
          type: array
          description: who you end up with, by share of runs, most first
          items: { $ref: "#/components/schemas/ReportExposure" }
    MockReport:
      type: object
      required: [teams, rounds, slot, seed, settings, could_wait_from, standings, picks, starters, runs, board, computed_ms]
      properties:
        teams: { type: integer }
        rounds: { type: integer }
        slot: { type: integer }
        seed: { type: integer, format: int64 }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        could_wait_from: { type: number, format: double }
        standings:
          type: array
          description: every team, best first
          items: { $ref: "#/components/schemas/ReportTeam" }
        picks:
          type: array
          items: { $ref: "#/components/schemas/ReportPick" }
        starters:
          type: array
          items: { $ref: "#/components/schemas/ReportStarter" }
        runs: { $ref: "#/components/schemas/ReportRuns" }
        board:
          description: the board, holding only the players the report names
          allOf: [{ $ref: "#/components/schemas/RoomBoard" }]
        computed_ms: { type: integer, description: how long the report took to compute }
        share_code: { type: string, description: a solo draft's link code, absent for a lobby }

    CompanionHost:
      type: string
      enum: [sleeper, ffpc]
    CompanionCreate:
      type: object
      required: [host, draft, seat]
      properties:
        host: { $ref: "#/components/schemas/CompanionHost" }
        draft: { type: string, minLength: 1, maxLength: 300, description: the draft link as pasted, or its id }
        seat: { $ref: "#/components/schemas/CompanionSeat" }
        replay:
          type: boolean
          description: >-
            development only (COMPANION_REPLAY), replays the recorded completed draft one pick a second, whatever
            draft says
    CompanionSeat:
      type: object
      description: exactly one of slot and username
      properties:
        slot: { type: integer, nullable: true, minimum: 1, maximum: 32 }
        username: { type: string, nullable: true, maxLength: 40 }
    CompanionStatus:
      type: string
      enum: [pre_draft, drafting, paused, complete]
    CompanionSummary:
      type: object
      required: [id, host, host_draft_id, name, slot, host_username, status, replay, created_at]
      properties:
        id: { type: string, format: uuid }
        host: { $ref: "#/components/schemas/CompanionHost" }
        host_draft_id: { type: string }
        name: { type: string, description: "the draft's name on the host, empty when it has none" }
        slot: { type: integer }
        host_username: { type: string, nullable: true, description: the Sleeper username the seat was found by }
        status: { $ref: "#/components/schemas/CompanionStatus" }
        replay: { type: boolean }
        created_at: { type: string, format: date-time }
    CompanionPick:
      type: object
      required: [pick, round, seat, player_id, host_player_id, name, position, team, keeper]
      properties:
        pick: { type: integer }
        round: { type: integer }
        seat: { type: integer, description: the draft slot that made it }
        player_id: { type: string, nullable: true, description: our board's player, null when we could not place him }
        host_player_id: { type: string }
        name: { type: string, description: the host's name for him }
        position: { type: string }
        team: { type: string }
        keeper: { type: boolean }
    OutcomeRange:
      type: object
      required: [floor, median, ceiling]
      properties:
        floor: { type: number, format: double }
        median: { type: number, format: double }
        ceiling: { type: number, format: double }
    Companion:
      type: object
      required:
        [id, host, host_draft_id, replay, name, status, teams, rounds, slot, seat_names, settings, basis, pick_count, total_picks,
         on_clock, your_turn, your_next_pick, picks_until_turn, since, picks, unplaced, placed_by_name, lost_at, traded, card, board,
         ranges, host_stale_seconds, created_at]
      properties:
        id: { type: string, format: uuid }
        host: { $ref: "#/components/schemas/CompanionHost" }
        host_draft_id: { type: string }
        replay: { type: boolean }
        name: { type: string, description: the draft's name on the host, may be empty }
        status: { $ref: "#/components/schemas/CompanionStatus" }
        teams: { type: integer }
        rounds: { type: integer }
        slot: { type: integer, description: the drafter's draft slot }
        seat_names:
          type: array
          description: >-
            each slot's name in the host league (its members' display names), slot 1 first; empty for a mock draft,
            and '' for a slot with no member
          items: { type: string }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        basis: { type: string, description: the board our call reads, in a sentence }
        pick_count: { type: integer, description: picks the host has made }
        total_picks: { type: integer }
        on_clock: { type: integer, nullable: true, description: the slot on the clock, null before the draft and after it }
        your_turn: { type: boolean }
        your_next_pick: { type: integer, nullable: true, description: the drafter's next overall pick, null after the last }
        picks_until_turn: { type: integer, nullable: true, description: picks before the drafter's next, 0 on the clock }
        since: { type: integer, description: the pick count the picks follow }
        picks:
          type: array
          description: every pick after since, in order
          items: { $ref: "#/components/schemas/CompanionPick" }
        unplaced: { type: integer, description: picks so far we could not place on our board; they take nobody from it }
        placed_by_name:
          type: array
          description: Sleeper picks placed by name, position and team because our players do not carry their Sleeper id yet, each by both names
          items: { $ref: "#/components/schemas/NamedPick" }
        lost_at:
          type: integer
          nullable: true
          description: the pick our draft could not follow (out of order, or no roster spot takes him); no call after it
        traded: { type: integer, description: picks made by a team other than the slot's own, a traded pick }
        card:
          nullable: true
          description: >-
            our call at the drafter's turn, or between turns the conditional call (conditional true): the player to
            take if the board holds to your_next_pick. The why is on the call only, or on every shortlist row with
            full_reasoning.
          allOf: [{ $ref: "#/components/schemas/RoomCard" }]
        board:
          nullable: true
          description: the board valued for this league, sent only when since is 0
          allOf: [{ $ref: "#/components/schemas/RoomBoard" }]
        ranges:
          type: object
          nullable: true
          description: floor, median and ceiling for each shortlist player, with range_of_outcomes only
          additionalProperties: { $ref: "#/components/schemas/OutcomeRange" }
        host_stale_seconds:
          type: integer
          nullable: true
          description: how old the picks are when the host did not answer the last read, null when fresh
        created_at: { type: string, format: date-time }

    LobbyFormat:
      type: string
      enum: [12_ppr, 12_half_superflex, 10_ppr]
    LobbyFilling:
      type: object
      required: [format, teams, clock_seconds, scoring, lineup, filling]
      properties:
        format: { $ref: "#/components/schemas/LobbyFormat" }
        teams: { type: integer }
        clock_seconds: { type: integer }
        scoring: { $ref: "#/components/schemas/ScoringPreset" }
        lineup: { $ref: "#/components/schemas/Lineup" }
        filling: { type: integer, description: drafters in the room filling now, 0 when none is }
    LobbyJoin:
      type: object
      required: [format]
      properties:
        format: { $ref: "#/components/schemas/LobbyFormat" }
    LobbySeat:
      type: object
      required: [room_id, seat, socket_url]
      properties:
        room_id: { type: string, format: uuid }
        seat: { type: integer }
        socket_url: { type: string, description: the room service's WebSocket for this room }
    LobbySeatView:
      type: object
      required: [seat, handle, kind]
      properties:
        seat: { type: integer }
        handle: { type: string, nullable: true }
        kind: { type: string, enum: [drafter, bot, left, open] }
    LobbyRoom:
      type: object
      required: [id, format, status, teams, rounds, clock_seconds, fill_deadline, started_at, solo_pace, you, settings, seats, board, socket_url]
      properties:
        id: { type: string, format: uuid }
        format: { $ref: "#/components/schemas/LobbyFormat" }
        status: { type: string, enum: [filling, drafting, complete, abandoned] }
        teams: { type: integer }
        rounds: { type: integer }
        clock_seconds: { type: integer }
        fill_deadline: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        solo_pace: { type: boolean, description: fewer than three people started it, so the bots pick at once }
        you: { type: integer, description: your seat }
        settings: { $ref: "#/components/schemas/LeagueSettings" }
        seats:
          type: array
          items: { $ref: "#/components/schemas/LobbySeatView" }
        board: { $ref: "#/components/schemas/RoomBoard" }
        socket_url: { type: string }

    RoomHello:
      type: object
      required: [type, last_seq]
      properties:
        type: { type: string, enum: [hello] }
        last_seq: { type: integer, format: int64, minimum: 0 }
    RoomWelcome:
      type: object
      required: [type, room_id, seq, actions, now]
      properties:
        type: { type: string, enum: [welcome] }
        room_id: { type: string, format: uuid }
        seq: { type: integer, format: int64, description: the room's latest seq }
        now: { type: string, format: date-time, description: the server's clock, so the client's clock reads the same }
        actions:
          type: array
          items: { $ref: "#/components/schemas/RoomAction" }
    RoomUpdate:
      type: object
      required: [type, seq, actions]
      properties:
        type: { type: string, enum: [update] }
        seq: { type: integer, format: int64 }
        actions:
          type: array
          items: { $ref: "#/components/schemas/RoomAction" }
    RoomCommand:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [pick, queue, leave] }
        player_id: { type: string, maxLength: 64, description: pick }
        pick: { type: integer, description: pick, the overall pick the drafter saw }
        player_ids:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 64 }
          description: queue, best first
    RoomAction:
      type: object
      description: >-
        One entry of the room's log. kind is SEAT_JOINED (payload handle), SEAT_LEFT (payload freed when a filling room gave the seat up, otherwise its stand-in drafts), SEAT_RETURNED, ROOM_STARTED
        (payload bots, the seats bots took, and solo_pace), ROOM_COMPLETE, ROOM_ABANDONED (payload reason, nobody_here when the fill deadline found no drafter connected or everyone_left), or an engine action (START_DRAFT,
        SET_QUEUE, MAKE_PICK, TIMER_EXPIRE) whose payload carries the engine action as action and, for a pick,
        pick (RoomPick with by drafter, queue, clock or bot) and deadline, when the next turn's clock runs out. A
        socket receives only its own seat's SET_QUEUE payload; another seat's arrives empty, with its seq and kind.
      required: [seq, kind, seat, payload, at]
      properties:
        seq: { type: integer, format: int64 }
        kind: { type: string }
        seat: { type: integer, nullable: true }
        payload: { type: object }
        at: { type: string, format: date-time }
    RoomError:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string, enum: [error] }
        code: { type: string }
        message: { type: string }
    LeagueHost:
      type: string
      description: the host a league runs on, named as a mechanism
      enum: [sleeper, mfl, ffpc, yahoo, espn]
    AttachPreviewInput:
      type: object
      required: [link]
      properties:
        host: { $ref: "#/components/schemas/LeagueHost" }
        link: { type: string, minLength: 1, maxLength: 300, description: the league link as pasted, or a Sleeper league id }
    AttachInput:
      type: object
      required: [link, me]
      properties:
        host: { $ref: "#/components/schemas/LeagueHost" }
        link: { type: string, minLength: 1, maxLength: 300, description: the league link as pasted, or a Sleeper league id }
        me: { $ref: "#/components/schemas/AttachSeat" }
    AttachSeat:
      type: object
      description: exactly one of username (Sleeper only) and roster_id
      properties:
        username: { type: string, nullable: true, maxLength: 40 }
        roster_id: { type: integer, nullable: true, minimum: 1, maximum: 32 }
    AttachPreview:
      type: object
      required: [host, host_league_id, season, name, teams, seat_by_username]
      properties:
        host: { $ref: "#/components/schemas/LeagueHost" }
        host_league_id: { type: string }
        season: { type: integer, description: the league's season, 0 when the host does not say }
        name: { type: string }
        teams: { type: array, items: { $ref: "#/components/schemas/LeagueTeam" } }
        seat_by_username: { type: boolean, description: whether the host finds a seat by username (Sleeper does) }
    AttachedLeague:
      type: object
      required: [id, host, host_league_id, season, name, roster_id, team_name, standing, attached_at, phase, phase_basis, draft_at, playoff_start_week, waivers_open]
      properties:
        id: { type: string, format: uuid }
        host: { $ref: "#/components/schemas/LeagueHost" }
        host_league_id: { type: string }
        season: { type: integer }
        name: { type: string, description: the league's name at its last read }
        roster_id: { type: integer }
        team_name: { type: string, description: "the drafter's team at the last read, empty when unread" }
        standing:
          allOf: [{ $ref: "#/components/schemas/LeagueStanding" }]
          nullable: true
          description: the drafter's record and place at the last read, null when unread
        attached_at: { type: string, format: date-time }
        phase: { $ref: "#/components/schemas/LeaguePhase" }
        phase_basis: { type: string, description: "one sentence naming the fact the phase came from, in the site's words" }
        draft_at: { type: string, format: date-time, nullable: true, description: "the host's draft time, null when the host does not say" }
        playoff_start_week:
          type: integer
          nullable: true
          description: the league's first playoff week as the host states it, null when the host does not say
        waivers_open:
          type: boolean
          description: >-
            the host still runs waivers this week: false in and after the playoffs where the host closes them, and once
            the season is over, else true
    LeagueStanding:
      type: object
      required: [wins, losses, ties, place, teams]
      properties:
        wins: { type: integer }
        losses: { type: integer }
        ties: { type: integer }
        place: { type: integer, description: "1-based, by record then points for, as the league page's strip orders it" }
        teams: { type: integer }
    LeagueTeam:
      type: object
      required: [roster_id, name, owner, wins, losses, ties, points_for]
      properties:
        roster_id: { type: integer }
        name: { type: string, description: the team's name, or its owner's when it has none }
        owner: { type: string, description: the owner's display name, empty where the host shows none }
        wins: { type: integer }
        losses: { type: integer }
        ties: { type: integer }
        points_for: { type: number, format: double }
    LeaguePlayer:
      type: object
      required: [host_id, board_id, name, position, team, injured_reserve]
      properties:
        host_id: { type: string }
        board_id: { type: string, nullable: true, description: the player's id on our board, null when unplaced }
        name: { type: string }
        position: { type: string }
        team: { type: string }
        injured_reserve:
          type: boolean
          description: >-
            the host marks him injured reserve beside his name (FFPC's IR designation); a player on a roster's IR
            slot is said by the slot
    RosterSpot:
      type: object
      required: [player, slot]
      properties:
        player: { $ref: "#/components/schemas/LeaguePlayer" }
        slot: { type: string, enum: [starter, bench, reserve, taxi] }
    MatchupStarter:
      type: object
      required: [player, points]
      properties:
        player: { $ref: "#/components/schemas/LeaguePlayer" }
        points: { type: number, format: double, description: his points so far this week }
    MatchupSide:
      type: object
      required: [roster_id, points, points_read, starters]
      properties:
        roster_id: { type: integer }
        points: { type: number, format: double }
        points_read:
          type: boolean
          description: >-
            the host's score for this side was read; false when it could not be (an FFPC all-play week whose
            scoring page did not answer), and points is then 0 and says nothing
        starters: { type: array, items: { $ref: "#/components/schemas/MatchupStarter" } }
    LeagueMatchup:
      type: object
      required: [week, mine, opponent]
      properties:
        week: { type: integer }
        mine: { $ref: "#/components/schemas/MatchupSide" }
        opponent: { allOf: [{ $ref: "#/components/schemas/MatchupSide" }], nullable: true }
    OrderBasis:
      type: string
      enum: [preseason, rest_of_season]
      description: >-
        which order ranks the players: our preseason board, or the rest-of-season order (from week 7, once the API
        reads it)
    DesignationStatus:
      type: string
      enum: [questionable, doubtful, out, injured_reserve, suspended, pup, nfi]
    InjuryDesignation:
      type: object
      required: [status, as_of]
      properties:
        status: { $ref: "#/components/schemas/DesignationStatus" }
        as_of:
          type: string
          format: date-time
          description: the stamp of the injury read that lists it, or of the host read for the host's own IR mark
    GamePoints:
      type: object
      required: [week, points]
      properties:
        week: { type: integer }
        points: { type: number, format: double, description: his points that game under the league's scoring }
    PointsAllowed:
      type: object
      required: [points_a_game, rank, of, position]
      properties:
        points_a_game:
          type: number
          format: double
          description: the opponent's defense to this position, season to date, under the league's scoring, one decimal
        rank: { type: integer, description: 1 allowed the fewest }
        of: { type: integer, description: the defenses ranked, those with a final game }
        position: { type: string }
    WeekFacts:
      type: object
      description: one player's week; a fact we do not hold is null, never zero
      required:
        - week
        - opponent
        - home
        - kickoff
        - bye
        - designation
        - played
        - points_this_week
        - last_games
        - allowed_to_position
        - game_total
        - spread
        - roof
        - weather
      properties:
        week: { type: integer }
        opponent: { type: string, nullable: true, description: "the opponent's team code, null on bye or when his team is unknown" }
        home: { type: boolean, nullable: true }
        kickoff: { type: string, format: date-time, nullable: true }
        bye: { type: boolean }
        designation: { allOf: [{ $ref: "#/components/schemas/InjuryDesignation" }], nullable: true }
        played: { type: boolean, description: his game this week is final }
        points_this_week:
          type: number
          format: double
          nullable: true
          description: the host's score for him so far, from the matchup, when he starts there and his game has kicked off
        last_games:
          type: array
          description: up to three completed games under the league's scoring, newest first
          items: { $ref: "#/components/schemas/GamePoints" }
        allowed_to_position: { allOf: [{ $ref: "#/components/schemas/PointsAllowed" }], nullable: true }
        game_total: { allOf: [{ $ref: "#/components/schemas/GameTotal" }], nullable: true }
        spread: { allOf: [{ $ref: "#/components/schemas/GameSpread" }], nullable: true }
        roof: { allOf: [{ $ref: "#/components/schemas/GameRoof" }], nullable: true }
        weather: { allOf: [{ $ref: "#/components/schemas/KickoffWeather" }], nullable: true }
    GameTotal:
      type: object
      description: >-
        the game's expected score, the consensus of the hourly capture's newest read before kickoff; a read more than six
        hours before kickoff (or before now) gives way to the game table's newest weekly read, with its own read time
      required: [points, team_points, read_at]
      properties:
        points: { type: number, format: double, description: both clubs' points together }
        team_points: { type: number, format: double, description: "this club's own expected points, from the same read" }
        read_at: { type: string, format: date-time, description: when the figures were read }
    GameSpread:
      type: object
      description: the expected margin from this club's side, from the same read as game_total
      required: [side, points, read_at]
      properties:
        side: { type: string, enum: [win, lose, even], description: "whether this club is expected to win or lose" }
        points: { type: number, format: double, description: "the margin, never negative, and 0 when even" }
        read_at: { type: string, format: date-time }
    GameRoof:
      type: object
      description: >-
        the venue as the stadium table confirms it: a dome takes no forecast, a venue abroad no weather term; null when
        the venue is not confirmed
      required: [kind, abroad]
      properties:
        kind: { type: string, enum: [outdoors, dome, retractable] }
        abroad: { type: boolean }
    KickoffWeather:
      type: object
      description: >-
        the weather service's forecast for the kickoff hour at the stadium, the newest read before kickoff; null for a
        dome, a venue abroad, or before the forecast reaches the game
      required: [temperature_f, wind_mph, precipitation_chance, precipitation_kind, read_at]
      properties:
        temperature_f: { type: number, format: double, nullable: true }
        wind_mph: { type: number, format: double, nullable: true }
        precipitation_chance: { type: number, format: double, nullable: true, description: "percent, 0 to 100" }
        precipitation_kind:
          type: string
          nullable: true
          enum: [none, rain, thunderstorms, snow, ice]
          description: the most severe kind of precipitation the kickoff hour names
        read_at: { type: string, format: date-time, description: when the forecast was read }
    GameWeek:
      type: object
      required: [season, week, games]
      properties:
        season: { type: integer }
        week: { type: integer }
        games: { type: array, items: { $ref: "#/components/schemas/ClubGame" } }
    ClubGame:
      type: object
      description: one club's game in the week, from its side
      required: [team, opponent, home, kickoff, played, game_total, spread, roof, weather]
      properties:
        team: { type: string, description: "the club, in the board's codes" }
        opponent: { type: string }
        home: { type: boolean }
        kickoff: { type: string, format: date-time }
        played: { type: boolean, description: the game is final }
        game_total: { allOf: [{ $ref: "#/components/schemas/GameTotal" }], nullable: true }
        spread: { allOf: [{ $ref: "#/components/schemas/GameSpread" }], nullable: true }
        roof: { allOf: [{ $ref: "#/components/schemas/GameRoof" }], nullable: true }
        weather: { allOf: [{ $ref: "#/components/schemas/KickoffWeather" }], nullable: true }
    PlayerLine:
      type: object
      required: [player, headshot, slug, position_rank, points_over_replacement, rest_of_season_per_game, week_projection, held, facts]
      properties:
        player: { $ref: "#/components/schemas/LeaguePlayer" }
        headshot: { type: string, nullable: true, description: "his face from our player directory, null without one" }
        slug:
          type: string
          nullable: true
          description: >-
            his page on the site (/players/{slug}): set for a player our order ranks whose name no other player in our
            directory shares, null otherwise (a shared name's page is named by the run, which the API does not read)
        position_rank: { type: integer, nullable: true, description: his place at his position in our order, null when unranked }
        points_over_replacement:
          type: number
          format: double
          nullable: true
          description: >-
            points over replacement a week for this league, one decimal: the order's averaged over the weeks it covers
            (the preseason number's season over 17, the rest-of-season order's over its own first week, the league's when the run does not say, through week
            17), as the basis says; null without a projection
        rest_of_season_per_game:
          type: number
          format: double
          nullable: true
          description: >-
            his rest-of-season points a game, one decimal: the published board's rest-of-season points over the games his
            club has left from the board's first week through week 17, byes out, as the basis says; null on the preseason
            number, on a run that does not say its first week, without a projection or with no games left. A player who is
            out keeps it: it assumes he plays
        week_projection:
          type: number
          format: double
          nullable: true
          description: >-
            his points this week on the week's published projection, to the cent, in the format the league's scoring is
            most like (PPR, half PPR or standard); a team defense's by its club, a kicker our board does not place (no board id) by his club's one kicker, never a teammate's for a kicker the snapshot left out. The newest snapshot stored for the
            league's week (projection_read_at says when). Null when his club has no game that week (a bye), whatever the snapshot holds, and when the snapshot has no row for him or none is stored.
            Our own weekly model replaces it when it passes its test
        held: { type: boolean, description: the drafter tags him Hold on a sheet, so he is never a drop or a trade give }
        facts: { $ref: "#/components/schemas/WeekFacts" }
    LineupSlot:
      type: object
      required: [slot, ours, host, changed, sentence]
      properties:
        slot: { type: string, enum: [QB, RB, WR, TE, FLEX, SUPERFLEX, K, DEF] }
        ours: { $ref: "#/components/schemas/PlayerLine" }
        host:
          allOf: [{ $ref: "#/components/schemas/PlayerLine" }]
          nullable: true
          description: >-
            the host lineup's player in this place: the same player when unchanged, the starter we sit for a change,
            null for a spot the host left empty
        changed: { type: boolean, description: we start a player the host has on the bench }
        sentence: { type: string, nullable: true, description: the reason for a change, from facts; null when unchanged }
    LineupAdvice:
      type: object
      required: [week, basis, basis_note, order_basis, refreshed, read_at, projection_read_at, projection_scoring, player_points, team_points, set, slots, bench, host_lineup_url, host_note, moves]
      properties:
        week: { type: integer }
        player_points:
          type: boolean
          description: >-
            the host gives each player's points (Sleeper, MFL); false where it gives each team's total alone (ESPN,
            Yahoo, FFPC), so a player's points_this_week stay null and the team's total is team_points
        team_points:
          type: number
          format: double
          nullable: true
          description: >-
            the host's points so far for the drafter's team this week, null before any of its starters has kicked off
            or when the host's score could not be read
        projection_scoring: { $ref: "#/components/schemas/ProjectionScoring" }
        projection_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the week's published projection the rows' week_projection read was captured, null with none
        basis: { type: string, description: "the honesty line above the rows: the order the lineup is ranked by, never a week's projection" }
        basis_note:
          type: string
          description: >-
            the rest of the basis, said once under the rows: the league's rules points so far leave out, empty when
            they leave out none (the page says what Proj and Pts are itself)
        order_basis: { $ref: "#/components/schemas/OrderBasis" }
        refreshed: { type: string, format: date-time, description: when the order was made }
        read_at: { type: string, format: date-time, description: the league's last host read }
        set: { type: boolean, description: true when the host's lineup is already ours }
        slots:
          type: array
          description: >-
            every starting spot in the league's order (QB, RB, WR, TE, the flex spots, K, DEF); a spot no rostered player
            can fill is left out
          items: { $ref: "#/components/schemas/LineupSlot" }
        bench:
          type: array
          description: everyone else on the active roster, by the same keys (injured reserve and taxi spots left out)
          items: { $ref: "#/components/schemas/PlayerLine" }
        host_lineup_url: { type: string, description: "the host's lineup page, empty when we know none" }
        host_note:
          type: string
          nullable: true
          description: >-
            one sentence under the verb when we cannot open the host's page ("Make this change on Yahoo. We cannot
            open that page for you yet."), null when the url opens it
        moves: { $ref: "#/components/schemas/LineupMoves" }
    BoxStarter:
      type: object
      required: [slot, line]
      properties:
        slot: { type: string, enum: [QB, RB, WR, TE, FLEX, SUPERFLEX, K, DEF] }
        line: { $ref: "#/components/schemas/PlayerLine" }
    MatchupBoxSide:
      type: object
      required: [roster_id, player_points, starters, bench]
      properties:
        roster_id: { type: integer }
        player_points:
          type: boolean
          description: the host gives each player's points for this side; false where it gives the side's total alone
        starters:
          type: array
          description: >-
            the host's starters in the league's slot order (QB, RB, WR, TE, the flex spots, K, DEF); an empty spot is
            left out, and a starter no slot takes ends the list in his position's slot. Empty where the host shows us
            no lineup for the side (FFPC's opponents)
          items: { $ref: "#/components/schemas/BoxStarter" }
        bench:
          type: array
          description: the side's other active players, by our order (injured reserve and taxi spots left out)
          items: { $ref: "#/components/schemas/PlayerLine" }
    ProjectionScoring:
      type: object
      description: >-
        the scoring the rows' week_projection is read in: the published projection's column the league scores most
        like, and whether that is the league's own scoring or the closest of the three to rules of its own (a tight
        end premium reads PPR and is never its own). A team defense's figure is the published default in every format
      required: [format, league_own]
      properties:
        format: { type: string, enum: [ppr, half_ppr, standard] }
        league_own: { type: boolean, description: the league scores exactly as format, every rule alike }
    MatchupBox:
      type: object
      required: [week, read_at, projection_read_at, projection_scoring, sides]
      properties:
        projection_scoring: { $ref: "#/components/schemas/ProjectionScoring" }
        week: { type: integer }
        read_at: { type: string, format: date-time, description: the league's last host read }
        projection_read_at:
          type: string
          format: date-time
          nullable: true
          description: when the week's published projection the rows' week_projection read was captured, null with none
        sides:
          type: array
          description: the drafter's side first, then the opponent's when the week pairs them
          items: { $ref: "#/components/schemas/MatchupBoxSide" }
    WaiverRow:
      type: object
      required: [add, drop, gain, starts, sentence]
      properties:
        add: { $ref: "#/components/schemas/PlayerLine" }
        drop:
          allOf: [{ $ref: "#/components/schemas/PlayerLine" }]
          nullable: true
          description: null when a roster spot is open or there is no move to make
        gain: { type: number, format: double, description: "points over replacement a week to the lineup, one decimal; above 0 sits above the rule" }
        starts: { type: boolean, description: he starts for you this week }
        sentence: { type: string }
    WaiverAdvice:
      type: object
      required: [week, basis, basis_note, order_basis, refreshed, read_at, best, rows, host_waivers_url, host_note, moves]
      properties:
        week: { type: integer }
        basis: { type: string }
        basis_note:
          type: string
          description: >-
            the rest of the basis, said once under the rows: the league the points over replacement are for and the
            league's rules points so far leave out
        order_basis: { $ref: "#/components/schemas/OrderBasis" }
        refreshed: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
        best: { allOf: [{ $ref: "#/components/schemas/WaiverRow" }], nullable: true, description: the add that gains most, null when none gains }
        rows:
          type: array
          description: positive gains first by gain, then the rest by points over replacement, at most 60
          items: { $ref: "#/components/schemas/WaiverRow" }
        host_waivers_url: { type: string, description: "the host's waiver page, empty when we know none" }
        host_note:
          type: string
          nullable: true
          description: >-
            one sentence under the verb when we cannot open the host's page ("Make this change on Yahoo. We cannot
            open that page for you yet."), null when the url opens it
        moves: { $ref: "#/components/schemas/WaiverMoves" }
    WaiverMoves:
      type: object
      required: [claim, note]
      properties:
        claim:
          type: string
          enum: [available, unavailable]
          description: >-
            available when a claim can be made on the host from our screen (the host has a write path, its claim
            switch is on for the account and the account's connection agreed to the moves); unavailable when the verb
            is the host's page
        note:
          type: string
          nullable: true
          description: one sentence when a claim waits on the member (connect again to agree to moves), null otherwise
    TradeRecord:
      type: object
      required: [wins, losses, ties]
      properties:
        wins: { type: integer }
        losses: { type: integer }
        ties: { type: integer }
    TradeRow:
      type: object
      required: [give, get, drop, my_gain, their_gain, close_for_them]
      properties:
        give: { type: array, items: { $ref: "#/components/schemas/PlayerLine" } }
        get: { type: array, items: { $ref: "#/components/schemas/PlayerLine" } }
        drop:
          allOf: [{ $ref: "#/components/schemas/PlayerLine" }]
          nullable: true
          description: >-
            who the drafter drops to make room when the trade brings in more players than it sends and the roster has
            no open spot (the player it costs least to lose, never held, never a starter after the trade); the gain
            is after him; null otherwise
        my_gain: { type: number, format: double, description: points over replacement a week to the drafter's lineup, one decimal }
        their_gain: { type: number, format: double, description: the same to theirs }
        close_for_them: { type: boolean, description: their gain is under 0.5 a week }
    TradeTeam:
      type: object
      required: [roster_id, name, owner, record, roster, trades, note]
      properties:
        roster_id: { type: integer }
        name: { type: string }
        owner: { type: string }
        record: { $ref: "#/components/schemas/TradeRecord" }
        roster:
          type: array
          description: >-
            every player on their active roster (injured reserve and taxi spots left out), by position then name: the
            builder's players on their side
          items: { $ref: "#/components/schemas/PlayerLine" }
        trades:
          type: array
          description: >-
            at most 10: the trades their lineup gains 0.5 a week or more from first, then the close calls for them,
            each group best for the drafter first
          items: { $ref: "#/components/schemas/TradeRow" }
        note:
          type: string
          nullable: true
          description: one sentence when every trade found with this team is a close call for them, else null
    LineupMoves:
      type: object
      required: [lineup, note, takes_writes, writes_on, reason]
      properties:
        takes_writes:
          type: boolean
          description: >-
            true where the league's platform takes a lineup from our screen at all (ESPN, MyFantasyLeague), false where
            it has no write path (the verb is always Copy the lineup there)
        writes_on:
          type: boolean
          description: >-
            true when the platform's write switch is on for this account (HOST_WRITES_ESPN_LINEUP or
            HOST_WRITES_MFL_LINEUP, or the account is on the switch's proof list); false where the platform takes no
            writes
        reason:
          type: string
          nullable: true
          description: >-
            one line under Copy the lineup saying why the lineup is not set from here (the platform takes no writes,
            its switch is off, or the member must connect or agree to moves), naming the platform; null when lineup is
            available

        lineup:
          type: string
          enum: [available, unavailable]
          description: >-
            available when the lineup can be set on the host from our screen (the host has a write path, its switch
            is on for the account and the account's connection agreed to the moves); unavailable when the verb is the
            host's page
        note:
          type: string
          nullable: true
          description: one sentence when a move waits on the member (connect again to agree to moves), null otherwise
    HostMoveChange:
      type: object
      required: [slot, in, out]
      properties:
        slot: { type: string, enum: [QB, RB, WR, TE, FLEX, SUPERFLEX, K, DEF] }
        in: { type: string, pattern: "^-?[0-9]{1,12}$", description: the host id of the player who starts in the slot }
        out:
          type: string
          nullable: true
          pattern: "^-?[0-9]{1,12}$"
          description: the host id of the starter the change sits, null for a slot the host left empty
    HostClaim:
      type: object
      required: [add, drop, bid]
      properties:
        add: { type: string, pattern: "^-?[0-9]{1,12}$", description: the host id of the player claimed }
        drop:
          type: string
          nullable: true
          pattern: "^-?[0-9]{1,12}$"
          description: the host id of the player dropped for him, null for an open roster spot
        bid:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100000
          description: >-
            the bid the member typed, in the league's waiver dollars; null where the league does not bid. We never
            suggest one.
    HostMoveInput:
      type: object
      required: [kind, week, changes]
      properties:
        kind: { type: string, enum: [lineup, claim] }
        week: { type: integer, minimum: 1, maximum: 25, description: "the week the screen read, the host's current one" }
        changes:
          type: array
          maxItems: 10
          description: a lineup's changes, at least one; empty for a claim
          items: { $ref: "#/components/schemas/HostMoveChange" }
        claim:
          allOf: [{ $ref: "#/components/schemas/HostClaim" }]
          nullable: true
          description: a claim's add, drop and bid; absent for a lineup
    HostBid:
      type: object
      required: [amount, min, max, left_known]
      properties:
        amount: { type: integer, description: the bid the plan sends }
        min: { type: integer, description: "the league's least bid" }
        max:
          type: integer
          description: >-
            what the team has left to bid, the league's budget less what it has spent; the whole budget when the host
            did not say what was spent (left_known false)
        left_known: { type: boolean, description: the host said what the team has spent, so max is what it has left }
    HostMoveConfirm:
      type: object
      required: [move, confirm]
      properties:
        move: { $ref: "#/components/schemas/HostMoveInput" }
        confirm: { type: string, minLength: 1, maxLength: 200, description: the plan's token, for this move alone }
    HostMovePlan:
      type: object
      required: [status, sentence, confirm, expires_at, host_url, bid]
      properties:
        status: { type: string, enum: [ready, unavailable] }
        sentence:
          type: string
          description: >-
            the move in words, every change named ("Start Rachaad White over Tank Bigsby at RB, and Jauan Jennings over
            Josh Downs in the flex, on ESPN now.", "Add Keenan Allen, drop Danny Amendola, bid $12. He is on waivers,
            so ESPN runs the claim on Wednesday."), or why it cannot be made here
        confirm: { type: string, nullable: true, description: the token that makes this move once, null when unavailable }
        expires_at: { type: string, format: date-time, nullable: true, description: when the token stops making it }
        host_url: { type: string, description: "the host's page for the move (lineup or waivers), empty when we know none" }
        bid:
          allOf: [{ $ref: "#/components/schemas/HostBid" }]
          nullable: true
          description: >-
            a claim in a league that bids: the bid the plan sends (the one typed, else the league's least) and the
            bounds the league allows; null otherwise
    HostMoveResult:
      type: object
      required: [outcome, sentence, host_words, host_url, move_id, processes_at]
      properties:
        outcome: { type: string, enum: [done, refused, pending, unavailable] }
        sentence: { type: string, description: our sentence for the outcome }
        host_words:
          type: string
          nullable: true
          description: the host's reason for a refusal, verbatim in its own words; null otherwise
        host_url: { type: string, description: "the host's page for the move (lineup or waivers), empty when we know none" }
        move_id: { type: string, format: uuid, nullable: true, description: the move's proof record, null when none was kept }
        processes_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            a pending claim: when the host's queue says it runs the claim (ESPN's processDate), null when it did not
            say or for any other move
    HostMove:
      type: object
      required: [id, kind, week, sentence, outcome, host_words, created_at, answered_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [lineup, claim] }
        week: { type: integer }
        sentence: { type: string, description: the move as the member confirmed it }
        outcome: { type: string, enum: [sending, not_sent, done, refused, pending] }
        host_words: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        answered_at: { type: string, format: date-time, nullable: true }
    TradeAdvice:
      type: object
      required: [week, basis, basis_note, order_basis, refreshed, read_at, teams, roster, host_trades_url, host_note, check_basis]
      properties:
        week: { type: integer }
        check_basis:
          type: string
          description: the trade builder's honesty line, shown before its first answer (TradeCheck.basis says the same)
        roster:
          type: array
          description: >-
            every player on the drafter's active roster (injured reserve and taxi spots left out), by position then
            name: the picker's own players, a trade found or not
          items: { $ref: "#/components/schemas/PlayerLine" }
        basis: { type: string }
        basis_note:
          type: string
          description: >-
            the rest of the basis, said once under the rows: the league the points over replacement are for and the
            league's rules points so far leave out
        order_basis: { $ref: "#/components/schemas/OrderBasis" }
        refreshed: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
        teams: { type: array, description: every other team, in standings order, items: { $ref: "#/components/schemas/TradeTeam" } }
        host_trades_url: { type: string, description: "the host's trade page, empty when we know none" }
        host_note:
          type: string
          nullable: true
          description: >-
            one sentence under the verb when we cannot open the host's page ("Make this change on Yahoo. We cannot
            open that page for you yet."), null when the url opens it
    TradeCheckInput:
      type: object
      required: [team, give, get]
      properties:
        team: { type: integer, description: "the other team's roster_id (TradeTeam.roster_id)" }
        give:
          type: array
          minItems: 1
          maxItems: 2
          description: "host ids (LeaguePlayer.host_id) of one or two of the drafter's players: every rostered player has one, placed on our board or not"
          items: { type: string, minLength: 1, maxLength: 64 }
        get:
          type: array
          minItems: 1
          maxItems: 2
          description: host ids of one or two of theirs
          items: { type: string, minLength: 1, maxLength: 64 }
    TradeFills:
      type: object
      required: [yours, theirs, yours_open, theirs_open, yours_room, theirs_room]
      properties:
        yours: { type: boolean, description: "the drafter's roster still fills every slot it filled before the trade" }
        theirs: { type: boolean, description: the same for theirs }
        yours_open:
          type: string
          nullable: true
          description: >-
            the first slot the drafter's lineup would leave empty, as a lineup row labels it ("RB2", "TE", "Flex"),
            null when it fills every slot
        theirs_open: { type: string, nullable: true, description: the same for theirs }
        yours_room:
          type: boolean
          description: >-
            the drafter's roster has room for what it takes in: an open spot, or a player to drop (trade.drop) when it
            takes in more than it gives; false when every player it could drop is a starter after the trade, held, or
            its only kicker or defense
        theirs_room: { type: boolean, description: "the same for theirs (their drop is theirs to choose, so it is not named)" }
    TradeCheck:
      type: object
      required: [week, basis, basis_note, order_basis, refreshed, read_at, trade, fills, host_trades_url, host_note]
      properties:
        week: { type: integer }
        basis: { type: string, description: the honesty line beside the answer }
        basis_note: { type: string }
        order_basis: { $ref: "#/components/schemas/OrderBasis" }
        refreshed: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
        trade:
          allOf: [{ $ref: "#/components/schemas/TradeRow" }]
          description: >-
            the trade as the finder reckons one: my_gain and their_gain fall below zero for a lineup that loses,
            close_for_them as the finder marks it
        fills: { $ref: "#/components/schemas/TradeFills" }
        host_trades_url: { type: string, description: "the host's trade page, the finder's, empty when we know none" }
        host_note: { type: string, nullable: true, description: "as TradeAdvice's" }
    LeagueMove:
      type: object
      required: [kind, at, roster_ids, adds, drops]
      properties:
        kind: { type: string, enum: [add, waiver, trade] }
        at: { type: string, format: date-time }
        roster_ids: { type: array, items: { type: integer } }
        adds: { type: array, items: { $ref: "#/components/schemas/MovePlayer" } }
        drops: { type: array, items: { $ref: "#/components/schemas/MovePlayer" } }
    MovePlayer:
      type: object
      required: [player, roster_id]
      properties:
        player: { $ref: "#/components/schemas/LeaguePlayer" }
        roster_id: { type: integer, description: the team that took him (adds) or let him go (drops) }
    Placement:
      type: object
      description: how the league's rostered players were placed on our board, by rule
      required: [by_espn_id, by_defense, by_name, unplaced]
      properties:
        by_espn_id: { type: integer }
        by_defense: { type: integer }
        by_name: { type: integer }
        unplaced: { type: integer }
    LeagueSync:
      type: object
      required:
        - id
        - host
        - host_league_id
        - season
        - name
        - status
        - week
        - week_all_play
        - me
        - settings_league_id
        - settings_note
        - scoring_like
        - scoring_dropped
        - scoring_defaulted
        - teams
        - roster
        - matchup
        - moves
        - held_by
        - rostered
        - board_format
        - byes
        - placement
        - read_at
        - host_stale_seconds
        - host_failed
        - host_signed_out
      properties:
        id: { type: string, format: uuid }
        host: { $ref: "#/components/schemas/LeagueHost" }
        host_league_id: { type: string }
        season: { type: integer }
        name: { type: string }
        status: { type: string, description: the host's league state (in_season and the like), empty where the host shows none }
        week: { type: integer, description: the host's current week, 0 before the season or for a past one }
        week_all_play:
          type: boolean
          description: >-
            the host's schedule sets this week as all-play (every team scored against every other, no head-to-head
            game); the matchup then holds the drafter's side alone
        me: { type: integer, description: the drafter's roster id }
        settings_league_id:
          type: string
          format: uuid
          nullable: true
          description: the saved league a mock reruns from, null when a mock room cannot draft this league
        settings_note: { type: string, nullable: true, description: why there is no saved league, in the drafter's words }
        scoring_like:
          allOf: [{ $ref: "#/components/schemas/ScoringPreset" }]
          description: the preset the league's rules score most like, what a mock without custom scoring drafts on
        scoring_dropped:
          type: array
          description: >-
            the league's scoring rules the saved league (ScoringRules) does not carry, by the host's own
            name and figure
          items: { type: string }
        scoring_defaulted:
          type: array
          description: the ScoringRules keys the league does not state, each at its standard figure ("key figure")
          items: { type: string }
        teams:
          type: array
          description: every team, in standings order (wins, then points for)
          items: { $ref: "#/components/schemas/LeagueTeam" }
        roster: { type: array, items: { $ref: "#/components/schemas/RosterSpot" } }
        matchup: { allOf: [{ $ref: "#/components/schemas/LeagueMatchup" }], nullable: true }
        moves:
          type: array
          description: the completed moves of this week and last, newest first
          items: { $ref: "#/components/schemas/LeagueMove" }
        held_by:
          type: object
          description: >-
            the roster id holding each player a team in the league holds, by his board id; the waiver pool is our
            board without them, and every page marks them. The board is the run's own (web data/league-board), not
            part of this answer
          additionalProperties: { type: integer }
        rostered:
          type: array
          deprecated: true
          description: >-
            held_by's board ids, sorted, for a web from before held_by during the deploy window. Removed after
            2026-10-21 once the web that reads held_by has shipped
          items: { type: string }
        board_format:
          allOf: [{ $ref: "#/components/schemas/BoardFormat" }]
          description: the run's board the league reads on (ppr, half_ppr, standard or superflex)
        byes:
          type: object
          description: each NFL team's bye week this season, by team code
          additionalProperties: { type: integer }
        placement: { $ref: "#/components/schemas/Placement" }
        read_at: { type: string, format: date-time, description: when the host was last read for this league }
        host_stale_seconds:
          type: integer
          description: how stale the answer is because the host failed since, 0 when the last read reached it
        host_failed:
          type: boolean
          description: >-
            the stale answer's last read failed. False for a read kept from before this process while the next one
            goes to the host, so a stale answer names a failure only when there was one
        host_signed_out:
          type: boolean
          description: >-
            the stale answer's last read failed because no member of the league is signed in to the host (FFPC), so a
            sign-in mends it. False when fresh

    DeviceScope:
      type: string
      description: what a paired browser may write
      enum: [league:write, draft:write]
    Device:
      type: object
      required: [id, name, scopes, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: what the browser called itself at pairing }
        scopes: { type: array, items: { $ref: "#/components/schemas/DeviceScope" } }
        created_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: when it last sent a page, to the hour; null when it never has
    DeviceMe:
      type: object
      required: [device, handle]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        handle: { type: string, nullable: true, description: the account's public name, null when it has none }
    PairCode:
      type: object
      required: [code, expires_at]
      properties:
        code: { type: string, description: six words separated by spaces }
        expires_at: { type: string, format: date-time }
    PairInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 200, description: the six words as typed, any case or spacing }
        name: { type: string, maxLength: 60, description: what the browser calls itself, like Chrome on a Mac }
    Paired:
      type: object
      required: [token, device]
      properties:
        token: { type: string, description: the device token, answered this once; send it as Authorization Bearer }
        device: { $ref: "#/components/schemas/Device" }

    ConnectedHost:
      type: string
      description: a host the member connects their own account on, named as a mechanism
      enum: [ffpc, yahoo, espn, mfl]
    HostConnectionStatus:
      type: string
      description: >-
        connected reads. signed_out: the host no longer honors what we keep (FFPC's session past the one kept sign-in
        allowed in six hours, a Yahoo refresh Yahoo refused, ESPN cookies ESPN no longer accepts); the member connects
        again
      enum: [connected, signed_out]
    HostConnection:
      type: object
      required: [host, status, connected_at, last_read_at, proven]
      properties:
        host: { $ref: "#/components/schemas/ConnectedHost" }
        status: { $ref: "#/components/schemas/HostConnectionStatus" }
        proven:
          type: boolean
          description: >-
            false for an ESPN session kept before any league the public cannot read was read with it (the member's
            leagues were all public, or ESPN listed none); FFPC and Yahoo prove themselves on connect
        connected_at: { type: string, format: date-time }
        last_read_at: { type: string, format: date-time, nullable: true }
    HostConnectInput:
      type: object
      required: [email, password, consent]
      properties:
        email: { type: string, minLength: 1, maxLength: 128, description: "the member's FFPC sign-in (FFPC's form calls it the username)" }
        password: { type: string, minLength: 1, maxLength: 128, description: sent to FFPC's sign-in only, never answered or logged }
        consent:
          type: boolean
          description: >-
            the member agrees that we sign in to FFPC as them to read their league, never make a move or a bid, and that
            they can disconnect any time; must be true
    HostConnections:
      type: object
      required: [enabled, connections]
      properties:
        enabled: { type: array, items: { $ref: "#/components/schemas/ConnectedHost" }, description: the hosts connecting is open for }
        connections: { type: array, items: { $ref: "#/components/schemas/HostConnection" } }
    HostLeague:
      type: object
      required: [league_id, name, team_name, record]
      properties:
        league_id: { type: string }
        name: { type: string }
        team_name: { type: string }
        record: { type: string, description: "the team's record as the host writes it (FFPC 2 - 3), empty when the list does not carry it" }
        teams: { type: integer, minimum: 1, maximum: 32, description: the league's team count, where the host's list states it }
        scoring_type: { type: string, description: "the league's scoring type in our words: points, categories, best ball" }
        attached: { type: boolean, description: whether the account follows the league already, where the host's list says }
        public:
          type: boolean
          description: >-
            whether the public reads the league with no sign-in (ESPN), as one read with no cookies answered within the
            hour; absent when it was not checked or ESPN did not answer, and unmarked says which
        unmarked:
          type: string
          enum: [not_checked, no_answer]
          description: >-
            why an ESPN league carries no public mark: not_checked, past the first 10 leagues of the list, which are the
            ones checked; no_answer, ESPN did not answer the check in time
    YahooConnectInput:
      type: object
      properties:
        return_to:
          type: string
          maxLength: 200
          pattern: "^/[A-Za-z0-9_-][A-Za-z0-9/_-]{0,199}$"
          description: a page on the site to come back to once connected, like /league/{id}; the account page when absent
    ESPNConnectInput:
      type: object
      required: [swid, espn_s2, consent]
      properties:
        consent_version:
          type: integer
          minimum: 1
          description: >-
            the version of the consent words the page showed (3 names the moves); kept never above the server's own,
            and taken as 2 when absent
        swid: { type: string, minLength: 38, maxLength: 40, description: "ESPN's SWID cookie, a braced id: {XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX}" }
        espn_s2: { type: string, minLength: 40, maxLength: 600, description: "ESPN's espn_s2 cookie, kept encrypted, never answered or logged" }
        consent:
          type: boolean
          description: >-
            the member agrees that we keep an encrypted copy of their ESPN session so their league stays in sync, and
            that disconnect deletes it; must be true
    MFLConnectInput:
      type: object
      required: [username, password, consent, consent_version]
      properties:
        username: { type: string, minLength: 1, maxLength: 128, description: "the member's MyFantasyLeague username or email" }
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: sent once to MyFantasyLeague's login in a POST body, never kept, answered or logged
        consent:
          type: boolean
          description: >-
            the member agrees that we exchange their password once for a MyFantasyLeague session, keep that session
            encrypted (never the password), and set their lineup on MyFantasyLeague when they confirm a move; must be
            true
        consent_version:
          type: integer
          minimum: 1
          description: the version of the consent words the page showed (1 names the lineup moves); kept never above the server's own
    HostConnected:
      type: object
      required: [connection, leagues]
      properties:
        connection: { $ref: "#/components/schemas/HostConnection" }
        leagues: { type: array, items: { $ref: "#/components/schemas/HostLeague" } }
        note:
          type: string
          description: >-
            one sentence for a connection kept but not yet proven (ESPN): how many leagues ESPN lists and that the
            session is kept for the day a private league or a move needs it
