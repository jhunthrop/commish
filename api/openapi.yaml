        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/espn:
    delete:
      tags: [hosts]
      operationId: disconnectESPN
      summary: Disconnect ESPN. The kept cookies are deleted at once; private leagues read from ESPN keep their last read, shown as stale.
      security: [{ session: [] }, { device: [] }]
      responses:
        "200": { $ref: "#/components/responses/EmptyResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/mfl/connect:
    post:
      tags: [hosts]
      operationId: connectMFL
      summary: >-
        Exchange the member's MyFantasyLeague username and password once, in a POST to MyFantasyLeague's own login,
        for its session (MFL_USER_ID), then read the member's leagues with that session and keep it envelope
        encrypted with the expiry its cookie states. The password is never kept, logged or answered. Records the
        consent words' version the page showed (1 names the lineup moves), which a lineup move needs. Answers the
        member's MyFantasyLeague leagues this season (201). Open while HOST_WRITES_MFL_LINEUP is on, and to the
        accounts on its proof list while it is off (else 503). 422 when MyFantasyLeague refuses the pair, in the same
        words for a bad username as for a bad password; three refusals in an hour pause the account for the hour
        (423), as do three refusals of one username from any account, or the site's hourly cap on MyFantasyLeague
        sign-ins across every account (423, one sentence for both). 502, with nothing kept, when MyFantasyLeague does
        not answer. 5 an hour an account.
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFLConnectInput" }
      responses:
        "201":
          description: connected, the session kept
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties: { data: { $ref: "#/components/schemas/HostConnected" } }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "423": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /hosts/mfl/leagues:
    get:
      tags: [hosts]
      operationId: mflLeagues
      summary: >-
        The member's MyFantasyLeague leagues this season, read with their kept session, each with their team in it and
        whether the account follows it already. 503 when MyFantasyLeague is not open to the account (the switch off and
        the account not on its proof list), as connecting is. 404 when not connected; 409 when MyFantasyLeague no
        longer accepts the session (or it is past its expiry, at most a year from connecting), which signs it out.
      security: [{ session: [] }, { device: [] }]
      responses:
