          only players at this position; without it every position, ranked by points over replacement. Kickers and
          defenses are not on the order, as the in-season table carries none
        schema: { type: string, enum: [QB, RB, WR, TE] }
      - name: q
        in: query
        required: false
        description: only players whose name or club holds these letters, any case
        schema: { type: string, minLength: 2, maxLength: 40 }
      - name: limit
        in: query
        required: false
        description: at most this many rows, 100 without it
        schema: { type: integer, minimum: 1, maximum: 400 }
      - name: byes
        in: query
        required: false
        description: >-
          last: the Players page's week rankings (Lane 163), every available player whose club is on bye in the
          answer's week (line.facts.bye) after the rest, the players on a season-long list included; each row's rank is
          its place in the answer as drawn, its overall_rank its place in the order without byes=last (Lane 227, B209);
          without it the order keeps them in their places and the two are equal
        schema: { type: string, enum: [last] }
