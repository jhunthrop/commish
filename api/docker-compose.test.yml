# The test database: Postgres 16 on 5433, the same as CI's service.
# make db-up, then make test.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: commish, POSTGRES_PASSWORD: commish, POSTGRES_DB: commish_test }
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "commish"]
      interval: 2s
      timeout: 2s
      retries: 15
