name: fantasy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commish
      POSTGRES_PASSWORD: commish
      POSTGRES_DB: commish
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commish -d commish"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commish
      POSTGRES_PASSWORD: commish
      POSTGRES_DB: commish_test
    # THE DATA DIR IS A DISK VOLUME, NOT A tmpfs (Round D, Task 3 — the season-long debt).
    #
    # It was a 1.4 GB tmpfs, and the whole-repo suite kept failing 53100 "No space left on device"
    # on TRUNCATE while the host had hundreds of gigabytes free. The standing diagnosis was that
    # the tmpfs was too small (WAL recycling up to max_wal_size and never shrinking), and the
    # standing fix was to cap WAL, then to make the tmpfs bigger. MEASURED, the diagnosis is wrong:
    # sampling the data dir every 2s across a whole-repo run (serial AND four-way parallel) peaks
    # at 448 MB. It never approached 1.4 GB, let alone the 4 GB a bump had grown it to.
    #
    # WHAT ACTUALLY RAN OUT WAS THE DOCKER VM'S MEMORY. A tmpfs is paged out of the VM's own RAM,
    # and this VM has 2.9 GB total for every container here (Redis alone holds ~590 MB). The
    # sampler bottoms out at 91 MB free with a gigabyte already swapped, and a tmpfs page
    # allocation that cannot find memory reports ENOSPC — "no space" for a filesystem that is 89%
    # empty. A SIZE cap can never fix that, in either direction: raising it only lets the test
    # database compete harder for the memory the failure is made of.
    #
    # So the throwaway test database moves onto the container's own disk, which has ~950 GB free
    # and cannot run out, and hands the ~450 MB it was holding back to the VM. Durability is
    # turned off to pay for the move: fsync, full page writes and synchronous commit exist to
    # survive a crash, and a database whose entire contents are re-created by `db:migrate:test`
    # has nothing to survive for. max_wal_size stays capped so the volume does not grow without
    # bound across long sessions.
    command:
      - postgres
      - -c
      - max_wal_size=256MB
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commish -d commish_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Transaction-mode connection pooler in front of the dev Postgres. Production will run one of
  # these too (Plan D), and the app talks to it rather than to Postgres directly — so it has to
  # be in the loop locally, or the first time anyone finds out that transaction pooling breaks
  # a pattern will be in production. See docs/decisions/data-layer-hardening.md.
  pgbouncer:
    # edoburu/pgbouncer:latest resolved 2026-08-19.
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: commish
      DB_PASSWORD: commish
      DB_NAME: commish
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "25"
      LISTEN_PORT: "6432"
      # Grants the app's own user admin-console access (the virtual `pgbouncer` database, `SHOW
      # POOLS`/`SHOW CONFIG`) instead of the image's default `postgres`, which is not in
      # userlist.txt and so can never authenticate. src/db/pgbouncer.test.ts uses this to assert
      # pool_mode directly rather than by inference.
      ADMIN_USERS: commish
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U commish -d commish"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The same pooler in front of the TEST Postgres, so src/db/pgbouncer.test.ts exercises
  # transaction pooling for real rather than describing it.
  pgbouncer-test:
    # edoburu/pgbouncer:latest resolved 2026-08-19.
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    environment:
      DB_HOST: postgres-test
      DB_PORT: "5432"
      DB_USER: commish
      DB_PASSWORD: commish
      # DB_NAME is deliberately UNSET (Phase 4, Task 2): the image's entrypoint then writes a
      # wildcard `[databases]` entry (`* = host=postgres-test ...`), so this one pooler routes
      # EVERY database on postgres-test by its connect-time name — `commish_test` exactly as
      # before, plus the per-lane databases the worktree doctrine hands out (`commish_test_p4`,
      # `commish_test_v3`, ...), each lane pointing `TEST_PGBOUNCER_URL` at its own. Pinned, a
      # lane's pgbouncer suite could only ever test the shared database's schema, which stops
      # matching the lane's code the moment a lane ships a migration.
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "25"
      LISTEN_PORT: "6432"
      # See the same key on the `pgbouncer` service above.
      ADMIN_USERS: commish
    ports:
      - "6433:6432"
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U commish -d commish_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  # The test database's lanes live here now instead of in the VM's RAM. Wiping it (`docker compose
  # down -v`) costs nothing but a `npm run db:migrate:test`, which re-creates every lane database
  # and migrates it.
  postgres-test-data:
  redis-data:
